<!-- @dsCard group="VEO Services" viewport="1440x900" name="VEO Services — web app" subtitle="Login → Campañas → Detalle → Inventario (proposed, built from brand rules)" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>VEO Services</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../assets/logo/veo-isotipo-lime.png">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Campaign.jsx"></script>
<script type="text/babel" src="Inventory.jsx"></script>
<script type="text/babel">
function Blank({ title }) {
  return <div><Topbar title={title} /><div style={{ padding: 48, font: "300 18px/1.4 var(--font-sans)", color: "var(--text-muted)", maxWidth: 560 }}>Pantalla no incluida en esta versión del UI kit. Se diseña cuando existan referencias reales del producto.</div></div>;
}
function App() {
  const [route, setRoute] = React.useState(() => localStorage.getItem("veo-kit-route") || "login");
  const [camp, setCamp] = React.useState(null);
  const go = (r) => { setRoute(r); localStorage.setItem("veo-kit-route", r); window.scrollTo(0, 0); };
  if (route === "login") return <Login onLogin={() => go("dashboard")} />;
  const page = route === "dashboard" ? <Dashboard openCampaign={(c) => { setCamp(c); go("campaign"); }} />
    : route === "campaign" ? <Campaign campaign={camp} back={() => go("dashboard")} />
    : route === "inventory" ? <Inventory />
    : <Blank title={route === "reports" ? "Reportes" : "Permisos"} />;
  return <div style={{ display: "flex", minHeight: "100vh" }}><Sidebar route={route} go={go} onLogout={() => go("login")} /><main style={{ flex: 1, minWidth: 0, background: "#fff" }}>{page}</main></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
