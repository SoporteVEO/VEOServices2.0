<!-- @dsCard group="Colors" viewport="700x130" name="Status colors" subtitle="UI-only additions; Lime doubles as success/verified" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px"><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:var(--veo-success)"></div><div><div style="font:600 14px var(--font-display);color:var(--veo-success-ink)">Verificado / Activo</div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">--veo-success / --veo-success-ink</div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:var(--veo-warning)"></div><div><div style="font:600 14px var(--font-display);color:var(--veo-warning-ink)">Pendiente</div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">--veo-warning / --veo-warning-ink</div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:var(--veo-danger)"></div><div><div style="font:600 14px var(--font-display);color:var(--veo-danger-ink)">Fuera de servicio</div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">--veo-danger / --veo-danger-ink</div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:var(--veo-info)"></div><div><div style="font:600 14px var(--font-display);color:var(--veo-dark)">Información</div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">--veo-info / --veo-dark</div></div></div></div></body></html>
