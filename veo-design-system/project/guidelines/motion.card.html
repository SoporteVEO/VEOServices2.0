<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}</style></head><body><style>@keyframes fill{0%,10%{opacity:0}11%,60%{opacity:1}61%,100%{opacity:0}}.m{width:36px;height:36px;background:var(--veo-lime);animation:fill 2.4s infinite var(--ease-step)}</style><div style="display:flex;gap:6px;align-items:center"><div class="m" style="animation-delay:0s;background:var(--veo-lime)"></div><div class="m" style="animation-delay:0.12s;background:var(--veo-lime)"></div><div class="m" style="animation-delay:0.24s;background:var(--veo-dark)"></div><div class="m" style="animation-delay:0.36s;background:var(--veo-lime)"></div><div class="m" style="animation-delay:0.48s;background:var(--veo-lime)"></div><div class="m" style="animation-delay:0.6s;background:var(--veo-dark)"></div><div class="m" style="animation-delay:0.72s;background:var(--veo-lime)"></div><div class="m" style="animation-delay:0.84s;background:var(--veo-lime)"></div><div style="margin-left:24px;font:var(--type-ui);color:var(--text-muted)">--motion-fast 160ms · --motion-base 240ms<br>--ease-standard · --ease-step</div></div></body></html>
