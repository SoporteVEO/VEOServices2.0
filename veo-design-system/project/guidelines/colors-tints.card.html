<!-- @dsCard group="Colors" viewport="700x220" name="UI tints" subtitle="Derived steps for borders, hovers and dark-mode layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-dark);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">dark</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-dark-90);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">dark-90</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-dark-80);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">dark-80</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-dark-60);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">dark-60</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-gray);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">gray</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-gray-70);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">gray-70</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-gray-40);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">gray-40</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-gray-20);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">gray-20</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-ice-deep);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">ice-deep</div></div></div><div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-lime-deep);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">lime-deep</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-lime);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">lime</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-lime-soft);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">lime-soft</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-ice);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">ice</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--veo-white);border:1px solid rgba(27,38,41,.08)"></div><div style="font:400 12px var(--font-sans);color:var(--text-muted)">white</div></div></div></body></html>
