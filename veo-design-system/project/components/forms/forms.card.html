<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:18px}.lab{font:600 12px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--veo-gray);width:90px;flex-shrink:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, RadioGroup, Switch, Glyph } = window.VEODesignSystem_0c07b8;

function App(){ const [r,setR]=React.useState('Valla'); const A=<Glyph name="arrow-up-right" size={16}/>;
return <div className="col">

<div className="row"><span className="lab">Sizes</span><Button size="sm">Small 36</Button><Button size="md">Medium 48</Button><Button size="lg" variant="signal" icon={A}>Large 60</Button><IconButton label="Ir" variant="signal" icon={A}/><IconButton label="Cerrar" variant="secondary" icon={<Glyph name="x"/>}/><IconButton label="Menú" icon={<Glyph name="menu"/>}/></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:24}}><Input label="Nombre" placeholder="¿Cómo te llamamos?"/><Input label="Correo" defaultValue="ana@marca" error="Revise el formato del correo."/><Select label="Corredor" placeholder="Seleccione" options={['Sur','Norte','Centro']}/></div>

<div className="row" style={{gap:36}}><Checkbox label="Incluir DOOH" defaultChecked/><Checkbox label="Solo verificadas"/><RadioGroup direction="row" name="f" value={r} onChange={setR} options={['Valla','Pantalla']}/><Switch label="Alertas" defaultChecked/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
