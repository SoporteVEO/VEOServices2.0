/* ============================================================
   To-Do de animaciones (solo DOOH - Producción)
   Un tablero por estados para las animaciones que se van trabajando.
   Ojo con dos cosas del negocio:
   · el nombre de la animación NO es el nombre del cliente;
   · varias animaciones pueden ser versiones del mismo cliente u OP.
   Por eso la tarjeta guarda el nombre de la animación aparte, y el
   cliente solo aparece cuando la animación se aprueba y se decide
   qué hacer con ella: entra como OP nueva, entra como versión de un
   cliente que ya está al aire, o queda aprobada sin OP.
   ============================================================ */
const TD_EST = [
  {v:"odd",   etq:"ODD recibida",            cls:"c-odd",   ico:"▤"},
  {v:"anim",  etq:"Animando",                cls:"c-anim",  ico:"◍"},
  {v:"env",   etq:"Enviado para aprobación", cls:"c-env",   ico:"➤"},
  {v:"ok",    etq:"Aprobado",                cls:"c-ok",    ico:"✓"},
  {v:"oksop", etq:"Aprobado sin OP",         cls:"c-oksop", ico:"◷"},
];
const TD_ETIQ = TD_EST.reduce((a, e) => (a[e.v] = e.etq, a), {});
const TD_CLS  = TD_EST.reduce((a, e) => (a[e.v] = e.cls, a), {});

function todos(){ if(!Array.isArray(DB.todo)) DB.todo = []; return DB.todo; }
function todoPorId(id){ return todos().find(x => x.id === id) || null; }
/* cuántas animaciones esperan algo de Producción (todo menos lo ya resuelto) */
function todoPendientes(){
  if(RO) return 0;
  tdAutoArchivar();
  return todos().filter(x => !x.archivada && x.estado !== "oksop" && !x.opId).length;
}
/* ============================================================
   El número de ODD (Orden de Diseño)
   Formato: ODD - D07092026 - 01
   · D es de Digital
   · la fecha va pegada, día mes año sin separadores
   · el correlativo empieza en 01 cada día
   ============================================================ */
const ODD_RE = /D\s*(\d{2})(\d{2})(\d{4})\s*-\s*(\d{1,3})/i;
function oddFecha(iso){
  /* sirve tanto una fecha (2026-09-07) como una marca de tiempo completa */
  const d = parseISO(String(iso || todayISO()).slice(0, 10)) || parseISO(todayISO());
  if(!d) return "";
  return `${String(d.getDate()).padStart(2,"0")}${String(d.getMonth()+1).padStart(2,"0")}${d.getFullYear()}`;
}
function oddArmar(fecha, num){ return `ODD - D${fecha} - ${String(num).padStart(2,"0")}`; }
/* lee un ODD escrito de cualquier forma y devuelve sus partes */
function oddPartes(txt){
  const m = ODD_RE.exec(String(txt || ""));
  if(!m) return null;
  return {fecha: m[1] + m[2] + m[3], num: +m[4]};
}
/* el correlativo más alto ya usado en esa fecha, contando las archivadas */
function oddUltimo(fecha){
  let max = 0;
  for(const x of todos()){
    const p = oddPartes(x.odd);
    if(p && p.fecha === fecha && p.num > max) max = p.num;
  }
  return max;
}
/* el siguiente número libre para esa fecha */
function oddSiguiente(fechaISO){
  const f = oddFecha(fechaISO);
  return oddArmar(f, oddUltimo(f) + 1);
}
/* ¿ese número ya lo tiene otra animación? */
function oddOcupado(txt, exceptoId){
  const p = oddPartes(txt);
  if(!p) return false;
  return todos().some(x => {
    if(x.id === exceptoId) return false;
    const q = oddPartes(x.odd);
    return q && q.fecha === p.fecha && q.num === p.num;
  });
}
/* Acepta lo que escriba Producción y lo deja en el formato de la casa:
   "3" → el correlativo 3 de hoy · "07092026-3" → el 3 de ese día
   y si ya está bien escrito solo se le arreglan los espacios. */
function oddNormalizar(txt, fechaISO){
  const t = String(txt || "").trim();
  if(!t) return "";
  const p = oddPartes(t);
  if(p) return oddArmar(p.fecha, p.num);
  const soloNum = /^-?\s*(\d{1,3})$/.exec(t);
  if(soloNum) return oddArmar(oddFecha(fechaISO), +soloNum[1]);
  const conFecha = /^(?:ODD)?\s*-?\s*D?\s*(\d{8})\s*-?\s*(\d{1,3})?$/i.exec(t);
  if(conFecha) return oddArmar(conFecha[1], +(conFecha[2] || (oddUltimo(conFecha[1]) + 1)));
  return t;                                  // algo distinto: se respeta tal cual
}
function tdNorm(x){
  x.id = x.id || uid();
  x.nombre = String(x.nombre || "").trim();
  x.cliente = String(x.cliente || "").trim();
  x.odd = String(x.odd || "").trim();
  x.notas = String(x.notas || "");
  /* las fechas son opcionales: muchas animaciones llegan sin vigencia todavía */
  x.inicio = /^\d{4}-\d{2}-\d{2}$/.test(x.inicio || "") ? x.inicio : "";
  x.fin    = /^\d{4}-\d{2}-\d{2}$/.test(x.fin || "")    ? x.fin    : "";
  x.estado = TD_ETIQ[x.estado] ? x.estado : "odd";
  x.ts = x.ts || new Date().toISOString();
  x.tsEstado = x.tsEstado || x.ts;
  if(!Array.isArray(x.historial)) x.historial = [{estado: x.estado, ts: x.ts}];
  return x;
}
function tdGuardar(){ todos().forEach(tdNorm); save(); }
/* mueve una tarjeta de estado y deja el rastro */
function tdMover(id, estado, silencioso){
  const x = todoPorId(id);
  if(!x || !TD_ETIQ[estado] || x.estado === estado) return null;
  x.estado = estado;
  delete x.noAuto;                      // vuelve a contar para el archivado solo
  x.tsEstado = new Date().toISOString();
  x.historial.push({estado, ts: x.tsEstado});
  if(x.historial.length > 40) x.historial.splice(0, x.historial.length - 40);
  tdGuardar();
  if(!silencioso) render();
  return x;
}
/* días que lleva la animación en el estado en el que está */
function tdDias(iso){
  const d = parseISO(String(iso || "").slice(0, 10));
  if(!d) return null;
  return Math.max(0, days(d, parseISO(todayISO())));
}

/* ============================================================
   Archivado solo
   Una animación aprobada ya cumplió: a los TD_DIAS_ARCH días de haber caído
   en Aprobado se archiva sola para que el tablero no se llene de trabajo
   terminado. Sigue estando en "Ver archivadas" y se puede devolver.
   "Aprobado sin OP" no se archiva solo: esas quedan esperando su OP.
   ============================================================ */
const TD_DIAS_ARCH = 3;
/* cuántos días le faltan para archivarse sola (null si no aplica) */
function tdDiasArchivo(x){
  if(!x || x.archivada || x.noAuto || x.estado !== "ok") return null;
  const d = tdDias(x.tsEstado);
  return d === null ? null : Math.max(0, TD_DIAS_ARCH - d);
}
/* archiva las aprobadas que ya cumplieron los días; devuelve cuántas archivó */
function tdAutoArchivar(){
  if(RO) return 0;
  let n2 = 0;
  for(const x of todos()){
    if(x.archivada || x.noAuto || x.estado !== "ok") continue;
    const d = tdDias(x.tsEstado);
    if(d === null || d < TD_DIAS_ARCH) continue;
    x.archivada = true;
    x.autoArch = new Date().toISOString();
    x.historial.push({estado:"ok", ts:x.autoArch, auto:true});
    n2++;
  }
  if(n2) tdGuardar();
  return n2;
}

/* ---------- campañas que están al aire o programadas, para las versiones ---------- */
function tdCampanasVivas(){
  const out = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    const e = estado(c, refDate);
    if(e === "finalizada") continue;
    const k = claveDeCampana(c.cliente, c.campana);
    let g = out.find(x => x.clave === k);
    if(!g){ g = {clave:k, cliente:c.cliente, campana:c.campana || "", pantallas:[], ids:[],
                 inicio:c.inicio, fin:c.fin, versiones:(c.versiones || []).length};
            out.push(g); }
    if(!g.pantallas.includes(p.nombre)) g.pantallas.push(p.nombre);
    g.ids.push(c.id);
    g.versiones = Math.max(g.versiones, (c.versiones || []).length);
  }
  return out.sort((a, b) => a.cliente.localeCompare(b.cliente));
}

/* ============================================================
   el tablero
   ============================================================ */
function viewTodo(){
  tdAutoArchivar();
  const items = todos().map(tdNorm).filter(x => !x.archivada);
  const arch = todos().filter(x => x.archivada).length;
  const cols = TD_EST.map(e => {
    const dentro = items.filter(x => x.estado === e.v)
      .sort((a, b) => String(b.tsEstado).localeCompare(String(a.tsEstado)));
    return `<section class="tdcol ${e.cls}" data-drop="${e.v}">
      <header>
        <span class="tdi">${e.ico}</span>
        <b>${e.etq}</b>
        <span class="tdn">${dentro.length}</span>
        <button type="button" class="tdmas" data-nueva="${e.v}" title="Agregar una animación aquí">+</button>
      </header>
      <div class="tdlista">
        ${dentro.map(tdTarjeta).join("") || `<p class="tdvacio">Nada aquí. Arrastra una tarjeta o pulsa +.</p>`}
      </div>
    </section>`;
  }).join("");

  return `<div class="sechead"><h3>To-Do de animaciones</h3><div class="line"></div>
      <span class="hint">${items.length} en el tablero${arch ? ` · ${arch} archivada${arch===1?"":"s"}` : ""}</span></div>
    <div class="repfil" style="margin-bottom:12px">
      <button class="btn primary" id="td_nueva">Nueva animación</button>
      <span class="hint">El nombre de la animación es el del arte, no el del cliente. Al pasar a
        <b>Aprobado</b> se decide si entra como OP nueva, como versión de un cliente que ya está al aire,
        o si queda aprobada sin OP.</span>
      ${arch ? `<button class="btn sm ghost" id="td_arch">Ver archivadas (${arch})</button>` : ""}
    </div>
    <div class="tdboard">${cols}</div>`;
}

/* "15/09 → 30/09", o solo la que esté puesta */
function tdFechas(x){
  if(!x.inicio && !x.fin) return "";
  if(x.inicio && x.fin) return `${fmt(x.inicio)} → ${fmt(x.fin)}`;
  return x.inicio ? `desde ${fmt(x.inicio)}` : `hasta ${fmt(x.fin)}`;
}
function tdTarjeta(x){
  const d = tdDias(x.tsEstado);
  const listaOP = x.opId;
  const esVer = x.versionDe;
  const fechas = tdFechas(x);
  const faltan = tdDiasArchivo(x);
  return `<article class="tdcard" draggable="true" data-tid="${esc(x.id)}">
    <div class="tdtit">
      <b>${esc(x.nombre) || "(sin nombre)"}</b>
      <button type="button" class="tdx" data-ed="${esc(x.id)}" title="Abrir la animación">⋯</button>
    </div>
    ${x.odd ? `<div class="tdodd">${/^odd/i.test(x.odd) ? "" : "ODD "}${esc(x.odd)}</div>` : ""}
    ${x.cliente ? `<div class="tdcli">${esc(x.cliente)}</div>` : ""}
    ${fechas ? `<div class="tdfec">${esc(fechas)}</div>` : ""}
    ${x.notas ? `<div class="tdnota">${esc(String(x.notas).slice(0, 120))}</div>` : ""}
    <div class="tdpie">
      <span class="tdedad${d !== null && d >= 5 && !listaOP && x.estado !== "oksop" ? " vieja" : ""}">${
        d === null ? "" : d === 0 ? "hoy" : d === 1 ? "1 día aquí" : `${d} días aquí`}</span>
      <span class="tdpd">
        ${faltan !== null ? `<span class="tdav" title="Las aprobadas se archivan solas a los ${TD_DIAS_ARCH} días">${
                faltan === 0 ? "se archiva hoy" : faltan === 1 ? "se archiva mañana" : `se archiva en ${faltan} días`}</span>` : ""}
        ${listaOP ? `<span class="tdok">OP ingresada</span>`
          : esVer ? `<span class="tdok">versión agregada</span>`
          : x.estado === "ok" ? `<button type="button" class="btn sm primary" data-aprob="${esc(x.id)}">Qué hacer</button>`
          : ""}
      </span>
    </div>
  </article>`;
}

function wireTodo(v){
  const g = (sel, fn) => v.querySelectorAll(sel).forEach(fn);
  const nb = document.getElementById("td_nueva");
  if(nb) nb.onclick = () => modalTodo(null, "odd");
  const ab = document.getElementById("td_arch");
  if(ab) ab.onclick = modalTodoArchivadas;
  g("[data-nueva]", b => b.onclick = () => modalTodo(null, b.dataset.nueva));
  g("[data-ed]", b => b.onclick = () => modalTodo(todoPorId(b.dataset.ed)));
  g("[data-aprob]", b => b.onclick = () => modalTodoAprobada(todoPorId(b.dataset.aprob)));

  /* arrastrar entre columnas */
  let cual = null;
  g(".tdcard", el => {
    el.addEventListener("dragstart", ev => {
      cual = el.dataset.tid; el.classList.add("arrastrando");
      try{ ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", cual); }catch(e){}
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("arrastrando");
      v.querySelectorAll(".tdcol").forEach(z => z.classList.remove("dropok"));
      cual = null;
    });
  });
  g("[data-drop]", z => {
    z.addEventListener("dragover", ev => {
      if(!cual) return;
      const x = todoPorId(cual);
      if(!x || x.estado === z.dataset.drop) return;
      ev.preventDefault();
      try{ ev.dataTransfer.dropEffect = "move"; }catch(e){}
      z.classList.add("dropok");
    });
    z.addEventListener("dragleave", ev => { if(!z.contains(ev.relatedTarget)) z.classList.remove("dropok"); });
    z.addEventListener("drop", ev => {
      ev.preventDefault();
      const id = cual; cual = null;
      v.querySelectorAll(".tdcol").forEach(y => y.classList.remove("dropok"));
      tdAplicarEstado(id, z.dataset.drop);
    });
  });
}
/* Cambiar de estado: al llegar a "Aprobado" es cuando se pregunta qué hacer. */
function tdAplicarEstado(id, estado){
  const x = tdMover(id, estado);
  if(!x) return;
  toast(`${x.nombre || "La animación"} → ${TD_ETIQ[estado]}`);
  if(estado === "ok" && !x.opId && !x.versionDe) setTimeout(() => modalTodoAprobada(x), 250);
}

/* ============================================================
   alta y edición de una animación
   ============================================================ */
function modalTodo(x, estadoInicial){
  const nuevo = !x;
  const d = x || {id:uid(), nombre:"", cliente:"", odd: oddSiguiente(), notas:"",
                  estado: estadoInicial || "odd", ts:new Date().toISOString()};
  const m = document.getElementById("modal");
  m.className = "modal";
  m.innerHTML = `
    <div class="mh"><div style="flex:1;min-width:0">
      <h3>${nuevo ? "Nueva animación" : "Animación"}</h3>
      <small>${nuevo ? "el nombre del arte, no el del cliente"
        : `en <b>${esc(TD_ETIQ[d.estado])}</b>${(() => { const t = tdDias(d.tsEstado);
             return t === null ? "" : t === 0 ? " desde hoy" : ` desde hace ${t} día${t===1?"":"s"}`; })()}`}</small>
    </div></div>
    <div class="mb">
      <div class="field"><label for="td_nom">Nombre de la animación *</label>
        <input type="text" id="td_nom" maxlength="80" value="${esc(d.nombre)}" autocomplete="off"
          placeholder="ej. RENUEVA TU DUI · versión 15s"></div>
      <div class="dos">
        <div class="field"><label for="td_odd">N° de ODD</label>
          <input type="text" id="td_odd" maxlength="40" value="${esc(d.odd)}" autocomplete="off"
            placeholder="${esc(oddSiguiente())}" spellcheck="false">
          <div class="hint" id="td_oddh">${nuevo ? "Se genera solo. Puedes escribir otro número o solo el correlativo."
            : "Formato ODD - D" + esc(oddFecha()) + " - 01"}</div></div>
        <div class="field"><label for="td_est">Estado</label>
          <select id="td_est">${TD_EST.map(e =>
            `<option value="${e.v}"${d.estado === e.v ? " selected" : ""}>${e.etq}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="td_cli">Cliente o marca</label>
        <input type="text" id="td_cli" maxlength="60" value="${esc(d.cliente)}" autocomplete="off"
          placeholder="Opcional: se puede llenar al aprobarla"></div>
      <div class="dos">
        <div class="field"><label for="td_ini">Fecha de inicio</label>
          <input type="date" id="td_ini" value="${esc(d.inicio || "")}">
          <div class="hint">Opcional. Si se sabe, se pasa sola a la OP o a la versión.</div></div>
        <div class="field"><label for="td_fin">Fecha final</label>
          <input type="date" id="td_fin" value="${esc(d.fin || "")}"></div>
      </div>
      <div class="field"><label for="td_not">Notas</label>
        <textarea id="td_not" rows="3" maxlength="600" placeholder="Opcional">${esc(d.notas)}</textarea></div>
      ${d.opId ? `<div class="aviso2 a"><span class="ai">✓</span><span class="at">
        <b>Ya tiene OP ingresada</b><small>Esta animación entró como orden de pauta.</small></span></div>` : ""}
      ${d.versionDe ? `<div class="aviso2 a"><span class="ai">✓</span><span class="at">
        <b>Agregada como versión</b><small>De ${esc(d.versionDe.cliente)}${
          d.versionDe.campana ? " · " + esc(d.versionDe.campana) : ""}.</small></span></div>` : ""}
      ${!nuevo && d.historial && d.historial.length > 1 ? `<div class="field"><label>Recorrido</label>
        <div class="tdhist">${d.historial.slice(-8).map(h => {
          const f = new Date(h.ts);
          return `<span class="tdhi"><b>${esc(TD_ETIQ[h.estado] || h.estado)}</b>${
            isNaN(f) ? "" : ` ${diaDe(f)} ${relojDe(f)}`}</span>`;
        }).join("")}</div></div>` : ""}
    </div>
    <div class="mf">
      <span class="hint" id="td_msg"></span>
      ${nuevo ? "" : `<button class="btn ghost danger" id="td_del">Eliminar</button>`}
      ${nuevo || d.archivada ? "" : `<button class="btn ghost" id="td_ar">Archivar</button>`}
      <button class="btn ghost" id="mcancel">Cancelar</button>
      <button class="btn primary" id="td_ok">${nuevo ? "Agregar" : "Guardar"}</button>
    </div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;

  const del = document.getElementById("td_del");
  if(del) del.onclick = () => {
    if(!confirm(`¿Eliminar “${d.nombre}” del tablero?\n\nNo toca las listas de reproducción.`)) return;
    DB.todo = todos().filter(y => y.id !== d.id);
    tdGuardar(); closeModal(); render(); toast("Animación eliminada del tablero");
  };
  const ar = document.getElementById("td_ar");
  if(ar) ar.onclick = () => {
    d.archivada = true; tdGuardar(); closeModal(); render(); toast("Animación archivada");
  };

  document.getElementById("td_ok").onclick = () => {
    const nom = document.getElementById("td_nom").value.trim();
    const msg = document.getElementById("td_msg");
    if(!nom){ msg.textContent = "Ponle nombre a la animación."; msg.style.color = "var(--critical)";
              document.getElementById("td_nom").focus(); return; }
    const antes = d.estado;
    d.nombre = nom;
    /* el ODD se deja siempre en el formato de la casa y sin repetir correlativo */
    d.odd = oddNormalizar(document.getElementById("td_odd").value, d.ts);
    let oddCambiado = "";
    if(oddOcupado(d.odd, d.id)){
      d.odd = oddSiguiente(d.ts);
      oddCambiado = d.odd;                    // ese correlativo ya era de otra animación
    }
    d.cliente = document.getElementById("td_cli").value.trim();
    d.inicio = document.getElementById("td_ini").value || "";
    d.fin    = document.getElementById("td_fin").value || "";
    if(d.inicio && d.fin && d.inicio > d.fin){
      msg.textContent = "La fecha de inicio va después de la final.";
      msg.style.color = "var(--critical)";
      document.getElementById("td_fin").focus(); return;
    }
    d.notas = document.getElementById("td_not").value.trim();
    const est = document.getElementById("td_est").value;
    if(nuevo){
      d.estado = est; d.tsEstado = new Date().toISOString();
      d.historial = [{estado: est, ts: d.tsEstado}];
      todos().unshift(tdNorm(d));
    } else if(est !== antes){
      d.estado = est; d.tsEstado = new Date().toISOString();
      d.historial.push({estado: est, ts: d.tsEstado});
    }
    tdGuardar(); closeModal(); render();
    toast(oddCambiado ? `Ese N° de ODD ya estaba usado · quedó como ${oddCambiado}`
        : nuevo ? "Animación agregada al tablero" : "Animación guardada");
    if(est === "ok" && antes !== "ok" && !d.opId && !d.versionDe)
      setTimeout(() => modalTodoAprobada(d), 250);
  };
  document.getElementById("td_nom").focus();
}

function modalTodoArchivadas(){
  const list = todos().filter(x => x.archivada);
  const m = document.getElementById("modal");
  m.className = "modal";
  m.innerHTML = `
    <div class="mh"><h3>Animaciones archivadas</h3>
      <span class="chip"><i class="i-muted"></i>${list.length}</span></div>
    <div class="mb">
      ${list.length ? `<div class="tdarch">${list.map(x => `<div class="tdar">
          <span class="ta"><b>${esc(x.nombre)}</b><small>${esc(TD_ETIQ[x.estado])}${
            x.cliente ? " · " + esc(x.cliente) : ""}${
            x.autoArch ? " · archivada sola a los " + TD_DIAS_ARCH + " días" : ""}${
            tdFechas(x) ? " · " + esc(tdFechas(x)) : ""}</small></span>
          <button type="button" class="btn sm ghost" data-rea="${esc(x.id)}">Devolver al tablero</button>
        </div>`).join("")}</div>`
        : `<p class="empty">No hay animaciones archivadas.</p>`}
    </div>
    <div class="mf"><button class="btn ghost" id="mcancel">Cerrar</button></div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;
  m.querySelectorAll("[data-rea]").forEach(b => b.onclick = () => {
    const x = todoPorId(b.dataset.rea); if(!x) return;
    delete x.archivada; delete x.autoArch;
    /* si se devuelve a mano, se queda hasta que alguien la mueva otra vez:
       si no, el archivado solo la sacaría del tablero de inmediato */
    x.noAuto = true;
    tdGuardar(); closeModal(); render();
    toast(x.estado === "ok" ? "Devuelta al tablero · ya no se archiva sola" : "Devuelta al tablero");
  });
}

/* ============================================================
   aprobada: qué se hace con la animación
   ============================================================ */
function modalTodoAprobada(x){
  if(!x) return;
  const vivas = tdCampanasVivas();
  const m = document.getElementById("modal");
  m.className = "modal ancho";
  m.innerHTML = `
    <div class="mh"><div style="flex:1;min-width:0">
      <h3>Aprobada · ${esc(x.nombre)}</h3>
      <small>¿qué se hace con esta animación?</small>
    </div></div>
    <div class="mb">
      <div class="decide" id="td_dec">
        <b>La animación quedó aprobada</b>
        <small>El nombre del arte no es el del cliente: elige cómo entra a las listas.</small>
        <label class="opd on">
          <input type="radio" name="td_modo" value="op" checked>
          <span><b>Ingresar la OP ahora</b>
            Se abre la ventana de <b>Ingresar OP</b> con lo que ya sabemos, y de ahí sigue el
            proceso normal: pantallas, spots, valores y constancia.</span></label>
        <label class="opd">
          <input type="radio" name="td_modo" value="version">
          <span><b>Es una versión de un cliente que ya está al aire</b>
            Se agrega como versión del arte a una campaña que ya existe, sin crear una OP nueva.
            ${vivas.length ? `Hay ${vivas.length} campaña${vivas.length===1?"":"s"} al aire o programada${vivas.length===1?"":"s"}.`
                           : `Ahora mismo no hay campañas al aire.`}</span></label>
        <label class="opd">
          <input type="radio" name="td_modo" value="sinop">
          <span><b>Queda aprobada sin OP</b>
            La animación está lista pero todavía no hay orden de pauta. Se mueve a
            <b>Aprobado sin OP</b> y queda esperando.</span></label>
      </div>

      <div class="field" id="td_boxop">
        <label for="td_amarca">Cliente o marca de la OP</label>
        <input type="text" id="td_amarca" maxlength="60" value="${esc(x.cliente)}" autocomplete="off"
          placeholder="ej. DUICENTRO">
        <div class="hint">La campaña se va a llamar <b>${esc(x.nombre)}</b>; puedes cambiarlo en la
          ventana de Ingresar OP.</div>
      </div>

      <div class="field" id="td_boxver" hidden>
        <label for="td_bver">Campaña a la que se le agrega la versión</label>
        <input type="search" id="td_bver" placeholder="Busca el cliente…" autocomplete="off">
        <div class="tdvers" id="td_lista"></div>
        <div class="tres" style="margin-top:10px">
          <div class="field"><label for="td_vini">Inicio de la versión</label>
            <input type="date" id="td_vini"></div>
          <div class="field"><label for="td_vfin">Fin de la versión</label>
            <input type="date" id="td_vfin"></div>
        </div>
        <div class="hint">Si dejas las fechas vacías, la versión toma la vigencia de la campaña.</div>
      </div>
    </div>
    <div class="mf">
      <span class="hint" id="td_amsg"></span>
      <button class="btn ghost" id="mcancel">Cerrar</button>
      <button class="btn primary" id="td_aok">Continuar</button>
    </div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;

  const dec = document.getElementById("td_dec");
  const boxOP = document.getElementById("td_boxop"), boxVer = document.getElementById("td_boxver");
  let elegida = null;

  const pintarModo = () => {
    const val = (dec.querySelector('input[name="td_modo"]:checked') || {}).value;
    dec.querySelectorAll(".opd").forEach(l => {
      const i = l.querySelector("input");
      l.classList.toggle("on", !!(i && i.checked));
    });
    boxOP.hidden = val !== "op";
    boxVer.hidden = val !== "version";
  };
  dec.querySelectorAll('input[name="td_modo"]').forEach(r => r.onchange = pintarModo);
  pintarModo();

  /* lista de campañas para elegir a cuál se le agrega la versión */
  const lista = document.getElementById("td_lista");
  const pintarLista = () => {
    const q = sinTildes(document.getElementById("td_bver").value || "").trim();
    const hits = vivas.filter(g => !q || sinTildes(g.cliente).includes(q) || sinTildes(g.campana).includes(q));
    lista.innerHTML = hits.length ? hits.slice(0, 40).map(g => `
      <button type="button" class="tdver${elegida === g.clave ? " on" : ""}" data-ver="${esc(g.clave)}">
        <b>${esc(g.cliente)}</b>
        <small>${esc(g.campana) || "sin nombre de campaña"} · ${g.pantallas.join(", ")}
          · ${fmt(g.inicio) || "—"} a ${fmt(g.fin) || "—"}${
          g.versiones ? ` · ya tiene ${g.versiones} versi${g.versiones===1?"ón":"ones"}` : ""}</small>
      </button>`).join("")
      : `<p class="empty" style="margin:6px 0">${vivas.length
          ? "Ningún cliente al aire con ese nombre." : "No hay campañas al aire ni programadas."}</p>`;
    lista.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => {
      elegida = b.dataset.ver;
      const g = vivas.find(y => y.clave === elegida);
      if(g){
        const vi = document.getElementById("td_vini"), vf = document.getElementById("td_vfin");
        if(!vi.value) vi.value = x.inicio || g.inicio || "";
        if(!vf.value) vf.value = x.fin || g.fin || "";
      }
      pintarLista();
    });
  };
  document.getElementById("td_bver").oninput = pintarLista;
  pintarLista();

  document.getElementById("td_aok").onclick = () => {
    const msg = document.getElementById("td_amsg");
    msg.style.color = "var(--critical)";
    const val = (dec.querySelector('input[name="td_modo"]:checked') || {}).value;

    if(val === "sinop"){
      x.cliente = x.cliente || "";
      tdMover(x.id, "oksop", true);
      tdGuardar(); closeModal(); render();
      toast(`${x.nombre} queda aprobada sin OP`);
      return;
    }
    if(val === "op"){
      const marca = document.getElementById("td_amarca").value.trim();
      if(!marca){ msg.textContent = "Pon el cliente o la marca de la OP.";
                  document.getElementById("td_amarca").focus(); return; }
      x.cliente = marca;
      if(x.estado !== "ok") tdMover(x.id, "ok", true);
      tdGuardar();
      closeModal();
      modalOP({
        cliente: marca,
        campana: x.nombre,
        inicio: x.inicio || "", fin: x.fin || "",
        notas: [x.odd && (/^odd/i.test(x.odd) ? x.odd : "ODD: " + x.odd), x.notas]
                .filter(Boolean).join(" · "),
        alGuardar: (opId) => {
          const y = todoPorId(x.id);
          if(!y) return;
          y.opId = opId; y.cliente = marca;
          if(y.estado !== "ok"){ y.estado = "ok"; y.tsEstado = new Date().toISOString();
                                 y.historial.push({estado:"ok", ts:y.tsEstado}); }
          tdGuardar();
          toast(`“${y.nombre}” quedó ligada a la OP de ${marca}`);
        },
      });
      return;
    }
    /* versión de una campaña que ya está al aire */
    if(!elegida){ msg.textContent = "Elige a qué campaña se le agrega la versión."; return; }
    const g = vivas.find(y => y.clave === elegida);
    if(!g){ msg.textContent = "Esa campaña ya no está disponible."; return; }
    const vi = document.getElementById("td_vini").value || x.inicio || g.inicio || null;
    const vf = document.getElementById("td_vfin").value || x.fin || g.fin || null;
    if(vi && vf && vi > vf){ msg.textContent = "El inicio de la versión va después del fin."; return; }

    let puestas = 0;
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
      if(!g.ids.includes(c.id)) continue;
      c.versiones = Array.isArray(c.versiones) ? c.versiones : [];
      if(c.versiones.some(vv => mismoTexto(vv.titulo || "", x.nombre))) continue;   // ya estaba
      c.versiones.push({id: uid(), titulo: x.nombre, inicio: vi, fin: vf});
      puestas++;
    }
    anotar({tipo:"editada", cliente:g.cliente, campana:g.campana,
            detalle:`versión de arte “${x.nombre}” agregada desde el To-Do`});
    x.cliente = g.cliente;
    x.versionDe = {clave:g.clave, cliente:g.cliente, campana:g.campana};
    if(x.estado !== "ok") tdMover(x.id, "ok", true);
    tdGuardar(); save(); closeModal(); render();
    toast(puestas
      ? `“${x.nombre}” agregada como versión de ${g.cliente} en ${puestas} pantalla${puestas===1?"":"s"}`
      : `${g.cliente} ya tenía una versión con ese nombre`);
  };
}

document.addEventListener("DOMContentLoaded", boot);
</script>
