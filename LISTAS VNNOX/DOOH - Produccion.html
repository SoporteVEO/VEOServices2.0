  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#184f95;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --pausa:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px 64px}

/* ---------- top bar ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--plane);
  border-bottom:1px solid var(--grid);
}
/* nowrap + el título se acorta con puntos suspensivos: la cabecera nunca se parte en dos filas */
.topin{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;gap:9px;align-items:center;flex-wrap:nowrap}
.topin > *:not(.brand){flex:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;flex:1 1 auto}
.brand > div{min-width:0;flex:1 1 auto}
.brand h1,.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* el logotipo tiene dos versiones: blanca para el tema oscuro, negra para el claro */
.logo{height:22px;width:auto;object-fit:contain;flex:none;display:block}
.logo.osc{display:none}
:root[data-theme="dark"] .logo.osc{display:block}
:root[data-theme="dark"] .logo.clr{display:none}
.brand h1{font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:0}
.tool{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:5px 9px}
.tool label{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tool input[type=date]{background:transparent;border:0;font-size:13px;padding:0}
.btn{
  background:var(--surface);border:1px solid var(--ring);border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--critical)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:5px 7px}
#btnnotif{position:relative}
#btnnotif.hay{border-color:color-mix(in srgb,var(--critical) 60%,var(--ring))}
.nbadge{
  position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--critical);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.nlist{display:flex;flex-direction:column;gap:6px}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--ring);
  border-left-width:3px;border-radius:10px;background:var(--surface-2)}
.nrow.nueva{background:color-mix(in srgb,var(--accent) 7%,var(--surface-2));border-left-color:var(--accent)}
.nrow.leida{opacity:.55;border-left-color:var(--grid)}
.nrow .ntx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nrow .ntx b{font-size:13px}
.nrow .ntx span{font-size:11.5px;color:var(--muted)}
.btn .ico{width:15px;height:15px;fill:currentColor;flex:none;margin-right:-1px}
.btn.alerta{background:var(--critical);border-color:transparent;color:#fff;font-weight:650}
#btnsave{font-weight:650}
#btnsave:disabled{opacity:.55;cursor:default}
.btn.alerta:hover{filter:brightness(1.1);background:var(--critical)}
/* ---------- semáforo de guardado ---------- */
.savegroup{display:flex;align-items:center;gap:9px;margin-left:auto}
.sem{
  display:flex;align-items:center;gap:9px;position:relative;overflow:hidden;
  border:1px solid var(--ring);border-radius:10px;padding:5px 12px 6px 9px;background:var(--surface);
  transition:border-color .2s,background .2s;
  width:290px;flex:none;                      /* ancho fijo: el estado no mueve la fila */
}
.sem .lights{display:flex;gap:4px;flex:none}
.sem .l{width:9px;height:9px;border-radius:50%;background:var(--grid);transition:background .18s,box-shadow .18s,opacity .18s}
.sem[data-s="rojo"]{border-color:color-mix(in srgb,var(--critical) 55%,var(--ring));background:color-mix(in srgb,var(--critical) 8%,var(--surface))}
.sem[data-s="rojo"] .l.r{color:var(--critical);background:currentColor;animation:semLatido 1.5s ease-in-out infinite}
.sem[data-s="amarillo"]{border-color:color-mix(in srgb,var(--warning) 55%,var(--ring))}
.sem[data-s="amarillo"] .l.y{color:var(--warning);background:currentColor;animation:semLatido 1s ease-in-out infinite}
.sem[data-s="verde"]{border-color:color-mix(in srgb,var(--good) 45%,var(--ring))}
.sem[data-s="verde"] .l.g{color:var(--good);background:currentColor;animation:semLatido 2.6s ease-in-out infinite}
.sem[data-s="gris"] .l{opacity:.5}
.sem[data-s="rojo"]{cursor:pointer}
.sem[data-s="rojo"]:hover{background:color-mix(in srgb,var(--critical) 14%,var(--surface))}
.semtxt{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.semtxt b{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.semtxt small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sembar{position:absolute;left:0;right:0;bottom:0;height:2px}
.sembar i{display:block;height:100%;width:0;background:var(--warning);border-radius:0 2px 2px 0}
.sem[data-s="amarillo"] .sembar i{animation:semFill 1.9s ease-out forwards}
.sem[data-s="verde"] .sembar i{width:100%;background:var(--good);animation:semFade 1.2s ease-out forwards}
@keyframes semLatido{
  0%,100%{ box-shadow:0 0 0 3px color-mix(in srgb,currentColor 26%,transparent); opacity:1 }
  50%    { box-shadow:0 0 0 6px color-mix(in srgb,currentColor 7%,transparent);  opacity:.72 }
}
@keyframes semFill{from{width:6%}to{width:94%}}
@keyframes semFade{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){ .sem .l,.sembar i{animation:none!important} }

/* ---------- nav ---------- */
nav.tabs{position:sticky;top:56px;z-index:30;background:var(--plane);border-bottom:1px solid var(--grid);overflow-x:auto}
.tabsin{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;
  font-size:13px;font-weight:550;color:var(--ink-2);white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:1px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.kpi{padding:13px 14px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .val{font-size:27px;font-weight:680;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .note{font-size:12px;color:var(--ink-2);margin-top:2px}
.kpi .val.txt{font-size:18px;font-weight:670;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
.kpi-op{border-color:color-mix(in srgb,var(--accent) 42%,var(--ring))}
.kpi-op#kpi_op{cursor:pointer}
.kpi-op#kpi_op:hover{border-color:var(--accent)}
.kpi-prox{border-color:color-mix(in srgb,var(--warning) 40%,var(--ring))}
.kpi-prox:hover{border-color:var(--warning)}
.kpi .rotn{font-weight:700;color:var(--muted);letter-spacing:0;font-size:10.5px}
.kpi-prox .val{transition:opacity .25s}
.kpi .val.feliz{display:flex;align-items:center;gap:8px;color:var(--good)}
.kpi .val.feliz svg{width:26px;height:26px;flex:none}
.kpi-prox:has(.feliz){border-color:color-mix(in srgb,var(--good) 42%,var(--ring))}
.kpi-prox:has(.feliz):hover{border-color:color-mix(in srgb,var(--good) 42%,var(--ring))}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;display:flex;gap:2px}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.slim{height:6px}
.bar > i.ok{background:var(--accent)}
.bar > i.warn{background:var(--warning)}
.bar > i.over{background:var(--critical)}
.bar > i.pausa{background:repeating-linear-gradient(135deg,var(--pausa) 0 4px,color-mix(in srgb,var(--pausa) 42%,var(--grid)) 4px 8px)}

/* ---------- screen cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:16px;box-shadow:var(--shadow);text-align:left;width:100%}
button.card{transition:transform .12s,border-color .12s}
button.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
.card h3{font-size:15px}
.card .hrs{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pctrow{display:flex;align-items:baseline;gap:8px;margin:10px 0 6px}
.pctrow b{font-size:24px;font-weight:680;letter-spacing:-.02em;line-height:1}
.pctrow span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;
  border:1px solid var(--ring);border-radius:999px;padding:2px 8px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.i-good{background:var(--good)} .i-warning{background:var(--warning)}
.i-critical{background:var(--critical)} .i-accent{background:var(--accent)}
.i-muted{background:var(--muted)}
.i-pausa{background:var(--pausa)}

/* ---------- screen detail ---------- */
.pbar{background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow);margin:22px 0 18px}
.pbar .row1{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ptitulo{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.pbar h2{font-size:19px}
.ultimo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.ultimo i{width:6px;height:6px;border-radius:50%;flex:none}
.ultimo b{font-weight:650;color:var(--ink)}
.ultimo .uc{color:var(--muted)}
.ultimo.vacio{color:var(--muted)}
/* ---------- horario de operación ---------- */
.horario{display:flex;align-items:stretch;gap:12px;background:var(--surface-2);border:1px solid var(--ring);border-radius:12px;padding:10px 14px}
.hcol{display:flex;flex-direction:column;gap:3px;justify-content:center}
.hlbl{font-size:10px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.horario input[type=time]{
  background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 9px;
  font-size:14px;font-weight:620;font-variant-numeric:tabular-nums;
}
.horario input[type=time]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hfijo{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;padding:6px 0}
.harrow{align-self:center;color:var(--muted);font-size:14px;padding-top:12px}
.hsep{width:1px;background:var(--grid);margin:2px 2px}
.hres{display:flex;flex-direction:column;gap:1px;justify-content:center;min-width:96px}
.hres b{font-size:19px;font-weight:690;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.hres small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hpre{display:flex;flex-direction:column;gap:3px;justify-content:center}
.hpre .r{display:flex;gap:4px}
.hpre button{border:1px solid var(--ring);background:var(--surface);border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:620;font-variant-numeric:tabular-nums}
.hpre button:hover{border-color:var(--accent)}
.hpre button.on{background:var(--accent);color:#fff;border-color:transparent}
.hmin{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.hmin input{width:62px;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 7px;font-size:13px;font-weight:620;font-variant-numeric:tabular-nums;color:var(--ink)}
.hmin input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- sugerencia ---------- */
.sugg{display:flex;align-items:center;gap:12px;margin-top:14px;border:1px solid var(--ring);border-radius:11px;padding:11px 14px}
.sugg .sicon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.sugg .stxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sugg .stxt b{font-size:13px;font-weight:650}
.sugg .stxt small{font-size:12px;color:var(--ink-2)}
.sugg[data-t="baja"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--ring));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.sugg[data-t="baja"] .sicon{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.sugg[data-t="sube"]{border-color:color-mix(in srgb,var(--warning) 55%,var(--ring));background:color-mix(in srgb,var(--warning) 9%,var(--surface))}
.sugg[data-t="sube"] .sicon{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.sugg[data-t="horario"]{border-color:color-mix(in srgb,var(--pausa) 45%,var(--ring))}
.sugg[data-t="horario"] .sicon{background:color-mix(in srgb,var(--pausa) 18%,transparent);color:var(--pausa)}
.sugg[data-t="ok"]{border-color:color-mix(in srgb,var(--good) 40%,var(--ring))}
.sugg[data-t="ok"] .sicon{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:14px}
.metric .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.metric .val{font-size:20px;font-weight:670;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric .val.warn{color:var(--warning)} .metric .val.bad{color:var(--critical)}

.sublists{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.sub{background:var(--surface);border:1px solid var(--ring);border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sub.full{border-color:var(--warning)}
.sub.over{border-color:var(--critical)}
.sub .sh{padding:13px 14px 11px;border-bottom:1px solid var(--grid)}
.sub .sh .r{display:flex;align-items:center;gap:8px}
.sub .sh h4{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .sh .cap{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin:7px 0 5px}
.sub .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.camp{
  border:1px solid var(--ring);border-left:3px solid var(--muted);border-radius:9px;
  padding:9px 10px;background:var(--surface-2);
}
.camp.s-activa{border-left-color:var(--good)}
.camp.s-porvencer{border-left-color:var(--warning)}
.camp.s-finalizada{border-left-color:var(--critical);opacity:.72}
.camp.s-programada{border-left-color:var(--accent)}
.camp.s-sinfecha{border-left-color:var(--muted)}
.camp.s-pausada{border-left-color:var(--pausa);background:color-mix(in srgb,var(--pausa) 7%,var(--surface-2))}
.camp.s-pausada .cli{opacity:.75}
.camp[draggable="true"]{cursor:grab}
.camp[draggable="true"]:active{cursor:grabbing}
.camp.arrastrando{opacity:.35}
.camp .grip{width:11px;height:15px;fill:var(--muted);flex:none;opacity:.55}
.camp[draggable="true"]:hover .grip{opacity:1;fill:var(--accent)}
.sub.dropok{outline:2px dashed var(--accent);outline-offset:-3px}
.sub.dropfull{outline:2px dashed var(--warning);outline-offset:-3px}
.sub.dropok .sh, .sub.dropfull .sh{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.camp .c1{display:flex;align-items:center;gap:8px}
.camp .cli{font-weight:620;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp .spots{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:1px 6px;flex:none}
.camp .c2{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.camp .cmp{font-size:11.5px;color:var(--muted);font-style:italic}
.camp .c3{display:flex;align-items:center;gap:6px;margin-top:7px}
.badge{font-size:10.5px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;border-radius:999px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px;flex:none}
.camp .c3 .badge{margin-right:auto}
.badge i{width:6px;height:6px;border-radius:50%}
.b-activa{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.b-porvencer{color:var(--warning);background:color-mix(in srgb,var(--warning) 16%,transparent)}
.b-finalizada{color:var(--critical);background:color-mix(in srgb,var(--critical) 14%,transparent)}
.b-programada{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.b-sinfecha{color:var(--muted);background:color-mix(in srgb,var(--muted) 16%,transparent)}
.b-pausada{color:var(--pausa);background:color-mix(in srgb,var(--pausa) 16%,transparent)}
.pausatxt{font-size:11.5px;color:var(--pausa);font-weight:600;margin-top:3px}

/* ---------- versiones de arte ---------- */
.vchip{
  display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:650;
  border:1px solid var(--ring);border-radius:999px;padding:2px 9px;background:var(--surface);
}
.vchip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.vchip[data-vers]{cursor:pointer}
.vchip[data-vers]:hover{border-color:currentColor}
.v-vigente{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.v-porvencer{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,var(--surface))}
.v-vencida{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,var(--surface))}
.v-programada{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.v-sinfecha{color:var(--muted)}

/* detalle de campaña en Soporte Comercial de solo lectura */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:8px}
.dcell{background:var(--surface-2);border:1px solid var(--ring);border-radius:9px;padding:8px 10px;min-width:0}
.dcell span{display:block;font-size:10px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dcell b{display:block;font-size:14px;font-weight:660;margin-top:3px}
.vrow.ro b{flex:1;min-width:90px;font-size:12.5px}
.vrow.ro .cmp{font-size:11.5px;color:var(--muted)}
.artechip.a-ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.vlist{display:flex;flex-direction:column;gap:5px}
.vlist:empty{display:none}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--ring);border-left-width:3px;border-radius:9px;padding:6px 8px}
.vrow[data-e="vigente"]{border-left-color:var(--good)}
.vrow[data-e="porvencer"]{border-left-color:var(--warning)}
.vrow[data-e="vencida"]{border-left-color:var(--critical)}
.vrow[data-e="programada"]{border-left-color:var(--accent)}
.vrow[data-e="sinfecha"]{border-left-color:var(--muted)}
.field .vrow input{width:auto;padding:5px 8px;font-size:12.5px;background:var(--surface);border:1px solid var(--ring);border-radius:7px}
.field .vrow input.v_tit{flex:1;min-width:90px;font-weight:600}
.field .vrow input[type=date]{flex:none;font-variant-numeric:tabular-nums}
.vrow .vsep{color:var(--muted);font-size:12px;flex:none}
.vrow .badge{flex:none;white-space:nowrap;min-width:84px;justify-content:center;margin-left:auto}
.vfoot{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.vfoot .hint{flex:1;min-width:140px}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 6px;border:1px dashed var(--axis);border-radius:9px}
.addrow{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.togg{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink-2);font-weight:550;cursor:pointer;user-select:none}
.togg input{accent-color:var(--accent);margin:0}
.freebadge{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center;margin-left:auto}

/* ---------- cápsulas de aviso de Soporte Comercial ---------- */
.avchip{
  display:inline-flex;align-items:center;gap:5px;margin-top:6px;margin-right:5px;
  font-size:11px;font-weight:660;border-radius:999px;padding:2px 9px;
  border:1px solid currentColor;cursor:pointer;
}
.avchip svg{width:11px;height:11px;fill:currentColor;flex:none}
.avchip.a-baja{color:var(--critical);background:color-mix(in srgb,var(--critical) 13%,transparent)}
.avchip.a-val{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.avchip.a-cam{color:var(--pausa);background:color-mix(in srgb,var(--pausa) 13%,transparent)}
.avchip.a-com{color:var(--ink-2);background:var(--surface-2)}
/* acciones de cada fila del buscador: con nombre, no solo íconos */
.acc2{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.acc2 .btn{white-space:nowrap}
.acc2 .btn svg{width:12px;height:12px;fill:currentColor;flex:none;margin-right:-1px}
.acc2 .btn.danger{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 35%,var(--ring))}
.acc2 .btn.danger:hover{background:color-mix(in srgb,var(--critical) 12%,var(--surface))}
.acc2 .btn.conmarca{border-color:color-mix(in srgb,var(--accent) 50%,var(--ring));color:var(--accent)}
/* pie de la ficha de campaña: varias acciones con nombre */
.mf.mfacc{flex-wrap:wrap;gap:7px}
.mf.mfacc .hint{flex:1 1 180px;min-width:150px}
.mf.mfacc .btn svg{width:12px;height:12px;fill:currentColor;flex:none;margin-right:-1px}
.mf.mfacc .btn.danger{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 35%,var(--ring))}
.mf.mfacc .btn.danger:hover{background:color-mix(in srgb,var(--critical) 12%,var(--surface))}
.mf.mfacc .btn.conmarca{border-color:color-mix(in srgb,var(--accent) 50%,var(--ring));color:var(--accent)}
tr.deexcel{background:color-mix(in srgb,var(--muted) 5%,transparent)}
tr.deexcel td{border-bottom-style:dashed}
.pchip2.sel{cursor:pointer;user-select:none}
.pchip2.sel input{width:14px;height:14px;accent-color:var(--accent);margin:0 4px 0 0;padding:0;border:0;background:transparent}
.pchip2:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));color:var(--ink)}
/* estado del Excel de rentabilidad en la barra */
.xldot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.xldot.ok{background:var(--good)}
.xldot.pide{background:var(--warning)}
.xldot.no{background:var(--critical)}
#btn_xl.pide{border-color:color-mix(in srgb,var(--warning) 60%,var(--ring))}
#btn_xl.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--ring))}
.xlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

/* decisión: actualizar la fila que ya existe o entrar como OP nueva */
.decide{border:1px solid color-mix(in srgb,var(--warning) 50%,var(--ring));
  background:color-mix(in srgb,var(--warning) 7%,transparent);
  border-radius:11px;padding:13px 14px;margin:12px 0}
.decide > b{display:block;font-size:13.5px;font-weight:660}
.decide > small{display:block;font-size:11.5px;color:var(--ink-2);margin:2px 0 10px}
.opd{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;margin-bottom:7px;cursor:pointer;
  border:1px solid var(--ring);border-radius:9px;background:var(--surface)}
.opd:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--ring))}
.opd.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opd input{margin:2px 0 0;flex:none;width:auto}
.opd span{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2);line-height:1.45}
.opd span > b:first-child{display:block;font-size:13px;font-weight:660;color:var(--ink);margin-bottom:2px}
.opd span b{font-weight:660;color:var(--ink)}

/* cápsula: Producción movió las fechas de una OP todavía sin rentabilizar */
.cambchip{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:2px 8px 2px 6px;
  border-radius:999px;font-size:10.5px;font-weight:650;white-space:nowrap;
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--ring));
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cambchip svg{width:11px;height:11px;fill:currentColor;flex:none}

/* ---------- To-Do de animaciones: tablero por estados ---------- */
.tdboard{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;align-items:start}
@media (max-width:1250px){ .tdboard{grid-template-columns:repeat(3,minmax(210px,1fr))} }
@media (max-width:820px){  .tdboard{grid-template-columns:repeat(2,minmax(180px,1fr))} }
@media (max-width:560px){  .tdboard{grid-template-columns:1fr} }
.tdcol{background:var(--surface-2);border:1px solid var(--ring);border-radius:13px;padding:10px;
  min-height:150px;transition:border-color .12s,background .12s}
.tdcol.dropok{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}
.tdcol > header{display:flex;align-items:center;gap:7px;padding:2px 2px 10px;border-bottom:1px solid var(--ring);
  margin-bottom:10px}
.tdcol > header b{flex:1;min-width:0;font-size:12.5px;font-weight:660;line-height:1.25}
.tdcol .tdi{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11px;background:color-mix(in srgb,currentColor 16%,transparent)}
.tdcol .tdn{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tdcol .tdmas{width:22px;height:22px;flex:none;border-radius:6px;font-size:15px;line-height:1;cursor:pointer;
  color:var(--muted);background:var(--surface);border:1px solid var(--ring)}
.tdcol .tdmas:hover{color:var(--accent);border-color:var(--accent)}
.tdcol.c-odd{color:#4A798C} .tdcol.c-anim{color:#8A5406} .tdcol.c-env{color:#1C4E8A}
.tdcol.c-ok{color:#2F7D32}  .tdcol.c-oksop{color:#6C5CE7}
.tdlista{display:flex;flex-direction:column;gap:8px;min-height:44px}
.tdvacio{font-size:11px;color:var(--muted);margin:6px 2px;line-height:1.4}
.tdcard{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:10px 11px;
  cursor:grab;color:var(--ink)}
.tdcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--ring))}
.tdcard.arrastrando{opacity:.45}
.tdtit{display:flex;align-items:flex-start;gap:6px}
.tdtit b{flex:1;min-width:0;font-size:13px;font-weight:660;line-height:1.3;word-break:break-word}
.tdx{flex:none;width:20px;height:20px;border-radius:6px;font-size:13px;line-height:1;cursor:pointer;
  color:var(--muted);background:transparent;border:1px solid transparent}
.tdx:hover{color:var(--accent);border-color:var(--ring);background:var(--surface-2)}
.tdodd{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-top:3px}
.tdcli{font-size:11.5px;font-weight:640;color:var(--accent);margin-top:3px}
.tdnota{font-size:11px;color:var(--ink-2);margin-top:5px;line-height:1.4}
.tdfec{font-size:10.5px;font-weight:640;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.tdav{font-size:10px;font-weight:660;color:var(--muted);border:1px dashed var(--ring);
  border-radius:999px;padding:2px 7px;white-space:nowrap}
/* el pie de la tarjeta: los días a la izquierda y lo demás a la derecha.
   Si no caben en una línea, bajan en vez de encimarse. */
.tdpie{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;flex-wrap:wrap}
.tdedad{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tdedad.vieja{color:var(--warning);font-weight:660}
.tdok{font-size:10.5px;font-weight:700;color:var(--good)}
.tdpd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tdhist{display:flex;flex-wrap:wrap;gap:6px}
.tdhi{font-size:10.5px;color:var(--ink-2);padding:3px 8px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--ring)}
.tdhi b{font-weight:660;color:var(--ink)}
.tdarch{display:flex;flex-direction:column;gap:8px}
.tdar{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--ring);
  border-radius:9px;background:var(--surface-2)}
.tdar .ta{flex:1;min-width:0;line-height:1.3}
.tdar .ta b{display:block;font-size:13px;font-weight:660}
.tdar .ta small{font-size:11px;color:var(--ink-2)}
.tdvers{display:flex;flex-direction:column;gap:7px;max-height:186px;overflow:auto;margin-top:8px}
.tdver{text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--ring);color:var(--ink);line-height:1.35}
.tdver:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--ring))}
.tdver.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}
.tdver b{display:block;font-size:13px;font-weight:660}
.tdver small{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
#td_est{width:100%;font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--ring)}
#td_est:focus{outline:none;border-color:var(--accent)}

/* ---------- pantalla de entrada de Soporte Comercial ---------- */
.bienv{margin:38px auto;max-width:720px;padding:30px 28px}
.bienv h2{font-size:20px;font-weight:680;margin:0 0 8px}
.bienv .bsub{color:var(--ink-2);font-size:13px;line-height:1.5;margin:0 0 20px}
.paso2{display:flex;align-items:center;gap:14px;padding:14px 15px;border:1px solid var(--ring);
  border-radius:11px;background:var(--surface-2);margin-bottom:10px}
.paso2.hecho{border-color:color-mix(in srgb,var(--good) 45%,var(--ring));
  background:color-mix(in srgb,var(--good) 7%,var(--surface-2))}
.paso2 .pnum{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--surface);border:1px solid var(--ring);color:var(--muted)}
.paso2.hecho .pnum{background:var(--good);border-color:var(--good);color:#fff}
.paso2 .ptxt{flex:1;min-width:0;line-height:1.35}
.paso2 .ptxt b{display:block;font-size:14px;font-weight:660}
.paso2 .ptxt small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.paso2 .pacc{flex:none;display:flex;align-items:center;gap:8px}
.paso2 .pacc .hint{font-size:11.5px;white-space:nowrap}
.bienv .bfin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--ring)}
.bienv .bfin .hint{font-size:11.5px;flex:1;min-width:180px}
.bienv .bnav{margin-top:14px;font-size:11px}
@media (max-width:640px){
  .paso2{flex-wrap:wrap}
  .paso2 .pacc{width:100%;padding-left:42px}
}
.verchip{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--ring));
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border-radius:999px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* hilo de comentarios */
.hilo{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.cmt{border:1px solid var(--ring);border-left:3px solid var(--accent);border-radius:10px;
  padding:8px 11px;background:var(--surface-2)}
.cmt.prod{border-left-color:var(--good)}
.cmh{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
.cmh b{font-size:11.5px;font-weight:680;color:var(--ink-2)}
.cmh span{flex:1;font-variant-numeric:tabular-nums}
.cmx{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;border-radius:5px}
.cmx:hover{color:var(--critical);background:color-mix(in srgb,var(--critical) 14%,transparent)}
.cmt-t{font-size:13px;white-space:pre-wrap;word-break:break-word}
.field textarea{resize:vertical;min-height:64px;font-family:inherit}
.btn.solo.conmarca{position:relative}
.btn .cnum{position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 3px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:9.5px;font-weight:750;display:grid;place-items:center;line-height:1}
/* opciones de radio con explicación */
.opcs{display:flex;flex-direction:column;gap:6px}
.opc{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--ring);border-radius:10px;
  padding:10px 12px;background:var(--surface-2);cursor:pointer}
/* gana a la regla general ".field input{width:100%}" */
.field .opc input,.opc input{width:16px;height:16px;min-width:16px;accent-color:var(--accent);
  margin:2px 0 0;padding:0;border:0;border-radius:50%;background:transparent;flex:none}
.opc:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface-2))}
.opc:has(input:disabled){opacity:.55;cursor:default}
.opct{display:block;flex:1;min-width:0;line-height:1.3}
.opct b{display:block;font-size:13px;font-weight:640}
.opct small{font-size:11.5px;color:var(--ink-2)}
.avchip:hover{filter:brightness(1.18)}
.camp.pide-baja{
  border-left-color:var(--critical)!important;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--critical) 32%,transparent);
}
input.busop{
  flex:1;min-width:220px;background:var(--surface);border:1px solid var(--ring);
  border-radius:9px;padding:8px 12px;font-size:13.5px;color:var(--ink);
}
input.busop:focus{outline:2px solid var(--accent);outline-offset:-1px}
.nlist .nrow .btn{flex:none}

/* ---------- registro en el Excel de rentabilidad ---------- */
.pchips2{display:flex;gap:6px;flex-wrap:wrap}
.pchip2{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:560;
  border:1px solid var(--ring);border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2);
}
.pchip2 b{font-size:10px;font-weight:750;letter-spacing:.04em;color:var(--accent)}
.aviso2{display:flex;align-items:center;gap:11px;border:1px solid var(--ring);border-left-width:3px;
  border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.aviso2 .ai{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.aviso2 .at{flex:1;min-width:0;line-height:1.3}
.aviso2 .at b{display:block;font-size:12.5px;font-weight:640}
.aviso2 .at small{font-size:11.5px;color:var(--ink-2)}
.aviso2.w{border-left-color:var(--warning)}
.aviso2.w .ai{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.aviso2.c{border-left-color:var(--critical)}
.aviso2.c .ai{background:color-mix(in srgb,var(--critical) 18%,transparent);color:var(--critical)}
.aviso2.a{border-left-color:var(--good)}
.aviso2.a .ai{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.mf .hint{margin-right:auto}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.tblwrap{background:var(--surface);border:1px solid var(--ring);border-radius:13px;overflow:auto;box-shadow:var(--shadow)}

/* ---------- search ---------- */
.searchbox{display:flex;gap:10px;align-items:center;margin:22px 0 14px;flex-wrap:wrap}
.searchbox input[type=search]{
  flex:1;min-width:240px;background:var(--surface);border:1px solid var(--ring);
  border-radius:10px;padding:10px 14px;font-size:14px;
}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--ring);border-radius:15px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mb{max-height:78vh;overflow:auto}
.modal.ancho{width:min(940px,100%)}
.modal.ancho .mb{max-height:70vh;overflow:auto}

/* ---------- reporte ---------- */
.repsem{border:1px solid var(--ring);border-radius:11px;overflow:hidden;background:var(--surface-2)}
.rephead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--grid)}
.rephead b{font-size:13.5px}
.rephead small{display:block;font-size:11px;color:var(--muted)}
.rephead .chips{margin:0;flex:1;justify-content:flex-end}
.reptab{font-size:12.5px}
.reptab td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.reptab tr:last-child td{border-bottom:0}
.reptab .cmp{font-size:11px;color:var(--muted);font-style:normal;margin-top:1px}
.optodas button.sel{background:var(--accent);color:#fff;border-color:transparent}
.repfil{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--ring);border-radius:11px;padding:10px 13px}
.repfil input[type=date]{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.repfil input[type=date]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.repchips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.repchips button{border:1px solid var(--ring);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:620;color:var(--ink)}
.repchips button:hover{border-color:var(--accent)}
.repchips button.sel{background:var(--accent);color:#fff;border-color:transparent}
.reptab2{font-size:12.5px}
.reptab2 th{position:sticky;top:0;background:var(--surface);z-index:1}
.reptab2 td{padding:8px 10px;vertical-align:top}
.reptab2 .cmp{font-size:10.5px;color:var(--muted);font-style:normal;margin-top:1px}
.reptab2 .badge{white-space:nowrap}
.reptab2 th:nth-child(5),.reptab2 td:nth-child(5){min-width:150px}
.reptab2 .cmp.pv{color:var(--serious);font-weight:660}
.reptab2 .cmp.venc{color:var(--critical);font-weight:660}
.reptab2 tr.secrow td{background:var(--surface-2);border-top:1px solid var(--ring);border-bottom:1px solid var(--ring);
  font-size:11px;color:var(--muted);padding:7px 10px}
.reptab2 tr.secrow b{color:var(--ink);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.uplist{display:flex;flex-wrap:wrap;gap:4px}
.upitem{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--ring);border-radius:999px;padding:2px 8px;background:var(--surface-2);white-space:nowrap}
.upitem b{font-variant-numeric:tabular-nums;font-weight:680}
.upitem.pausa{border-color:color-mix(in srgb,var(--pausa) 55%,var(--ring));color:var(--pausa)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:16px;flex:1}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--grid);display:flex;gap:8px;justify-content:flex-end}
.modal .mf.repmf{align-items:center;flex-wrap:wrap}
.modal .mf.repmf .hint{margin-right:auto;flex:1;min-width:180px}
.field{display:grid;gap:5px}
.field > label{font-size:11.5px;font-weight:620;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.pausebox{display:flex;align-items:center;gap:10px;border:1px solid var(--ring);border-radius:10px;padding:11px 13px;background:var(--surface-2);cursor:pointer;user-select:none}
.pausebox input{width:17px;height:17px;accent-color:var(--pausa);margin:0;flex:none}
.pausebox .t{flex:1}
.pausebox .t b{display:block;font-size:13px;font-weight:620}
.pausebox .t small{font-size:11.5px;color:var(--muted)}
.pausebox:has(input:checked){border-color:var(--pausa);background:color-mix(in srgb,var(--pausa) 10%,var(--surface-2))}
.multi{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto;border:1px solid var(--ring);border-radius:10px;padding:6px;background:var(--surface-2)}
.mrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer}
.mrow:hover{background:var(--surface)}
.multi .mrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none;padding:0;background:transparent;border:0;border-radius:0}
.mrow .mn{font-size:13px;font-weight:600;min-width:150px;flex:none}
.mrow .md{font-size:11.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow[data-t="nueva"] .md{color:var(--warning)}
.mrow[data-t="dup"]{opacity:.5;cursor:default}
.mrow[data-t="dup"] .md{color:var(--good)}
.mrow:has(input:checked){background:color-mix(in srgb,var(--accent) 12%,var(--surface))}

/* ---------- ingreso de OP ---------- */
.opload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--ring);border-radius:11px;padding:10px 12px}
.opload .hint{flex:1;min-width:180px}
.hint.ok{color:var(--good)}
.oprow .opb button[data-extra]{border-color:color-mix(in srgb,var(--accent) 55%,var(--ring));width:auto;padding:5px 9px}
.opgrid{display:flex;flex-direction:column;gap:3px;max-height:264px;overflow:auto;border:1px solid var(--ring);border-radius:10px;padding:6px;background:var(--surface-2)}
.oprow{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px}
.oprow:hover{background:var(--surface)}
.opinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opnom{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oprow .od{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oprow .opb{display:flex;gap:4px;flex:none}
.oprow .opval{display:flex;gap:7px;flex:none}
.oprow .opval label{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.oprow .opval span{font-size:9px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.oprow .opval input{width:88px;padding:4px 7px;font-size:12.5px;text-align:right;
  background:var(--surface);border:1px solid var(--ring);border-radius:7px;font-variant-numeric:tabular-nums}
.oprow .opval input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.oprow .opval.off{opacity:.35}
.optot span{color:var(--ink-2)}
.oprow .opb button{
  border:1px solid var(--ring);background:var(--surface);border-radius:7px;
  padding:5px 0;width:48px;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;
}
.oprow .opb button:hover{border-color:var(--accent)}
.oprow .opb button.sel{background:var(--accent);color:#fff;border-color:transparent}

/* ---------- borrado multipantalla ---------- */
.dlist{display:flex;flex-direction:column;gap:3px;max-height:240px;overflow:auto;border:1px solid var(--ring);border-radius:10px;padding:6px;background:var(--surface-2)}
.drow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.drow:hover{background:var(--surface)}
.dlist .drow input[type=checkbox]{width:16px;height:16px;accent-color:var(--critical);margin:0;flex:none;padding:0;background:transparent;border:0;border-radius:0}
.dinfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.dnom{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow[data-t="otra"] .dsub{color:var(--warning)}
.drow:has(input:checked){background:color-mix(in srgb,var(--critical) 12%,var(--surface))}
.btn:disabled{opacity:.5;cursor:default}
.oprow[data-t="nueva"] .od{color:var(--warning)}
.oprow[data-t="dup"] .od{color:var(--good)}
.oprow[data-act="1"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.optodas{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
.optodas button{border:1px solid var(--ring);background:var(--surface-2);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:620;color:var(--ink)}
.optodas button:hover{border-color:var(--accent)}
.optot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink-2)}
.optot b{font-size:16px;font-weight:680;font-variant-numeric:tabular-nums;color:var(--ink)}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--ring);border-radius:9px;padding:9px 11px;font-size:14px;width:100%;
  line-height:1.45;
}
/* un select y un input de la misma fila deben medir igual de alto: el select
   no hereda la altura de línea del texto, así que se les fija la misma */
.field input,.field select{min-height:40px}
.field input[type=date]{height:40px}   /* el calendario del navegador viene más alto */
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.quick button{border:1px solid var(--ring);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600}
.quick button.on{background:var(--accent);color:#fff;border-color:transparent}

/* estado del arte: recibido / sin arte / en aprobación */
.artebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.artebtns button{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--ring);background:var(--surface-2);border-radius:7px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-2);
}
.artebtns button i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.artebtns button:hover{border-color:var(--accent)}
.artebtns button[data-a=""]{color:var(--good)}
.artebtns button[data-a="sin"]{color:var(--critical)}
.artebtns button[data-a="aprob"]{color:var(--warning)}
.artebtns button.on{border-color:transparent;color:#fff}
.artebtns button[data-a=""].on{background:var(--good)}
.artebtns button[data-a="sin"].on{background:var(--critical)}
.artebtns button[data-a="aprob"].on{background:var(--warning);color:#1b2229}
/* donación / canje */
.negbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.negbtns button{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--ring);background:var(--surface-2);border-radius:7px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-2);
}
.negbtns button i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.negbtns button:hover{border-color:var(--accent)}
.negbtns button[data-g="donacion"]{color:var(--pausa)}
.negbtns button[data-g="canje"]{color:var(--serious)}
.negbtns button[data-g="dacion"]{color:var(--accent)}
.negbtns button[data-g="bonificacion"]{color:var(--good)}
.negbtns button.on{border-color:transparent;color:#fff}
.negbtns button[data-g=""].on{background:var(--muted)}
.negbtns button[data-g="donacion"].on{background:var(--pausa)}
.negbtns button[data-g="canje"].on{background:var(--serious)}
.negbtns button[data-g="dacion"].on{background:var(--accent)}
.negbtns button[data-g="bonificacion"].on{background:var(--good)}
.negchip{
  display:inline-flex;align-items:center;gap:5px;width:fit-content;margin-top:4px;
  font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;
}
.negchip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
/* modalidad que aplica solo a algunas pantallas: se marca con borde discontinuo */
.negchip.parcial{border-style:dashed}
/* selector de modalidad dentro de cada fila de la rejilla de la OP */
.opval .opneg{min-width:132px}
.opval .opneg select{width:100%;font:inherit;font-size:12px;padding:6px 8px;border-radius:8px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--ring)}
.opval .opneg select:focus{outline:none;border-color:var(--accent)}
.neghint{color:var(--ink-2)}
.neghint b{color:var(--ink)}
/* selector de modalidad en la tabla de valores de Soporte Comercial */
.valtab select.vg{width:100%;min-width:118px;font:inherit;font-size:12.5px;padding:6px 8px;
  border-radius:8px;color:var(--ink);background:var(--surface-2);border:1px solid var(--ring)}
.valtab select.vg:focus{outline:none;border-color:var(--accent)}
/* la pantalla con modalidad propia se distingue en la ventana de Rentabilizar */
.pchip2 .pneg{font-style:normal;font-size:10px;font-weight:700;margin-left:5px;padding:1px 6px;
  border-radius:999px;background:color-mix(in srgb,currentColor 16%,transparent)}
.pchip2.n-donacion{color:#6C5CE7} .pchip2.n-canje{color:#C2571B}
.pchip2.n-dacion{color:#1B4E8C}  .pchip2.n-bonificacion{color:#2F7D32}
.n-donacion{background:color-mix(in srgb,var(--pausa) 18%,transparent);color:var(--pausa)}
.n-canje{background:color-mix(in srgb,var(--serious) 20%,transparent);color:var(--serious)}
.n-dacion{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.n-bonificacion{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.sublbl{display:block;font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start}
/* dos campos en una fila: el de la izquierda un poco más ancho.
   align-items:start evita que un campo sin pista de ayuda se estire
   para igualar la altura del que sí la tiene. */
.dos{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:start}
.tres > .field,.dos > .field{align-content:start}
@media (max-width:560px){ .tres,.dos{grid-template-columns:1fr} }
.money{font-variant-numeric:tabular-nums}
.cmp.nw{white-space:nowrap}
.th2{display:block;font-size:9.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:1px}
.plist{display:flex;flex-direction:column;gap:3px}
.plist > span{display:block;line-height:1.35;white-space:nowrap}
.plist.num > span{font-variant-numeric:tabular-nums}
.revchip{
  display:inline-flex;align-items:center;gap:5px;width:fit-content;margin-top:4px;
  font-size:11px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--warning) 22%,transparent);color:var(--warning);
  border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);
}
.revchip:hover{background:color-mix(in srgb,var(--warning) 34%,transparent)}
.revchip svg{width:13px;height:13px;fill:currentColor;flex:none}
.avlist{display:flex;flex-direction:column;gap:7px}
.avrow{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;
  background:color-mix(in srgb,var(--warning) 12%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--warning) 32%,transparent);font-size:12.5px;line-height:1.4}
.avico{flex:none;width:18px;height:18px;border-radius:50%;background:var(--warning);color:#1b2229;
  font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.acc2{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.acc2 .btn{white-space:nowrap}
.acc2 .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.acc2 .btn:disabled:hover{filter:grayscale(.6)}
/* las celdas con varias líneas se alinean arriba, junto con la lista de pantallas */
#view tbody td{vertical-align:top}
.valtab input{width:112px;padding:5px 8px;font-size:12.5px;text-align:right;
  background:var(--surface-2);border:1px solid var(--ring);border-radius:7px;font-variant-numeric:tabular-nums}
.valtab input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.totbox{margin-top:9px;border:1px solid var(--ring);border-radius:9px;background:var(--surface-2);padding:8px 11px}
.totbox:empty{display:none}
.totlin{display:flex;align-items:baseline;gap:10px}
.totlin span{font-size:11.5px;color:var(--muted);flex:1}
.totlin b{font-size:16px;font-variant-numeric:tabular-nums}
.tothint{font-size:11px;color:var(--muted);margin-top:3px}
tr.rentado{opacity:.5}
tr.rentado b{font-weight:600}
.sechead .hint{margin-left:auto;flex:none}
.vcell{display:flex;flex-direction:column;gap:1px;font-size:11.5px;line-height:1.3}
.vcell b{font-size:12.5px;font-variant-numeric:tabular-nums}
.vcell span{color:var(--muted);font-variant-numeric:tabular-nums}
.artechip{
  display:inline-flex;align-items:center;gap:5px;width:fit-content;margin-top:4px;
  font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;
}
.artechip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.a-sin{background:color-mix(in srgb,var(--critical) 16%,transparent);color:var(--critical)}
.a-aprob{background:color-mix(in srgb,var(--warning) 22%,transparent);color:var(--warning)}
.constbox{border:1px dashed var(--ring);border-radius:10px;padding:11px 12px;background:var(--surface-2)}
.constbox .btn{margin-bottom:5px}

/* galería de constancias */
.btn.solo{padding:0;justify-content:center;width:31px;height:27px;border-radius:7px}
.btn.solo svg{width:15px;height:15px;fill:currentColor}
.minis{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mini{
  border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;width:86px;
}
.mini:hover{border-color:var(--accent)}
.mini .mimg{padding:0;border:0;background:none;line-height:0;border-radius:4px;overflow:hidden;cursor:zoom-in}
.mini img{width:74px;height:104px;object-fit:cover;object-position:top;border-radius:4px;background:#fff;display:block}
.mini span{font-size:9px;line-height:1.25;color:var(--muted);text-align:center}
.mini .mdl{
  border:1px solid var(--ring);background:var(--surface-2);border-radius:6px;
  padding:3px 7px;font-size:9.5px;font-weight:650;color:var(--ink-2);width:100%;
}
.mini .mdl:hover{border-color:var(--accent);color:var(--accent)}

/* visor flotante de una constancia */
#lbox{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px}
#lbox .lbin{background:var(--surface);border:1px solid var(--ring);border-radius:14px;box-shadow:var(--shadow);
  max-width:min(560px,94vw);width:100%;display:flex;flex-direction:column;overflow:hidden}
#lbox .lbh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--grid)}
#lbox .lbh b{font-size:13.5px}
#lbox .lbh span{font-size:11.5px;color:var(--muted);margin-right:auto}
#lbox .lbimg{background:var(--surface-2);padding:14px;display:flex;justify-content:center;overflow:auto;max-height:70vh}
#lbox .lbimg img{max-width:100%;border-radius:6px;box-shadow:var(--shadow);background:#fff;align-self:flex-start}
#lbox .lbf{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--grid)}
#lbox .lbf .hint{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mfalta{
  width:66px;height:96px;border-radius:4px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;text-align:center;padding:4px;
}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:12px}
.galcard{
  position:relative;border:1px solid var(--ring);border-radius:10px;background:var(--surface);
  overflow:hidden;display:flex;flex-direction:column;
}
.galcard.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.galcard .gth{background:#fff;height:190px;overflow:hidden;cursor:zoom-in;display:flex;justify-content:center}
.galcard .gth img{width:100%;object-fit:cover;object-position:top}
.galcard .gtx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.galcard .gtx b{font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.galcard .gtx span{font-size:10.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.galcard .gtx .cmp{color:var(--muted)}
.galcard .gsel{position:absolute;top:7px;right:7px;background:var(--surface);border:1px solid var(--ring);
  border-radius:6px;padding:3px 4px 1px;line-height:0}
.galcard .gsel input{width:15px;height:15px;accent-color:var(--accent)}
.vercon{display:flex;justify-content:center;background:var(--surface-2);border-radius:10px;padding:14px}
.vercon img{max-width:100%;max-height:64vh;border-radius:6px;box-shadow:var(--shadow);background:#fff}

.hint{font-size:11.5px;color:var(--muted)}
.hint.bad{color:var(--critical)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 0;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.sechead{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sechead h3{font-size:14px}
.sechead .line{flex:1;height:1px;background:var(--grid)}
.fsbar{max-width:1480px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.fsin{display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:1;min-width:0}
.fsacc{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.fsbar .pill{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:6px 11px;border:1px solid var(--ring);background:var(--surface);font-weight:550}
.fsbar .pill i{width:7px;height:7px;border-radius:50%;flex:none}
.fsbar .pill.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--ring))}
.fsbar .pill.warn{border-color:color-mix(in srgb,var(--warning) 60%,var(--ring));background:color-mix(in srgb,var(--warning) 9%,var(--surface))}
.fshint{color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--plane);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:550;z-index:200;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
@media (max-width:640px){ .two{grid-template-columns:1fr} .hoursel input[type=range]{width:120px} }
/* ---------- OP nuevas (Soporte crea, Producción ingresa) ---------- */
.opnsec{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--grid);padding-bottom:5px;margin-top:4px}
.opnseg{display:flex;gap:4px;flex-wrap:wrap}
.opnseg button{border:1px solid var(--ring);background:var(--surface-2);border-radius:8px;padding:0 14px;min-height:40px;
  font-size:13px;font-weight:620;color:var(--ink)}
.opnseg button:hover{border-color:var(--accent)}
.opnseg button.sel{background:var(--accent);color:#fff;border-color:transparent}
.opnvig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opnvig input[type=date]{flex:1;min-width:130px}
.opntot{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;align-items:end;
  background:var(--surface-2);border:1px solid var(--ring);border-radius:11px;padding:12px 14px}
.opntot > div > span{display:block;font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.opntot > div > b{font-size:19px;font-weight:720;font-variant-numeric:tabular-nums}
.opnnotas{margin:0;padding-left:18px;font-size:11px;color:var(--muted);line-height:1.5}
.opnmail{display:flex;gap:8px;flex-wrap:wrap}
.opnitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ring);border-radius:10px;
  background:var(--surface-2);flex-wrap:wrap}
.opnit{flex:1;min-width:220px;line-height:1.35}
.opnit small{display:block;font-size:11px;color:var(--muted)}
.opnmot{margin-top:6px;font-size:12px;padding:7px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--warning) 14%,transparent);border-left:3px solid var(--warning)}
.opncards{display:grid;gap:14px}
.opncard{border:1px solid var(--ring);border-radius:14px;background:var(--surface);padding:14px 16px;display:grid;gap:10px}
.opncard.pendiente{border-left:4px solid var(--accent)}
.opncard.devuelta{border-left:4px solid var(--warning)}
.opncard.ingresada{border-left:4px solid var(--good);opacity:.92}
.opncard header{display:flex;align-items:flex-start;gap:12px}
.opnh{flex:1;min-width:0;line-height:1.35}
.opnh b{font-size:16px;font-weight:700}
.opnh small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.opncorr{display:inline-block;font-size:10.5px;font-weight:720;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  background:#1B2229;color:#AEE901;border:1px solid color-mix(in srgb,#AEE901 35%,transparent);
  border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:2px}
.opntab{font-size:12.5px}
.opntab td,.opntab th{padding:7px 10px}
.opntab tfoot td{border-top:1px solid var(--ring)}
.opnplan{font-size:10.5px}
.opnplan.ok{color:var(--good)}
.opnplan.nueva{color:var(--warning)}
.opnplan.dup{color:var(--muted)}
.opnind{font-size:12.5px;line-height:1.45;padding:9px 12px;border-radius:9px;background:var(--surface-2);white-space:pre-wrap}
.opnind b{display:block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.opncard footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opncard footer .hint{flex:1;min-width:200px}
.tab .tabn{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10.5px;font-weight:720}
.opnejes{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.opnejes button{border:1px solid var(--ring);background:var(--surface-2);border-radius:999px;padding:4px 11px;
  font-size:12px;font-weight:620;color:var(--ink)}
.opnejes button:hover{border-color:var(--accent)}
.opnejes button.sel{background:var(--accent);color:#fff;border-color:transparent}
.opnlinks{display:grid;gap:6px}
.opnlink{display:flex;align-items:center;gap:8px}
.opnlink input{flex:1;min-width:0}
.opnln{flex:none;font-size:10px;font-weight:720;letter-spacing:.04em;text-transform:uppercase;color:#fff;
  background:#4A798C;border-radius:999px;padding:3px 9px}
.opnlink .btn{flex:none;width:40px;min-height:40px;padding:0;font-size:20px;font-weight:600;line-height:1;
  display:grid;place-items:center}
.opnlink .opnmas{background:var(--accent);color:#fff;border-color:transparent}
.opnenl a{display:flex;align-items:center;gap:8px;padding:3px 0;color:var(--accent);text-decoration:none;
  white-space:normal;word-break:break-all}
.opnenl a:hover{text-decoration:underline}
@media (max-width:640px){ .opntot{grid-template-columns:1fr} }

/* ---------- OOH · órdenes de diseño de vallas ---------- */
.oohbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.oohq{position:relative;flex:1 1 300px;max-width:440px}
.oohq svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);
  fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.oohq input{width:100%;min-height:38px;padding:7px 12px 7px 34px;border:1px solid var(--ring);border-radius:9px;
  background:var(--surface);color:var(--ink)}
.oohq input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.oohayuda{flex:1 1 220px}
.oohbar .btn.primary{margin-left:auto}
.oohkan{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:12px;align-items:start}
.oohcol{--c:var(--accent);background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:10px;
  display:grid;gap:10px;min-width:0}
.oohcol[data-e="trabajando"]{--c:#4A798C}
.oohcol[data-e="muestra"]{--c:var(--warning)}
.oohcol[data-e="cambios"]{--c:var(--serious)}
.oohcol[data-e="aprobado"]{--c:var(--good)}
.oohcol > header{display:flex;align-items:center;gap:8px;padding:2px 4px}
.oohcol > header i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.oohcol > header b{font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;flex:1}
.oohn{min-width:22px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;
  font-size:11px;font-weight:720;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.oohcards{display:grid;gap:10px}
.oohvacio{margin:0;padding:14px 6px;text-align:center;font-size:12px;color:var(--muted)}
.oohcard{--c:var(--accent);background:var(--surface);border:1px solid var(--ring);border-top:3px solid var(--c);
  border-radius:12px;padding:11px 12px;display:grid;gap:8px;box-shadow:var(--shadow);min-width:0}
.oohcard[data-e="trabajando"]{--c:#4A798C}
.oohcard[data-e="muestra"]{--c:var(--warning)}
.oohcard[data-e="cambios"]{--c:var(--serious)}
.oohcard[data-e="aprobado"]{--c:var(--good)}
.oohtop{display:flex;align-items:center;gap:6px;justify-content:space-between}
.oohtop .opncorr{margin:0;font-size:10px;padding:2px 6px;vertical-align:0}
.oohsus{font-size:9.5px;font-weight:760;letter-spacing:.06em;color:#1B2229;background:#AEE901;border-radius:999px;padding:2px 8px}
.oohcli{line-height:1.25;min-width:0}
.oohcli b{display:block;font-size:15px;font-weight:720;overflow-wrap:anywhere}
.oohcli small{display:block;font-size:11.5px;color:var(--muted)}
.oohcli small.oohase{color:var(--ink-2);font-weight:600}
.oohvrow{display:grid;grid-template-columns:minmax(140px,1fr) 3fr;gap:12px;align-items:start}
.oohvalla{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.oohvalla > div{min-width:0;line-height:1.25}
.oohvalla b{display:block;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.oohvalla span{display:block;font-size:11.5px;color:var(--ink-2)}
.oohsvg{flex:none}
.oohsvg .p{fill:#26313A;stroke:#AEE901;stroke-width:1.4}
.oohsvg .s{fill:var(--muted)}
.oohdir,.oohcon{display:flex;gap:7px;font-size:12px;line-height:1.35;color:var(--ink-2);min-width:0}
.oohdir span,.oohcon span{min-width:0;overflow-wrap:anywhere}
.oohdir svg,.oohcon svg{flex:none;width:14px;height:14px;margin-top:1px;fill:none;stroke:var(--muted);stroke-width:1.8}
.oohcon a{color:var(--accent);text-decoration:none;font-weight:600}
.oohenl{display:grid;gap:3px}
.oohenl a{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);text-decoration:none;min-width:0;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.oohenl a:hover{text-decoration:underline}
.oohenl .opnln{font-size:9px;padding:2px 7px}
.oohobs{font-size:12px;line-height:1.4;padding:7px 9px;border-radius:8px;background:var(--surface-2);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.oohest{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oohest small{font-size:11px;color:var(--muted)}
.oohpill{--c:var(--accent);appearance:none;-webkit-appearance:none;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:4px 12px;line-height:1.3;display:inline-flex;align-items:center}
select.oohpill{padding-right:26px;cursor:pointer;min-height:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select.oohpill:focus{outline:2px solid var(--accent);outline-offset:1px}
.oohpill[data-e="trabajando"]{--c:#4A798C}
.oohpill[data-e="muestra"]{--c:var(--warning)}
.oohpill[data-e="cambios"]{--c:var(--serious)}
.oohpill[data-e="aprobado"]{--c:var(--good)}
.oohed{font-size:10.5px;color:var(--muted)}
.oohcard footer{display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--grid);padding-top:8px}
.oohcard footer .btn{padding:4px 9px;font-size:11.5px}
.oohcard footer .oohfin{flex:1 1 100%;justify-content:center}
.oohcard footer .oohfin.primary{background:var(--good)}
.oohauto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oohauto > div{background:#1B2229;color:#fff;border-radius:11px;padding:10px 14px;line-height:1.3}
.oohauto span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#AEE901}
.oohauto b{display:block;font-size:17px;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.oohauto small{display:block;font-size:11px;color:#AEB8BB}
@media (max-width:640px){ .oohauto,.oohvrow{grid-template-columns:1fr} .oohbar .btn.primary{margin-left:0} }
/* ---------- Resumen: requieren atención en tarjetas ---------- */
.atn-sub{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.atn-sub i{width:8px;height:8px;border-radius:50%}
.atn-sub span{min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:inline-grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--ring);font-size:10.5px;color:var(--ink)}
.atn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:18px}
.atn{--c:var(--warning);background:var(--surface);border:1px solid var(--ring);border-left:4px solid var(--c);
  border-radius:14px;padding:13px 15px;display:grid;gap:9px;align-content:start;box-shadow:var(--shadow);min-width:0}
.atn.finalizada{--c:var(--critical)}
.atn-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.atn-dias{font-size:12px;font-weight:680;color:var(--c)}
.atn.porvencer .atn-dias{color:color-mix(in srgb,var(--warning) 70%,var(--ink))}
.atn-cli{line-height:1.25;min-width:0}
.atn-cli b{display:block;font-size:16px;font-weight:740;overflow-wrap:anywhere}
.atn-cli small{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.atn-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.atn-meta b{color:var(--ink);font-weight:680;font-variant-numeric:tabular-nums}
.atn-pants{display:flex;flex-wrap:wrap;gap:6px}
.atn-pant{border:1px solid var(--ring);background:var(--surface-2);border-radius:9px;padding:5px 10px;text-align:left;
  line-height:1.2;color:var(--ink);min-width:0}
.atn-pant:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}
.atn-pant b{display:block;font-size:12px;font-weight:650}
.atn-pant small{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.atn-top .atn-dias{margin-left:auto}
.atn-bor{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;
  border:1px solid color-mix(in srgb,var(--critical) 35%,var(--ring));background:transparent;color:var(--critical)}
.atn-bor:hover{background:color-mix(in srgb,var(--critical) 14%,var(--surface))}
.atn-bor svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

const KEY = "vnnox_listas_v1";
const SPOTS_HORA = 450;
const CAP_SUBLISTA = 900;
const HORA_MIN = 18, HORA_MAX = 23, HORA_STEP = 0.5;
const AVISO_DIAS = 7;               // "por vencer" si termina dentro de N días

/* ---------------- estado ---------------- */
let DB = null;
let tab = "resumen";                // "resumen" | "buscar" | id de pantalla
let refDate = todayISO();
let query = "";
let ocultarFin = false;          // ocultar campañas ya finalizadas en la vista de pantalla

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseISO(s){
  if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function fmt(s){
  const d = parseISO(s);
  if(!d) return "—";
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getFullYear()).slice(2)}`;
}
function days(a,b){ return Math.round((b-a)/86400000); }

/* --- horario de operación de la pantalla --- */
function aMin(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||""));
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function aHHMM(min){
  min = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(min/60)).padStart(2,"0") + ":" + String(min%60).padStart(2,"0");
}
function hora12(hhmm){
  const t = aMin(hhmm); if(t === null) return "—";
  const h = Math.floor(t/60), m = t % 60;
  const suf = h < 12 ? "a. m." : "p. m.";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + String(m).padStart(2,"0") + " " + suf;
}
/* Horas de operación; si el apagado es "menor" que el encendido, cruza la medianoche. */
function horasDe(on, off){
  const a = aMin(on), b = aMin(off);
  if(a === null || b === null) return 0;
  const d = (b - a + 1440) % 1440;
  return (d === 0 ? 1440 : d) / 60;
}
const HORA_SUGERIDA = "05:30";     // las pantallas normalmente encienden a esta hora
const MIN_HORAS_DEF = 16.5;        // mínimo de operación por defecto (configurable)
function minHoras(){ const v = Number(DB && DB.minHoras); return (isFinite(v) && v > 0) ? v : MIN_HORAS_DEF; }
const MAX_HORAS_OP = 23;

/* Propone un horario según los spots realmente comprometidos en la pantalla. */
function sugerirHorario(p, st){
  const sph = DB.spotsPorHora;
  const comprometidos = st.usados + st.pausados;
  const need = Math.ceil(comprometidos / (sph/2)) / 2;            // a media hora hacia arriba
  const nota = st.pausados ? ` (incluye ${miles(st.pausados)} en pausa)` : "";
  const on = HORA_SUGERIDA;
  const topeSpots = MAX_HORAS_OP * sph;

  if(need > MAX_HORAS_OP){
    return {tipo:"sube", on, off: aHHMM(aMin(on) + MAX_HORAS_OP*60), horas: MAX_HORAS_OP, icono:"!",
      titulo:`No alcanza ni operando ${MAX_HORAS_OP} h`,
      detalle:`Hay ${miles(comprometidos)} spots comprometidos${nota} y el tope son ${miles(topeSpots)}. Sobran ${miles(comprometidos - topeSpots)} spots que habría que mover a otra pantalla.`};
  }
  const h = Math.min(MAX_HORAS_OP, Math.max(minHoras(), need));
  const off = aHHMM(aMin(on) + Math.round(h*60));
  const capSug = Math.round(h * sph);

  if(h > p.horas + 0.01){
    return {tipo:"sube", on, off, horas:h, icono:"↑",
      titulo:`Amplía a ${textoHoras(h)} · ${hora12(on)} a ${hora12(off)}`,
      detalle: p.horas < minHoras()
        ? `La pantalla está en ${textoHoras(p.horas)} y el mínimo configurado son ${textoHoras(minHoras())}. Subiría la capacidad a ${miles(capSug)} spots.`
        : `Tienes ${miles(comprometidos)} spots comprometidos${nota} y solo caben ${miles(st.cap)}. Con ${textoHoras(h)} caben ${miles(capSug)}.`};
  }
  if(h < p.horas - 0.01){
    return {tipo:"baja", on, off, horas:h, icono:"↓",
      titulo:`Puedes bajar a ${textoHoras(h)} · ${hora12(on)} a ${hora12(off)}`,
      detalle:`Con ${miles(comprometidos)} spots comprometidos${nota} te sobran ${miles(st.cap - comprometidos)}. La capacidad quedaría en ${miles(capSug)} spots y apagarías ${textoHoras(p.horas - h)} antes.`};
  }
  if(p.on !== on){
    const off2 = aHHMM(aMin(on) + Math.round(p.horas*60));
    return {tipo:"horario", on, off: off2, horas:p.horas, icono:"↔",
      titulo:`Alinea el encendido a las ${hora12(on)}`,
      detalle:`Las pantallas suelen encender a esa hora. Manteniendo ${textoHoras(p.horas)} quedaría de ${hora12(on)} a ${hora12(off2)}.`};
  }
  return {tipo:"ok", icono:"✓",
    titulo:"El horario está bien ajustado",
    detalle:`${textoHoras(p.horas)} para ${miles(comprometidos)} spots comprometidos${nota} · quedan ${miles(st.cap - comprometidos)} libres.`};
}
