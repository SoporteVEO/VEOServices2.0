    <div class="mf">
      <button class="btn ghost" id="mcancel">Cancelar</button>
      <button class="btn primary" id="op_save">Ingresar OP</button>
    </div>`;
  document.getElementById("ov").hidden = false;

  const cajaArteOP = m.querySelector(".artebtns");
  activarArte(cajaArteOP);
  const cajaNegOP = m.querySelector(".negbtns");
  activarNeg(cajaNegOP);
  const campos = () => ({
    cliente: document.getElementById("op_cli").value.trim(),
    campana: document.getElementById("op_camp").value.trim(),
    inicio: document.getElementById("op_ini").value || null,
    fin: document.getElementById("op_fin").value || null,
    notas: document.getElementById("op_notas").value.trim(),
    arte: cajaArteOP ? cajaArteOP.dataset.arte : "",
    neg:    cajaNegOP ? cajaNegOP.dataset.neg : "",
    pausada: false, motivoPausa: "",
  });
  const vHintOP = document.getElementById("op_vhint");
  /* qué modalidad quedó en cada pantalla, dicho en una línea */
  function pintarNegOP(){
    const el = document.getElementById("op_neghint");
    if(!el) return;
    const act = [], porNeg = {};
    document.querySelectorAll("#op_grid .oprow").forEach(row => {
      if(n(row.dataset.frec) <= 0) return;
      const nom = row.querySelector(".opnom").textContent.trim();
      const g = row.querySelector(".opng").value || "";
      act.push(g);
      if(g){ (porNeg[g] = porNeg[g] || []).push(nom); }
    });
    if(!act.length){ el.textContent = ""; el.className = "hint"; return; }
    const conNeg = act.filter(Boolean).length;
    if(!conNeg){ el.textContent = `Las ${act.length} pantallas entran como pauta comercial.`;
                 el.className = "hint"; return; }
    const partes = Object.keys(porNeg).map(g =>
      `${NEG_ETIQ[g]} en ${porNeg[g].join(", ")}`);
    el.innerHTML = conNeg === act.length && Object.keys(porNeg).length === 1
      ? `Toda la OP entra como <b>${NEG_ETIQ[Object.keys(porNeg)[0]]}</b>.`
      : `<b>${partes.join(" · ")}</b> — las otras ${act.length - conNeg} entran como pauta comercial.`;
    el.className = "hint neghint";
  }
  /* los días que va a durar la pauta: de ahí salen los spots de la vigencia */
  function diasOP(){
    return diasDeVigencia(document.getElementById("op_ini").value,
                          document.getElementById("op_fin").value);
  }
  /* cada pantalla lleva su propio precio: el total es la suma y el $/spot sale
     de su frecuencia por los días que dura la pauta */
  function pintarValoresOP(){
    let total = 0, con = 0, sin2 = 0, aMano = 0;
    document.querySelectorAll("#op_grid .oprow").forEach(row => {
      const frec = n(row.dataset.frec);
      const inp = row.querySelector(".opvm"), sp = row.querySelector(".opvs");
      const activa = frec > 0;
      row.querySelector(".opval").classList.toggle("off", !activa);
      inp.disabled = !activa; sp.disabled = !activa;
      const mes = num(inp.value);
      if(!activa) return;
      if(mes === null){ sin2++; }
      else { total += mes; con++; }
      /* el valor por spot se sugiere, pero si lo escribes tú manda lo tuyo
         y no toca el valor mensual de la pantalla */
      if(row.dataset.spotmano !== "1"){
        const spv = frec * diasOP();
        sp.value = (mes !== null && spv > 0) ? +(mes / spv).toFixed(4) : "";
      }
      if(row.dataset.spotmano === "1") aMano++;
    });
    document.getElementById("op_vtotal").textContent = con ? money(total) : "$0.00";
    pintarNegOP();
    vHintOP.textContent = con
      ? `${con} pantalla${con === 1 ? "" : "s"} con valor` + (sin2 ? ` · ${sin2} sin valor` : "") +
        (aMano ? ` · ${aMano} con el valor por spot escrito a mano` : "") +
        ` · el valor por spot se calcula con el precio entre los spots de la vigencia (${miles(diasOP())} días)`
      : "Escribe el valor mensual de cada pantalla arriba. El valor por spot se calcula solo, y también lo puedes escribir tú.";
  }
  /* la modalidad de la OP se copia a todas las pantallas; cada fila la puede cambiar */
  if(cajaNegOP) cajaNegOP.addEventListener("click", e => {
    if(!e.target.closest("button")) return;
    setTimeout(() => {
      const g = cajaNegOP.dataset.neg || "";
      document.querySelectorAll("#op_grid .opng").forEach(s => { s.value = g; });
      pintarValoresOP();
    }, 0);
  });
  document.querySelectorAll("#op_grid .opng").forEach(s => s.onchange = pintarValoresOP);
  document.querySelectorAll("#op_grid .opvm").forEach(i => i.oninput = pintarValoresOP);
  ["op_ini","op_fin"].forEach(id => {
    const e = document.getElementById(id);
    if(e) e.addEventListener("change", pintarValoresOP);   // cambian los días → cambia el $/spot
  });
  document.querySelectorAll("#op_grid .opvs").forEach(i => i.oninput = () => {
    const row = i.closest(".oprow");
    row.dataset.spotmano = i.value === "" ? "0" : "1";     // vaciarlo vuelve al cálculo automático
    pintarValoresOP();
  });

  function pintar(){
    const base = campos();
    let total = 0, cuantas = 0, nuevas = 0;
    document.querySelectorAll("#op_grid .oprow").forEach(row => {
      const pant = DB.pantallas.find(x => x.id === row.dataset.pid);
      const frec = n(row.dataset.frec);
      const od = row.querySelector(".od");
      row.dataset.act = frec > 0 ? "1" : "0";
      const std = [300,450,600,900];
      const opb = row.querySelector(".opb");
      let extra = opb.querySelector("[data-extra]");
      if(frec > 0 && !std.includes(frec)){
        if(!extra){
          extra = document.createElement("button");
          extra.type = "button"; extra.dataset.extra = "1";
          extra.onclick = () => { const v = n(extra.dataset.v);
            row.dataset.frec = (n(row.dataset.frec) === v) ? 0 : v; pintar(); };
          opb.appendChild(extra);
        }
        extra.dataset.v = frec;
        extra.textContent = miles(frec);
      }
      row.querySelectorAll(".opb button").forEach(bt => bt.classList.toggle("sel", n(bt.dataset.v) === frec));
      if(frec <= 0){ row.dataset.t = ""; od.textContent = "no va en esta pantalla"; return; }
      total += frec; cuantas++;
      const plan = planPara(pant, {...base, frec}, refDate);
      row.dataset.t = plan.tipo;
      od.textContent = textoPlan(plan, true);
      if(plan.tipo === "nueva") nuevas++;
    });
    document.getElementById("op_tot").textContent = miles(total) + " spots";
    document.getElementById("op_res").textContent = cuantas
      ? `${cuantas} pantalla${cuantas>1?"s":""}${nuevas?` · ${nuevas} sublista${nuevas>1?"s":""} por crear`:""}`
      : "Sin pantallas seleccionadas";
    pintarValoresOP();
  }
  document.querySelectorAll("#op_grid .opb button").forEach(bt => bt.onclick = () => {
    const row = bt.closest(".oprow");
    const v = n(bt.dataset.v);
    row.dataset.frec = (n(row.dataset.frec) === v) ? 0 : v;   // volver a pulsar lo quita
    pintar();
  });
  ["op_cli","op_camp","op_ini","op_fin"].forEach(id => document.getElementById(id).oninput = pintar);
  const info = document.getElementById("op_leido");
  document.getElementById("op_cargar").onclick = () => document.getElementById("op_file").click();
  document.getElementById("op_file").onchange = async ev => {
    const f = ev.target.files[0]; ev.target.value = "";
    if(!f) return;
    info.className = "hint"; info.textContent = `Leyendo ${f.name}…`;
    try{
      const {op} = await leerArchivoOP(f);
      if(op.cliente) document.getElementById("op_cli").value = op.cliente;
      if(op.campana) document.getElementById("op_camp").value = op.campana;
      if(op.inicio)  document.getElementById("op_ini").value = op.inicio;
      if(op.fin)     document.getElementById("op_fin").value = op.fin;
      const notas = [op.agencia && "Agencia: " + op.agencia, op.ejecutivo && "Ejecutivo: " + op.ejecutivo,
                     op.formato && "Arte: " + op.formato, "OP: " + f.name].filter(Boolean).join(" · ");
      document.getElementById("op_notas").value = notas;
      /* se empieza de cero: si antes se cargó otra OP, no deben quedar sus valores */
      document.querySelectorAll("#op_grid .oprow").forEach(r => {
        r.dataset.frec = 0; r.dataset.spotmano = "0";
        r.querySelector(".opvm").value = ""; r.querySelector(".opvs").value = "";
      });
      let puestas = 0, conValor = 0, suma = 0;
      for(const q of op.pantallas){
        const row = document.querySelector(`#op_grid .oprow[data-pid="${q.pid}"]`);
        if(!row) continue;
        row.dataset.frec = q.frec; puestas++;
        /* el valor de la pantalla viene tal cual en la OP */
        if(q.mes !== null && q.mes !== undefined && q.mes >= 0){
          row.querySelector(".opvm").value = +q.mes.toFixed(2);
          conValor++; suma += q.mes;
        }
      }
      pintar();          // con la frecuencia y el valor puestos se calcula el $/spot

      /* El $/spot de la OP viene redondeado a dos decimales: si coincide con el
         cálculo exacto (valor ÷ spots de la vigencia) se deja el exacto, que es
         más preciso. Si no coincide, manda lo que dice la OP, pero se avisa. */
      const dias = diasDeVigencia(document.getElementById("op_ini").value,
                                  document.getElementById("op_fin").value);
      const choques = [];
      for(const q of op.pantallas){
        const row = document.querySelector(`#op_grid .oprow[data-pid="${q.pid}"]`);
        if(!row || q.spot === null || q.spot === undefined || q.mes === null || q.mes === undefined) continue;
        const spv = q.frec * dias;
        const exacto = spv > 0 ? q.mes / spv : null;
        if(exacto !== null && Math.abs(exacto - q.spot) <= 0.005) continue;
        row.querySelector(".opvs").value = +q.spot.toFixed(4);
        row.dataset.spotmano = "1";
        const pant = DB.pantallas.find(x => x.id === q.pid);
        choques.push(`${pant ? pant.nombre : q.pid}: la OP dice $${q.spot.toFixed(2)} por spot` +
          (exacto !== null ? `, pero ${money(q.mes)} ÷ ${miles(spv)} spots da $${exacto.toFixed(4)}` : ""));
      }
      if(choques.length) pintarValoresOP();

      /* la suma de las pantallas contra el total que trae la OP */
      const totalOP = op.valorTotal !== null && op.valorTotal !== undefined ? op.valorTotal : op.valorMensual;
      const avisos = op.avisos.slice();
      if(conValor && totalOP !== null && totalOP !== undefined && Math.abs(suma - totalOP) > 0.01)
        avisos.push(`las pantallas suman ${money(suma)} y la OP dice ${money(totalOP)} de total`);
      if(puestas && !conValor) avisos.push("la OP no trae el valor de las pantallas");
      avisos.push(...choques);

      const resumen = [op.cliente || "(sin marca)", op.campana, op.inicio && `${fmt(op.inicio)} → ${fmt(op.fin)}`,
                       `${puestas} pantalla${puestas===1?"":"s"}`,
                       conValor ? `${money(suma)} en valores` : ""].filter(Boolean).join(" · ");
      info.className = avisos.length ? "hint bad" : "hint ok";
      info.textContent = (avisos.length ? "⚠ " : "✓ ") + resumen +
        (avisos.length ? ` — revisa: ${avisos.join("; ")}` : " — revisa y guarda");
    }catch(err){
      info.className = "hint bad";
      info.textContent = "No pude leer el archivo: " + (err.message || err);
    }
  };
  document.querySelectorAll("[data-todas]").forEach(btn => btn.onclick = () => {
    document.querySelectorAll("#op_grid .oprow").forEach(row => row.dataset.frec = btn.dataset.todas);
    pintar();
  });
  pintar();

  document.getElementById("mcancel").onclick = closeModal;
  document.getElementById("op_save").onclick = () => {
    const base = campos();
    if(!base.cliente){ document.getElementById("op_cli").focus(); toast("Falta el nombre del cliente"); return; }
    const filas = [...document.querySelectorAll("#op_grid .oprow")]
      .map(r => { const frec = n(r.dataset.frec), mes = num(r.querySelector(".opvm").value);
        const escrito = num(r.querySelector(".opvs").value);
        const sel = r.querySelector(".opng");
        return {pid: r.dataset.pid, frec, vMes: mes,
                neg: sel ? (sel.value || "") : "",
                vSpot: escrito !== null ? escrito
                     : ((mes !== null && frec > 0) ? +(mes / (frec * diasOP())).toFixed(4) : null)}; })
      .filter(f => f.frec > 0);
    if(!filas.length){ toast("Pon los spots de al menos una pantalla"); return; }

    const opId = uid();
    let puestas = 0, nuevas = [], ampliar = [], repetidas = [];
    for(const f of filas){
      const pant = DB.pantallas.find(x => x.id === f.pid); if(!pant) continue;
      /* cada pantalla lleva SU modalidad; la de la OP es solo el valor por omisión */
      const r = colocar(pant, {...base, frec: f.frec, vMes: f.vMes, vSpot: f.vSpot,
                               neg: f.neg || base.neg || ""}, refDate, opId);
      if(!r.ok){ repetidas.push(pant.nombre); continue; }
      puestas++;
      if(r.plan.tipo === "nueva"){ nuevas.push(`${pant.nombre} · ${r.sub.nombre}`); if(r.plan.ampliar) ampliar.push(pant.nombre); }
    }
    closeModal(); save(); render();
    if(typeof pre.alGuardar === "function") pre.alGuardar(opId, base);
    let t = `OP de ${base.cliente} en ${puestas} pantalla${puestas>1?"s":""}`;
    if(nuevas.length) t += ` · ${nuevas.length} sublista${nuevas.length>1?"s":""} nueva${nuevas.length>1?"s":""}`;
    if(repetidas.length) t += ` · ${repetidas.length} ya la tenía`;
    toast(t);
    if(ampliar.length) setTimeout(() => alert(
      "La OP entró, pero estas pantallas se quedaron sin horas suficientes:\n\n" +
      ampliar.map(x => "  · " + x).join("\n") +
      "\n\nAbre cada una y aplica la sugerencia de horario."), 400);
  };
  /* valores que llegan desde el To-Do de animaciones */
  if(pre.cliente) document.getElementById("op_cli").value = pre.cliente;
  if(pre.campana) document.getElementById("op_camp").value = pre.campana;
  if(pre.notas)   document.getElementById("op_notas").value = pre.notas;
  if(pre.inicio)  document.getElementById("op_ini").value = pre.inicio;
  if(pre.fin)     document.getElementById("op_fin").value = pre.fin;
  if(pre.cliente || pre.campana) pintar();
  /* una OP que viene de Soporte Comercial llega con pantallas, valores y modalidad */
  if(Array.isArray(pre.pantallas) && pre.pantallas.length){
    document.querySelectorAll("#op_grid .oprow").forEach(r => {
      r.dataset.frec = 0; r.dataset.spotmano = "0";
      r.querySelector(".opvm").value = ""; r.querySelector(".opvs").value = "";
    });
    for(const q of pre.pantallas){
      const row = document.querySelector(`#op_grid .oprow[data-pid="${q.pid}"]`);
      if(!row) continue;
      row.dataset.frec = q.frec;
      if(q.mes !== null && q.mes !== undefined) row.querySelector(".opvm").value = +(+q.mes).toFixed(2);
      const sel = row.querySelector(".opng"); if(sel) sel.value = q.neg || "";
      if(q.spot !== null && q.spot !== undefined){
        row.querySelector(".opvs").value = +(+q.spot).toFixed(4); row.dataset.spotmano = "1";
      }
    }
    pintar();
    const inf = document.getElementById("op_leido");
    if(inf && pre.origen){ inf.className = "hint ok"; inf.textContent = "✓ " + pre.origen + " — revisa en qué sublistas queda y confirma"; }
  }
  document.getElementById(pre.cliente ? "op_ini" : "op_cli").focus();
}

/* ============ Reporte OP ============
   Una línea por cliente con su ÚLTIMO estado dentro del periodo elegido,
   más las pantallas y frecuencias en que está pautando hoy.
   Además del movimiento, el reporte incluye las campañas que siguen al aire
   aunque no se hayan tocado en el periodo: las vigentes, las que están por
   vencer y las que ya vencieron pero todavía están en la lista. */
const REP_ESTADO = {
  alta:"Nueva",  op:"Nueva OP",  renovada:"Renovación",  extendida:"Extensión de fecha",
  recortada:"Fecha recortada",  frecuencia:"Cambio de spots",  editada:"Editada",
  pausada:"Pausada",  reanudada:"Reanudada",  movida:"Movida de sublista",  baja:"Eliminada",
  v_vigente:"Vigente",  v_porvencer:"Por vencer",  v_vencida:"Vencida",
  v_programada:"Programada",  v_sinfecha:"Sin fechas"
};
let repDesde = null, repHasta = null;      // ISO; null = sin límite
/* Qué se incluye en el reporte. */
let repIncluir = "todas";                  // todas | nuevas | porvencer | vencidas
const REP_INCLUIR = [
  ["todas",     "todas",          "Los movimientos del periodo y, aparte, todo lo que sigue al aire."],
  ["nuevas",    "solo OP nuevas", "Únicamente las OP que entraron dentro del periodo."],
  ["porvencer", "por vencer",     `Campañas que terminan dentro de ${AVISO_DIAS} días.`],
  ["vencidas",  "vencidas",       "Campañas que ya terminaron y siguen en la lista."]
];
function repIncluirEtiq(){ const r = REP_INCLUIR.find(x => x[0] === repIncluir); return r ? r[1] : "todas"; }

/* La vigencia de un cliente mirando TODAS sus pantallas: la fecha más temprana
   de inicio y la más tardía de fin. Es lo que decide si está por vencer. */
function vigenciaDe(cliente){
  let inicio = null, fin = null, camp = "", nombre = String(cliente || "").trim(), n0 = 0, pausadas = 0;
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    if(!mismoTexto(c.cliente, cliente)) continue;
    n0++;
    if(c.pausada) pausadas++;
    if(String(c.cliente || "").trim()) nombre = String(c.cliente).trim();
    if(!camp && String(c.campana || "").trim()) camp = String(c.campana).trim();
    if(c.inicio && (!inicio || String(c.inicio) < inicio)) inicio = c.inicio;
    if(c.fin && (!fin || String(c.fin) > fin)) fin = c.fin;
  }
  const hoy = parseISO(todayISO());
  const f = parseISO(fin), i = parseISO(inicio);
  let est = "v_sinfecha", dias = null;
  if(f){
    dias = days(hoy, f);
    est = dias < 0 ? "v_vencida" : dias <= AVISO_DIAS ? "v_porvencer" : "v_vigente";
  }
  if(i && hoy < i && est !== "v_vencida") est = "v_programada";
  return {cliente:nombre, campana:camp, inicio, fin, estado:est, dias, pantallas:n0, pausadas};
}
/* Texto corto de cuánto le queda: "faltan 5 días", "venció hace 3 días". */
function textoDias(v){
  if(!v || v.dias === null) return "";
  if(v.estado === "v_programada") return v.inicio ? `inicia ${fmt(v.inicio)}` : "";
  if(v.dias < 0) return `venció hace ${Math.abs(v.dias)} día${Math.abs(v.dias) === 1 ? "" : "s"}`;
  if(v.dias === 0) return "termina hoy";
  if(v.dias === 1) return "falta 1 día";
  return `faltan ${v.dias} días`;
}
/* El último movimiento de OP de un cliente, sin importar el periodo. */
function ultimoMovimientoDe(cliente){
  let out = null;
  for(const ev of bitacoraOP()){
    if(!mismoTexto(ev.cliente, cliente)) continue;
    if(!out || String(ev.ts) > String(out.ts)) out = ev;
  }
  return out;
}
/* Una fila del bloque de campañas al aire, con la misma forma que un movimiento. */
function filaVigente(cliente){
  const v = vigenciaDe(cliente);
  const ult = ultimoMovimientoDe(cliente);
  return {cliente: v.cliente, campana: v.campana || (ult ? ult.campana : ""),
          inicio: v.inicio, fin: v.fin, ts: ult ? ult.ts : null,
          tipo: v.estado, vig: v, alAire: true};
}
/* Todas las campañas que hoy están en alguna lista, ordenadas por lo que vence antes. */
function filasAlAire(excluir){
  const fuera = excluir || new Set();
  const out = [];
  /* si Soporte Comercial eliminó la OP, la pauta igual sigue al aire hasta que
     Producción la quite de la lista: por eso aquí no se filtra nada */
  for(const k of clientesVivos()){
    if(fuera.has(k)) continue;
    out.push(filaVigente(k));
  }
  return out.sort((a,b) => String(a.fin || "9999").localeCompare(String(b.fin || "9999")));
}

function isoDe(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function rangoPreset(cual){
  const hoy = new Date();
  const l = lunesDe(hoy);
  if(cual === "semana")      return [isoDe(l), isoDe(new Date(l.getFullYear(), l.getMonth(), l.getDate()+6))];
  if(cual === "pasada"){ const a = new Date(l.getFullYear(), l.getMonth(), l.getDate()-7);
                             return [isoDe(a), isoDe(new Date(a.getFullYear(), a.getMonth(), a.getDate()+6))]; }
  if(cual === "mes")         return [isoDe(new Date(hoy.getFullYear(), hoy.getMonth(), 1)),
                                     isoDe(new Date(hoy.getFullYear(), hoy.getMonth()+1, 0))];
  if(cual === "mespasado")   return [isoDe(new Date(hoy.getFullYear(), hoy.getMonth()-1, 1)),
                                     isoDe(new Date(hoy.getFullYear(), hoy.getMonth(), 0))];
  if(cual === "90")          return [isoDe(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()-89)), isoDe(hoy)];
  return [null, null];       // todo
}
function presetActivo(){
  for(const k of ["semana","pasada","mes","mespasado","90"]){
    const [a,b] = rangoPreset(k);
    if(a === repDesde && b === repHasta) return k;
  }
  return (!repDesde && !repHasta) ? "todo" : "";
}
/* Dónde está pautando hoy ese cliente, según las listas (no según la bitácora). */
function ubicacionesDe(cliente){
  const out = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
    if(mismoTexto(c.cliente, cliente))
      out.push({pantalla:p.nombre, sublista:s.nombre, frec:n(c.frec), pausada:!!c.pausada});
  return out;
}
/* Los valores de esa campaña, pantalla por pantalla. Cada pantalla tiene su precio.
   El total es siempre la suma de los valores mensuales registrados. */

/* ============================================================
   La modalidad vive en CADA pantalla, no en la OP entera
   Una OP puede ser comercial en tres pantallas y bonificada en una: si el
   estado dijera solo "Bonificación" estaría diciendo que toda la OP es
   bonificada, y eso es falso. Estas ayudas resumen la mezcla real.
   ============================================================ */
/* Una entrada por pantalla, con su modalidad y su valor. */
function negPorPantalla(cliente, campana){
  const porPant = new Map();
  const hayEstricto = (() => {
    if(!campana) return false;
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
      if(mismoTexto(c.cliente, cliente) && mismoTexto(c.campana || "", campana)) return true;
    return false;
  })();
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    if(!mismoTexto(c.cliente, cliente)) continue;
    if(campana && hayEstricto && !mismoTexto(c.campana || "", campana)) continue;
    const y = porPant.get(p.id) || {pid:p.id, pantalla:p.nombre, neg:"", frec:0, mes:null};
    if(!y.neg) y.neg = negDe(c);
    y.frec += n(c.frec);
    const v = valoresDe(c);
    if(v.mes !== null) y.mes = (y.mes || 0) + v.mes;
    porPant.set(p.id, y);
  }
  return [...porPant.values()];
}
/* Cómo está repartida la modalidad en esta OP. */
function negResumen(cliente, campana){
  const filas = negPorPantalla(cliente, campana);
  if(!filas.length) return {estado:"vacio", filas, tipos:[], conNeg:[]};
  const conNeg = filas.filter(f => f.neg);
  if(!conNeg.length) return {estado:"comercial", filas, tipos:[], conNeg};
  const tipos = [];
  for(const f of conNeg) if(!tipos.includes(f.neg)) tipos.push(f.neg);
  if(conNeg.length === filas.length && tipos.length === 1)
    return {estado:"todo", neg:tipos[0], filas, tipos, conNeg};
  return {estado:"mixto", filas, tipos, conNeg};
}
/* Las pantallas de un tipo de modalidad. */
function negPantallasDe(r, tipo){ return r.conNeg.filter(f => f.neg === tipo).map(f => f.pantalla); }
/* Cápsulas: una por modalidad, diciendo en qué pantallas aplica cuando no es toda la OP. */
function chipsNeg(cliente, campana){
  const r = negResumen(cliente, campana);
  if(r.estado === "comercial" || r.estado === "vacio") return "";
  if(r.estado === "todo")
    return `<div class="negchip n-${r.neg}" title="Toda la OP es ${esc(NEG_ETIQ[r.neg])}"><i></i>${NEG_ETIQ[r.neg]}</div>`;
  return r.tipos.map(tp => {
    const ps = negPantallasDe(r, tp);
    const detalle = ps.length === 1 ? ps[0] : `${ps.length} de ${r.filas.length} pantallas`;
    return `<div class="negchip n-${tp} parcial" title="${esc(NEG_ETIQ[tp])} solo en: ${esc(ps.join(", "))}">
        <i></i>${NEG_ETIQ[tp]} · ${esc(detalle)}</div>`;
  }).join("");
}
/* De un texto libre del Excel ("Bonificación: PASEO", "SAN BENITO BONO"…) saca
   el código de la modalidad, para poder pintarla del color que le toca. */
function negClaseDe(txt){
  const k = sinTildes(String(txt || ""));
  if(/donac/.test(k)) return "donacion";
  if(/canje/.test(k)) return "canje";
  if(/dacion/.test(k)) return "dacion";
  if(/bonific|bono/.test(k)) return "bonificacion";
  return "";
}
/* Texto plano del reparto, para PDF, Excel y CSV. */
function negTexto(cliente, campana, abrev){
  const r = negResumen(cliente, campana);
  if(r.estado === "comercial" || r.estado === "vacio") return "";
  if(r.estado === "todo") return NEG_ETIQ[r.neg];
  return r.tipos.map(tp => {
    const ps = negPantallasDe(r, tp).map(nom => {
      if(!abrev) return nom;
      const p = DB.pantallas.find(x => mismoTexto(x.nombre, nom));
      return (typeof rxAbrev === "function") ? rxAbrev(p ? (p.codigo || p.nombre) : nom) : nom;
    });
    return `${NEG_ETIQ[tp]}: ${ps.join(", ")}`;
  }).join(" · ");
}

function valoresCliente(cliente, campana){
  const porPant = new Map();
  let neg = "", override = null;          // "Valor total de la OP" escrito a mano
  /* mismo criterio que las ubicaciones: si nada calza con el nombre de campaña, se va por cliente */
  const hayEstricto = (() => {
    if(!campana) return false;
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
      if(mismoTexto(c.cliente, cliente) && mismoTexto(c.campana || "", campana)) return true;
    return false;
  })();
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    if(!mismoTexto(c.cliente, cliente)) continue;
    if(campana && hayEstricto && !mismoTexto(c.campana || "", campana)) continue;
    const v = valoresDe(c);
    if(!neg && v.neg) neg = v.neg;
    if(override === null && num(c.vTotal) !== null) override = num(c.vTotal);
    const y = porPant.get(p.id) || {pantalla:p.nombre, mes:null, spot:null, frec:0};
    if(v.mes  !== null) y.mes  = (y.mes  || 0) + v.mes;
    if(v.spot !== null && y.spot === null) y.spot = v.spot;
    y.frec += n(c.frec);
    porPant.set(p.id, y);
  }
  const filas = [...porPant.values()];
  const conMes = filas.filter(x => x.mes !== null);
  const suma = conMes.length ? conMes.reduce((a, x) => a + x.mes, 0) : null;
  const total = override !== null ? override : suma;
  const meses = conMes.map(x => x.mes);
  const spots = filas.filter(x => x.spot !== null).map(x => x.spot);
  const rNeg = negResumen(cliente, campana);
  return {
    filas, total, suma, override,
    neg: rNeg.estado === "todo" ? rNeg.neg : "",     // solo si TODA la OP es de esa modalidad
    negR: rNeg,                                      // el reparto completo
    negTexto: negTexto(cliente, campana),
    faltan: filas.length - conMes.length,
    mes:  meses.length ? Math.min(...meses) : null,
    mesMax: meses.length ? Math.max(...meses) : null,
    spot: spots.length ? Math.min(...spots) : null,
    spotMax: spots.length ? Math.max(...spots) : null
  };
}
/* "$450.00" o "$300.00 – $450.00" cuando cada pantalla cobra distinto. */
function rango(a, b, esSpot){
  const f = esSpot ? moneySpot : money;
  if(a === null) return "—";
  return (b === null || Math.abs(b - a) < 0.00005) ? f(a) : `${f(a)} – ${f(b)}`;
}
/* Días que dura la pauta, contando el primero y el último. */
function diasVigencia(inicio, fin){
  const a = parseISO(inicio), b = parseISO(fin);
  if(!a || !b) return null;
  const d = days(a, b) + 1;
  return d > 0 ? d : null;
}
/* Spots de toda la vigencia: spots por día de cada pantalla × días. */
function spotsVigencia(ubs, inicio, fin){
  const d = diasVigencia(inicio, fin);
  if(d === null) return null;
  return ubs.reduce((a, u) => a + u.frec * d, 0);
}
/* Si el movimiento se anotó sin nombre de campaña y hoy sí lo tiene, se muestra el de hoy. */
function campanaActual(cliente, campana){
  if(campana) return campana;
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
    if(mismoTexto(c.cliente, cliente) && String(c.campana || "").trim()) return c.campana;
  return "";
}
/* Clientes que todavía existen en alguna lista. Lo borrado deja de reportarse. */
function clientesVivos(){
  const set = new Set();
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
    set.add(String(c.cliente || "").trim().toUpperCase());
  return set;
}
/* Último movimiento de cada cliente dentro del periodo. */
function filasReporte(){
  const d1 = parseISO(repDesde);
  const d2 = parseISO(repHasta);
  const tope = d2 ? new Date(d2.getFullYear(), d2.getMonth(), d2.getDate(), 23, 59, 59, 999) : null;
  const porCliente = new Map();
  const vivos = clientesVivos();
  for(const ev of bitacoraOP()){
    if(!vivos.has(String(ev.cliente || "").trim().toUpperCase())) continue;   // se eliminó: no se reporta
    if(opEliminada(claveRent(ev))) continue;                                  // Soporte Comercial la eliminó
    const d = new Date(ev.ts);
    if(isNaN(d)) continue;
    if(d1 && d < d1) continue;
    if(tope && d > tope) continue;
    const k = String(ev.cliente || "").trim().toUpperCase();
    if(!k) continue;
    const prev = porCliente.get(k);
    if(!prev || String(ev.ts) > String(prev.ts)) porCliente.set(k, ev);
  }
  return [...porCliente.values()].sort((a,b) => String(b.ts).localeCompare(String(a.ts)));
}
function estadoDe(ev){ return ev.tipo === "alta" && ev.op ? REP_ESTADO.op : (REP_ESTADO[ev.tipo] || ev.tipo); }
function claseEstado(ev){ return BIT_CLASE[ev.tipo === "alta" && ev.op ? "op" : ev.tipo] || "b-sinfecha"; }
/* La vigencia de la fila: la que trae calculada (bloque al aire) o la del cliente. */
function vigDeFila(f){ return f.vig || (f.vig = vigenciaDe(f.cliente)); }

/* ============================================================
   Los dos bloques del reporte, ya filtrados por lo que se pidió incluir.
   · movimientos: lo que pasó dentro del periodo (OP nuevas y cambios de fecha)
   · alAire: lo que sigue en las listas aunque no se haya tocado en el periodo
   ============================================================ */
function bloquesReporte(){
  const mov = filasReporte();
  const conMov = new Set(mov.map(e => String(e.cliente || "").trim().toUpperCase()));

  if(repIncluir === "nuevas"){
    return {modo:"nuevas",
            bloques:[{k:"mov", titulo:"OP nuevas del periodo",
                      filas: mov.filter(e => e.tipo === "alta")}]};
  }
  if(repIncluir === "porvencer" || repIncluir === "vencidas"){
    const busca = repIncluir === "porvencer" ? "v_porvencer" : "v_vencida";
    /* aquí no importa si hubo movimiento: importa cómo está la campaña hoy */
    const filas = filasAlAire().filter(f => f.vig.estado === busca).map(f => {
      const m = mov.find(e => mismoTexto(e.cliente, f.cliente));
      return m ? Object.assign({}, m, {vig: f.vig, alAire: true, movio: estadoDe(m)}) : f;
    });
    return {modo: repIncluir,
            bloques:[{k:"vig",
                      titulo: repIncluir === "porvencer"
                        ? `Campañas por vencer · terminan dentro de ${AVISO_DIAS} días`
                        : "Campañas vencidas que siguen en la lista",
                      filas}]};
  }
  return {modo:"todas", bloques:[
    {k:"mov", titulo:"Movimientos del periodo", filas: mov},
    {k:"vig", titulo:"Campañas al aire sin movimiento en el periodo", filas: filasAlAire(conMov)}
  ]};
}
/* Todas las filas del reporte, sin importar de qué bloque vienen. */
function filasDelReporte(){ return bloquesReporte().bloques.reduce((a,b) => a.concat(b.filas), []); }
/* Foto rápida de lo que hay en las listas hoy. */
function conteoAlAire(){
  const c = {vigente:0, porvencer:0, vencida:0, programada:0, sinfecha:0};
  for(const f of filasAlAire()) c[f.vig.estado.replace("v_","")]++;
  return c;
}

function modalReporte(){

    <div class="mb">

        <span class="repchips">
          ${[["semana","esta semana"],["pasada","semana pasada"],["mes","este mes"],["mespasado","mes pasado"],["90","últimos 90 días"],["todo","todo"]]
            .map(([k,t]) => `<button type="button" data-pre="${k}" class="${preset===k?"sel":""}">${t}</button>`).join("")}
        </span>

        <span class="hlbl">Qué incluir</span>
        <span class="repchips" id="rep_inc">
          ${REP_INCLUIR.map(([k,t,ay]) => `<button type="button" data-inc="${k}" title="${esc(ay)}" class="${repIncluir===k?"sel":""}">${t}</button>`).join("")}
        </span>
        <span class="hint" style="margin-left:auto">${esc((REP_INCLUIR.find(x => x[0] === repIncluir) || [])[2] || "")}</span>
      </div>
      <div class="chips" style="margin:0">
        <span class="chip"><i class="i-good"></i>${alAire.vigente + alAire.porvencer} al aire hoy</span>

/* ============ bitácora de movimientos (vive en el .json) ============ */
const MAX_BITACORA = 1500;         // tope de movimientos guardados (los más viejos se sueltan)
/* El Reporte OP registra ÚNICAMENTE: OP nuevas, renovaciones y cambios en la fecha
   de vigencia (extensiones o recortes). Lo demás (pausas, bajas, cambios de spots,
   movidas de sublista, ediciones sueltas) ya no se guarda ni se muestra. */
const BIT_TIPOS = ["alta", "renovada", "extendida", "recortada"];
function bitacora(){ if(!Array.isArray(DB.bitacora)) DB.bitacora = []; return DB.bitacora; }
function bitacoraOP(){ return bitacora().filter(e => BIT_TIPOS.includes(e.tipo)); }
function anotar(ev){
  if(RO) return;
  if(!BIT_TIPOS.includes(ev.tipo)) return;     // único filtro, así nada más llega al .json
  const limpio = {ts: new Date().toISOString()};
  for(const [k, v] of Object.entries(ev)){
    if(v === null || v === undefined || v === "" || v === false) continue;   // no guardar vacíos
    limpio[k] = v;
  }
  const b = bitacora();
  b.push(limpio);
  if(b.length > MAX_BITACORA) b.splice(0, b.length - MAX_BITACORA);
}
function pesoBitacora(){
  try{ return JSON.stringify(bitacora(), null, 1).length; }catch(e){ return 0; }
}
function kb(bytes){ return bytes < 1024 ? bytes + " B" : (bytes/1024).toFixed(bytes < 102400 ? 1 : 0) + " KB"; }
/* Clasifica un cambio de fecha final: renovación (revivió) o extensión (se alargó). */
function tipoPorFecha(finAntes, finAhora){
  const a = parseISO(finAntes), n2 = parseISO(finAhora), hoy = parseISO(todayISO());
  if(!n2) return null;
  if(!a) return "extendida";
  if(n2 > a) return (a < hoy) ? "renovada" : "extendida";
  if(n2 < a) return "recortada";
  return null;
}
const BIT_ETIQ = {
  alta:"Nuevo", op:"OP", renovada:"Renovada", extendida:"Extendida", recortada:"Recortada",
  frecuencia:"Spots", editada:"Editada", pausada:"Pausada", reanudada:"Reanudada",
  baja:"Eliminada", movida:"Movida"
};
const BIT_CLASE = {
  alta:"b-activa", op:"b-programada", renovada:"b-activa", extendida:"b-programada",
  recortada:"b-porvencer", frecuencia:"b-programada", editada:"b-sinfecha", pausada:"b-pausada",
  reanudada:"b-activa", baja:"b-finalizada", movida:"b-sinfecha"
};
function lunesDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dia = (x.getDay() + 6) % 7;           // lunes = 0
  x.setDate(x.getDate() - dia);
  return x;
}
function claveSemana(d){ const l = lunesDe(d); return `${l.getFullYear()}-${String(l.getMonth()+1).padStart(2,"0")}-${String(l.getDate()).padStart(2,"0")}`; }
function tituloSemana(clave){
  const l = parseISO(clave), f = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6);
  const hoyL = lunesDe(new Date());
  const mes = d => d.toLocaleDateString("es-SV", {month:"short"}).replace(".","");
  const rango = l.getMonth() === f.getMonth()
    ? `${l.getDate()}–${f.getDate()} ${mes(f)}`
    : `${l.getDate()} ${mes(l)} – ${f.getDate()} ${mes(f)}`;
  const semanas = Math.round((hoyL - l) / (7*86400000));
  const rel = semanas === 0 ? "esta semana" : semanas === 1 ? "semana pasada" : `hace ${semanas} semanas`;
  return {rango: `${rango} ${f.getFullYear()}`, rel};
}

/* ============ mover una campaña de una sublista a otra ============ */
let arrastre = null;
function libresDe(sub){ return sub.capacidad - statsSublista(sub, refDate).usados; }
function moverCampana(origen, destinoId){
  if(!origen || !destinoId || origen.sub === destinoId) return;
  const o = findCamp(origen.sub, origen.camp), d = findSub(destinoId);
  if(!o || !d) return;
  const libre = libresDe(d.s);
  if(n(o.c.frec) > libre && !confirm(
      `${o.c.cliente} lleva ${miles(o.c.frec)} spots y en ${d.s.nombre} solo quedan ${miles(libre)} libres.\n\n¿Moverla de todos modos?`)) return;
  o.s.campanas = o.s.campanas.filter(x => x.id !== o.c.id);
  d.s.campanas.push(o.c);
  marcarUltimo(d.p, o.c.cliente, "movida");
  anotar({tipo:"movida", cliente:o.c.cliente, campana:o.c.campana, pantalla:d.p.nombre,
          sublista:d.s.nombre, frec:n(o.c.frec), inicio:o.c.inicio, fin:o.c.fin, detalle:`desde ${o.s.nombre}`});
  save(); render();
  toast(`${o.c.cliente}: ${o.s.nombre} → ${d.s.nombre}`);
}

function addSub(cap){
  const p = DB.pantallas.find(x => x.id === tab); if(!p) return;
  const s = statsPantalla(p, refDate);
  const totalCap = p.sublistas.reduce((a,x)=>a+x.capacidad,0);
  if(totalCap + cap > s.cap){
    if(!confirm(`Con esta sublista las listas suman ${miles(totalCap+cap)} spots y la pantalla solo tiene ${miles(s.cap)} (${p.horas} h).\n\nSube las horas al aire o agrégala de todos modos.\n\n¿Agregar igual?`)) return;
  }
  p.sublistas.push({id:uid(), nombre:`${p.codigo} EXTRA ${p.sublistas.length+1}_${cap}`, capacidad:cap, campanas:[]});
  save(); render(); toast("Sublista agregada");
}

/* ---- escritor XLSX mínimo (ZIP sin compresión + SpreadsheetML) ---- */
const CRCT = (() => { const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[i]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  const w16 = (a,v)=>{a.push(v&255,(v>>8)&255)}, w32=(a,v)=>{a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255)};
  for(const f of files){
    const nameB = enc.encode(f.name), data = enc.encode(f.data), c = crc32(data);
    const lh = []; w32(lh,0x04034b50); w16(lh,20); w16(lh,0); w16(lh,0); w16(lh,0); w16(lh,0);
    w32(lh,c); w32(lh,data.length); w32(lh,data.length); w16(lh,nameB.length); w16(lh,0);
    parts.push(new Uint8Array(lh), nameB, data);
    const ch = []; w32(ch,0x02014b50); w16(ch,20); w16(ch,20); w16(ch,0); w16(ch,0); w16(ch,0); w16(ch,0);
    w32(ch,c); w32(ch,data.length); w32(ch,data.length); w16(ch,nameB.length); w16(ch,0); w16(ch,0); w16(ch,0); w16(ch,0); w32(ch,0); w32(ch,off);
    central.push(new Uint8Array(ch), nameB);
    off += lh.length + nameB.length + data.length;
  }
  let cs = 0; for(const p of central) cs += p.length;
  const eo = []; w32(eo,0x06054b50); w16(eo,0); w16(eo,0); w16(eo,files.length); w16(eo,files.length); w32(eo,cs); w32(eo,off); w16(eo,0);
  return new Blob([...parts, ...central, new Uint8Array(eo)], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xmlEsc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
function colName(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }
function sheetXml(rows){
  let x = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  rows.forEach((r,ri)=>{
    x += `<row r="${ri+1}">`;
    r.forEach((v,ci)=>{
      const ref = colName(ci)+(ri+1);
      if(v === null || v === undefined || v === "") return;
      if(typeof v === "number" && isFinite(v)) x += `<c r="${ref}"${ri===0?' s="1"':''}><v>${v}</v></c>`;
      else x += `<c r="${ref}" t="inlineStr"${ri===0?' s="1"':''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    });
    x += `</row>`;
  });
  return x + `</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const files = [];
  files.push({name:"[Content_Types].xml", data:
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`});

  files.push({name:"xl/_rels/workbook.xml.rels", data:
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:"xl/styles.xml", data:
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`});
  sheets.forEach((s,i)=> files.push({name:`xl/worksheets/sheet${i+1}.xml`, data: sheetXml(s.rows)}));
  return zip(files);
}

/* ============================================================
   OP nuevas
   Soporte Comercial crea la OP con los mismos campos de la plantilla de
   comercial; se guarda en el .json y le aparece a DOOH - Producción en el
   panel "OP nuevas". Producción la revisa, la ingresa como siempre (ahí se
   ve en qué sublistas cae) y, ya ingresada, pasa a rentabilizar.
   Nada se guarda en el navegador: todo vive en el archivo de datos.
   ============================================================ */
const OPN_FORMATOS = ["Animado", "Estático", "Video"];
/* ejecutivos de comercial: se eligen con un clic y también se puede escribir otro */
const OPN_EJECUTIVOS = ["Marta Descamps", "Luis Segovia", "Ricardo Ayala", "Maggy Jeanpierre", "Oficina"];
const OPN_NOTAS = [
  "Los canjes son autorizados únicamente por gerencia.",
  "Cualquier modificación en la OP debe ser notificada bajo esta misma cola de correo, con la nueva OP.",
  "Los testigos físicos están sujetos a previa programación.",
];
const OPN_ESTADO = {pendiente:"Esperando a Producción", ingresada:"Ingresada", devuelta:"Devuelta a Soporte"};
const OPN_CLASE  = {pendiente:"b-programada", ingresada:"b-activa", devuelta:"b-porvencer"};
const OPN_CORREO_DEF = "diseno@veo.com.sv";

/* ---------- dónde viven las OP nuevas ----------
   Cada OP es SU PROPIO archivo, suelto en la carpeta "Constancias de pauta DOOH"
   y con nombre "OPN 290926-02 MARCA.json". Solo Soporte escribe esos archivos.
   Lo que decide Producción va en "OPN estado <id>.json" (solo lo escribe Producción)
   y también en el .json. Así nadie escribe encima de lo del otro, aunque cada quien
   trabaje en su computadora y Drive tarde en sincronizar.
   · No se usa subcarpeta: si las dos computadoras la crean a la vez, Drive la
     duplica ("OP nuevas" y "OP nuevas (1)") y cada tablero mira una distinta.
   · Si Drive hace una copia "(1)" de un archivo, se junta por id y gana la versión
     más nueva, así que tampoco se pierde nada. */
const OPN_PREFIJO = "OPN ";
const OPN_LEGADO = /^OP nuevas( \(\d+\))?$/i;      // las subcarpetas que se alcanzaron a crear
let opnCache = [];                 // las OP leídas de la carpeta
let opnAjustes = {};               // _ajustes.json (el correo de Producción)
let opnEstadosCarpeta = {};        // _estado_<id>.json: lo que decidió Producción
let opnCarpeta = "sin";            // ok | permiso | sin
let opnFirma = null;               // para saber si algo cambió al volver a leer
async function opnDir(pedir){
  if(!dirHandle) return null;
  if(!(await permisoCarpeta(!!pedir))) return null;
  return dirHandle;                       // la carpeta de constancias, tal cual: aquí no se crea nada
}
/* Lee la carpeta. Devuelve {ok, cambio}. Un archivo que no se pueda leer se salta. */
async function opnLeerCarpeta(pedir){
  const raiz = await opnDir(pedir);
  if(!raiz){ opnCarpeta = dirHandle ? "permiso" : "sin"; return {ok:false, cambio:false}; }
  const ops = new Map(), est = {};
  let aj = {}, ajTs = "";
  /* se reconoce cada archivo por lo que trae adentro, no solo por su nombre */
  const tomar = async (h, legado) => {
    if(h.kind !== "file" || !/\.json$/i.test(h.name)) return;
    if(!legado && !h.name.startsWith(OPN_PREFIJO)) return;       // el control, las constancias… no son nuestros
    let x;
    try{ x = JSON.parse(await (await h.getFile()).text()); }catch(e){ return; }
    if(!x || typeof x !== "object") return;
    if(x.id && x.marca && x.corr){                                // una OP
      const p = ops.get(x.id);
      const gana = !p || (x.rev || 1) > (p.rev || 1) ||
        ((x.rev || 1) === (p.rev || 1) && String(x.tsCambio || x.ts || "") > String(p.tsCambio || p.ts || ""));
      if(gana){ x.archivo = legado ? null : h.name; ops.set(x.id, x); }
    } else if(x.id && x.estado && x.revEstado !== undefined){       // lo que decidió Producción
      if(!est[x.id] || String(x.tsEstado || "") > String(est[x.id].tsEstado || "")) est[x.id] = x;
    } else if(x.correoProduccion){                                  // ajustes
      if(String(x.ts || "") >= ajTs){ aj = x; ajTs = String(x.ts || ""); }
    }
  };
  try{
    for await (const h of raiz.values()){
      if(h.kind === "directory"){
        if(OPN_LEGADO.test(h.name)){ try{ for await (const h2 of h.values()) await tomar(h2, true); }catch(e){} }
        continue;
      }
      await tomar(h, false);
    }
  }catch(e){ opnCarpeta = "permiso"; return {ok:false, cambio:false}; }
  const out = [...ops.values()];
  opnCache = out; opnAjustes = aj; opnEstadosCarpeta = est; opnCarpeta = "ok";
  const firma = out.map(o => o.id + ":" + (o.rev || 1)).sort().join(",") + "|" +
    Object.values(est).map(e => e.id + ":" + e.estado + ":" + (e.revEstado || 1)).sort().join(",");
  const cambio = firma !== opnFirma; opnFirma = firma;
  return {ok:true, cambio};
}
async function opnEscribirArchivo(nombre, datos){
  const d = await opnDir(true);
  if(!d) throw new Error(dirHandle ? "falta autorizar la carpeta de constancias" : "falta conectar la carpeta de constancias");
  const fh = await d.getFileHandle(nombre, {create:true});
  await escribirEn(fh, JSON.stringify(datos, null, 1));
}
/* "OPN 290926-02 SUPER SELECTOS.json" */
function opnArchivo(o){
  const marca = String(o.marca || "SIN MARCA").toUpperCase()
    .replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 50);
  return `${OPN_PREFIJO}${o.corr} ${marca}.json`;
}
/* Lo que Producción decidió de cada OP (vive en el .json) */
function opnEstados(){
  if(!DB.opEstado || typeof DB.opEstado !== "object" || Array.isArray(DB.opEstado)) DB.opEstado = {};
  return DB.opEstado;
}
function opnPonerEstado(o, datos){
  const reg = Object.assign({id: o.id, revEstado: o.rev || 1, tsEstado: new Date().toISOString()}, datos);
  opnEstados()[o.id] = reg;
  opnEstadosCarpeta[o.id] = reg;
  /* y en su propio archivo, que Soporte también lee y nadie más escribe */
  opnEscribirArchivo(`${OPN_PREFIJO}estado ${o.id}.json`, reg)
    .catch(() => toast("Quedó guardado en el archivo de datos; la carpeta de constancias no respondió"));
}
function opnEstadoDe(o){
  /* de las dos copias (el .json y el archivo propio) manda la más reciente */
  const a = opnEstados()[o.id], b = opnEstadosCarpeta[o.id];
  const e = (a && b) ? (String(a.tsEstado || "") >= String(b.tsEstado || "") ? a : b) : (a || b);
  if(!e) return {estado: o.estado || "pendiente"};      // las antiguas del .json traen su estado
  /* si Soporte la corrigió después de que se la devolvieron, vuelve a estar por revisar */
  if(e.estado === "devuelta" && (o.rev || 1) > (e.revEstado || 1)) return {estado:"pendiente"};
  const out = {estado: e.estado};
  if(e.motivo) out.motivo = e.motivo;
  if(e.opId) out.opId = e.opId;
  if(e.tsIngreso) out.tsIngreso = e.tsIngreso;
  if(e.tsEstado && String(e.tsEstado) > String(o.tsCambio || o.ts || "")) out.tsCambio = e.tsEstado;
  return out;
}
/* Todas las OP: las de la carpeta y, si quedan, las que se guardaron antes dentro del .json */
function opNuevas(){
  const lista = [], vistos = new Set();
  for(const o of opnCache){ vistos.add(o.id); lista.push(Object.assign({}, o, opnEstadoDe(o))); }
  for(const o of (Array.isArray(DB.opNuevas) ? DB.opNuevas : []))
    if(!vistos.has(o.id)) lista.push(Object.assign({}, o, opnEstadoDe(o)));
  return lista;
}
/* Vuelve a leer la carpeta y, si llegó algo, repinta (sin estorbar una ventana abierta). */
let opnSondeo = null;
async function opnRefrescar(pedir){
  const r = await opnLeerCarpeta(pedir);
  if(r.ok && r.cambio){
    const libre = document.getElementById("ov").hidden;
    if(libre) render(); else renderTabs();
  }
  return r;
}
function opnIniciarSondeo(){
  if(opnSondeo) return;
  opnSondeo = setInterval(() => { if(!document.hidden) opnRefrescar(false); }, 15000);
  window.addEventListener("focus", () => opnRefrescar(false));

/* Un enlace escrito como sea queda como dirección completa: "drive.google.com/…" → "https://drive.google.com/…".
   Devuelve null si no parece un enlace (tiene espacios o no tiene un punto). */
function opnEnlace(t){
  let s = String(t || "").trim();
  if(!s) return "";
  if(/\s/.test(s) || !/\./.test(s)) return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
  return s;
}
/* "drive.google.com/drive/folders/1AbC…" para mostrarlo sin ocupar media pantalla */
function opnEnlaceCorto(u, max){
  const s = String(u || "").replace(/^https?:\/\//i, "").replace(/^www\./i, "");
  const tope = max || 58;
  return s.length > tope ? s.slice(0, tope - 1) + "…" : s;
}
function opnPorId(id){ return opNuevas().find(o => o.id === id) || null; }
function opnPendientes(){ return opNuevas().filter(o => o.estado === "pendiente").length; }

/* La fecha del correlativo va como día, mes y año corto: 29/09/2026 → 290926
   (el mismo orden que el N° de ODD). */
function opnFechaCorta(iso){
  const d = parseISO(String(iso || todayISO()).slice(0, 10)) || parseISO(todayISO());
  return `${String(d.getDate()).padStart(2,"0")}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getFullYear()).slice(2)}`;
}
/* El siguiente correlativo del día, contando TODAS las OP creadas ese día. */
function opnCorrelativo(fechaISO, lista){
  const f = opnFechaCorta(fechaISO);
  let max = 0;
  for(const o of (lista || opNuevas())){
    const m = /^(\d{6})-(\d+)$/.exec(String(o.corr || ""));
    if(m && m[1] === f) max = Math.max(max, +m[2]);
  }
  return `${f}-${String(max + 1).padStart(2, "0")}`;
}
/* "OP DOOH_SUPER SELECTOS_290926-01": sin los caracteres que Windows no acepta */
function opnNombre(o){
  const marca = String(o.marca || "SIN MARCA").toUpperCase()
    .replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 60);
  return `OP DOOH_${marca}_${o.corr}`;
}
function opnDias(o){ return diasVigencia(o.inicio, o.fin) || 0; }
function opnPantallaNombre(pid){ const p = DB.pantallas.find(x => x.id === pid); return p ? p.nombre : pid; }
function opnTotales(o){
  const d = opnDias(o);
  let total = 0, spots = 0, conValor = 0;
  for(const q of (o.pantallas || [])){
    if(q.mes !== null && q.mes !== undefined){ total += +q.mes; conValor++; }
    spots += n(q.frec) * d;
  }
  return {total, spots, conValor, dias: d};
}
/* Costo por spot: el escrito a mano manda; si no, valor ÷ spots de la vigencia */
function opnSpot(q, dias){
  if(q.spot !== null && q.spot !== undefined && q.spotMano) return +q.spot;
  const spv = n(q.frec) * dias;
  return (q.mes !== null && q.mes !== undefined && spv > 0) ? +q.mes / spv : null;
}
/* ¿Cabe? Se usa el mismo planificador con el que Producción coloca la OP */
function opnPlan(pid, marca, frec, inicio, fin){
  const p = DB.pantallas.find(x => x.id === pid);
  if(!p || !frec) return null;
  /* con la misma fecha de referencia que usa la ventana Ingresar OP, para que
     lo que ve aquí coincida con lo que Producción verá al ingresarla */
  try{ return planPara(p, {cliente: marca || "(nueva)", campana:"", frec, inicio, fin}, refDate); }
  catch(e){ return null; }
}
function opnTextoPlan(plan, corto){
  if(!plan) return "";
  if(plan.tipo === "ok")  return corto ? "hay espacio" : `hay espacio · ${plan.sub.nombre}`;
  if(plan.tipo === "dup") return `el cliente ya está en ${plan.sub.nombre}`;
  return `sin espacio libre · Producción tendría que abrir una sublista`;
}

    o.valorTotal = +tot.total.toFixed(2);
    const vm = num($("on_mens").value);
    o.valorMensual = vm !== null ? vm : o.valorTotal;

    const btn = $("on_ok");
    btn.disabled = true; btn.textContent = "Guardando…"; msg.textContent = "";
    const ahora = new Date().toISOString();
    let guardada = null;
    try{
      /* la OP se guarda como su propio archivo en la carpeta de constancias */
      if(!dirHandle && !(await pedirCarpeta())) throw new Error("falta conectar la carpeta de constancias");
      const lect = await opnLeerCarpeta(true);          // también trae el último correlativo del día
      if(!lect.ok) throw new Error("falta autorizar la carpeta de constancias");
      if(b0.id){
        const prev = opnCache.find(x => x.id === b0.id) ||
                     (Array.isArray(DB.opNuevas) ? DB.opNuevas.find(x => x.id === b0.id) : null);
        if(!prev) throw new Error("no encontré la OP original");
        guardada = Object.assign({}, prev, o, {rev: (prev.rev || 1) + 1, tsCambio: ahora});
        guardada.enlaces = o.enlaces.slice();
        for(const k of ["estado", "motivo", "opId", "tsIngreso"]) delete guardada[k];
        guardada.archivo = prev.archivo || opnArchivo(guardada);
      } else {
        guardada = Object.assign({id: uid(), corr: opnCorrelativo(o.fechaIngreso, opNuevas()),
          rev: 1, ts: ahora, tsCambio: ahora, autor: "Soporte Comercial"}, o);
        guardada.archivo = opnArchivo(guardada);
      }
      await opnEscribirArchivo(guardada.archivo, guardada);
      await opnLeerCarpeta(false);
      guardada = Object.assign({}, guardada, {estado:"pendiente"});
    }catch(err){
      btn.disabled = false; btn.textContent = b0.id ? "Reenviar y descargar PDF" : "Crear OP y descargar PDF";
      return falla("No se pudo guardar la OP: " + (err.message || err) + ". Vuelve a intentar.");
    }
    btn.textContent = "Generando PDF…";
    let archivo = "";
    try{ archivo = await opnGuardarPDF(guardada); }
    catch(e){ toast("La OP quedó guardada, pero no se pudo generar el PDF: " + (e.message || e)); }
    render();
    modalOPEnviada(guardada, archivo);
  };
}

/* ---------- el correo a Producción ----------
   Un archivo HTML no puede mandar correos solo: se abre el borrador ya escrito
   (en Gmail o en el programa de correo) y se adjunta el PDF que se descargó. */
function opnCorreo(){ return String(opnAjustes.correoProduccion || DB.correoProduccion || OPN_CORREO_DEF).trim(); }
function opnAsunto(o){ return opnNombre(o) + (o.rev > 1 ? ` (corrección ${o.rev})` : ""); }
function opnCuerpo(o){
  const t = opnTotales(o);
  const lineas = (o.pantallas || []).map(q =>
    `  · ${opnPantallaNombre(q.pid)}: ${miles(q.frec)} spots/día · ${q.mes !== null && q.mes !== undefined ? money(q.mes) : "sin valor"}` +
    (q.neg ? ` · ${NEG_ETIQ[q.neg] || q.neg}` : ""));
  return [
    "Hola,",
    "",
    `${o.rev > 1 ? "Reenvío con correcciones la orden de pauta" : "Adjunto la nueva orden de pauta"}: ${opnNombre(o)}.`,
    "",
    `Marca: ${o.marca}${o.campana ? "\nCampaña: " + o.campana : ""}`,
    `Vigencia: ${fmt(o.inicio)} al ${fmt(o.fin)} (${t.dias} días)`,
    `Ejecutivo/a: ${o.ejecutivo}${o.agencia ? " · Agencia: " + o.nombreAgencia : ""}`,
    "Pantallas:",
    ...lineas,
    `Valor total: ${money(o.valorTotal)}`,
    (o.enlaces || []).length ? "\nEnlaces de descarga:\n" + o.enlaces.map((u, i) => `  · Arte ${i + 1}: ${u}`).join("\n") : "",
    o.indicaciones ? `\nIndicaciones: ${o.indicaciones}` : "",
    "",
    "Ya está en el panel «OP nuevas» de DOOH - Producción para revisarla e ingresarla.",
    "",
    "Soporte Comercial",
  ].filter(x => x !== null).join("\n");
}
function opnAbrirCorreo(o, via){
  const to = opnCorreo(), su = opnAsunto(o), body = opnCuerpo(o);
  const url = via === "gmail"
    ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`
    : `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`;
  window.open(url, "_blank");
}

/* ---------- guardar el PDF con su nombre ---------- */
async function opnGuardarPDF(o){
  const nombre = opnNombre(o) + (o.rev > 1 ? `_corr${o.rev}` : "") + ".pdf";
  let destino = null;
  if(window.showSaveFilePicker){
    try{
      destino = await window.showSaveFilePicker({suggestedName: nombre,
        types: [{description:"PDF", accept:{"application/pdf":[".pdf"]}}]});
    }catch(e){ if(e && e.name === "AbortError") return ""; destino = null; }
  }
  const bytes = await pdfOPNueva(o);
  if(destino) await escribirEn(destino, bytes);
  else dl(new Blob([bytes], {type:"application/pdf"}), nombre);
  return (destino && destino.name) || nombre;
}

/* ============================================================
   El PDF de la OP, con el branding de Veo
   Tamaño carta, membrete de la marca, tinta oscura y acento lima.
   ============================================================ */
async function pdfOPNueva(o){
  const TEAL = "#4A798C", SUAVE = "#F4F6F1", CLARO = "#C9D2D4", TENUE = "#AEB8BB";
  const TOPE = 708, PISO = 96;
  const t = opnTotales(o);
  const ahora = new Date(o.tsCambio || o.ts || Date.now());
  const largo = iso => { const d = parseISO(iso); return d ? d.toLocaleDateString("es-SV", {day:"numeric", month:"long", year:"numeric"}) : "—"; };
  const corto = iso => { const d = parseISO(iso); return d ? d.toLocaleDateString("es-SV", {day:"numeric", month:"short", year:"numeric"}).replace(".", "") : "—"; };
  const sello = `Fecha: ${ahora.toLocaleDateString("es-SV",{day:"numeric",month:"long",year:"numeric"})} / Hora: ${relojDe(ahora)}`;

  const paginas = [];
  let L = null, y = 0;
  const hoja = () => { L = pdfLienzo(); paginas.push(L); pdfMembrete(L, sello); y = TOPE; };
  const cabe = alto => { if(y - alto < PISO) hoja(); };
  hoja();

  /* --- título y correlativo --- */
  L.texto(MG, y - 18, "Orden de Pauta DOOH", {tam:19, neg:true, col:TINTA});
  L.rect(MG, y - 28, 46, 3, LIMA);
  const pw = 158, px = HOJA_W - MG - pw;
  L.redondo(px, y - 36, pw, 36, 8, TINTA);
  L.texto(px + 13, y - 14, "OP DOOH", {tam:7.4, neg:true, col:TENUE});
  if(o.rev > 1) L.texto(px + pw - 13, y - 14, `CORRECCIÓN ${o.rev}`, {tam:6.6, neg:true, col:LIMA, al:"der"});
  L.texto(px + 13, y - 29, o.corr || "", {tam:14, neg:true, col:LIMA});
  y -= 48;
  L.texto(MG, y, `Creada por Soporte Comercial · ${largo(String(o.ts || "").slice(0,10) || todayISO())}`,
          {tam:8.6, col:GRIS});
  y -= 14;

  /* --- tarjeta principal: marca, campaña, arte y vigencia --- */
  const hH = 96;
  L.redondo(MG, y - hH, ANCHO_CUERPO, hH, 10, TINTA);
  const izq = MG + 20, der = MG + ANCHO_CUERPO - 20, anchoMarca = ANCHO_CUERPO * 0.6;
  L.texto(izq, y - 20, "MARCA", {tam:7, neg:true, col:LIMA});
  let tamM = 21;
  while(tamM > 12 && pdfAncho(o.marca || "", tamM, true) > anchoMarca) tamM -= 0.5;
  L.texto(izq, y - 44, o.marca || "", {tam:tamM, neg:true, col:"#FFFFFF", max:anchoMarca});
  if(o.campana) L.texto(izq, y - 62, o.campana, {tam:10.5, col:CLARO, max:anchoMarca});
  if(o.formato){
    const et = `ARTE ${String(o.formato).toUpperCase()}`;
    const w = pdfAncho(et, 7, true) + 16;
    L.redondo(izq, y - 86, w, 15, 7.5, LIMA);
    L.texto(izq + 8, y - 81, et, {tam:7, neg:true, col:TINTA});
  }
  L.texto(der, y - 20, "VIGENCIA", {tam:7, neg:true, col:LIMA, al:"der"});
  L.texto(der, y - 42, corto(o.inicio), {tam:14, neg:true, col:"#FFFFFF", al:"der"});
  L.texto(der, y - 58, `al ${corto(o.fin)}`, {tam:10.5, col:CLARO, al:"der"});
  const dTxt = `${t.dias} DÍA${t.dias === 1 ? "" : "S"}`;
  const dw = pdfAncho(dTxt, 7.2, true) + 16;
  L.redondo(der - dw, y - 86, dw, 15, 7.5, TEAL);
  L.texto(der - dw / 2, y - 81, dTxt, {tam:7.2, neg:true, col:"#FFFFFF", al:"cen"});
  y -= hH + 12;

  /* --- tres datos comerciales --- */
  const cH = 48, gap = 10, cW = (ANCHO_CUERPO - gap * 2) / 3;
  const tarj = (i, etq, val, sub) => {
    const x = MG + i * (cW + gap);
    L.redondo(x, y - cH, cW, cH, 6, SUAVE);
    L.rect(x, y - cH, 3, cH, LIMA);
    L.texto(x + 12, y - 15, etq, {tam:6.8, neg:true, col:GRIS, max:cW - 20});
    L.texto(x + 12, y - 31, val || "—", {tam:10.2, neg:true, col:TINTA, max:cW - 20});
    if(sub) L.texto(x + 12, y - 42, sub, {tam:7.4, col:GRIS, max:cW - 20});
  };
  tarj(0, "EJECUTIVO/A", o.ejecutivo);
  tarj(1, "AGENCIA", o.agencia ? (o.nombreAgencia || "Sí") : "Directo", o.agencia ? "Con agencia" : "Sin agencia");
  tarj(2, "FECHA DE INGRESO", largo(o.fechaIngreso));
  y -= cH + 18;

  /* --- tabla de pantallas --- */
  const COL = [
    {t:"PANTALLA", w:114, al:"izq"}, {t:"SPOTS / DÍA", w:56, al:"der"}, {t:"SPOTS VIGENCIA", w:76, al:"der"},
    {t:"VALOR", w:72, al:"der"}, {t:"COSTO X SPOT", w:70, al:"der"}, {t:"MODALIDAD", w:80, al:"izq"}];
  const P = 8, rH = 22;
  const encabezado = () => {
    L.rect(MG, y - rH, ANCHO_CUERPO, rH, TINTA);
    let cx = MG;
    for(const c of COL){
      L.texto(c.al === "der" ? cx + c.w - P : cx + P, y - 14, c.t,
              {tam:6.6, neg:true, col:"#FFFFFF", al: c.al === "der" ? "der" : undefined, max:c.w - P * 2});
      cx += c.w;
    }
    y -= rH;
  };
  cabe(40 + rH * 2);
  L.texto(MG, y - 2, "Pantallas", {tam:11.5, neg:true, col:TINTA});
  L.texto(HOJA_W - MG, y - 2,
          `${o.pantallas.length} pantalla${o.pantallas.length === 1 ? "" : "s"} · ${miles(t.spots)} spots en la vigencia`,
          {tam:8.4, col:GRIS, al:"der"});
  y -= 12;
  encabezado();
  o.pantallas.forEach((q, i) => {
    if(y - rH < PISO){ hoja(); encabezado(); }
    if(i % 2 === 1) L.rect(MG, y - rH, ANCHO_CUERPO, rH, CEBRA);
    const spot = opnSpot(q, t.dias);
    const celdas = [opnPantallaNombre(q.pid), miles(q.frec), miles(n(q.frec) * t.dias),
                    q.mes !== null && q.mes !== undefined ? money(q.mes) : "—",
                    spot !== null ? "$" + spot.toFixed(4) : "—"];
    let cx = MG;
    celdas.forEach((v, k) => {
      const c = COL[k];
      L.texto(c.al === "der" ? cx + c.w - P : cx + P, y - 14.5, v,
              {tam:8.6, neg: k === 0 || k === 3, col:TINTA, al: c.al === "der" ? "der" : undefined, max:c.w - P * 2});
      cx += c.w;
    });
    /* la modalidad como cápsula de color; lo comercial va en gris */
    if(q.neg){
      const cn = negPdfColor(q.neg), et = negPdfEtiq(q.neg);
      const w = Math.min(pdfAncho(et, 6.6, true) + 12, COL[5].w - 6);
      L.redondo(cx + 4, y - 16.5, w, 11, 5.5, cn.fondo);
      L.texto(cx + 10, y - 13.2, et, {tam:6.6, neg:true, col:cn.texto, max:w - 10});
    } else {
      L.texto(cx + P, y - 14.5, "Comercial", {tam:8, col:GRIS});
    }
    L.linea(MG, y - rH, MG + ANCHO_CUERPO, y - rH, LINEA, 0.5);
    y -= rH;
  });
  if(y - rH < PISO) hoja();
  L.rect(MG, y - rH, ANCHO_CUERPO, rH, "#EAEFE4");
  {
    let cx = MG;
    const tot = ["TOTAL", miles(o.pantallas.reduce((a, q) => a + n(q.frec), 0)), miles(t.spots), money(t.total), "", ""];
    tot.forEach((v, k) => {
      const c = COL[k];
      if(v) L.texto(c.al === "der" ? cx + c.w - P : cx + P, y - 14.5, v,
                    {tam:8.6, neg:true, col:TINTA, al: c.al === "der" ? "der" : undefined, max:c.w - P * 2});
      cx += c.w;
    });
  }
  y -= rH + 16;

  /* --- valores de la OP --- */
  const vH = 60, vW = (ANCHO_CUERPO - gap) / 2;
  cabe(vH + 10);
  L.redondo(MG, y - vH, vW, vH, 8, SUAVE);
  L.texto(MG + 16, y - 19, "VALOR MENSUAL", {tam:7.2, neg:true, col:GRIS});
  L.texto(MG + 16, y - 44, money(o.valorMensual ?? t.total), {tam:18, neg:true, col:TINTA});
  const vx = MG + vW + gap;
  L.redondo(vx, y - vH, vW, vH, 8, TINTA);
  L.texto(vx + 16, y - 19, "VALOR TOTAL DE LA OP", {tam:7.2, neg:true, col:LIMA});
  L.texto(vx + 16, y - 45, money(o.valorTotal ?? t.total), {tam:21, neg:true, col:"#FFFFFF"});
  L.texto(vx + vW - 16, y - 19, `${miles(t.spots)} spots`, {tam:7.4, col:TENUE, al:"der"});
  y -= vH + 18;

  /* --- enlaces de descarga: se pueden pulsar desde el PDF --- */
  if((o.enlaces || []).length){
    cabe(40);
    L.texto(MG, y - 2, `Enlace${o.enlaces.length === 1 ? "" : "s"} de descarga`, {tam:10, neg:true, col:TINTA});
    y -= 12;
    o.enlaces.forEach((u, i) => {
      const trozos = pdfCortar(u, ANCHO_CUERPO - 74, 8.4, false);
      const alto = 9 + trozos.length * 11;
      cabe(alto + 4);
      L.redondo(MG, y - alto, ANCHO_CUERPO, alto, 5, SUAVE);
      const et = `ARTE ${i + 1}`;
      L.redondo(MG + 8, y - 15.8, pdfAncho(et, 6.6, true) + 12, 11, 5.5, TEAL);
      L.texto(MG + 14, y - 12.5, et, {tam:6.6, neg:true, col:"#FFFFFF"});
      let ly = y - 12.8;
      for(const tz of trozos){ L.texto(MG + 62, ly, tz, {tam:8.4, col:TEAL}); ly -= 11; }
      (L.links = L.links || []).push({x: MG, y: y - alto, w: ANCHO_CUERPO, h: alto, url: u});
      y -= alto + 4;
    });
    y -= 12;
  }

  /* --- indicaciones especiales --- */
  const lineas = o.indicaciones ? pdfCortar(o.indicaciones, ANCHO_CUERPO - 28, 9, false) : [];
  const iH = Math.max(32, 18 + lineas.length * 12);
  cabe(iH + 22);
  L.texto(MG, y - 2, "Indicaciones especiales", {tam:10, neg:true, col:TINTA});
  y -= 10;
  L.borde(MG, y - iH, ANCHO_CUERPO, iH, LINEA, 0.8);
  L.rect(MG, y - iH, 3, iH, TEAL);
  if(lineas.length){
    let ly = y - 16;
    for(const l of lineas){
      if(ly < PISO){ hoja(); ly = y - 16; }
      L.texto(MG + 14, ly, l, {tam:9, col:TINTA}); ly -= 12;
    }
  } else {
    L.texto(MG + 14, y - 19, "Sin indicaciones especiales.", {tam:9, col:GRIS2});
  }
  y -= iH + 16;

  /* --- notas de la plantilla --- */
  cabe(OPN_NOTAS.length * 12 + 6);
  for(const nota of OPN_NOTAS){
