/* Producción guarda el archivo entero: antes de escribir se traen las OP que
   Soporte haya creado o corregido mientras tanto, para no borrarlas. De cada
   OP queda la versión con el cambio más reciente. */
function opnUnirConDisco(fresco){
  if(!fresco || !Array.isArray(fresco.opNuevas)) return 0;
  if(!Array.isArray(DB.opNuevas)) DB.opNuevas = [];
  const aqui = DB.opNuevas;                     // las antiguas, que vivían en el .json
  let n2 = 0;
  for(const d of fresco.opNuevas){
    const i = aqui.findIndex(x => x.id === d.id);
    if(i < 0){ aqui.push(d); n2++; continue; }
    if(String(d.tsCambio || d.ts || "") > String(aqui[i].tsCambio || aqui[i].ts || "")){ aqui[i] = d; n2++; }
  }
  if(typeof fresco.correoProduccion === "string" && fresco.correoProduccion && !DB.correoProduccion)
    DB.correoProduccion = fresco.correoProduccion;
  return n2;
}


/* ============================================================
   OOH · Órdenes de Diseño (ODD) de vallas estáticas
   Soporte Comercial las crea; Producción les va cambiando el estado y las
   finaliza. Los dos las pueden editar y eliminar.
   Viven en la carpeta «Otros archivos», cada una en su propio archivo:
     ODD-OOH-29092026-01.json          la orden (la escribe quien la edite)
     ODD-OOH-29092026-01 estado.json   el estado (solo lo escribe Producción)
     ODD-OOH-correlativos.json         el último número de cada día (solo Soporte)
   Así ninguno escribe encima de lo que decide el otro, aunque cada quien esté
   en su computadora y Drive tarde en sincronizar. Del navegador solo se usa el
   apuntador a la carpeta (IndexedDB); ningún dato queda guardado ahí.
   ============================================================ */
const OOH_PREF = "ODD-OOH-";
const OOH_CONTADOR = "ODD-OOH-correlativos.json";
const OOH_CARPETA = "Otros archivos";
const OOH_KEY = RO ? "otros_ro" : "otros";
const OOH_ESTADOS = [
  {k:"recibido",   t:"Recibido"},
  {k:"trabajando", t:"Trabajando"},
  {k:"muestra",    t:"Muestra lista"},
  {k:"cambios",    t:"Cambios"},
  {k:"aprobado",   t:"Aprobado"}];
const OOH_SUSTRATOS = ["Lona", "Vinyl"];
let oohDir = null;            // la carpeta «Otros archivos»
let oohCarpeta = "sin";       // ok | permiso | sin
let oohLista = [];            // las ODD vivas
let oohEstados = {};          // id → {estado, tsEstado, historial}
let oohArchivos = {};         // id → nombres de archivo (incluye copias "(1)" de Drive)
let oohContador = {};         // "29092026" → último número usado ese día
let oohFirma = null;
let oohConocidas = null;      // para avisar lo que llega
let oohBusca = "";
let oohSondeo = null;

function oohEstadoTxt(k){ const e = OOH_ESTADOS.find(x => x.k === k); return e ? e.t : "Recibido"; }
function oohEstadoDe(o){ const e = oohEstados[o.id]; return (e && OOH_ESTADOS.some(x => x.k === e.estado)) ? e.estado : "recibido"; }
function oohPorId(id){ return oohLista.find(o => o.id === id) || null; }
function oohFechaCod(d){
  return String(d.getDate()).padStart(2, "0") + String(d.getMonth() + 1).padStart(2, "0") + d.getFullYear();
}
function oohLeerCorr(c){
  const m = /^ODD-OOH-(\d{8})-(\d+)$/.exec(String(c || ""));
  return m ? {fecha: m[1], n: +m[2]} : null;
}
function oohCorr(fecha, n){ return `${OOH_PREF}${fecha}-${String(n).padStart(2, "0")}`; }
function oohSiguiente(d){ const f = oohFechaCod(d); return oohCorr(f, (oohContador[f] || 0) + 1); }
function oohFechaLarga(d){ return d.toLocaleDateString("es-SV", {day:"numeric", month:"long", year:"numeric"}); }
function oohFechaNum(d){
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
/* "12.00 x 4.00 m" → {w:12, h:4}; si no se entiende, null */
function oohMedidas(t){
  const m = /(\d+(?:[.,]\d+)?)\s*(?:m|mt|mts|metros)?\s*[x×X*]\s*(\d+(?:[.,]\d+)?)/.exec(String(t || ""));
  if(!m) return null;
  const w = parseFloat(m[1].replace(",", ".")), h = parseFloat(m[2].replace(",", "."));
  return (w > 0 && h > 0) ? {w, h} : null;
}
function oohProporcion(t){
  const d = oohMedidas(t);
  return d ? Math.min(6, Math.max(0.5, d.w / d.h)) : 3;
}
/* 8 dígitos de El Salvador → 7809-7427; lo demás queda como se escribió */
function oohCelular(t){
  const s = String(t || "").trim();
  const dig = s.replace(/\D/g, "");
  if(dig.length === 8 && !/^\+/.test(s)) return dig.slice(0, 4) + "-" + dig.slice(4);
  if(dig.length === 11 && dig.startsWith("503")) return "+503 " + dig.slice(3, 7) + "-" + dig.slice(7);
  return s;
}

/* ---------- la carpeta ---------- */
async function oohPermiso(pedir){
  if(!oohDir) return false;
  try{
    let p = await oohDir.queryPermission({mode:"readwrite"});
    if(p === "granted") return true;
    if(!pedir) return false;
    p = await oohDir.requestPermission({mode:"readwrite"});
    return p === "granted";
  }catch(e){ return false; }
}
async function oohConectar(){
  if(!HAS_DIR){ toast("Este navegador no permite elegir carpetas: usa Google Chrome o Microsoft Edge"); return false; }
  let h;
  try{ h = await window.showDirectoryPicker({mode:"readwrite", id:"vnnox_otros"}); }
  catch(e){ return false; }
  if(String(h.name || "").trim().toLowerCase() !== OOH_CARPETA.toLowerCase()){
    toast(`Elegiste «${h.name}». Hay que elegir la carpeta «${OOH_CARPETA}» (está dentro de LISTAS VNNOX).`);
    return false;
  }
  oohDir = h;
  await idbSet(OOH_KEY, h);
  const r = await oohLeer(true);
  return r.ok;
}
/* Lee la carpeta. Cada archivo se reconoce por lo que trae adentro. */
async function oohLeer(pedir){
  if(!oohDir){ oohCarpeta = "sin"; return {ok:false, cambio:false}; }
  if(!(await oohPermiso(pedir))){ oohCarpeta = "permiso"; return {ok:false, cambio:false}; }
  const ords = new Map(), est = {}, arch = {}, borradas = new Set(), cont = {};
  const sube = (f, n) => { if(f && n) cont[f] = Math.max(cont[f] || 0, n); };
  try{
    for await (const h of oohDir.values()){
      if(h.kind !== "file" || !h.name.startsWith(OOH_PREF) || !/\.json$/i.test(h.name)) continue;
      let x;
      try{ x = JSON.parse(await (await h.getFile()).text()); }catch(e){ continue; }
      if(!x || typeof x !== "object") continue;
      if(x.contador && typeof x.contador === "object"){
        for(const [f, v] of Object.entries(x.contador)) sube(f, +v || 0);
        continue;
      }
      if(!x.id) continue;
      (arch[x.id] = arch[x.id] || []).push(h.name);
      const c = oohLeerCorr(x.corr); if(c) sube(c.fecha, c.n);
      if(x.eliminada){ borradas.add(x.id); continue; }            // quedó marcada como borrada
      if(x.tipo === "estado"){
        if(!est[x.id] || String(x.tsEstado || "") > String(est[x.id].tsEstado || "")) est[x.id] = x;
        continue;
      }
      if(x.corr && typeof x.cliente === "string"){
        const p = ords.get(x.id);
        if(!p || String(x.tsCambio || x.ts || "") > String(p.tsCambio || p.ts || "")) ords.set(x.id, x);
      }
    }
  }catch(e){ oohCarpeta = "permiso"; return {ok:false, cambio:false}; }
  for(const id of borradas){ ords.delete(id); delete est[id]; }
  oohLista = [...ords.values()].sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
  oohEstados = est; oohArchivos = arch; oohContador = cont; oohCarpeta = "ok";
  const firma = oohLista.map(o => `${o.id}:${o.tsCambio || o.ts}:${oohEstadoDe(o)}`).join(",");
  const cambio = firma !== oohFirma; oohFirma = firma;
  return {ok:true, cambio};
}
async function oohEscribir(nombre, datos){
  if(!oohDir) throw new Error(`falta conectar la carpeta «${OOH_CARPETA}»`);
  if(!(await oohPermiso(true))) throw new Error(`falta autorizar la carpeta «${OOH_CARPETA}»`);
  const fh = await oohDir.getFileHandle(nombre, {create:true});
  await escribirEn(fh, JSON.stringify(datos, null, 1));
}
async function oohExiste(nombre){
  try{ await oohDir.getFileHandle(nombre); return true; }catch(e){ return false; }
}
/* El número del día: lo lleva Soporte, que es quien crea las ODD. Las que ya se
   finalizaron no vuelven a prestar su número. */
async function oohGuardarContador(corr){
  const c = oohLeerCorr(corr); if(!c) return;
  let actual = {};
  try{
    const fh = await oohDir.getFileHandle(OOH_CONTADOR);
    const x = JSON.parse(await (await fh.getFile()).text());
    if(x && x.contador && typeof x.contador === "object") actual = x.contador;
  }catch(e){}
  for(const [f, v] of Object.entries(oohContador)) actual[f] = Math.max(+actual[f] || 0, v);
  actual[c.fecha] = Math.max(+actual[c.fecha] || 0, c.n);
  oohContador[c.fecha] = actual[c.fecha];
  /* solo hacen falta los días recientes */
  const dias = Object.keys(actual).sort((a, b) => (a.slice(4) + a.slice(2, 4) + a.slice(0, 2)).localeCompare(b.slice(4) + b.slice(2, 4) + b.slice(0, 2)));
  while(dias.length > 120) delete actual[dias.shift()];
  await oohEscribir(OOH_CONTADOR, {contador: actual, ts: new Date().toISOString()});
}
async function oohRefrescar(pedir){
  const r = await oohLeer(pedir);
  if(r.ok && r.cambio){
    oohAvisar();
    const libre = document.getElementById("ov").hidden;
    if(libre && tab === "ooh") render(); else renderTabs();
  }
  return r;
}
async function oohIniciar(){
  if(HAS_DIR){ try{ const h = await idbGet(OOH_KEY); if(h) oohDir = h; }catch(e){} }
  try{ await oohLeer(false); }catch(e){}
  oohAvisar();
  if(oohSondeo) return;
  oohSondeo = setInterval(() => { if(!document.hidden) oohRefrescar(false); }, 15000);
  window.addEventListener("focus", () => oohRefrescar(false));
}

/* Producción: aviso de ODD nuevas. Soporte: aviso de cambios de estado. */
function oohAvisar(){
  if(oohCarpeta !== "ok") return;
  const firma = o => RO ? `${o.id}|${oohEstadoDe(o)}` : o.id;
  if(oohConocidas === null){ oohConocidas = new Set(oohLista.map(firma)); return; }
  const nuevas = oohLista.filter(o => !oohConocidas.has(firma(o)));
  for(const o of oohLista) oohConocidas.add(firma(o));
  if(!nuevas.length) return;
  let titulo, texto;
  if(RO){
    titulo = "Producción actualizó una ODD OOH";
    texto = nuevas.length === 1
      ? `${nuevas[0].cliente}: ${oohEstadoTxt(oohEstadoDe(nuevas[0]))} · ${nuevas[0].corr}`
      : `${nuevas.length} ODD OOH cambiaron de estado · revisa «OOH»`;
  } else {
    titulo = "ODD OOH nueva de Soporte Comercial";
    texto = nuevas.length === 1
      ? `Soporte Comercial creó ${nuevas[0].corr} de ${nuevas[0].cliente} · está en «OOH»`
      : `${nuevas.length} ODD OOH nuevas de Soporte Comercial · revisa «OOH»`;
  }
  toast(texto);
  try{
    if(window.Notification && Notification.permission === "granted") new Notification(titulo, {body: texto});
  }catch(e){}
}
/* Lo que se cuenta en la pestaña: a Producción, lo recibido sin empezar; a Soporte, las muestras listas. */
function oohPendientes(){
  const k = RO ? "muestra" : "recibido";
  return oohLista.filter(o => oohEstadoDe(o) === k).length;
}

/* ---------- cambios ---------- */
async function oohPonerEstado(o, estado){
  if(RO || !o) return;
  const ahora = new Date().toISOString();
  const prev = oohEstados[o.id];
  const reg = {tipo:"estado", id:o.id, corr:o.corr, estado, tsEstado:ahora,
               historial: [...((prev && prev.historial) || []), {estado, ts:ahora}].slice(-40)};
  oohEstados[o.id] = reg;
  oohFirma = null;
  try{
    await oohEscribir(`${o.corr} estado.json`, reg);
    toast(`${o.cliente}: ${oohEstadoTxt(estado)}`);
  }catch(e){
    toast("No se pudo guardar el estado: " + (e.message || e));
    await oohLeer(false);
  }
  render();
}
/* Finalizar o eliminar: se borran sus archivos. Si la unidad compartida no deja
   borrar (permiso de colaborador), el archivo queda marcado como borrado y ya no
   aparece en ningún tablero. */
async function oohQuitar(o, motivo){
  if(!o) return false;
  const r = await oohLeer(true);
  if(!r.ok){ toast(`Falta autorizar la carpeta «${OOH_CARPETA}»`); return false; }
  const nombres = [...new Set([...(oohArchivos[o.id] || []), `${o.corr}.json`, `${o.corr} estado.json`])];
  const marca = {id:o.id, corr:o.corr, eliminada:true, motivo, ts:new Date().toISOString(),
                 por: RO ? "Soporte Comercial" : "Producción"};
  try{
    for(const nm of nombres){
      if(!(await oohExiste(nm))) continue;
      try{ await oohDir.removeEntry(nm); }
      catch(e){ await oohEscribir(nm, marca); }
    }
  }catch(e){
    toast("No se pudo quitar la ODD: " + (e.message || e));
    await oohLeer(false); render();
    return false;
  }
  if(oohConocidas) oohConocidas.delete(o.id);
  await oohLeer(false);
  render();
  return true;
}

/* ---------- la pestaña ---------- */
function oohValla(t, ancho){
  const r = oohProporcion(t), W = ancho || 46;
  const w = r >= 1 ? W : Math.round(W * r * 0.9), h = Math.max(10, Math.round(w / r));
  const H = h + 12;
  return `<svg class="oohsvg" viewBox="0 0 ${W + 4} ${H}" width="${W + 4}" height="${H}" aria-hidden="true">
    <rect x="${(W + 4 - w) / 2}" y="1" width="${w}" height="${h}" rx="2" class="p"/>
    <rect x="${(W + 4 - w) / 2 + w * 0.22 - 1.5}" y="${h + 1}" width="3" height="10" class="s"/>
    <rect x="${(W + 4 - w) / 2 + w * 0.78 - 1.5}" y="${h + 1}" width="3" height="10" class="s"/>
  </svg>`;
}

function tarjetaOOH(o){
  const e = oohEstadoDe(o);
  const reg = oohEstados[o.id];
  const tsE = reg && reg.tsEstado ? new Date(reg.tsEstado) : null;
  const creada = new Date(o.ts);
  const editada = o.tsCambio && o.tsCambio !== o.ts ? new Date(o.tsCambio) : null;
  const q = [o.corr, o.cliente, o.agencia, o.asesor, o.codigo, o.direccion, o.contacto, o.tamano].join(" ").toLowerCase();
  const pill = RO
    ? `<span class="oohpill" data-e="${e}">${oohEstadoTxt(e)}</span>`
    : `<select class="oohpill" data-e="${e}" data-oohest="${esc(o.id)}" aria-label="Estado de ${esc(o.corr)}">${OOH_ESTADOS.map(x =>
        `<option value="${x.k}"${x.k === e ? " selected" : ""}>${x.t}</option>`).join("")}</select>`;
  return `<article class="oohcard" data-e="${e}" data-q="${esc(q)}">
    <div class="oohtop"><span class="opncorr">${esc(o.corr)}</span>
      <span class="oohsus">${esc(String(o.sustrato || "Lona").toUpperCase())}</span></div>
    <div class="oohcli"><b>${esc(o.cliente)}</b><small>${o.agencia ? "Agencia " + esc(o.agencia) : "Cliente directo"}</small>
      ${o.asesor ? `<small class="oohase">Asesor: ${esc(o.asesor)}</small>` : ""}</div>
    <div class="oohvalla">${oohValla(o.tamano)}
      <div><b>${esc(o.codigo || "Sin código")}</b><span>${esc(o.tamano || "Tamaño sin indicar")}</span></div></div>
    ${o.direccion ? `<div class="oohdir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span>${esc(o.direccion)}</span></div>` : ""}
    ${(o.contacto || o.celular) ? `<div class="oohcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.9-6 7.5-6s6.7 2.2 7.5 6"/></svg>
      <span>${esc(o.contacto || "")}${o.contacto && o.celular ? " · " : ""}${o.celular
        ? `<a href="tel:${esc(String(o.celular).replace(/[^\d+]/g, ""))}">${esc(o.celular)}</a>` : ""}</span></div>` : ""}
    ${o.envioMuestra ? `<div class="oohcon" title="Dirección de envío de muestra"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
      <span>Muestra a: ${esc(o.envioMuestra)}</span></div>` : ""}
    ${(o.enlaces || []).length ? `<div class="oohenl">${o.enlaces.map((u, i) =>
      `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}"><span class="opnln">Editable ${i + 1}</span>${esc(opnEnlaceCorto(u, 34))}</a>`).join("")}</div>` : ""}
    ${o.observaciones ? `<div class="oohobs" title="${esc(o.observaciones)}">${esc(o.observaciones)}</div>` : ""}
    <div class="oohest">${pill}<small>${tsE ? `desde ${diaDe(tsE)} ${relojDe(tsE)}` : `creada ${isNaN(creada) ? "" : diaDe(creada) + " " + relojDe(creada)}`}</small></div>
    ${editada ? `<div class="oohed">Editada ${diaDe(editada)} ${relojDe(editada)} por ${esc(o.editadoPor || "—")}</div>` : ""}
    <footer>
      <button class="btn sm ghost" data-oohpdf="${esc(o.id)}" title="Descargar el PDF de la ODD">PDF</button>
      <button class="btn sm ghost" data-oohedit="${esc(o.id)}">Editar</button>
      <button class="btn sm ghost danger" data-oohdel="${esc(o.id)}">Eliminar</button>
      ${RO ? "" : `<button class="btn sm ${e === "aprobado" ? "primary" : "ghost"} oohfin" data-oohfin="${esc(o.id)}">Finalizar ODD</button>`}
    </footer>
  </article>`;
}
function oohFiltrar(v){
  const q = oohBusca.trim().toLowerCase();
  v.querySelectorAll(".oohcard").forEach(c => c.hidden = !!q && !c.dataset.q.includes(q));
  v.querySelectorAll(".oohcol").forEach(col => {
    const vis = [...col.querySelectorAll(".oohcard")].filter(c => !c.hidden).length;
    col.querySelector(".oohn").textContent = vis;
  });
}
function wireOOH(v){
  const bp = document.getElementById("ooh_perm");
  if(bp) bp.onclick = async () => {
    bp.disabled = true;
    const ok = oohCarpeta === "sin" ? await oohConectar() : (await oohRefrescar(true)).ok;
    if(ok){ oohAvisar(); render(); toast(`Carpeta «${OOH_CARPETA}» lista`); }
    else { bp.disabled = false; if(oohCarpeta !== "sin") toast("El navegador no dio el permiso de la carpeta"); }
  };
  /* si se llegó a la pestaña con un clic, ese clic ya sirve para pedir el permiso */
  if(oohCarpeta === "permiso" && navigator.userActivation && navigator.userActivation.isActive)
    oohRefrescar(true).then(r => { if(r.ok) render(); });
  const q = document.getElementById("ooh_q");
  if(q){ q.oninput = () => { oohBusca = q.value; oohFiltrar(v); }; if(oohBusca) oohFiltrar(v); }
  const bn = document.getElementById("ooh_new");
  if(bn) bn.onclick = () => modalODD(null);
  v.querySelectorAll("[data-oohest]").forEach(s => s.onchange = () => oohPonerEstado(oohPorId(s.dataset.oohest), s.value));
  v.querySelectorAll("[data-oohpdf]").forEach(b => b.onclick = async () => {
    const o = oohPorId(b.dataset.oohpdf); if(!o) return;
    try{ const f = await oohGuardarPDF(o); if(f) toast("PDF guardado: " + f); }
    catch(e){ toast("No se pudo generar el PDF: " + (e.message || e)); }
  });
  v.querySelectorAll("[data-oohedit]").forEach(b => b.onclick = () => { const o = oohPorId(b.dataset.oohedit); if(o) modalODD(o); });
  v.querySelectorAll("[data-oohdel]").forEach(b => b.onclick = async () => {
    const o = oohPorId(b.dataset.oohdel); if(!o) return;
    if(!confirm(`¿Eliminar ${o.corr} de ${o.cliente}?\n\nSe borra del registro en los dos tableros y no se puede deshacer.`)) return;
    if(await oohQuitar(o, "eliminada")) toast(`${o.corr} eliminada`);
  });
  v.querySelectorAll("[data-oohfin]").forEach(b => b.onclick = async () => {
    const o = oohPorId(b.dataset.oohfin); if(!o) return;
    const e = oohEstadoDe(o);
    const extra = e === "aprobado" ? "" : `\n\nOjo: todavía está en «${oohEstadoTxt(e)}», no en «Aprobado».`;
    if(!confirm(`¿Finalizar ${o.corr} de ${o.cliente}?\n\nSale del registro de los dos tableros.${extra}`)) return;
    if(await oohQuitar(o, "finalizada")) toast(`${o.corr} finalizada · salió del registro`);
  });
}

      $("oo_fecha").textContent = oohFechaNum(d);
      $("oo_hora").textContent = relojDe(d) + " · se registra sola al crear";
      $("oo_corr").textContent = oohSiguiente(d);
    }, 20000);

  /* enlaces: el + agrega otra fila, la × la quita */

  function fila(valor){
    const i = caja.children.length;
    const f = document.createElement("div");
    f.className = "opnlink";
    f.innerHTML = `<span class="opnln">Editable ${i + 1}</span>

    if(mas) mas.onclick = () => { fila(""); caja.lastElementChild.querySelector("input").focus(); };
    const quita = f.querySelector(".opnquita");
    if(quita) quita.onclick = () => { f.remove(); renumerar(); };
  }
  function renumerar(){
    [...caja.children].forEach((f, i) => {
      f.querySelector(".opnln").textContent = `Editable ${i + 1}`;
      f.querySelector("input").id = `oo_link_${i}`;
    });
  }
  (Array.isArray(b0.enlaces) && b0.enlaces.length ? b0.enlaces : [""]).forEach(u => fila(u));
  if(!edita) setTimeout(() => $("oo_ase") && $("oo_ase").focus(), 30);

  $("oo_ok").onclick = async () => {
    const msg = $("oo_msg");
    const falla = (t, foco) => { msg.textContent = t; msg.style.color = "var(--critical)"; if(foco) $(foco).focus(); };
    const d = {
      asesor: $("oo_ase").value.trim(),
      cliente: $("oo_cli").value.trim(),
      agencia: $("oo_ag").value.trim(),
      contacto: $("oo_con").value.trim(),
      celular: oohCelular($("oo_cel").value),
      envioMuestra: $("oo_env").value.trim(),
      tamano: $("oo_tam").value.trim(),
      sustrato: ($("oo_sus").querySelector(".sel") || {dataset:{sus:"Lona"}}).dataset.sus,
      codigo: $("oo_cod").value.trim(),
      direccion: $("oo_dir").value.trim(),
      observaciones: $("oo_obs").value.trim(),
      enlaces: [],
    };
    for(const inp of document.querySelectorAll("#oo_links .oo_link")){
      const u = opnEnlace(inp.value);
      if(u === null){ inp.focus(); return falla(`Ese enlace no se ve bien: "${inp.value.trim()}". Pega la dirección completa.`); }
      if(u) d.enlaces.push(u);
    }
    if(!d.asesor) return falla("Falta el nombre del asesor comercial.", "oo_ase");
    if(!d.cliente) return falla("Falta el cliente.", "oo_cli");
    if(!d.tamano) return falla("Falta el tamaño de la valla.", "oo_tam");
    if(!d.codigo && !d.direccion) return falla("Pon el código de la valla o su dirección.", "oo_cod");
    if(d.celular && d.celular.replace(/\D/g, "").length < 8) return falla("El celular está incompleto.", "oo_cel");

    const btn = $("oo_ok");
    const txt = btn.textContent;
    btn.disabled = true; btn.textContent = "Guardando…"; msg.textContent = "";
    let rec = null;
    try{
      if(!oohDir && !(await oohConectar())) throw new Error(`falta conectar la carpeta «${OOH_CARPETA}»`);
      const r = await oohLeer(true);                 // trae lo último (y el último número del día)
      if(!r.ok) throw new Error(`falta autorizar la carpeta «${OOH_CARPETA}»`);
      const ts = new Date().toISOString();
      if(edita){
        const prev = oohPorId(b0.id);
        if(!prev) throw new Error("esta ODD ya se finalizó o se eliminó en el otro tablero");
        rec = Object.assign({}, prev, d, {tsCambio: ts, rev: (prev.rev || 1) + 1,
                                          editadoPor: RO ? "Soporte Comercial" : "Producción"});
      } else {
        const hoy = new Date(), f = oohFechaCod(hoy);
        let nro = (oohContador[f] || 0) + 1;
        while(await oohExiste(`${oohCorr(f, nro)}.json`)) nro++;      // nunca encima de otra
        rec = Object.assign({tipo:"odd-ooh", id: uid(), corr: oohCorr(f, nro), ts, tsCambio: ts, rev: 1,
                             autor: "Soporte Comercial"}, d);
      }
      await oohEscribir(`${rec.corr}.json`, rec);
      if(!edita) await oohGuardarContador(rec.corr);
      await oohLeer(false);
      if(oohConocidas) oohConocidas.add(RO ? `${rec.id}|${oohEstadoDe(rec)}` : rec.id);
    }catch(err){
      btn.disabled = false; btn.textContent = txt;
      return falla("No se pudo guardar la ODD: " + (err.message || err) + ".");
    }
    let archivo = "";
    if(!edita){
      btn.textContent = "Generando PDF…";
      try{ archivo = await oohGuardarPDF(rec); }
      catch(e){ toast("La ODD quedó guardada, pero no se pudo generar el PDF: " + (e.message || e)); }
    }
    closeModal();
    tab = "ooh"; render();
    toast(edita ? `${rec.corr} actualizada` : `${rec.corr} creada${archivo ? " · PDF: " + archivo : ""}`);
  };
}

/* ---------- el PDF, con el branding de Veo ---------- */
async function oohGuardarPDF(o){
  const nombre = `${o.corr}.pdf`;
  let destino = null;
  if(window.showSaveFilePicker){
    try{
      destino = await window.showSaveFilePicker({suggestedName: nombre,
        types: [{description:"PDF", accept:{"application/pdf":[".pdf"]}}]});
    }catch(e){ if(e && e.name === "AbortError") return ""; destino = null; }
  }
  const bytes = await pdfODD(o);
  if(destino) await escribirEn(destino, bytes);
  else dl(new Blob([bytes], {type:"application/pdf"}), nombre);
  return (destino && destino.name) || nombre;
}
async function pdfODD(o){
  const TEAL = "#4A798C", SUAVE = "#F4F6F1", CLARO = "#C9D2D4", TENUE = "#AEB8BB", POSTE = "#5B6770";
  const TOPE = 708, PISO = 96;
  const gen = new Date(o.ts || Date.now());
  const sello = `Fecha: ${oohFechaLarga(gen)} / Hora: ${relojDe(gen)}`;
  const paginas = [];
  let L = null, y = 0;
  const hoja = () => { L = pdfLienzo(); paginas.push(L); pdfMembrete(L, sello); y = TOPE; };
  const cabe = alto => { if(y - alto < PISO) hoja(); };
  hoja();

  /* --- título y correlativo --- */
  L.texto(MG, y - 18, "Orden de Diseño OOH", {tam:19, neg:true, col:TINTA});
  L.rect(MG, y - 28, 46, 3, LIMA);
  const pw = Math.max(178, pdfAncho(o.corr, 13, true) + 28), px = HOJA_W - MG - pw;
  L.redondo(px, y - 36, pw, 36, 8, TINTA);
  L.texto(px + 14, y - 14, "ODD · VALLA ESTÁTICA", {tam:7, neg:true, col:TENUE});
  L.texto(px + 14, y - 29, o.corr, {tam:13, neg:true, col:LIMA});
  y -= 48;
  const edit = o.tsCambio && o.tsCambio !== o.ts ? new Date(o.tsCambio) : null;
  L.texto(MG, y, `Generada por ${o.autor || "Soporte Comercial"} · ${oohFechaLarga(gen)}, ${relojDe(gen)}` +
          (edit ? ` · actualizada ${oohFechaNum(edit)} ${relojDe(edit)}` : ""), {tam:8.6, col:GRIS, max:ANCHO_CUERPO});
  y -= 14;

  /* --- tarjeta principal: cliente, agencia, sustrato y la valla dibujada a escala --- */
  const hH = 124;
  L.redondo(MG, y - hH, ANCHO_CUERPO, hH, 10, TINTA);
  const izq = MG + 20, der = MG + ANCHO_CUERPO - 20, anchoCli = ANCHO_CUERPO * 0.54;
  L.texto(izq, y - 22, "CLIENTE", {tam:7, neg:true, col:LIMA});
  let tamC = 21;
  while(tamC > 11 && pdfAncho(o.cliente || "", tamC, true) > anchoCli) tamC -= 0.5;
  L.texto(izq, y - 46, o.cliente || "", {tam:tamC, neg:true, col:"#FFFFFF", max:anchoCli});
  L.texto(izq, y - 64, o.agencia ? `Agencia: ${o.agencia}` : "Cliente directo", {tam:10.5, col:CLARO, max:anchoCli});
  const etS = `SUSTRATO · ${String(o.sustrato || "Lona").toUpperCase()}`;
  const wS = pdfAncho(etS, 7, true) + 16;
  L.redondo(izq, y - 98, wS, 15, 7.5, LIMA);
  L.texto(izq + 8, y - 93, etS, {tam:7, neg:true, col:TINTA});
  const etT = String(o.tamano || "").toUpperCase();
  if(etT){
    const wT = Math.min(pdfAncho(etT, 7, true) + 16, anchoCli - wS - 6);
    L.redondo(izq + wS + 6, y - 98, wT, 15, 7.5, TEAL);
    L.texto(izq + wS + 14, y - 93, etT, {tam:7, neg:true, col:"#FFFFFF", max:wT - 14});
  }
  {
    const med = oohMedidas(o.tamano), r = oohProporcion(o.tamano);
    const maxW = 150, maxH = 60;
    let bw = maxW, bh = bw / r;
    if(bh > maxH){ bh = maxH; bw = bh * r; }
    const bx = der - 34 - bw, techo = y - 30, piso = techo - bh;
    const suelo = y - hH + 14;
    L.rect(bx + bw * 0.22 - 2.5, suelo, 5, piso - suelo, POSTE);
    L.rect(bx + bw * 0.78 - 2.5, suelo, 5, piso - suelo, POSTE);
    L.linea(bx - 14, suelo, bx + bw + 14, suelo, POSTE, 1);
    L.redondo(bx, piso, bw, bh, 3, "#26313A");
    L.borde(bx, piso, bw, bh, LIMA, 1.2);
    L.texto(bx + bw / 2, piso + bh / 2 - 3, String(o.sustrato || "Lona").toUpperCase(), {tam:8, neg:true, col:LIMA, al:"cen"});
    if(med){
      const fmtM = v => (Math.round(v * 100) / 100).toFixed(2) + " m";
      L.texto(bx + bw / 2, techo + 5, fmtM(med.w), {tam:7.4, col:CLARO, al:"cen"});
      L.texto(bx + bw + 5, piso + bh / 2 - 3, fmtM(med.h), {tam:7.4, col:CLARO});
    }
  }
  y -= hH + 12;

  /* --- la valla: código y dirección --- */
  const gap = 10, w1 = 150, w2 = ANCHO_CUERPO - w1 - gap;
  const dirL = pdfCortar(o.direccion || "Sin dirección indicada.", w2 - 28, 9.6, false).slice(0, 8);
  const vH = Math.max(60, 32 + dirL.length * 12.5);
  L.redondo(MG, y - vH, w1, vH, 8, SUAVE);
  L.rect(MG, y - vH, 3, vH, LIMA);
  L.texto(MG + 14, y - 17, "CÓDIGO DE VALLA", {tam:6.8, neg:true, col:GRIS});
  let tamK = 15;
  while(tamK > 9 && pdfAncho(o.codigo || "—", tamK, true) > w1 - 26) tamK -= 0.5;
  L.texto(MG + 14, y - 38, o.codigo || "—", {tam:tamK, neg:true, col:TINTA, max:w1 - 24});
  const x2 = MG + w1 + gap;
  L.redondo(x2, y - vH, w2, vH, 8, SUAVE);
  L.rect(x2, y - vH, 3, vH, TEAL);
  L.texto(x2 + 14, y - 17, "DIRECCIÓN DE LA VALLA", {tam:6.8, neg:true, col:GRIS});
  let ly = y - 33;
  for(const l of dirL){ L.texto(x2 + 14, ly, l, {tam:9.6, neg:!!o.direccion, col: o.direccion ? TINTA : GRIS2}); ly -= 12.5; }
  y -= vH + 12;

  /* --- contacto --- */
  const cH = 48, g4 = 8, cW = (ANCHO_CUERPO - g4 * 3) / 4;
  const tarj = (i, etq, val, sub) => {
    const x = MG + i * (cW + g4);
    L.redondo(x, y - cH, cW, cH, 6, SUAVE);
    L.rect(x, y - cH, 3, cH, LIMA);
    L.texto(x + 11, y - 15, etq, {tam:6.4, neg:true, col:GRIS, max:cW - 18});
    let t = 9.6;
    while(t > 7.6 && pdfAncho(val || "—", t, true) > cW - 18) t -= 0.2;
    L.texto(x + 11, y - 31, val || "—", {tam:t, neg:true, col:TINTA, max:cW - 18});
    if(sub) L.texto(x + 11, y - 42, sub, {tam:7.2, col:GRIS, max:cW - 18});
  };
  tarj(0, "ASESOR COMERCIAL", o.asesor);
  tarj(1, "CONTACTO", o.contacto);
  tarj(2, "CELULAR", o.celular);
  tarj(3, "FECHA DE GENERACIÓN", oohFechaNum(gen), relojDe(gen));
  if(o.celular) (L.links = L.links || []).push({x: MG + 2 * (cW + g4), y: y - cH, w: cW, h: cH,
    url: "tel:" + String(o.celular).replace(/[^\d+]/g, "")});
  y -= cH + 10;

  /* --- a dónde va la muestra --- */
  {
    const envL = pdfCortar(o.envioMuestra || "Sin indicar.", ANCHO_CUERPO - 28, 9.6, false).slice(0, 5);
    const eH = 30 + envL.length * 12.5;
    L.redondo(MG, y - eH, ANCHO_CUERPO, eH, 8, SUAVE);
    L.rect(MG, y - eH, 3, eH, TEAL);
    L.texto(MG + 14, y - 16, "DIRECCIÓN DE ENVÍO DE MUESTRA", {tam:6.8, neg:true, col:GRIS});
    let ey = y - 31;
    for(const l of envL){ L.texto(MG + 14, ey, l, {tam:9.6, neg:!!o.envioMuestra, col: o.envioMuestra ? TINTA : GRIS2}); ey -= 12.5; }
    y -= eH + 20;
  }

  /* --- enlaces de editables: se pueden pulsar desde el PDF --- */
  if((o.enlaces || []).length){
    cabe(40);
    L.texto(MG, y - 2, `Enlace${o.enlaces.length === 1 ? "" : "s"} de editables`, {tam:10, neg:true, col:TINTA});
    y -= 12;
    o.enlaces.forEach((u, i) => {
      const trozos = pdfCortar(u, ANCHO_CUERPO - 86, 8.4, false);
      const alto = 9 + trozos.length * 11;
      cabe(alto + 4);
      L.redondo(MG, y - alto, ANCHO_CUERPO, alto, 5, SUAVE);
      const et = `EDITABLE ${i + 1}`;
      L.redondo(MG + 8, y - 15.8, pdfAncho(et, 6.6, true) + 12, 11, 5.5, TEAL);
      L.texto(MG + 14, y - 12.5, et, {tam:6.6, neg:true, col:"#FFFFFF"});
      let yy = y - 12.8;
      for(const tz of trozos){ L.texto(MG + 76, yy, tz, {tam:8.4, col:TEAL}); yy -= 11; }
      (L.links = L.links || []).push({x: MG, y: y - alto, w: ANCHO_CUERPO, h: alto, url: u});
      y -= alto + 4;
    });
    y -= 12;
  }

  /* --- observaciones --- */
  const lineas = o.observaciones
    ? String(o.observaciones).split(/\n/).flatMap(p => p.trim() ? pdfCortar(p, ANCHO_CUERPO - 28, 9, false) : [""])
    : [];
  cabe(Math.min(120, 40 + lineas.length * 12));
  L.texto(MG, y - 2, "Observaciones", {tam:10, neg:true, col:TINTA});
  y -= 10;
  if(!lineas.length){
    L.borde(MG, y - 32, ANCHO_CUERPO, 32, LINEA, 0.8);
    L.rect(MG, y - 32, 3, 32, TEAL);
    L.texto(MG + 14, y - 19, "Sin observaciones.", {tam:9, col:GRIS2});
    y -= 48;
  } else {
    let i = 0;
    while(i < lineas.length){
      const caben = Math.max(1, Math.floor((y - PISO - 18) / 12));
      const tramo = lineas.slice(i, i + caben);
      const alto = 18 + tramo.length * 12;
      L.borde(MG, y - alto, ANCHO_CUERPO, alto, LINEA, 0.8);
      L.rect(MG, y - alto, 3, alto, TEAL);
      let yy = y - 16;
      for(const l of tramo){ L.texto(MG + 14, yy, l, {tam:9, col:TINTA}); yy -= 12; }
      y -= alto + 16;
      i += tramo.length;
      if(i < lineas.length){ hoja(); y -= 6; }
    }
  }

  paginas.forEach((pg, i) => {
    pg.texto(HOJA_W - MG, 80, `Página ${i + 1} de ${paginas.length}`, {tam:7.4, col:GRIS2, al:"der"});
    pg.texto(MG, 80, `${o.corr} · Generado desde ${RO ? "Soporte Comercial DOOH" : "DOOH - Producción"}`, {tam:7.4, col:GRIS2});
  });
  return await pdfArmar(paginas.map(pg => pg.ops.join("\n")), paginas.map(pg => pg.links || []));
}

          toast("Datos cargados de " + f.name);
        }catch(err){ alert("No se pudo leer el archivo.\n\n" + (err.message || err)); }
      };
      fr.readAsText(f);
    };
  } else {
    document.getElementById("btnjson").onclick = exportJSON;
    document.getElementById("btnimport").onclick = () => document.getElementById("fileinput").click();
    document.getElementById("fileinput").onchange = e => { if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; };
  }
  document.getElementById("ov").onclick = e => { if(e.target.id === "ov") closeModal(); };
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("ov").hidden) closeModal(); });

  // datalist de clientes para autocompletar
  const dl2 = document.createElement("datalist"); dl2.id = "clientes";
  const set = new Set();
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas) set.add(c.cliente);
  dl2.innerHTML = [...set].sort().map(c=>`<option value="${esc(c)}">`).join("");
  document.body.appendChild(dl2);

  semEstadoActual();
  setInterval(() => { const el = document.getElementById("sem");
    if(el && el.dataset.s === "rojo") semEstadoActual(); }, 30000);
  if(!RO) window.addEventListener("beforeunload", e => {
    if(cambiosSinArchivo){ e.preventDefault(); e.returnValue = ""; }
  });
  render();
  setInterval(vigilarArchivo, 8000);
  window.addEventListener("focus", vigilarArchivo);
}

/* Caracteres fuera de latin-1 que sí existen en WinAnsiEncoding (más algunos reemplazos). */
const PDF_ESP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,
  "Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,
  "œ":156,"ž":158,"Ÿ":159,"→":150,"←":150,"↔":150,"″":34,"′":39,"　":32};
function pdfCod(ch){
  const c = ch.codePointAt(0);
  if(c < 256) return c;
  return PDF_ESP[ch] || 63;            // 63 = "?"
}
function pdfAncho(txt, tam, neg){
  const w = neg ? PDF_W_B : PDF_W_R;
  let t = 0;
  for(const ch of String(txt == null ? "" : txt)) t += w[pdfCod(ch)] || 0;
  return t * tam / 1000;
}
function pdfEsc(txt){
  let out = "";
  for(const ch of String(txt == null ? "" : txt)){
    const c = pdfCod(ch);
    if(c === 40 || c === 41 || c === 92) out += "\\";
    out += String.fromCharCode(c);
  }
  return out;
}
/* Corta un texto en líneas que quepan en "ancho". */
function pdfCortar(txt, ancho, tam, neg){
  const palabras = String(txt == null ? "" : txt).split(/\s+/).filter(Boolean);
  const lineas = [];
  let act = "";
  const partir = pal => {                       // palabra sola más ancha que la columna
    let trozo = "";
    for(const ch of pal){
      if(pdfAncho(trozo + ch, tam, neg) > ancho && trozo){ lineas.push(trozo); trozo = ch; }
      else trozo += ch;
    }
    return trozo;
  };
  for(const p of palabras){
    const t = act ? act + " " + p : p;
    if(pdfAncho(t, tam, neg) <= ancho){ act = t; continue; }
    if(act){ lineas.push(act); act = ""; }
    act = pdfAncho(p, tam, neg) > ancho ? partir(p) : p;
  }
  if(act) lineas.push(act);
  return lineas.length ? lineas : [""];
}
function pdfRecorta(txt, ancho, tam, neg){
  let s = String(txt == null ? "" : txt);
  if(pdfAncho(s, tam, neg) <= ancho) return s;
  while(s.length && pdfAncho(s + "…", tam, neg) > ancho) s = s.slice(0, -1);
  return s + "…";
}
function pdfRGB(hex){
  const h = hex.replace("#","");
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]
         .map(v => v.toFixed(3)).join(" ");
}
const nf = x => {
  const s = (Math.round(x * 100) / 100).toString();
  return s === "-0" ? "0" : s;
};

/* --- lienzo: acumula los operadores de una página --- */
function pdfLienzo(){
  const ops = [];
  const api = {
    ops,
    crudo(s){ ops.push(s); return api; },
    rect(x, y, w, h, color){ ops.push(`${pdfRGB(color)} rg ${nf(x)} ${nf(y)} ${nf(w)} ${nf(h)} re f`); return api; },
    borde(x, y, w, h, color, grosor){
      ops.push(`${pdfRGB(color)} RG ${nf(grosor||0.6)} w ${nf(x)} ${nf(y)} ${nf(w)} ${nf(h)} re S`); return api;
    },
    linea(x1, y1, x2, y2, color, grosor){
      ops.push(`${pdfRGB(color)} RG ${nf(grosor||0.6)} w ${nf(x1)} ${nf(y1)} m ${nf(x2)} ${nf(y2)} l S`); return api;
    },
    /* rectángulo con esquinas redondeadas */
    redondo(x, y, w, h, r, color){
      r = Math.min(r, w/2, h/2);
      const k = r * 0.5523;
      ops.push(`${pdfRGB(color)} rg ${nf(x+r)} ${nf(y)} m ${nf(x+w-r)} ${nf(y)} l ` +
        `${nf(x+w-r+k)} ${nf(y)} ${nf(x+w)} ${nf(y+r-k)} ${nf(x+w)} ${nf(y+r)} c ` +
        `${nf(x+w)} ${nf(y+h-r)} l ${nf(x+w)} ${nf(y+h-r+k)} ${nf(x+w-r+k)} ${nf(y+h)} ${nf(x+w-r)} ${nf(y+h)} c ` +
        `${nf(x+r)} ${nf(y+h)} l ${nf(x+r-k)} ${nf(y+h)} ${nf(x)} ${nf(y+h-r+k)} ${nf(x)} ${nf(y+h-r)} c ` +
        `${nf(x)} ${nf(y+r)} l ${nf(x)} ${nf(y+r-k)} ${nf(x+r-k)} ${nf(y)} ${nf(x+r)} ${nf(y)} c h f`);
      return api;
    },
    texto(x, y, txt, o){
      o = o || {};
      const tam = o.tam || 9, neg = !!o.neg, col = o.col || "#1B2229";
      let s = String(txt == null ? "" : txt);
      if(o.max) s = pdfRecorta(s, o.max, tam, neg);
      let px = x;
      if(o.al === "der")  px = x - pdfAncho(s, tam, neg);
      if(o.al === "cen")  px = x - pdfAncho(s, tam, neg) / 2;
      ops.push(`BT ${pdfRGB(col)} rg /${neg ? "FB" : "FR"} ${nf(tam)} Tf ${nf(px)} ${nf(y)} Td (${pdfEsc(s)}) Tj ET`);
      return api;
    }
  };
  return api;
}

const NEG_PDF = {
  donacion:     {fondo:"#E4E1F7", texto:"#39308A"},
  canje:        {fondo:"#FBE4D8", texto:"#8A4318"},
  dacion:       {fondo:"#D9E7FA", texto:"#1B4E8C"},

/* si mañana se agrega otra modalidad, la cápsula sale en gris pero el PDF no se cae */
const NEG_PDF_OTRO = {fondo:"#EEF1F2", texto:"#4A5A5F"};
function negPdfColor(v){ return NEG_PDF[v] || NEG_PDF_OTRO; }
function negPdfEtiq(v){
  const e = (typeof NEG_ETIQ === "object" && NEG_ETIQ) ? NEG_ETIQ[v] : null;
  return e || String(v || "Modalidad");
}
const COLS = [
  {k:"fecha",  t:"Fecha de\ningreso",       w:50},
  {k:"cli",    t:"Cliente",                 w:104},
  {k:"vig",    t:"Vigencia",                w:64},   // aquí cabe el aviso de días
  {k:"estado", t:"Estado",                  w:84},
  {k:"pant",   t:"Pantallas y\nfrecuencia", w:86},
  {k:"val",    t:"Valores",                 w:80}
];
const PAD = 6, ALTO_TH = 26;

function pdfFilasReporte(lista){
  return (lista || filasDelReporte()).map(ev => {
    const d = new Date(ev.ts);
    const ubs = ubicacionesDe(ev.cliente);
    const t = pdfTipoDe(ev);
    const cw = COLS[1].w - PAD * 2, pw = COLS[5].w - PAD * 2;
    const lCli  = pdfCortar(ev.cliente || "", cw, 8.4, true);
    const cmp = campanaActual(ev.cliente, ev.campana);
    const lCamp = cmp ? pdfCortar(cmp, cw, 7.1, false) : [];
    const lPant = ubs.length
      ? ubs.map(u => pdfCortar(`${u.pantalla}  ${miles(u.frec)}${u.pausada ? " (pausa)" : ""}`, pw, 7.4, false)).flat()
      : ["sin pauta al aire"];
    const vg = vigDeFila(ev);
    const dias = textoDiasCorto(vg);
    const antes = ev.movio ? `${ev.movio} en el periodo`
                : ev.finAntes && ev.finAntes !== ev.fin ? `antes ${fmt(ev.finAntes)}` : "";
    /* la pastilla del estado siempre va en una sola línea: se achica la letra si hace falta */
    const hueco = COLS[3].w - PAD * 2 - 17;
    let tamEst = 7.4;
    while(tamEst > 5.6 && pdfAncho(t.etq, tamEst, true) > hueco) tamEst -= 0.2;
    const val = valoresCliente(ev.cliente, ev.campana);
    const hayVal = val.total !== null;
    const alto = Math.max(
      PAD * 2 + lCli.length * 10.5 + lCamp.length * 8.4 +
        (val.negR && val.negR.estado === "todo" ? 12
         : val.negR && val.negR.estado === "mixto" ? val.negR.tipos.length * 12.5 : 0),
      PAD * 2 + lPant.length * 9.2,
      PAD * 2 + 12.4 + (antes ? 9 : 0),
      PAD * 2 + 9.4 + (dias ? 13 : 0),
      PAD * 2 + (hayVal ? (val.faltan ? 3.9 : 3) : 1) * 9.6,
      24
    );
    return {ev, t, d, ubs, lCli, lCamp, lPant, tamEst, antes, alto, val, hayVal, vg, dias,
            spots: ubs.reduce((a,u) => a + u.frec, 0)};
  });
}

function pdfDibujarFila(L, f, x, y){          // y = borde superior de la fila
  let cx = x;
  const base = y - PAD - 7.6;
  /* fecha · las campañas que vienen de antes del historial no tienen movimiento */
  if(f.ev.ts && !isNaN(f.d)){
    L.texto(cx + PAD, base, `${String(f.d.getDate()).padStart(2,"0")}/${String(f.d.getMonth()+1).padStart(2,"0")}/${String(f.d.getFullYear()).slice(2)}`,
            {tam:8.4, col:TINTA});
    L.texto(cx + PAD, base - 8.6, relojDe(f.d), {tam:7.1, col:GRIS2, max:COLS[0].w - PAD*2});
  } else {
    L.texto(cx + PAD, base, "—", {tam:8.4, col:GRIS2});
    L.texto(cx + PAD, base - 8.4, "antes del", {tam:6.2, col:GRIS2, max:COLS[0].w - PAD*2});
    L.texto(cx + PAD, base - 15.2, "historial", {tam:6.2, col:GRIS2, max:COLS[0].w - PAD*2});
  }
  cx += COLS[0].w;
  /* cliente */
  let cy = base;
  f.lCli.forEach(l => { L.texto(cx + PAD, cy, l, {tam:8.4, neg:true, col:TINTA}); cy -= 10.5; });
  f.lCamp.forEach(l => { L.texto(cx + PAD, cy + 1.5, l, {tam:7.1, col:GRIS}); cy -= 8.4; });
  /* la modalidad es de cada pantalla: si no cubre toda la OP se dice dónde aplica */
  const rn = f.val.negR;
  if(rn && rn.estado === "todo"){
    const cn = negPdfColor(rn.neg);
    const et = negPdfEtiq(rn.neg);
    const w2 = pdfAncho(et, 6.8, true) + 11;
    L.redondo(cx + PAD, cy - 6.6, w2, 11, 5.5, cn.fondo);
    L.texto(cx + PAD + 5.5, cy - 3.2, et, {tam:6.8, neg:true, col:cn.texto});
  } else if(rn && rn.estado === "mixto"){
    for(const tp of rn.tipos){
      const cn = negPdfColor(tp);
      const ps = negPantallasDe(rn, tp);
      const hueco2 = COLS[1].w - PAD * 2 - 11;
      /* primero se intenta nombrar las pantallas achicando la letra; si aun así no
         caben, se dice cuántas son para no cortar el nombre a media palabra */
      let etq = `${negPdfEtiq(tp)}: ${ps.join(", ")}`;
      let tamN = 6.2;
      while(tamN > 5.2 && pdfAncho(etq, tamN, true) > hueco2) tamN -= 0.2;
      if(pdfAncho(etq, tamN, true) > hueco2 && ps.length > 1){
        etq = `${negPdfEtiq(tp)}: ${ps.length} de ${rn.filas.length} pantallas`;
        tamN = 6.2;
        while(tamN > 5.2 && pdfAncho(etq, tamN, true) > hueco2) tamN -= 0.2;
      }
      const w2 = Math.min(pdfAncho(etq, tamN, true) + 11, COLS[1].w - PAD * 2);
      L.redondo(cx + PAD, cy - 6.6, w2, 11, 5.5, cn.fondo);
      L.texto(cx + PAD + 5.5, cy - 3.2, etq, {tam:tamN, neg:true, col:cn.texto, max:w2 - 11});
      cy -= 12.5;
    }
  }
  cx += COLS[1].w;
  /* vigencia · con el aviso de cuánto le queda */
  L.texto(cx + PAD, base, fmt(f.ev.inicio) || "—", {tam:8, col:TINTA});
  L.texto(cx + PAD, base - 9.4, fmt(f.ev.fin) || "—", {tam:8, col:TINTA});
  if(f.dias){
    const cd = f.vg.estado === "v_vencida" ? "#8C2323" : f.vg.estado === "v_porvencer" ? "#8A5406" : GRIS;
    L.texto(cx + PAD, base - 18.4, f.dias, {tam:6.4, neg:f.vg.estado !== "v_vigente", col:cd, max:COLS[2].w - PAD*2});
  }
  cx += COLS[2].w;
  /* estado: pastilla de color, siempre en una línea */
  const anchoP = Math.min(COLS[3].w - PAD * 2, pdfAncho(f.t.etq, f.tamEst, true) + 17);
  const py0 = y - PAD - 11.4;
  L.redondo(cx + PAD, py0, anchoP, 12.4, 6.2, f.t.fondo);
  L.redondo(cx + PAD + 5.4, py0 + 4.4, 3.6, 3.6, 1.8, f.t.punto);
  L.texto(cx + PAD + 12.6, py0 + 3.9, f.t.etq, {tam:f.tamEst, neg:true, col:f.t.texto});
  if(f.antes) L.texto(cx + PAD + 1, py0 - 8.4, f.antes, {tam:7, col:GRIS, max:COLS[3].w - PAD*2});
  cx += COLS[3].w;
  /* pantallas */
  let py = base;
  f.lPant.forEach(l => { L.texto(cx + PAD, py, l, {tam:7.4, col:f.ubs.length ? TINTA : GRIS2}); py -= 9.2; });
  cx += COLS[4].w;
  /* valores */
  const dx = cx + COLS[5].w - PAD;
  if(!f.hayVal){
    L.texto(dx, base, "—", {tam:8, col:GRIS2, al:"der"});
  } else {
    L.texto(dx, base, money(f.val.total), {tam:8.6, neg:true, col:TINTA, al:"der"});
    L.texto(dx, base - 9.6, "mes " + rango(f.val.mes, f.val.mesMax), {tam:6.6, col:GRIS, al:"der"});
    L.texto(dx, base - 18, "spot " + rango(f.val.spot, f.val.spotMax, true), {tam:6.6, col:GRIS, al:"der"});
    if(f.val.faltan) L.texto(dx, base - 26.4, `${f.val.faltan} sin valor`, {tam:6.4, col:GRIS2, al:"der"});
  }
}

function pdfEncabezadoTabla(L, y){
  L.rect(MG, y - ALTO_TH, ANCHO_CUERPO, ALTO_TH, TINTA);
  let cx = MG;
  for(const c of COLS){
    const ls = c.t.toUpperCase().split("\n");
    let ty = y - ALTO_TH / 2 + (ls.length - 1) * 4 - 2.4;
    for(const l of ls){ L.texto(cx + PAD, ty, l, {tam:6.9, neg:true, col:"#FFFFFF", max:c.w - PAD*2}); ty -= 8; }
    cx += c.w;
  }
  return y - ALTO_TH;
}

/* el mismo aviso de días, más corto para que quepa en la columna */
function textoDiasCorto(v){
  if(!v || v.dias === null) return (v && v.estado === "v_programada" && v.inicio) ? `inicia ${fmt(v.inicio)}` : "";
  if(v.estado === "v_programada") return v.inicio ? `inicia ${fmt(v.inicio)}` : "";
  if(v.dias < 0) return `hace ${Math.abs(v.dias)} día${Math.abs(v.dias) === 1 ? "" : "s"}`;
  if(v.dias === 0) return "termina hoy";
  if(v.dias === 1) return "falta 1 día";
  return `faltan ${v.dias} días`;
}

/* banda que separa un bloque del reporte dentro de la tabla */
function pdfBandaSeccion(L, y, titulo, cuantos){
  const alto = 17;
  L.rect(MG, y - alto, ANCHO_CUERPO, alto, "#E7ECE2");
  L.texto(MG + PAD, y - 11.6, titulo.toUpperCase(), {tam:7.2, neg:true, col:TINTA, max:ANCHO_CUERPO - 120});
  L.texto(HOJA_W - MG - PAD, y - 11.6, `${cuantos} ${cuantos === 1 ? "cliente" : "clientes"}`,
          {tam:7.2, neg:true, col:GRIS, al:"der"});
  return y - alto;
}

    .map(b => ({titulo: b.titulo, filas: pdfFilasReporte(b.filas)}));

    ? "Todo el historial"
    : `Del ${fmt(repDesde) || "inicio"} al ${fmt(repHasta) || "hoy"}`)

  /* resumen por tipo */
  const conVig = grupos.bloques.some(b => b.k === "vig" && b.filas.length);
  const aire = conteoAlAire();
  const orden = grupos.modo === "porvencer" || grupos.modo === "vencidas"
    ? []                                        // ahí las tarjetas de vigencia dicen más
    : ["alta","renovada","extendida","recortada"];
  const cuenta = {alta:0, renovada:0, extendida:0, recortada:0};
  let spots = 0, plata = 0, conPlata = 0;
  for(const f of filas){
    const k = f.ev.tipo === "alta" ? "alta" : f.ev.tipo;
    if(cuenta[k] != null) cuenta[k]++;
    spots += f.spots;
    if(f.val.total !== null){ plata += f.val.total; conPlata++; }
  }
  /* tarjetas de lo que hay en las listas hoy */
  const tarjVig = (conVig || !orden.length) ? [
    {etq:"Al aire hoy",       v: aire.vigente + aire.porvencer, punto:"#8FBF06"},
    {etq:`Por vencer · ${AVISO_DIAS} días`, v: aire.porvencer,  punto:"#E09227"},
    {etq:"Vencidas en lista", v: aire.vencida,                  punto:"#D03B3B"}
  ] : [];

  /* --- paginación --- */
  const TOPE = 704, PISO = 92;
  const paginas = [];
  let L = null, y = 0;
  const nuevaHoja = (primera) => {
    L = pdfLienzo();
    paginas.push(L);
    pdfMembrete(L, sello);
    y = TOPE;
    if(primera){
      L.texto(MG, y - 16, "Reporte de Órdenes de Pauta DOOH", {tam:17, neg:true, col:TINTA});
      L.rect(MG, y - 25, 42, 2.6, LIMA);
      L.texto(MG, y - 40, periodo, {tam:9.5, col:GRIS});
      L.texto(HOJA_W - MG, y - 40,
              `${filas.length} ${filas.length === 1 ? "cliente" : "clientes"} · ${miles(spots)} spots al aire` +
              (conPlata ? ` · ${money(plata)}` : ""),
              {tam:9.5, col:GRIS, al:"der"});
      y -= 56;
      /* tarjetas de resumen */
      const gap = 10, ah = 44;
      if(orden.length){
        const aw = (ANCHO_CUERPO - gap * 3) / 4;
        orden.forEach((k, i) => {
          const t = PDF_TIPO[k], x = MG + i * (aw + gap);
          L.redondo(x, y - ah, aw, ah, 5, "#F5F7F3");
          L.rect(x, y - ah, 3, ah, t.punto);
          L.texto(x + 12, y - 21, String(cuenta[k]), {tam:19, neg:true, col:TINTA});
          L.texto(x + 12, y - 33, t.etq.toUpperCase(), {tam:6.6, neg:true, col:GRIS, max:aw - 20});
        });
        y -= ah + (tarjVig.length ? 10 : 20);
      }
      if(tarjVig.length){
        const aw = (ANCHO_CUERPO - gap * 2) / 3;
        tarjVig.forEach((t, i) => {
          const x = MG + i * (aw + gap);
          L.redondo(x, y - ah, aw, ah, 5, "#F5F7F3");
          L.rect(x, y - ah, 3, ah, t.punto);
          L.texto(x + 12, y - 21, String(t.v), {tam:19, neg:true, col:TINTA});
          L.texto(x + 12, y - 33, t.etq.toUpperCase(), {tam:6.6, neg:true, col:GRIS, max:aw - 20});
        });
        y -= ah + 20;
      }
    }
    y = pdfEncabezadoTabla(L, y);
  };

  nuevaHoja(true);
  if(!filas.length){
    const vacio = grupos.modo === "porvencer" ? `No hay campañas que terminen dentro de ${AVISO_DIAS} días.`
                : grupos.modo === "vencidas"  ? "No hay campañas vencidas en las listas."
                : grupos.modo === "nuevas"    ? "No entraron OP nuevas en el periodo elegido."
                : "No hay movimientos en el periodo ni campañas en las listas.";
    L.redondo(MG, y - 54, ANCHO_CUERPO, 48, 5, "#F5F7F3");
    L.texto(HOJA_W / 2, y - 26, vacio, {tam:10, al:"cen", col:GRIS});
    L.texto(HOJA_W / 2, y - 40, "El reporte incluye las OP del periodo y las campañas que siguen al aire.",
            {tam:8, al:"cen", col:GRIS2});
  }
  let cebra = 0;
  for(const sec of secciones){
    /* la banda del bloque nunca queda sola al pie de la hoja */
    if(secciones.length > 1 || sec.titulo !== "Movimientos del periodo"){
      const primera = sec.filas[0];
      if(y - 17 - (primera ? primera.alto : 0) < PISO){ nuevaHoja(false); }
      y = pdfBandaSeccion(L, y, sec.titulo, sec.filas.length);
      cebra = 0;
    }
    for(const f of sec.filas){
      if(y - f.alto < PISO){ nuevaHoja(false); cebra = 0; }
      if(cebra % 2 === 1) L.rect(MG, y - f.alto, ANCHO_CUERPO, f.alto, CEBRA);
      pdfDibujarFila(L, f, MG, y);
      y -= f.alto;
      L.linea(MG, y, MG + ANCHO_CUERPO, y, LINEA, 0.5);
      cebra++;
    }
  }
  if(filas.length){
    if(y - 22 < PISO) nuevaHoja(false);
    L.rect(MG, y - 22, ANCHO_CUERPO, 22, "#EEF1EC");
    L.texto(MG + PAD, y - 14.4, `TOTAL · ${filas.length} ${filas.length === 1 ? "cliente" : "clientes"}`,
            {tam:8.2, neg:true, col:TINTA});
    L.texto(HOJA_W - MG - PAD, y - 14.4,
            `${miles(spots)} spots al aire${conPlata ? "   ·   " + money(plata) : ""}`,
            {tam:8.2, neg:true, col:TINTA, al:"der"});
    y -= 22;
  }
  /* numeración */
  paginas.forEach((p, i) => {
    p.texto(HOJA_W - MG, 80, `Página ${i+1} de ${paginas.length}`, {tam:7.4, col:GRIS2, al:"der"});
    p.texto(MG, 80, (RO ? "Generado desde Soporte Comercial DOOH" : "Generado desde DOOH - Producción"), {tam:7.4, col:GRIS2});
  });

  return await pdfArmar(paginas.map(p => p.ops.join("\n")));
}

/* --- ensamblado del archivo PDF --- */
async function pdfDesinflar(bytes){
  if(typeof CompressionStream === "undefined") return null;
  try{
    const cs = new CompressionStream("deflate");
    const w = cs.writable.getWriter();
    w.write(bytes); w.close();
    const r = cs.readable.getReader();
    const tr = []; let tot = 0;
    for(;;){ const {done, value} = await r.read(); if(done) break; tr.push(value); tot += value.length; }
    const out = new Uint8Array(tot);
    let o = 0; for(const t of tr){ out.set(t, o); o += t.length; }
    return out;
  }catch(e){ return null; }
}
function pdfBytesDe(s){
  const b = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255;
  return b;
}
async function pdfArmar(contenidos, anotaciones){
  const partes = [], obj = [];
  let pos = 0;
  const put = bytes => { partes.push(bytes); pos += bytes.length; };
  const putStr = s => put(pdfBytesDe(s));
  const nHojas = contenidos.length;
  const idPagina = i => 5 + i * 2;             // 5,7,9…   contenido: 6,8,10…

  putStr("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const escribir = async (num, cuerpo, flujo) => {
    obj[num] = pos;
    if(!flujo){ putStr(`${num} 0 obj\n${cuerpo}\nendobj\n`); return; }
    const crudo = pdfBytesDe(flujo);
    const comp = await pdfDesinflar(crudo);
    const datos = comp || crudo;
    putStr(`${num} 0 obj\n<< /Length ${datos.length}${comp ? " /Filter /FlateDecode" : ""} >>\nstream\n`);
    put(datos);
    putStr("\nendstream\nendobj\n");
  };

  const hijos = contenidos.map((_, i) => `${idPagina(i)} 0 R`).join(" ");
  /* enlaces que se pueden pulsar: cada uno es un objeto aparte, después de las páginas */
  const anot = anotaciones || [];
  let sigId = idPagina(nHojas - 1) + 2;
  const idsAnot = contenidos.map((_, i) => (anot[i] || []).map(() => sigId++));
  const uriPDF = u => {
    let s = String(u || "");
    try{ s = encodeURI(decodeURI(s)); }catch(e){ s = encodeURI(s); }
    return s.replace(/[\\()]/g, m => "\\" + m);
  };
  await escribir(1, "<< /Type /Catalog /Pages 2 0 R >>");
  await escribir(2, `<< /Type /Pages /Count ${nHojas} /Kids [${hijos}] >>`);
  await escribir(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  await escribir(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  for(let i = 0; i < nHojas; i++){
    const annots = idsAnot[i].length ? ` /Annots [${idsAnot[i].map(id => id + " 0 R").join(" ")}]` : "";
    await escribir(idPagina(i),
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${HOJA_W} ${HOJA_H}] ` +
      `/Resources << /Font << /FR 3 0 R /FB 4 0 R >> >> /Contents ${idPagina(i)+1} 0 R${annots} >>`);
    await escribir(idPagina(i) + 1, null, contenidos[i]);
  }
  for(let i = 0; i < nHojas; i++) for(let k = 0; k < idsAnot[i].length; k++){
    const a = anot[i][k];
    await escribir(idsAnot[i][k],
      `<< /Type /Annot /Subtype /Link /Rect [${nf(a.x)} ${nf(a.y)} ${nf(a.x + a.w)} ${nf(a.y + a.h)}] ` +
      `/Border [0 0 0] /A << /S /URI /URI (${uriPDF(a.url)}) >> >>`);
  }
  const total = sigId;                          // último id + 1, más el objeto 0
  const xref = pos;
  let tabla = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i = 1; i < total; i++) tabla += String(obj[i] || 0).padStart(10, "0") + " 00000 n \n";
  putStr(tabla);
  putStr(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  let len = 0; for(const p of partes) len += p.length;
  const out = new Uint8Array(len);
  let o = 0; for(const p of partes){ out.set(p, o); o += p.length; }
  return out;
}

/* --- datos que comparten el Reporte y las Constancias --- */
/* Todas las ubicaciones de esta misma campaña (cliente + campaña) en las 8 pantallas. */
function ubicacionesConstancia(d){
  let refCli = d.cliente, refCamp = d.campana;
  if(d.aqui && d.aqui.id){
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
      if(c.id === d.aqui.id){ refCli = c.cliente; refCamp = c.campana; }
  }
  /* Si la campaña se renombró después (o el movimiento se anotó sin nombre de campaña),
     se busca solo por cliente antes de darla por perdida. */
  const hayEstricto = (() => {
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
      if(mismoTexto(c.cliente, refCli) && mismoTexto(c.campana || "", refCamp || "")) return true;
    return false;
  })();
  const soloCliente = !refCamp || !hayEstricto;
  const out = [];
  for(const p of DB.pantallas){
    let frec = 0, est = null, hay = false;
    for(const s of p.sublistas) for(const c of s.campanas){
      if(!mismoTexto(c.cliente, refCli)) continue;
      if(!soloCliente && !mismoTexto(c.campana || "", refCamp || "")) continue;
      const esta = !!(d.aqui && c.id === d.aqui.id);
      const vista = esta ? {...c, inicio:d.inicio, fin:d.fin, pausada:d.pausada, frec:n(d.frec)} : c;
      frec += n(vista.frec);
      hay = true;
      const e = estado(vista, refDate);
      if(!est || esta) est = e;                 // manda el estado de la que se está editando
    }
    if(hay) out.push({pantalla:p.nombre, frec, est: est || "sinfecha"});
  }
  return out;
}

/* Cuándo quedó registrado el ingreso, según la bitácora. */
function ingresoRegistrado(cliente, campana){
  let prim = null;
  for(const ev of bitacora()){
    if(ev.tipo !== "alta") continue;
    if(!mismoTexto(ev.cliente, cliente)) continue;
    if(campana && ev.campana && !mismoTexto(ev.campana, campana)) continue;
    if(!prim || String(ev.ts) < String(prim.ts)) prim = ev;
  }
  return prim;
}

/* --- nombres de archivo: llevan la información dentro --- */
function slugCon(s, max){
  const t = String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9]+/g, " ").trim().replace(/\s+/g, "-").toUpperCase();
  return t.slice(0, max || 40);
}
/* Correlativo del día: DDMMAAAA-NN, con NN corriendo por fecha. */
function correlativoDe(cuando, lista){
  const p = x => String(x).padStart(2, "0");
  const dia = `${p(cuando.getDate())}${p(cuando.getMonth()+1)}${cuando.getFullYear()}`;
  let alto = 0;
  for(const it of (lista || [])){
    const m = /^(\d{8})-(\d+)$/.exec(it.folio || "");
    if(m && m[1] === dia) alto = Math.max(alto, +m[2]);
  }
  return `${dia}-${p(alto + 1)}`;
}
function nombreConstancia(cliente, campana, cuando, correl){
  const p = x => String(x).padStart(2, "0");
  const f = `${cuando.getFullYear()}${p(cuando.getMonth()+1)}${p(cuando.getDate())}-${p(cuando.getHours())}${p(cuando.getMinutes())}`;
  return `${f}__${slugCon(cliente, 42) || "SIN-CLIENTE"}__${slugCon(campana, 42) || "SIN-CAMPANA"}__${correl}.jpg`;
}
function leerNombre(nombre){
  const m = /^(\d{8})-(\d{4})__(.*?)__(.*?)__([A-Z0-9][A-Z0-9-]{3,17})\.jpe?g$/i.exec(nombre);
  if(!m) return null;
  const [, f, h, cli, camp, folio] = m;
  const fecha = new Date(+f.slice(0,4), +f.slice(4,6)-1, +f.slice(6,8), +h.slice(0,2), +h.slice(2,4));
  if(isNaN(fecha)) return null;
  return {nombre, fecha, iso: `${f.slice(0,4)}-${f.slice(4,6)}-${f.slice(6,8)}`,
          cli, camp: camp === "SIN-CAMPANA" ? "" : camp, folio};
}
async function listarConstancias(){
  if(!dirHandle || !(await permisoCarpeta(false))) return null;
  const out = [];
  try{
    for await (const [nom, h] of dirHandle.entries()){
      if(h.kind !== "file") continue;
      const d = leerNombre(nom);
      if(d) out.push(d);
    }
  }catch(e){ return null; }
  return out.sort((a, b) => b.fecha - a.fecha || a.nombre.localeCompare(b.nombre));
}
async function blobConstancia(nombre){
  if(!dirHandle) return null;
  try{ return await (await dirHandle.getFileHandle(nombre)).getFile(); }catch(e){ return null; }
}
async function borrarConstancias(nombres){
  let n2 = 0;
  for(const nom of nombres){
    try{ await dirHandle.removeEntry(nom); n2++; }catch(e){}
  }
  return n2;
}
async function guardarEnCarpeta(nombre, blob){
  const fh = await dirHandle.getFileHandle(nombre, {create:true});
  await escribirEn(fh, blob);
}
/* Las constancias que ya tiene esta campaña. */
async function constanciasDe(cliente, campana){
  const todas = await listarConstancias();
  if(!todas) return [];
  const a = slugCon(cliente, 42) || "SIN-CLIENTE", b = slugCon(campana, 42);
  return todas.filter(x => x.cli === a && x.camp === b);
}

/* Dibuja el ticket. Se llama dos veces: la primera solo para medir el alto. */
/* colores y nota de cada modalidad en el ticket */
const NEG_TIK = {
  donacion: {b:"#E6E3F8", t:"#39308A", nota:"Pauta otorgada en DONACIÓN. No genera cobro al cliente."},
  canje:    {b:"#FBE4D8", t:"#8A4318", nota:"Pauta acordada como CANJE. No genera cobro en efectivo."},

  bonificacion:{b:"#E3F3E4", t:"#2F7D32", nota:"Pauta BONIFICADA. No genera cobro adicional al cliente."},
};
function pintarTicket(ctx, d, medir){
  const W = T_ANCHO, izq = T_PAD, der = W - T_PAD, anchoU = W - T_PAD * 2;
  let y = 0;
  const on = !medir;

  const texto = (t, x, tam, opc) => {
    opc = opc || {};
    if(on){
      ctx.font = `${opc.neg ? "700 " : ""}${tam}px ${opc.mono ? T_MONO : T_SANS}`;
      ctx.fillStyle = opc.col || "#1B2229";
      ctx.textAlign = opc.al || "left";
      ctx.fillText(t, x, y);
    }
    return tam;
  };
  const medirTexto = (t, tam, opc) => {
    ctx.font = `${opc && opc.neg ? "700 " : ""}${tam}px ${opc && opc.mono ? T_MONO : T_SANS}`;
    return ctx.measureText(t).width;
  };
  const cortar = (t, ancho, tam, opc) => {
    const pal = String(t == null ? "" : t).split(/\s+/).filter(Boolean);
    const out = []; let act = "";
    for(const p of pal){
      const q = act ? act + " " + p : p;
      if(medirTexto(q, tam, opc) <= ancho || !act) act = q;
      else { out.push(act); act = p; }
    }
    if(act) out.push(act);
    return out.length ? out : [""];
  };
  const regla = (tipo) => {
    y += 9;
    if(on){
      ctx.strokeStyle = "#B9C2BE";
      ctx.lineWidth = 1;
      ctx.setLineDash(tipo === "punteada" ? [3, 3] : []);
      ctx.beginPath(); ctx.moveTo(izq, y + 0.5); ctx.lineTo(der, y + 0.5); ctx.stroke();
      if(tipo === "doble"){ ctx.beginPath(); ctx.moveTo(izq, y + 3.5); ctx.lineTo(der, y + 3.5); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    y += tipo === "doble" ? 13 : 10;
  };
  const par = (etq, val, opc) => {
    opc = opc || {};
    y += 13;
    texto(etq, izq, 9.5, {mono:true, col:"#7C8A8E"});
    texto(val, der, 10, {mono:true, neg:true, al:"right", col: opc.col || "#1B2229"});
  };

  /* franja lima y logotipo */
  if(on){ ctx.fillStyle = "#AEE901"; ctx.fillRect(0, 0, W, 5); }
  y = 30;
  if(on) dibujarLogo(ctx, (W - 92) / 2, y - 14, 92);
  y += 12;

  y += 20;
  texto("CONSTANCIA DE PAUTA", W / 2, 13.5, {neg:true, al:"center"});
  y += 16;
  texto("INGRESADA DOOH", W / 2, 13.5, {neg:true, al:"center"});
  y += 6;
  regla("doble");

  par("CORRELATIVO", d.folio);
  par("EMITIDA", `${d.emitida.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"numeric"})} ${relojDe(d.emitida)}`);
  regla("punteada");

  /* cliente y campaña */
  y += 12;
  texto("CLIENTE", izq, 9.5, {mono:true, col:"#7C8A8E"});
  for(const l of cortar(d.cliente || "—", anchoU, 15, {neg:true})){ y += 18; texto(l, izq, 15, {neg:true}); }
  if(d.campana){
    y += 14;
    texto("CAMPAÑA", izq, 9.5, {mono:true, col:"#7C8A8E"});
    for(const l of cortar(d.campana, anchoU, 12)){ y += 15; texto(l, izq, 12); }
  }
  regla("punteada");

  par("VIGENCIA", d.inicio || d.fin ? `${fmt(d.inicio) || "—"} a ${fmt(d.fin) || "—"}` : "sin fechas");
  if(d.dias != null) par("DIAS", `${miles(d.dias)}`);
  if(d.spotsVig != null) par("SPOTS TOTALES", `${miles(d.spotsVig)} en la vigencia`);
  par("INGRESO", d.ingreso || "no consta");
  par("ESTADO", (ETIQ[d.est] || d.est || "").toUpperCase());
  par("ARTE", (ARTE_ETIQ[d.arte] || "").toUpperCase(),
      {col: d.arte === "sin" ? "#C42B2B" : d.arte === "aprob" ? "#9A5E07" : "#4A6B08"});
  regla("punteada");

  /* valores */
  /* la modalidad es de cada pantalla: arriba solo va si cubre TODA la OP */
  const negTodas = d.pantallas.length && d.pantallas.every(u => u.neg && u.neg === d.pantallas[0].neg)
                 ? d.pantallas[0].neg : "";
  const negAlgunas = d.pantallas.filter(u => u.neg);
  if(d.vTotal !== null || negAlgunas.length){
    par("VALOR TOTAL", d.vTotal === null ? "no registrado" : money(d.vTotal));
    if(negTodas) par("MODALIDAD", NEG_ETIQ[negTodas].toUpperCase(), {col: (NEG_TIK[negTodas]||{}).t});
    else if(negAlgunas.length) par("MODALIDAD", "POR PANTALLA", {col:"#8A5406"});
    regla("punteada");
  }

  /* pantallas: cada una con sus spots y su valor */
  const xSpots = izq + 196, hayPlata = d.pantallas.some(u => u.mes !== null && u.mes !== undefined);
  y += 13;
  texto("PANTALLA", izq, 9.5, {mono:true, col:"#7C8A8E"});
  texto("SPOTS/DIA", xSpots, 9.5, {mono:true, col:"#7C8A8E", al:"right"});
  if(hayPlata) texto("VALOR MES", der, 9.5, {mono:true, col:"#7C8A8E", al:"right"});
  y += 4;
  if(!d.pantallas.length){
    y += 14;
    texto("sin pantallas asignadas", izq, 11, {mono:true, col:"#7C8A8E"});
  }
  for(const u of d.pantallas){
    const ls = cortar(u.pantalla, 176, 10.5, {mono:true});
    ls.forEach((l, i) => {
      y += 13.5;
      texto(l, izq, 10.5, {mono:true});
      if(i === 0){
        texto(miles(u.frec), xSpots, 10.5, {mono:true, neg:true, al:"right"});
        if(hayPlata) texto(u.mes === null || u.mes === undefined ? "—" : money(u.mes), der, 10.5, {mono:true, neg:true, al:"right"});
      }
    });
    if(u.spot !== null && u.spot !== undefined){
      y += 11;
      texto(moneySpot(u.spot) + " / spot", izq + 10, 9, {mono:true, col:"#7C8A8E"});
    }
    /* la modalidad de esta pantalla, cuando la tiene */
    if(u.neg){
      y += 11;
      texto(NEG_ETIQ[u.neg].toUpperCase(), izq + 10, 9,
            {mono:true, neg:true, col: (NEG_TIK[u.neg] || {}).t || "#8A5406"});
    }
  }
  regla();
  y += 13;
  texto(`TOTAL  ${d.pantallas.length} pantalla${d.pantallas.length === 1 ? "" : "s"}`, izq, 10.5, {mono:true, neg:true});
  texto(`${miles(d.spots)}/dia`, xSpots, 10, {mono:true, neg:true, al:"right"});
  if(hayPlata && d.vTotal !== null) texto(money(d.vTotal), der, 12, {mono:true, neg:true, al:"right"});
  y += 6;

  /* aviso del arte */
  if(d.arte){
    const col = d.arte === "sin" ? {b:"#FBE2E2", t:"#8C2323"} : {b:"#FBE9D2", t:"#8A5406"};
    const ls = cortar(ARTE_NOTA[d.arte], anchoU - 20, 10.5);
    const alto = 14 + (ls.length + 1) * 14;
    y += 12;
    if(on){ ctx.fillStyle = col.b; ctx.fillRect(izq, y, anchoU, alto); }
    y += 17;
    texto("* " + (ARTE_ETIQ[d.arte] || "").toUpperCase() + " *", W / 2, 11, {neg:true, al:"center", col:col.t});
    for(const l of ls){ y += 14; texto(l, W / 2, 10.5, {al:"center", col:col.t}); }
    y += 10;
  }

  /* versiones del arte que ya están cargadas */
  if(d.versiones && d.versiones.length){
    regla("punteada");
    y += 13;
    texto("VERSIONES DEL ARTE", izq, 9.5, {mono:true, col:"#7C8A8E"});
    for(const v of d.versiones){
      const e = estadoVersion(v, refDate);
      const cv = VER_COL[e] || VER_COL.sinfecha;
      const ls = cortar(v.titulo || "(sin nombre)", anchoU - 74, 11, {mono:true});
      ls.forEach((l, i) => {
        y += 14;
        texto(l, izq, 11, {mono:true});
        if(i === 0) texto((VER_ETIQ[e] || e).toUpperCase(), der, 9, {neg:true, al:"right", col:cv});
      });
      y += 12;
      texto(`${fmt(v.inicio) || "—"} a ${fmt(v.fin) || "—"}`, izq + 10, 9.5, {mono:true, col:"#7C8A8E"});
    }
    y += 4;
  }

  if(negTodas || negAlgunas.length){
    const cn = negTodas ? (NEG_TIK[negTodas] || {b:"#EEF1F2", t:"#4A5A5F",
                nota: "Modalidad " + String(NEG_ETIQ[negTodas] || negTodas).toUpperCase() + "."})
             : {b:"#FBF0DC", t:"#8A5406",
                nota: "Modalidad por pantalla: " + negAlgunas.map(u =>
                  `${u.pantalla} en ${NEG_ETIQ[u.neg].toUpperCase()}`).join("; ") +
                  ". Las demás pantallas son pauta comercial."};
    const nota = cn.nota;
    const ls = cortar(nota, anchoU - 22, 10.5, {neg:true});
    const alto = 14 + ls.length * 14;
    y += 12;
    if(on){ ctx.fillStyle = cn.b; ctx.fillRect(izq, y, anchoU, alto); }
    for(const l of ls){ y += 14; texto(l, W / 2, 10.5, {al:"center", neg:true, col:cn.t}); }
    y += 12;
  }

  regla("punteada");
  /* avisos de pie */
  y += 6;
  for(const l of cortar("Generado electrónicamente de forma automática desde la OP enviada por COMERCIAL a PRODUCCIÓN.", anchoU, 9.5)){
    y += 12; texto(l, W / 2, 9.5, {al:"center", col:"#7C8A8E"});
  }
  y += 6;
  for(const l of cortar("Esta imagen es garantía única solo para USO INTERNO, más no para clientes ni contabilidad.", anchoU, 9.5, {neg:true})){
    y += 12; texto(l, W / 2, 9.5, {al:"center", neg:true, col:"#8C2323"});
  }
  y += 20;
  texto("Lo que muestras importa", W / 2, 12, {al:"center", col:"#1B2229", neg:true});
  y += 18;

  /* franja lima de cierre */
  if(on){ ctx.fillStyle = "#AEE901"; ctx.fillRect(0, y, W, 5); }
  return y + 5;
}

async function ticketJPG(d){
  const lienzo = document.createElement("canvas");
  lienzo.width = T_ANCHO * T_ESC; lienzo.height = 4000 * T_ESC;
  let ctx = lienzo.getContext("2d");
  ctx.scale(T_ESC, T_ESC);
  const alto = Math.ceil(pintarTicket(ctx, d, true));

  const fin = document.createElement("canvas");
  fin.width = Math.round(T_ANCHO * T_ESC); fin.height = Math.round(alto * T_ESC);
  ctx = fin.getContext("2d");
  ctx.scale(T_ESC, T_ESC);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, T_ANCHO, alto);
  ctx.textBaseline = "alphabetic";
  pintarTicket(ctx, d, false);

  const blob = await new Promise(res => fin.toBlob(res, "image/jpeg", 0.72));
  return {blob, w: fin.width, h: fin.height};
}

/* Reúne los datos de la campaña que se están viendo en el editor. */
function datosConstancia(d){
  const ubs = ubicacionesConstancia(d);
  /* precio de cada pantalla; el de la que se está editando sale de la ventana */
  const vv = valoresCliente(d.cliente, d.campana);
  for(const u of ubs){
    const fila = vv.filas.find(x => x.pantalla === u.pantalla);
    u.mes  = fila ? fila.mes  : null;
    u.spot = fila ? fila.spot : null;
    if(d.aqui && u.pantalla === d.aqui.pantalla){
      u.mes  = num(d.vMes);
      u.spot = num(d.vSpot);
    }
  }
  const ing = ingresoRegistrado(d.cliente, d.campana);
  const di = parseISO(d.inicio), df = parseISO(d.fin);
  return {
    cliente: d.cliente, campana: d.campana, inicio: d.inicio, fin: d.fin,
    arte: ARTE_ETIQ[d.arte] != null ? d.arte : "",
    dias: (di && df) ? days(di, df) + 1 : null,
    est: estado({inicio:d.inicio, fin:d.fin, pausada:d.pausada}, refDate),
    ingreso: ing ? (() => { const t = new Date(ing.ts);
      return `${t.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"2-digit"})} ${relojDe(t)}`; })() : null,
    pantallas: ubs,
    spots: ubs.reduce((a, u) => a + u.frec, 0),
    spotsVig: spotsVigencia(ubs, d.inicio, d.fin),
    vTotalCalc: (() => {
      if(vv.override !== null && vv.override !== undefined) return vv.override;   // total escrito a mano
      const c2 = ubs.filter(u => u.mes !== null && u.mes !== undefined);
      return c2.length ? c2.reduce((a, u) => a + u.mes, 0) : null; })(),
    versiones: (d.versiones || []).filter(v => v && (v.titulo || v.inicio || v.fin)),
    neg: negDe({neg: d.neg}),
    emitida: new Date(),
    folio: ""            // el correlativo se asigna al guardar, ya con la lista a la vista
  };
}

/* ============ generar y guardar ============ */
async function generarConstancia(datos, alTerminar, opc){
  const auto = !!(opc && opc.auto);
  if(!datos.cliente){ toast("Falta el nombre del cliente"); return; }
  if(!HAS_DIR){ toast("Este navegador no permite guardar en una carpeta"); return; }
  if(!dirHandle || !(await permisoCarpeta(true))){
    if(auto && !dirHandle){ toast("Conecta la carpeta de constancias para que se genere la constancia"); return; }
    if(!confirm("Las constancias se guardan como imágenes .jpg dentro de una carpeta tuya.\n\n" +
                "Elige una sola vez la carpeta \"Constancias de pauta DOOH\" y de ahí en adelante " +
                "todas se guardan solas ahí.\n\n¿Elegir la carpeta ahora?")) return;
    if(!(await pedirCarpeta())) return;
    if(!(await permisoCarpeta(true))) return;
  }
  const todas = (await listarConstancias()) || [];
  const ca = slugCon(datos.cliente, 42) || "SIN-CLIENTE", cb = slugCon(datos.campana, 42);
  const previas = todas.filter(x => x.cli === ca && x.camp === cb);
  if(!auto && previas.length && !confirm(
      `Esta campaña ya tiene ${previas.length} constancia${previas.length === 1 ? "" : "s"} guardada${previas.length === 1 ? "" : "s"}.\n\n` +
      `Se generará una nueva constancia. La anterior NO se borra: quedan las dos en la galería.\n\n¿Continuar?`)) return;

  const d = datosConstancia(datos);
  d.vTotal = d.vTotalCalc;
  d.folio = correlativoDe(d.emitida, todas);
  const {blob} = await ticketJPG(d);
  const nombre = nombreConstancia(d.cliente, d.campana, d.emitida, d.folio);
  await guardarEnCarpeta(nombre, blob);
  toast(auto ? `Constancia ${d.folio} generada` : `Constancia guardada en ${dirNombre}`);
  if(alTerminar) await alTerminar(nombre);
}

/* ============ tira de miniaturas dentro de Editar campaña ============ */
async function pintarMiniaturas(cont, cliente, campana){
  if(!cont) return;
  if(!HAS_DIR){ cont.innerHTML = `<span class="hint">Este navegador no permite guardar en carpetas.</span>`; return; }
  if(!dirHandle){
    cont.innerHTML = RO
      ? `<button type="button" class="btn sm ghost" data-elegir="1">Elegir carpeta de constancias</button>
         <div class="hint" style="margin-top:5px">Apunta a la carpeta "Constancias de pauta DOOH" para ver las imágenes.</div>`
      : `<span class="hint">Sin carpeta de constancias conectada. Se te pedirá al generar la primera.</span>`;
    const be = cont.querySelector("[data-elegir]");
    if(be) be.onclick = async () => { if(await pedirCarpeta()) pintarMiniaturas(cont, cliente, campana); };
    return;
  }
  if(!(await permisoCarpeta(false))){
    cont.innerHTML = `<button type="button" class="btn sm ghost" data-recon="1">Conectar carpeta de constancias</button>`;
    cont.querySelector("[data-recon]").onclick = async () => {
      if(await permisoCarpeta(true)) pintarMiniaturas(cont, cliente, campana);
    };
    return;
  }
  const lista = await constanciasDe(cliente, campana);
  if(!lista.length){ cont.innerHTML = `<span class="hint">Todavía no hay constancias de esta campaña.</span>`; return; }
  cont.innerHTML = `<div class="minis"></div>`;
  const tira = cont.querySelector(".minis");
  for(const it of lista){
    const f = await blobConstancia(it.nombre);
    const cel = document.createElement("div");
    cel.className = "mini"; cel.title = it.nombre;
    cel.innerHTML = `
      <button type="button" class="mimg">${f ? `<img src="${urlDe(f)}" alt="">` : `<div class="mfalta">no está</div>`}</button>
      <span>${esc(it.folio)}<br>${it.fecha.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"2-digit"})} ${relojDe(it.fecha)}</span>
      ${f ? `<button type="button" class="mdl" title="Descargar .jpg">Descargar</button>` : ""}`;
    cel.querySelector(".mimg").onclick = () => verConstancia(it, () => pintarMiniaturas(cont, cliente, campana));
    const bdl = cel.querySelector(".mdl");
    if(bdl) bdl.onclick = () => dl(f, it.nombre);
    tira.appendChild(cel);
  }
}

/* ============ ver una constancia en grande ============ */
/* Ventana flotante: no toca la ventana que ya esté abierta detrás. */
async function verConstancia(it, alCambiar){
  const f = await blobConstancia(it.nombre);
  document.getElementById("lbox")?.remove();
  const lb = document.createElement("div");
  lb.id = "lbox";
  lb.innerHTML = `
    <div class="lbin" role="dialog" aria-label="Constancia ${esc(it.folio)}">
      <div class="lbh"><b>Constancia ${esc(it.folio)}</b>
        <span>${it.fecha.toLocaleDateString("es-SV")} · ${relojDe(it.fecha)}</span>
        <button class="btn sm ghost" data-cerrar>Cerrar</button></div>
      <div class="lbimg">${f ? `<img src="${urlDe(f)}" alt="Constancia">`
                             : `<p class="empty">El archivo ya no está en la carpeta.</p>`}</div>
      <div class="lbf">
        <span class="hint">${esc(it.nombre)}</span>
        ${f ? `<button class="btn sm" data-dl>Descargar .jpg</button>` : ""}
        ${f && !RO ? `<button class="btn sm alerta" data-del>Eliminar</button>` : ""}
      </div>
    </div>`;
  document.body.appendChild(lb);
  const cerrar = () => { lb.remove(); document.removeEventListener("keydown", esc2); };
  const esc2 = ev => { if(ev.key === "Escape"){ ev.stopPropagation(); cerrar(); } };
  document.addEventListener("keydown", esc2);
  lb.onclick = ev => { if(ev.target === lb) cerrar(); };
  lb.querySelector("[data-cerrar]").onclick = cerrar;
  const bd = lb.querySelector("[data-dl]");
  if(bd) bd.onclick = () => dl(f, it.nombre);
  const bx = lb.querySelector("[data-del]");
  if(bx) bx.onclick = async () => {
    if(!confirm(`Se va a eliminar la constancia ${it.folio} de la carpeta.\n\nEsto no se puede deshacer.\n\n¿Eliminar?`)) return;
    await borrarConstancias([it.nombre]);
    toast("Constancia eliminada");
    cerrar();
    if(alCambiar) await alCambiar();
  };
}

let galDesde = null, galHasta = null, galBusca = "";
async function modalGaleria(){
  const m = document.getElementById("modal");
  m.className = "modal ancho";
  const lista = await listarConstancias();

  if(!HAS_DIR || lista === null){
    m.innerHTML = `
      <div class="mh"><h3>Constancias de OP</h3></div>
      <div class="mb">
        <p class="empty" style="margin:6px 0">${!HAS_DIR
          ? "Este navegador no permite trabajar con carpetas. Usa Chrome o Edge."
          : dirHandle
            ? `La carpeta <b>${esc(dirNombre)}</b> está recordada pero falta autorizarla en esta sesión.`
            : "Las constancias se guardan como imágenes .jpg dentro de una carpeta tuya. Elígela una sola vez y todas se guardarán ahí."}</p>
      </div>
      <div class="mf">
        ${HAS_DIR ? `<button class="btn primary" id="gal_con">${dirHandle ? "Conectar carpeta" : "Elegir carpeta"}</button>` : ""}
