/* ---------------- persistencia ----------------
   Única fuente de verdad: el archivo .json en disco (carpeta de Drive, OneDrive,
   red, etc.). Requiere Chrome o Edge. El navegador NO almacena información:
   lo único que queda guardado es un puntero al archivo elegido (IndexedDB),
   para poder reconectarlo con un clic. Sin archivo conectado no se guarda nada. */
const HAS_FSA = typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function";
let fileHandle = null;
let fileName = "";
let fileMtime = 0;                 // lastModified conocido del archivo
const HKEY = RO ? "handle_ro" : "handle";   // Soporte Comercial recuerda su propio archivo
const PMODE = "readwrite";      // Soporte Comercial solo escribe los valores de la pauta
let fsState = HAS_FSA ? "local" : "nosoportado";   // local | conectado | permiso | nosoportado
let writing = false, pendingWrite = false;
let sinPermisoEscritura = false;   // conectado, pero Chrome solo dio lectura
let bloqueado = false;            // hay un archivo recordado que todavía no se ha leído

/* --- IndexedDB mínimo: recuerda cuál archivo elegiste --- */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("vnnox_fs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  try{
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const q = db.transaction("kv","readonly").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  }catch(e){ return undefined; }
}
async function idbSet(k, v){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const q = db.transaction("kv","readwrite").objectStore("kv").put(v, k);
      q.onsuccess = () => res(); q.onerror = () => rej(q.error);
    });
  }catch(e){}
}

/* ============================================================
   Escritura a prueba de Google Drive
   En una unidad de Drive, Chrome escribe primero en un archivo temporal
   (.crswap) al lado y luego lo renombra encima del original. Ese paso
   falla cada tanto —mientras Drive sincroniza, o si el archivo está
   abierto en otro programa o en otra pestaña— con el error
   "the state of the underlying filesystem".

   Qué hacemos:
   1) todas las escrituras van en fila, de una en una (los dos tableros
      escriben en el mismo archivo);
   2) se reintenta cuatro veces con esperas cortas, porque casi siempre
      es cosa de un momento;
   3) si aun así no pasa, se prueba el modo "exclusive", que escribe
      directo sin archivo temporal. Ese modo va de último a propósito:
      el normal es atómico y nunca deja el archivo a medias.
   ============================================================ */
const REINTENTOS = [0, 300, 900, 2000];     // esperas antes de cada intento
let filaEscritura = Promise.resolve();      // una escritura a la vez, en orden

function enFila(tarea){
  const t = filaEscritura.then(tarea, tarea);
  filaEscritura = t.then(() => {}, () => {});
  return t;
}
/* ¿es el error de "el archivo está ocupado / el disco no deja"? */
function esErrorDeDisco(e){
  const n2 = (e && e.name) || "", m = ((e && e.message) || "").toLowerCase();
  return n2 === "NoModificationAllowedError" || n2 === "InvalidStateError" ||
         n2 === "AbortError" || m.includes("underlying filesystem") ||
         m.includes("state of the") || m.includes("lock") || m.includes("busy");
}
function esErrorDePermiso(e){
  const n2 = (e && e.name) || "";
  return n2 === "NotAllowedError" || n2 === "SecurityError" || (e && e.__permiso);
}
function esErrorDeArchivoPerdido(e){
  return ((e && e.name) || "") === "NotFoundError";
}
/* Mensaje en español, accionable, para cualquier fallo de escritura. */
function motivoEscritura(e){
  if(esErrorDePermiso(e))        return "el navegador no tiene permiso para editar el archivo";
  if(esErrorDeArchivoPerdido(e)) return "el archivo ya no está donde estaba: vuelve a conectarlo";
  if(esErrorDeDisco(e))          return "el sistema no dejó escribir el archivo. Puede ser que el " +
                                        "navegador lo tenga abierto solo para leer, que esté abierto " +
                                        "en otro programa, o que Google Drive lo esté sincronizando";
  return (e && e.message) || "no se pudo escribir";
}
/* Detalle técnico del último fallo, para poder diagnosticarlo. */
let ultimoFallo = null;
function detalleFallo(){
  if(!ultimoFallo) return "";
  return `${ultimoFallo.name || "Error"}: ${ultimoFallo.message || ""}`
       + ` · ${ultimoFallo.intentos} intento(s)`
       + ` · permiso: ${ultimoFallo.perm}`
       + ` · archivo: ${fileName || "—"}`;
}
/* Pide permiso de escritura si hace falta. Solo funciona dentro de un clic. */
async function permisoEscritura(handle){
  if(!handle || !handle.queryPermission) return true;
  let p = "granted";
  try{ p = await handle.queryPermission({mode:"readwrite"}); }catch(e){}
  if(p === "granted") return true;
  try{ p = await handle.requestPermission({mode:"readwrite"}); }catch(e){}
  if(p === "granted") return true;
  const err = new Error("falta permiso de escritura"); err.__permiso = true; throw err;
}
/* Un intento. El modo normal es atómico: si algo falla, el archivo original
   queda intacto. El modo exclusive escribe encima y luego recorta al tamaño
   nuevo, para que el archivo nunca quede vacío en medio de la operación. */
async function unaEscritura(handle, cuerpo, tam, exclusivo){
  let w;
  if(exclusivo) w = await handle.createWritable({mode:"exclusive", keepExistingData:true});
  else          w = await handle.createWritable();
  try{
    if(exclusivo){
      await w.write({type:"write", position:0, data:cuerpo});
      await w.truncate(tam);          // recorta lo que sobraba del contenido anterior
    } else {
      await w.write(cuerpo);
    }
    await w.close();
    return true;
  }catch(e){
    try{ await w.abort(); }catch(e2){}
    throw e;
  }
}
/* Escribe `datos` (texto, Blob o Uint8Array) en `handle`. Lanza si no pudo. */
function escribirEn(handle, datos){
  return enFila(async () => {
    if(!handle) throw new Error("sin archivo");
    await permisoEscritura(handle);
    /* los datos van tal cual: texto, Blob o Uint8Array */
    const tam = (typeof datos === "string") ? new Blob([datos]).size
              : (datos instanceof Blob ? datos.size
              : (datos && (datos.byteLength != null ? datos.byteLength : datos.length)) || 0);
    let ultimo = null, intentos = 0;
    for(let i = 0; i < REINTENTOS.length; i++){
      if(REINTENTOS[i]) await new Promise(r => setTimeout(r, REINTENTOS[i]));
      intentos++;
      try{ return await unaEscritura(handle, datos, tam, false); }
      catch(e){
        ultimo = e;
        if(!esErrorDeDisco(e)) break;         // permiso o archivo perdido: no insistir
      }
    }
    /* último recurso: escribir directo, sin archivo temporal */
    if(esErrorDeDisco(ultimo)){
      intentos++;
      try{ return await unaEscritura(handle, datos, tam, true); }
      catch(e){ ultimo = e; }
    }
    let perm = "?";
    try{ perm = await handle.queryPermission({mode:"readwrite"}); }catch(e){}
    ultimoFallo = {name:(ultimo && ultimo.name) || "Error",
                   message:(ultimo && ultimo.message) || "", intentos, perm};
    if(perm !== "granted") sinPermisoEscritura = true;
    try{ console.warn("[VNNOX] no se pudo escribir ·", detalleFallo()); }catch(e){}
    throw ultimo || new Error("no se pudo escribir");
  });
}


/* ---------- recuperación cuando no se pudo guardar ----------
   Casi siempre es que el navegador abrió el archivo solo para leer. Se ofrece
   arreglarlo en un clic: pedir el permiso, o volver a elegir el archivo, y
   reintentar lo que se estaba guardando. */
function bloqueReintento(idMsg, r, reintentar){
  const msg = document.getElementById(idMsg);
  if(!msg) return;
  msg.style.color = "var(--critical)";
  msg.innerHTML = `No se pudo guardar: ${esc(r.motivo || "")}
    <button type="button" class="btn sm primary" id="rt_perm" style="margin-left:8px">Dar permiso y guardar</button>
    <button type="button" class="btn sm ghost" id="rt_pick" style="margin-left:6px">Elegir el archivo otra vez</button>
    <button type="button" class="btn sm ghost" id="rt_det" style="margin-left:6px">Ver detalle</button>`;
  const otra = async (arreglar) => {
    const ok = await arreglar();
    if(!ok){ msg.insertAdjacentHTML("beforeend",
      `<div style="margin-top:6px">Sigue sin permiso de edición. Pídele a quien administra la carpeta
       de Drive que te deje editarla.</div>`); return; }
    msg.style.color = "";
    msg.textContent = "Permiso concedido · guardando…";
    await reintentar();
  };
  const bp = document.getElementById("rt_perm");
  if(bp) bp.onclick = () => otra(pedirPermisoEscritura);
  const bk = document.getElementById("rt_pick");
  if(bk) bk.onclick = () => otra(reelegirArchivo);
  const bd = document.getElementById("rt_det");
  if(bd) bd.onclick = () => {
    bd.remove();
    msg.insertAdjacentHTML("beforeend",
      `<div class="hint" style="margin-top:6px;word-break:break-word">${esc(detalleFallo())}</div>`);
  };
}

function valido(d){ return d && Array.isArray(d.pantallas) && d.pantallas.length; }
function hhmm(){ return new Date().toLocaleTimeString("es-SV",{hour:"2-digit",minute:"2-digit"}); }
/* Limpia cualquier copia que versiones anteriores hubieran dejado en el navegador. */
function limpiarNavegador(){
  try{ [KEY, KEY + "_lastsave", KEY + "_theme"].forEach(k => localStorage.removeItem(k)); }catch(e){}
}

const VACIO = () => ({version:1, spotsPorHora:SPOTS_HORA, minHoras:MIN_HORAS_DEF, pantallas:[]});

async function initStorage(){
  limpiarNavegador();
  DB = VACIO(); normalize();
  if(!HAS_FSA){
    if(!RO){ DB = JSON.parse(JSON.stringify(SEED)); normalize(); }
    return;
  }
  const saved = await idbGet(HKEY);
  if(!saved){
    // primera vez: el editor arranca con la foto del Excel para poder crear el archivo
    if(!RO){ DB = JSON.parse(JSON.stringify(SEED)); normalize(); }
    fsState = "local";
    return;
  }
  fileHandle = saved;
  fileName = saved.name || "datos.json";
  let perm = "prompt";
  try{ perm = await fileHandle.queryPermission({mode:PMODE}); }catch(e){ perm = "prompt"; }
  if(perm === "granted"){
    fsState = "conectado";
    sinPermisoEscritura = false;
    if(await leerArchivo(true)) bloqueado = false;
    else { bloqueado = true; fsState = "permiso"; }   // nunca sustituir el archivo por datos viejos
  } else {
    fsState = "permiso";
    bloqueado = true;
  }
}

async function leerArchivo(silencioso){
  if(!fileHandle) return false;
  try{
    const f = await fileHandle.getFile();
    const txt = (await f.text()).trim();
    if(txt){
      const d = JSON.parse(txt);
      if(!valido(d)) throw new Error("El archivo no tiene el formato del dashboard.");
      DB = d; normalize();
    }
    fileMtime = f.lastModified;
    if(RO) registrarRespaldo();
    if(!silencioso) toast("Datos cargados de " + fileName);
    return true;
  }catch(e){
    if(!silencioso) alert("No se pudo leer el archivo de datos.\n\n" + (e.message || e));
    return false;
  }
}

async function escribirArchivo(){
  if(RO || fsState !== "conectado" || !fileHandle) return;
  if(writing){ pendingWrite = true; return; }
  writing = true;
  try{
    /* Soporte Comercial también escribe en este archivo (crea OP nuevas): se
       relee antes de guardar para no borrar lo que haya dejado mientras tanto */
    let trajo = 0;
    try{ trajo = opnUnirConDisco(JSON.parse(await (await fileHandle.getFile()).text())); }catch(e0){}
    await escribirEn(fileHandle, JSON.stringify(DB, null, 1));
    if(trajo && document.getElementById("ov").hidden) setTimeout(render, 0);
    fileMtime = (await fileHandle.getFile()).lastModified;
    cambiosSinArchivo = false;
    registrarRespaldo();
    const txt = subUltimo(false);
    const espera = Math.max(0, ESPERA_VERDE - (Date.now() - tAmarillo));
    clearTimeout(tVerde);
    tVerde = setTimeout(() => sem("verde","Respaldado", txt), espera);
  }catch(e){
    /* solo se pierde la conexión si es cosa de permiso o el archivo se movió;
       si Drive estaba ocupado seguimos conectados y se puede reintentar */
    if(esErrorDePermiso(e) || esErrorDeArchivoPerdido(e)) fsState = "permiso";
    cambiosSinArchivo = true;
    sem("rojo","No se pudo guardar", motivoEscritura(e));
    renderFsBar();
    toast("No se pudo guardar: " + motivoEscritura(e));
  }
  writing = false;
  if(pendingWrite){ pendingWrite = false; escribirArchivo(); }
}

/* Soporte Comercial solo puede tocar los importes. Relee el archivo, aplica únicamente
   esos campos sobre lo que hay en disco y lo vuelve a escribir. Nada más cambia. */
/* Motor común de escritura de Soporte Comercial: relee el archivo, deja que "aplicar"
   toque solo lo permitido y lo vuelve a escribir. Devuelve cuántas cosas cambió. */
async function escribirComoVisor(aplicar){
  if(fsState !== "conectado" || !fileHandle) return {ok:false, motivo:"sin archivo"};
  try{
    const fresco = JSON.parse(await (await fileHandle.getFile()).text());
    if(!valido(fresco)) return {ok:false, motivo:"el archivo no se pudo leer"};
    const tocadas = aplicar(fresco);
    if(!tocadas) return {ok:false, motivo:"no había nada que cambiar"};
    sem("amarillo","Guardando…","Escribiendo en el archivo…");
    await escribirEn(fileHandle, JSON.stringify(fresco, null, 1));
    fileMtime = (await fileHandle.getFile()).lastModified;
    DB = fresco; normalize();
    registrarRespaldo();
    const txt = subUltimo(false);
    clearTimeout(tVerde);
    tVerde = setTimeout(() => sem("verde", RO ? "Valores guardados" : "Respaldado", txt),
                        Math.max(0, ESPERA_VERDE - (Date.now() - tAmarillo)));
    return {ok:true, n:tocadas};
  }catch(e){
    if(esErrorDePermiso(e) || esErrorDeArchivoPerdido(e)) fsState = "permiso";
    sem("rojo","No se pudo guardar", motivoEscritura(e));
    renderFsBar();
    return {ok:false, motivo: motivoEscritura(e), disco: esErrorDeDisco(e), err:e};
  }
}
/* Soporte Comercial solo puede tocar los importes. */
async function guardarValores(cambios){
  if(!cambios || !cambios.size) return {ok:true, n:0};
  return escribirComoVisor(fresco => {
    let tocadas = 0;
    for(const p of fresco.pantallas) for(const s2 of p.sublistas) for(const c of s2.campanas){
      const cb = cambios.get(c.id);
      if(!cb) continue;
      if("vMes"   in cb) cb.vMes   === null ? delete c.vMes   : (c.vMes   = cb.vMes);
      if("vSpot"  in cb) cb.vSpot  === null ? delete c.vSpot  : (c.vSpot  = cb.vSpot);
      if("vTotal" in cb) cb.vTotal === null ? delete c.vTotal : (c.vTotal = cb.vTotal);
      if("neg"    in cb) cb.neg ? (c.neg = cb.neg) : delete c.neg;
      tocadas++;
    }
    return tocadas;
  });
}

let saveTimer = null;
function save(){
  if(RO || bloqueado) return;
  normalize();
  clearTimeout(saveTimer);
  if(fsState === "conectado") sem("amarillo","Guardando…","Escribiendo en el archivo…");
  else { cambiosSinArchivo = true; sem("rojo","Sin respaldo", subUltimo(true)); }
  saveTimer = setTimeout(() => {
    if(fsState === "conectado") escribirArchivo();
  }, 250);
}
/* Semáforo de guardado: rojo = sin respaldar en el archivo, amarillo = escribiendo,
   verde = escrito en el archivo. */
let cambiosSinArchivo = false;
let ultimoRespaldo = null;                 // marca de tiempo del último respaldo escrito

/* La fecha del último respaldo la da el archivo mismo, no el navegador. */
function registrarRespaldo(){
  ultimoRespaldo = (fileMtime > 946684800000) ? new Date(fileMtime) : new Date();
}
function relojDe(d){ return d.toLocaleTimeString("es-SV",{hour:"2-digit",minute:"2-digit"}); }
function diaDe(d){
  const hoy = new Date(), ayer = new Date(hoy.getTime() - 86400000);
  const igual = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(igual(d,hoy)) return "hoy";
  if(igual(d,ayer)) return "ayer";
  return d.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
/* Subtítulo del semáforo: siempre dice cuándo fue el último respaldo. */
function subUltimo(alerta){
  if(!ultimoRespaldo) return RO ? "Sin lecturas todavía" : "Nunca respaldado · conecta el archivo";
  const base = (RO ? "Última lectura: " : "Último respaldo: ") + diaDe(ultimoRespaldo) + " " + relojDe(ultimoRespaldo);
  if(!alerta) return base;
  const min = Math.floor((Date.now() - ultimoRespaldo.getTime()) / 60000);
  if(min < 1) return base + " · hace menos de 1 min";
  if(min < 60) return base + " · hace " + min + " min";
  const hrs = Math.floor(min/60), res = min % 60;
  if(hrs < 24) return base + " · hace " + hrs + " h" + (res ? " " + res + " min" : "");
  const dias = Math.floor(hrs/24);
  return base + " · hace " + dias + (dias === 1 ? " día" : " días");
}
const ESPERA_VERDE = 2000;          // el amarillo se ve al menos 2 s antes de pasar a verde
let tAmarillo = 0, tVerde = null;
function sem(estado, titulo, detalle){
  const el = document.getElementById("sem");
  if(!el) return;
  if(estado !== "verde") clearTimeout(tVerde);      // cualquier estado nuevo cancela el verde pendiente
  if(estado === "amarillo") tAmarillo = Date.now();
  el.dataset.s = estado;
  const l = document.getElementById("semlbl"), d = document.getElementById("semsub");
  if(l) l.textContent = titulo;
  if(d) d.textContent = detalle || "";
  el.title = estado === "rojo" ? "Clic para conectar el archivo de datos" : titulo + (detalle ? " — " + detalle : "");
  el.onclick = (estado === "rojo" && !RO) ? conectar : null;
  renderConnBtn();
}
/* Un clic: si ya se eligió el archivo alguna vez, solo re-pide el permiso
   (sin explorador). Únicamente la primera vez abre el selector. */
async function conectar(){
  if(fileHandle) return reconectar();
  const rec = await idbGet(HKEY);
  if(rec){ fileHandle = rec; fileName = rec.name || "datos.json"; return reconectar(); }
  return RO ? abrirDatos() : elegirArchivo();
}
let connSeq = 0;
async function renderConnBtn(){
  const b = document.getElementById("btnconn");
  if(!b) return;
  const bs = document.getElementById("btnsave");   // sin archivo no hay nada que guardar
  b.onclick = conectar;
  if(fsState === "conectado"){ b.hidden = true; if(bs) bs.hidden = false; return; }
  if(bs) bs.hidden = true;
  const me = ++connSeq;
  const rec = fileHandle || await idbGet(HKEY);
  if(me !== connSeq) return;                       // llegó una actualización más nueva
  if(fsState === "conectado"){ b.hidden = true; if(bs) bs.hidden = false; return; }
  const nom = (fileHandle && fileName) || (rec && rec.name) || "";
  b.hidden = false;
  b.className = "btn alerta";
  b.textContent = "Conectar archivo";
  b.title = nom ? "Conectar " + nom + " para respaldar los cambios" : "Elegir el archivo de datos donde se van a respaldar los cambios";
}
function semEstadoActual(){
  if(RO){
    if(fsState === "conectado") sem("verde","Conectado", subUltimo(false));
    else if(DB.pantallas.length) sem("gris","Sin conectar","Copia cargada a mano");
    else sem("gris","Sin conectar","Sin archivo");
    return;
  }
  if(fsState === "conectado") sem("verde","Respaldado", subUltimo(false));
  else sem("rojo", bloqueado ? "Sin conectar" : "Sin respaldo", subUltimo(true));
}

/* Guardado manual: escribe en el archivo de inmediato, sin esperar el automático. */
let guardando = false;
async function guardarAhora(){
  if(RO) return;
  if(fsState !== "conectado"){
    toast("Primero conecta el archivo de datos");
    return conectar();
  }
  if(guardando) return;
  guardando = true;
  const b = document.getElementById("btnsave");
  if(b){ b.disabled = true; b.textContent = "Guardando…"; }
  clearTimeout(saveTimer);
  normalize();
  sem("amarillo","Guardando…","Guardado manual en curso…");
  await escribirArchivo();
  if(b){ b.disabled = false; b.textContent = "Guardar"; }
  guardando = false;
  if(fsState === "conectado") toast("Guardado en " + fileName);
}

/* --- acciones del usuario --- */
function pickerError(e){
  if(e && e.name === "AbortError") return;
  alert("No se pudo abrir el selector de archivos.\n\n" + (e?.message || e) +
        "\n\nEsta función necesita Google Chrome o Microsoft Edge. Mientras tanto el dashboard sigue guardando en este navegador y puedes usar Respaldo JSON / Importar.");
}
async function crearArchivo(){
  try{
    const h = await window.showSaveFilePicker({

/* Soporte Comercial también escribe (valores, cambios, avisos y comentarios),
   así que el archivo se pide con permiso de LECTURA Y ESCRITURA. Si el
   navegador solo concede lectura se avisa de una vez, en lugar de dejar que
   falle al momento de guardar. */
async function abrirDatos(){
  if(HAS_FSA){
    try{
      const [h] = await window.showOpenFilePicker({
        multiple:false, types:[{description:"Datos del dashboard", accept:{"application/json":[".json"]}}]
      });
      let p = "prompt";
      try{ p = await h.requestPermission({mode:"readwrite"}); }catch(e){}
      if(p !== "granted"){
        /* al menos leer, pero dejándolo claro */
        let pr = "prompt";
        try{ pr = await h.requestPermission({mode:"read"}); }catch(e){}
        if(pr !== "granted"){ alert("Se necesita permiso sobre el archivo para poder abrirlo."); return; }
        sinPermisoEscritura = true;
      } else sinPermisoEscritura = false;
      fileHandle = h; fileName = h.name;
      if(!await leerArchivo(false)){ fileHandle = null; fileName = ""; renderFsBar(); return; }
      fsState = "conectado"; bloqueado = false;
      await idbSet(HKEY, h);
      renderFsBar(); render(); semEstadoActual();
      if(sinPermisoEscritura)
        toast("Conectado solo para leer: Chrome no dio permiso de edición. No se podrán guardar cambios.");
      return;
    }catch(e){ if(e && e.name === "AbortError") return; }
  }
  document.getElementById("fileinput").click();   // respaldo: elegir el archivo cada vez
}
/* Pide el permiso de escritura ahora mismo (tiene que ir dentro de un clic).
   Devuelve true si quedó concedido. */
async function pedirPermisoEscritura(){
  if(!fileHandle) return false;
  let p = "prompt";
  try{ p = await fileHandle.queryPermission({mode:"readwrite"}); }catch(e){}
  if(p !== "granted"){
    try{ p = await fileHandle.requestPermission({mode:"readwrite"}); }catch(e){}
  }
  sinPermisoEscritura = (p !== "granted");
  /* el fallo anterior dejó la conexión marcada como "sin permiso": ya se puede volver */
  if(p === "granted" && fileHandle){ fsState = "conectado"; bloqueado = false; }
  renderFsBar();
  return p === "granted";
}
/* Vuelve a elegir el archivo: entrega un handle nuevo, ya con escritura.
   Sirve cuando el permiso quedó en solo lectura o cuando Drive dejó el
   handle viejo inservible. */
async function reelegirArchivo(){
  if(!HAS_FSA) return false;

    });

}

function normalize(){
  DB.spotsPorHora = DB.spotsPorHora || SPOTS_HORA;
  if(!Array.isArray(DB.avisos)) DB.avisos = [];        // avisos que Soporte Comercial le deja al editor
  if(!Array.isArray(DB.todo)) DB.todo = [];            // tablero de animaciones de Producción
  if(!Array.isArray(DB.opNuevas)) DB.opNuevas = [];    // OP de antes (ahora cada una es su archivo)
  if(!DB.opEstado || typeof DB.opEstado !== "object" || Array.isArray(DB.opEstado)) DB.opEstado = {};   // lo que decide Producción
  { const v = Number(DB.minHoras); DB.minHoras = (isFinite(v) && v > 0 && v <= 24) ? v : MIN_HORAS_DEF; }
  for(const p of DB.pantallas){
    if(aMin(p.on) === null || aMin(p.off) === null){
      // migración: conserva las horas que ya tenía y les inventa un horario equivalente
      const tot = Math.round((n(p.horas) || 20) * 60);
      p.on = p.on && aMin(p.on) !== null ? p.on : HORA_SUGERIDA;
      p.off = aHHMM(aMin(p.on) + tot);
    }
    p.horas = horasDe(p.on, p.off);
    p.sublistas = p.sublistas || [];
    for(const s of p.sublistas){
      s.id = s.id || uid();
      s.capacidad = n(s.capacidad) || CAP_SUBLISTA;
      s.campanas = s.campanas || [];
      for(const c of s.campanas){
        c.id = c.id || uid(); c.frec = n(c.frec); c.pausada = !!c.pausada; c.motivoPausa = c.motivoPausa || "";
        c.versiones = Array.isArray(c.versiones) ? c.versiones : [];
        for(const v of c.versiones){ v.id = v.id || uid(); v.titulo = String(v.titulo || ""); }
      }
    }
  }
}

/* ---------------- cálculos ---------------- */
function estado(c, ref){
  const r = parseISO(ref), i = parseISO(c.inicio), f = parseISO(c.fin);
  if(f && r > f) return "finalizada";        // ya terminó, aunque estuviera pausada
  if(c.pausada) return "pausada";
  if(!c.inicio && !c.fin) return "sinfecha";
  if(i && r < i) return "programada";
  if(f && days(r,f) <= AVISO_DIAS) return "porvencer";
  return "activa";
}
/* Vigencia de una versión de arte: mismo lenguaje de colores que las campañas. */
function estadoVersion(v, ref){
  const r = parseISO(ref), i = parseISO(v.inicio), f = parseISO(v.fin);
  if(!v.inicio && !v.fin) return "sinfecha";
  if(f && r > f) return "vencida";
  if(i && r < i) return "programada";
  if(f && days(r, f) <= AVISO_DIAS) return "porvencer";
  return "vigente";
}
const VER_ETIQ = {vigente:"Vigente", porvencer:"Por vencer", vencida:"Vencida", programada:"Programada", sinfecha:"Sin fechas"};
const VER_CLASE = {vigente:"b-activa", porvencer:"b-porvencer", vencida:"b-finalizada", programada:"b-programada", sinfecha:"b-sinfecha"};
/* Resumen para la tarjeta: cuántas hay y cuál es el estado que más urge. */
function resumenVersiones(c, ref){
  const vs = c.versiones || [];
  if(!vs.length) return null;
  const cuenta = {vigente:0, porvencer:0, vencida:0, programada:0, sinfecha:0};
  for(const v of vs) cuenta[estadoVersion(v, ref)]++;
  const peor = cuenta.vencida ? "vencida" : cuenta.porvencer ? "porvencer"
             : cuenta.vigente ? "vigente" : cuenta.programada ? "programada" : "sinfecha";
  const detalle = Object.entries(cuenta).filter(([,v]) => v)
    .map(([k,v]) => `${v} ${VER_ETIQ[k].toLowerCase()}${v>1 && k!=="porvencer" && k!=="sinfecha" ? "s" : ""}`).join(" · ");
  return {total: vs.length, cuenta, peor, detalle};
}

/* Los importes se guardan como número; vacío = no se registró. */
function num(v){
  if(v === null || v === undefined || v === "") return null;
  const x = parseFloat(String(v).replace(/[^0-9.,-]/g, "").replace(/,/g, ""));
  return isFinite(x) ? x : null;
}
function money(v, corto){
  const x = num(v);
  if(x === null) return corto ? "—" : "—";
  return "$" + x.toLocaleString("es-SV", {minimumFractionDigits: corto ? 0 : 2, maximumFractionDigits: corto ? 0 : 2});
}
function moneySpot(v){
  const x = num(v);
  return x === null ? "—" : "$" + x.toLocaleString("es-SV", {minimumFractionDigits:2, maximumFractionDigits:4});
}
function valoresDe(c){
  return {mes: num(c && c.vMes), total: num(c && c.vTotal), spot: num(c && c.vSpot), neg: negDe(c)};
}
function ocupa(st){ return st === "activa" || st === "porvencer"; }   // consume aire hoy

function capPantalla(p){ return Math.round(p.horas * DB.spotsPorHora); }
function statsPantalla(p, ref){
  const st = {usados:0, pausados:0, total:0, cap:capPantalla(p), activa:0, porvencer:0, finalizada:0, programada:0, sinfecha:0, pausada:0, campanas:0, sublistas:p.sublistas.length};
  for(const s of p.sublistas){
    for(const c of s.campanas){
      const e = estado(c, ref);
      st[e]++; st.campanas++; st.total += n(c.frec);
      if(ocupa(e)) st.usados += n(c.frec);
      if(e === "pausada") st.pausados += n(c.frec);
    }
  }
  st.libres = st.cap - st.usados;
  st.pct = st.cap ? (st.usados / st.cap) * 100 : 0;
  return st;
}
function statsSublista(s, ref){
  let usados = 0, activos = 0, pausados = 0, npausa = 0;
  for(const c of s.campanas){
    const e = estado(c, ref);
    if(ocupa(e)){ usados += n(c.frec); activos++; }
    if(e === "pausada"){ pausados += n(c.frec); npausa++; }
  }
  return {usados, activos, pausados, npausa,
          libres: s.capacidad - usados,
          pct: s.capacidad ? usados/s.capacidad*100 : 0,
          pctPausa: s.capacidad ? pausados/s.capacidad*100 : 0};
}
function barClass(pct){ return pct > 100.5 ? "over" : pct >= 99.5 ? "warn" : "ok"; }

/* Última alta registrada; si entró como OP, junta todas sus pantallas. */
function ultimaOPIngresada(){
  const b = bitacora();
  const vivos = clientesVivos();
  let ult = null;
  for(const ev of b){
    if(ev.tipo !== "alta") continue;
    if(!vivos.has(String(ev.cliente || "").trim().toUpperCase())) continue;   // eliminada

    if(!ult || String(ev.ts) > String(ult.ts)) ult = ev;
  }
  if(!ult) return null;
  let pantallas = 1, spots = n(ult.frec);
  if(ult.op){
    pantallas = 0; spots = 0;
    for(const ev of b) if(ev.tipo === "alta" && ev.op === ult.op){ pantallas++; spots += n(ev.frec); }
  }
  return {cliente: ult.cliente, campana: ult.campana, ts: ult.ts, pantallas, spots, esOP: !!ult.op};
}

/* Campañas al aire más cerca de su fecha final. Si hay varias dentro del
   aviso de 7 días se rotan; si no hay ninguna, se muestra la siguiente. */
let rotProx = 0, rotTimer = null;
function proximasAVencer(){
  const r = parseISO(refDate);
  const out = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    const f = parseISO(c.fin); if(!f) continue;
    const e = estado(c, refDate);
    if(e === "finalizada" || e === "programada" || e === "sinfecha") continue;
    out.push({c, p, s, dias: days(r, f)});
  }
  out.sort((a,b) => a.dias - b.dias || String(a.c.cliente).localeCompare(String(b.c.cliente)));
  return out.filter(x => x.dias <= AVISO_DIAS);
}
function cardProxima(){
  const lista = proximasAVencer();
  if(!lista.length) return `<div class="lbl">Próxima OP a vencer</div>
    <div class="val txt feliz">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="8.6" cy="9.6" r="1.35" fill="currentColor"/>
        <circle cx="15.4" cy="9.6" r="1.35" fill="currentColor"/>
        <path d="M7.2 14.2a5.6 5.6 0 0 0 9.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>Ninguna</div>
    <div class="note">nada vence en los próximos ${AVISO_DIAS} días</div>`;
  if(rotProx >= lista.length) rotProx = 0;
  const it = lista[rotProx];
  const color = it.dias <= 0 ? "var(--critical)" : it.dias <= AVISO_DIAS ? "var(--warning)" : "inherit";
  const cuando = it.dias <= 0 ? "vence hoy" : it.dias === 1 ? "vence mañana" : `faltan ${it.dias} días`;
  return `<div class="lbl">Próxima OP a vencer${lista.length > 1 ? ` <span class="rotn">${rotProx+1}/${lista.length}</span>` : ""}</div>
    <div class="val txt" style="color:${color}">${esc(it.c.cliente)}</div>
    <div class="note">${cuando} · ${fmt(it.c.fin)}${it.c.pausada ? " · en pausa" : ""}</div>`;
}
function pintarProxima(){
  const el = document.getElementById("kpi_prox");
  if(!el) return;
  el.innerHTML = cardProxima();
  const lista = proximasAVencer();
  const it = lista[rotProx];
  el.onclick = it ? () => { tab = it.p.id; render(); window.scrollTo({top:0}); } : null;
  el.title = it ? `${it.c.cliente} · ${it.p.nombre} · ${it.s.nombre} · ${miles(it.c.frec)} spots` : "";
  el.style.cursor = it ? "pointer" : "default";
}
function armarRotacion(){
  clearInterval(rotTimer); rotTimer = null;
  if(tab !== "resumen") return;
  const lista = proximasAVencer();
  if(lista.length < 2) return;
  rotTimer = setInterval(() => {
    const l = proximasAVencer();
    if(l.length < 2){ clearInterval(rotTimer); rotTimer = null; return; }
    rotProx = (rotProx + 1) % l.length;
    pintarProxima();
  }, 5000);
}

/* ---------------- vista: resumen ---------------- */
/* ============ visor: control de discrepancias en los valores ============ */
/* Spots que se pautan en toda la vigencia de una pantalla. El valor por spot
   sale del precio entre ESTOS spots, que son los mismos que se escriben en el
   Excel de rentabilidad. Si la OP todavía no tiene fechas se asume un mes de
   30 días, que es como se cotiza. */
function spotsDeVigencia(frec, inicio, fin){
  const d = diasVigencia(inicio, fin);
  return n(frec) * (d && d > 0 ? d : 30);
}
function diasDeVigencia(inicio, fin){
  const d = diasVigencia(inicio, fin);
  return (d && d > 0) ? d : 30;
}
/* Revisa que el valor por spot cuadre con el precio y que el total cuadre con la suma. */
function revisarValores(cliente, campana){
  const filas = campanasDe(cliente, campana);
  const avisos = [];
  let suma = 0, conMes = 0, ov = null;
  for(const f of filas){
    const mes = num(f.c.vMes), spot = num(f.c.vSpot), frec = n(f.c.frec);
    if(ov === null && num(f.c.vTotal) !== null) ov = num(f.c.vTotal);
    if(mes !== null){ suma += mes; conMes++; }
    if(mes !== null && frec > 0 && spot !== null){
      const spots = spotsDeVigencia(frec, f.c.inicio, f.c.fin);
      const dias  = diasDeVigencia(f.c.inicio, f.c.fin);
      const esperado = spots ? mes / spots : null;
      if(esperado !== null && Math.abs(spot - esperado) > Math.max(esperado * 0.01, 0.0005))
        avisos.push({tipo:"spot", pantalla:f.p.nombre, mes, frec, spot, esperado, spots, dias});
    }
    if(mes !== null && spot === null) avisos.push({tipo:"faltaspot", pantalla:f.p.nombre});
    if(mes === null && spot !== null) avisos.push({tipo:"faltames", pantalla:f.p.nombre});
  }
  if(ov !== null && conMes && Math.abs(ov - suma) > 0.01) avisos.push({tipo:"total", ov, suma});
  return {avisos, filas, suma, ov, conMes};
}
/* La aprobación vale para estos valores; si alguien los cambia, vuelve a pedir revisión. */
function huellaValores(r){
  return r.filas.map(f => `${f.c.id}:${num(f.c.vMes)}:${num(f.c.vSpot)}`).sort().join("|") + "#" + r.ov;
}
function claveOk(ev, r){ return claveRent(ev) + "@" + huellaValores(r); }
function necesitaRevision(ev){
  const r = revisarValores(ev.cliente, ev.campana);
  if(!r.avisos.length) return null;
  if(okSet.has(claveOk(ev, r))) return null;
  return r;
}
const AVISO_TXT = {
  spot: a => `${a.pantalla}: el valor por spot dice ${moneySpot(a.spot)}, pero ${money(a.mes)} entre `
           + `${miles(a.spots)} spots (${miles(a.frec)}/día × ${miles(a.dias)} días de pauta) `
           + `da ${moneySpot(a.esperado)}.`,
  total: a => `El valor total de la OP dice ${money(a.ov)}, pero la suma de las pantallas da ${money(a.suma)}.`,
  faltaspot: a => `${a.pantalla}: tiene valor mensual pero le falta el valor por spot.`,
  faltames: a => `${a.pantalla}: tiene valor por spot pero le falta el valor mensual.`
};

      </div>

/* ============ visor: editar los valores de una campaña ============ */
/* Devuelve todas las campañas (una por pantalla) de esa campaña, para poder editarlas. */
function campanasDe(cliente, campana){
  const hayEstricto = (() => {
    if(!campana) return false;
    for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas)
      if(mismoTexto(c.cliente, cliente) && mismoTexto(c.campana || "", campana)) return true;
    return false;
  })();
  const out = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    if(!mismoTexto(c.cliente, cliente)) continue;
    if(campana && hayEstricto && !mismoTexto(c.campana || "", campana)) continue;
    out.push({p, s, c});
  }
  return out;
}

            <td class="num"><input type="number" min="0" step="0.01" class="vm" placeholder="0.00" value="${f.c.vMes != null ? f.c.vMes : ""}"></td>
            <td class="num"><input type="number" min="0" step="0.0001" class="vs" placeholder="0.0000" value="${f.c.vSpot != null ? f.c.vSpot : ""}"></td>

        <div class="tothint">El valor por spot se calcula solo con la frecuencia de cada pantalla y los días de la pauta.
          Puedes escribirlo a mano —no cambia el valor mensual— y si lo dejas vacío vuelve a calcularse.

    m.querySelectorAll("tbody tr").forEach((tr, i) => {
      const mes = num(tr.querySelector(".vm").value), frec = n(filas[i].c.frec);

  m.querySelectorAll(".vg").forEach(i => i.onchange = recalcular);
  m.querySelectorAll(".vs").forEach((i, k) => i.oninput = () => {

    });

      detalle: detalle.slice(0, 4).join(" · ") + (detalle.length > 4 ? ` · y ${detalle.length - 4} más` : ""),
    });
    /* si esta OP ya está en el Excel de rentabilidad, su fila se pone al día */

        {tipo:"alta", ts:new Date().toISOString(), cliente, campana: campana || "",
         inicio: c0.inicio, fin: c0.fin, op: null});

      ? necesitaRevision({cliente, campana: campana || "", ts: new Date().toISOString(), tipo:"alta"})
      : null;
    toast(`Valores guardados en ${r.n} pantalla${r.n === 1 ? "" : "s"}` +
          (exFila ? ` · fila ${exFila.fila} del Excel al día` : "") +

          notas: base.c.notas || "", pausada: !!base.c.pausada, motivoPausa: base.c.motivoPausa || "",
          frec: n(base.c.frec), vMes: num(base.c.vMes), vSpot: num(base.c.vSpot),
          neg: negDe(base.c), versiones: base.c.versiones || [],
          aqui: {pantalla: base.p.nombre, sublista: base.s.nombre, id: base.c.id}
        }, null, {auto:true});
      }catch(e){ toast("Valores guardados, pero no se pudo generar la constancia"); }
    }
    if(alGuardar) alGuardar();

}

/* ============ visor: notificaciones de OP ============ */

/* ============================================================
   Una OP pendiente es UNA sola fila
   Si Producción cambia las fechas de una OP que Soporte Comercial
   todavía no rentabilizó, eso no es un movimiento aparte: sigue siendo
   la misma OP nueva, ahora con otra vigencia. Se juntan en una sola fila
   para no rentabilizar dos veces lo mismo ni llamar "extensión" a algo
   que nunca llegó al Excel.
   Cuando la OP YA se rentabilizó, el cambio sí es un movimiento propio:
   hay que registrarlo aparte para poner al día su fila.
   ============================================================ */
function absorberCambio(base, ev){
  const j = Object.assign({}, base);
  if(ev.inicio) j.inicio = ev.inicio;
  if(ev.fin)    j.fin    = ev.fin;
  if(ev.frec != null) j.frec = ev.frec;
  /* qué cambió y cuándo, para poder decírselo a quien revisa */
  j.cambios = (base.cambios || []).slice();
  if((ev.fin || "") !== (base.fin || ""))
    j.cambios.push({que:"fin", antes: base.fin || "", ahora: ev.fin || "", ts: ev.ts, tipo: ev.tipo});
  if((ev.inicio || "") !== (base.inicio || ""))
    j.cambios.push({que:"inicio", antes: base.inicio || "", ahora: ev.inicio || "", ts: ev.ts, tipo: ev.tipo});
  j.tsCambio = ev.ts;
  return j;
}
/* Una OP que todavía no se rentabiliza muestra la vigencia que la campaña
   tiene HOY en las listas, no la del día que entró: si Producción la movió,
   lo que hay que rentabilizar es lo de ahora. Una ya rentabilizada conserva
   las fechas con las que se registró en el Excel. */
function alDiaConLaLista(ev){
  const f = campanasDe(ev.cliente, ev.campana)[0];
  if(!f) return ev;
  const iniHoy = f.c.inicio || "", finHoy = f.c.fin || "";
  if(iniHoy === (ev.inicio || "") && finHoy === (ev.fin || "")) return ev;
  const j = Object.assign({}, ev);
  j.cambios = (ev.cambios || []).slice();
  if(finHoy !== (ev.fin || ""))
    j.cambios.push({que:"fin", antes: ev.fin || "", ahora: finHoy, ts: ev.tsCambio || ev.ts});
  if(iniHoy !== (ev.inicio || ""))
    j.cambios.push({que:"inicio", antes: ev.inicio || "", ahora: iniHoy, ts: ev.tsCambio || ev.ts});
  if(iniHoy) j.inicio = iniHoy;
  if(finHoy) j.fin = finHoy;
  return j;
}
function juntarPendientes(lista){
  const grupos = new Map();
  for(const ev of lista){
    const g = claveDeCampana(ev.cliente, ev.campana);
    if(!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(ev);
  }
  const out = [];
  for(const evs of grupos.values()){
    evs.sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
    let abierto = null;                     // la OP que todavía no se rentabiliza
    for(const ev of evs){
      if(abierto){ abierto = absorberCambio(abierto, ev); continue; }
      if(rentSet.has(claveRent(ev))){ out.push(ev); continue; }
      abierto = ev;
    }
    if(abierto) out.push(alDiaConLaLista(abierto));
  }
  return out;
}
/* Cápsula que avisa que Producción movió las fechas de esta misma OP. */
function textoCambios(ev){
  if(!ev.cambios || !ev.cambios.length) return "";
  /* de cada campo: el valor con el que llegó y el que tiene ahora */
  const acc = {};
  for(const c of ev.cambios){
    if(!acc[c.que]) acc[c.que] = {antes: c.antes, ahora: c.ahora};
    else acc[c.que].ahora = c.ahora;
  }
  return Object.keys(acc)
    .filter(q => (acc[q].antes || "") !== (acc[q].ahora || ""))
    .map(q => `${q === "fin" ? "fin" : "inicio"} ${fmt(acc[q].antes) || "—"} → ${fmt(acc[q].ahora) || "—"}`)
    .join(" · ");
}
function chipCambio(ev){
  const txt = textoCambios(ev);
  if(!txt) return "";
  return `<div class="cambchip" title="Producción cambió la vigencia de esta OP antes de rentabilizarla: ${esc(txt)}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      Fechas cambiadas</div>`;
}
/* Si la vigencia cambió después de recibida, el aviso vuelve a contar como nuevo. */
function claveLeida(ev){
  return claveRent(ev) + (ev.tsCambio ? "@" + String(ev.tsCambio).slice(0, 16) : "");
}

function novedades(){
  const vistos = new Set(), out = [];
  const vivos = clientesVivos();
  for(const ev of bitacora()){
    if(!RES_TIPOS.includes(ev.tipo)) continue;
    if(!String(ev.cliente || "").trim()) continue;
    if(!vivos.has(String(ev.cliente).trim().toUpperCase())) continue;         // eliminada
    if(isNaN(new Date(ev.ts))) continue;
    const k = claveRent(ev);
    if(vistos.has(k)) continue;
    if(opEliminada(k)) continue;                       // Soporte Comercial la eliminó
    vistos.add(k);
    out.push(ev);
  }
  return juntarPendientes(out).sort((a, b) => String(b.ts).localeCompare(String(a.ts)));   // lo más nuevo primero
}

/* ============ visor: movimientos de OP en el Resumen ============ */
let resDesde = null, resHasta = null, resVerRent = false;
const RES_TIPOS = ["alta", "renovada", "extendida"];

function movimientosOP(){
  const d1 = parseISO(resDesde), d2 = parseISO(resHasta);
  const tope = d2 ? new Date(d2.getFullYear(), d2.getMonth(), d2.getDate(), 23, 59, 59, 999) : null;
  const vistos = new Set(), out = [];
  const vivos = clientesVivos();
  for(const ev of bitacora()){
    if(!RES_TIPOS.includes(ev.tipo)) continue;
    if(!String(ev.cliente || "").trim()) continue;
    if(!vivos.has(String(ev.cliente).trim().toUpperCase())) continue;         // eliminada
    const d = new Date(ev.ts);
    if(isNaN(d)) continue;
    if(d1 && d < d1) continue;
    if(tope && d > tope) continue;
    const k = claveRent(ev);
    if(vistos.has(k)) continue;
    if(opEliminada(k)) continue;                // Soporte Comercial la eliminó
    vistos.add(k);
    out.push(ev);
  }
  return juntarPendientes(out).sort((a, b) => String(a.ts).localeCompare(String(b.ts)));    // ascendente
}

        ${s.finalizada?`<span class="chip"><i class="i-critical"></i>${s.finalizada} finalizadas</span>`:""}
        ${s.programada?`<span class="chip"><i class="i-accent"></i>${s.programada} programadas</span>`:""}
        <span class="chip"><i class="i-muted"></i>${s.sublistas} sublistas${s.sublistas<necesarias?` de ${necesarias}`:""}</span>
        <span class="chip" style="color:${s.libres<0?"var(--critical)":"var(--ink-2)"}">${s.libres>=0?miles(s.libres)+" libres":miles(-s.libres)+" sobrevendidos"}</span>
      </div></button>`;
  }
  h += `</div>` + legend();
  return h;
}

/* ---------------- Requieren atención: una tarjeta por campaña ----------------
   Junta en una sola tarjeta la misma campaña (cliente + campaña + estado) aunque
   esté en varias pantallas o sublistas, y muestra cada pantalla como una pastilla
   que lleva a esa pantalla. */
/* Quita de una vez la campaña de todas las pantallas de su tarjeta. */
function modalAtnBorrar(g){
  if(!g || RO) return;
  const m = document.getElementById("modal");
  m.className = "modal";
  m.innerHTML = `
    <div class="mh"><div style="flex:1;min-width:0"><h3>Eliminar campaña finalizada</h3>
      <small>${esc(g.cliente)} · ${esc(g.campana) || "sin campaña"} · terminó el ${fmt(g.fin)}</small></div>
      <span class="chip"><i class="i-critical"></i>${g.items.length} ubicaci${g.items.length === 1 ? "ón" : "ones"}</span></div>
    <div class="mb">
      <div class="field"><label>Se va a quitar de</label>
        <div class="dlist">${g.items.map(it => `<div class="drow"><span class="dinfo">
          <span class="dnom">${esc(it.p.nombre)} · ${esc(it.s.nombre)}</span>
          <span class="dsub">${fmt(it.c.inicio)} → ${fmt(it.c.fin)} · ${miles(it.c.frec)} spots</span></span></div>`).join("")}</div>
        <div class="hint">Libera ${miles(g.spots)} spots. Es lo mismo que borrarla en cada pantalla, pero de una sola vez.</div></div>
    </div>
    <div class="mf"><button class="btn ghost" id="mcancel">Cancelar</button>
      <button class="btn alerta" id="atn_ok">Eliminar de ${g.items.length === 1 ? "la pantalla" : `las ${g.items.length} ubicaciones`}</button></div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;
  document.getElementById("atn_ok").onclick = () => {
    let borradas = 0, cerr = 0;
    for(const it of g.items){
      const r = findCamp(it.s.id, it.c.id);          // por si algo cambió mientras la ventana estaba abierta
      if(!r) continue;
      quitarCampana(r.p, r.s, r.c);
      borradas++;
    }
    for(const it of g.items) cerr += cerrarBajasDe(it.c);
    closeModal(); save(); render();
    toast(`${g.cliente} eliminada de ${borradas} ubicaci${borradas === 1 ? "ón" : "ones"}${cerr ? " · aviso de Soporte Comercial cerrado" : ""}`);
  };
}
function atnClave(t){ return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().replace(/\s+/g, " "); }
function atnDias(d){
  if(d === null) return "sin fecha final";
  if(d > 1) return `vence en ${d} días`;
  if(d === 1) return "vence mañana";
  if(d === 0) return "vence hoy";
  return `terminó hace ${Math.abs(d)} día${Math.abs(d) === 1 ? "" : "s"}`;
}
let atnGrupos = [];                 // las tarjetas pintadas, para el botón de eliminar
function seccionAtencion(){
  const grupos = new Map();
  const orden = {};
  DB.pantallas.forEach((p, i) => orden[p.id] = i);
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    const e = estado(c, refDate);
    if(e !== "porvencer" && e !== "finalizada") continue;
    const k = atnClave(c.cliente) + "|" + atnClave(c.campana) + "|" + e;
    if(!grupos.has(k)) grupos.set(k, {e, cliente: c.cliente, campana: c.campana, items: []});
    grupos.get(k).items.push({p, s, c});
  }
  const ref = parseISO(refDate);
  const lista = [...grupos.values()].map(g => {
    g.items.sort((x, y) => (orden[x.p.id] - orden[y.p.id]) || String(x.s.nombre).localeCompare(String(y.s.nombre)));
    const fines = [...new Set(g.items.map(it => it.c.fin).filter(Boolean))].sort();
    g.fin = fines[0] || ""; g.finMax = fines[fines.length - 1] || "";
    g.dias = parseISO(g.fin) && ref ? days(ref, parseISO(g.fin)) : null;
    g.pantallas = new Set(g.items.map(it => it.p.id)).size;
    g.spots = g.items.reduce((a, it) => a + n(it.c.frec), 0);
    return g;
  });
  lista.sort((x, y) => x.e === y.e ? String(x.fin).localeCompare(String(y.fin)) || y.pantallas - x.pantallas
                                   : (x.e === "porvencer" ? -1 : 1));
  const pv = lista.filter(g => g.e === "porvencer"), fz = lista.filter(g => g.e === "finalizada");
  atnGrupos = lista;
  const tarjeta = g => `<article class="atn ${g.e}">
      <div class="atn-top">
        <span class="badge b-${g.e}"><i style="background:currentColor"></i>${ETIQ[g.e]}</span>
        <span class="atn-dias">${atnDias(g.dias)}</span>
        ${g.e === "finalizada" ? `<button type="button" class="atn-bor" data-atnbor="${lista.indexOf(g)}"
          title="Eliminar de ${g.items.length === 1 ? "su pantalla" : `las ${g.items.length} ubicaciones`}"
          aria-label="Eliminar ${esc(g.cliente)} de todas sus pantallas"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2c.1.9.8 1.6 1.7 1.6h5.8c.9 0 1.6-.7 1.7-1.6L17.5 7M10 11v6M14 11v6"/></svg></button>` : ""}
      </div>
      <div class="atn-cli"><b>${esc(g.cliente)}</b><small>${esc(g.campana) || "Sin campaña"}</small></div>
      <div class="atn-meta">
        <span><b>${g.pantallas}</b> pantalla${g.pantallas === 1 ? "" : "s"}</span>
        <span><b>${miles(g.spots)}</b> spots</span>
        <span>termina <b>${fmt(g.fin)}</b>${g.finMax && g.finMax !== g.fin ? ` a <b>${fmt(g.finMax)}</b>` : ""}</span>
      </div>
      <div class="atn-pants">${g.items.map(it => `<button type="button" class="atn-pant" data-goto="${it.p.id}"
          title="Ir a ${esc(it.p.nombre)} · ${esc(it.s.nombre)}${it.c.fin !== g.fin ? " · termina " + fmt(it.c.fin) : ""}">
          <b>${esc(it.p.nombre)}</b><small>${esc(it.s.nombre)} · ${miles(it.c.frec)}</small></button>`).join("")}</div>
    </article>`;
  const bloque = (titulo, cls, arr) => arr.length ? `<div class="atn-sub"><i class="${cls}"></i>${titulo}<span>${arr.length}</span></div>
    <div class="atn-grid">${arr.map(tarjeta).join("")}</div>` : "";
  const totPant = lista.reduce((a, g) => a + g.items.length, 0);
  return `<div class="sechead"><h3>Requieren atención</h3><div class="line"></div>
      <span class="hint">${lista.length} campaña${lista.length === 1 ? "" : "s"} · ${totPant} ubicaci${totPant === 1 ? "ón" : "ones"}</span></div>
    ${bloque("Por vencer", "i-warning", pv)}
    ${bloque("Finalizadas · listas para retirar", "i-critical", fz)}`;
}

    <span><i style="background:var(--warning)"></i>Por vencer (≤${AVISO_DIAS} días)</span>
    <span><i style="background:var(--critical)"></i>Finalizada</span>

/* ---------------- vista: buscar ---------------- */
function viewBuscar(){
  const q = query.trim().toLowerCase();
  const hits = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    const hay = `${c.cliente} ${c.campana} ${c.notas||""}`.toLowerCase();
    if(!q || hay.includes(q)) hits.push({p,s,c,e:estado(c,refDate)});
  }
  hits.sort((a,b)=> a.c.cliente.localeCompare(b.c.cliente) || a.p.nombre.localeCompare(b.p.nombre));

  const clientes = new Set(hits.map(h=>h.c.cliente.toUpperCase()));
  const spotsAire = hits.filter(h=>ocupa(h.e)).reduce((a,h)=>a+n(h.c.frec),0);

  let h = `<div class="searchbox">
    <input type="search" id="q" placeholder="Buscar cliente, campaña o nota…  (ej. MINED, saba, curacao)" value="${esc(query)}" autocomplete="off">
    <span class="chip"><i class="i-accent"></i>${hits.length} registros</span>
    <span class="chip"><i class="i-muted"></i>${clientes.size} clientes</span>
    <span class="chip"><i class="i-good"></i>${miles(spotsAire)} spots al aire</span>
  </div>`;

  if(!hits.length) return h + `<p class="empty" style="margin-top:20px">Sin resultados para “${esc(query)}”.</p>`;

  h += `<div class="tblwrap"><table><thead><tr><th>Cliente</th><th>Campaña</th><th>Pantalla</th><th>Sublista</th><th>Inicio</th><th>Fin</th><th class="num">Spots</th><th>Estado</th><th></th></tr></thead><tbody>`;
  let last = "";
  for(const it of hits){
    const key = it.c.cliente.toUpperCase();
    const sep = key !== last;
    last = key;
    h += `<tr>
      <td>${sep?`<b>${esc(it.c.cliente)}</b>`:`<span style="color:var(--muted)">↳</span>`}</td>
      <td style="color:var(--ink-2)">${esc(it.c.campana)||"—"}</td>
      <td>${esc(it.p.nombre)}</td>
      <td style="color:var(--ink-2)">${esc(it.s.nombre)}</td>
      <td class="num">${fmt(it.c.inicio)}</td><td class="num">${fmt(it.c.fin)}</td>
      <td class="num">${miles(it.c.frec)}</td>
      <td><span class="badge b-${it.e}"><i style="background:currentColor"></i>${ETIQ[it.e]}</span></td>
      <td>${RO ? `<button class="btn sm ghost" data-goto="${it.p.id}">Ver</button>` : `<button class="btn sm ghost" data-editcamp="${it.c.id}" data-sub="${it.s.id}">Editar</button>`}</td></tr>`;
  }
  h += `</tbody></table></div>` + legend();
  return h;
}

/* ---------------- búsqueda de objetos ---------------- */
function findSub(id){
  for(const p of DB.pantallas){ const s = p.sublistas.find(x=>x.id===id); if(s) return {p,s}; }
  return null;
}
function findCamp(subId, campId){
  const r = findSub(subId);
  if(r){
    const c = r.s.campanas.find(x=>x.id===campId);
    if(c) return {...r, c};
  }
  /* no está donde decía la pantalla: alguien la movió mientras tanto */
  return findCampDondeSea(campId);
}
/* Busca una campaña por su id en todas las pantallas y sublistas. */
function findCampDondeSea(campId){
  if(!campId) return null;
  for(const p of DB.pantallas) for(const s of p.sublistas){
    const c = s.campanas.find(x => x.id === campId);
    if(c) return {p, s, c};
  }
  return null;
}

/* ============ colocación de una misma campaña en varias pantallas ============
   Busca la sublista que mejor aprovecha el espacio (la de hueco más justo que
   alcance) y, si no hay ninguna, propone crear una sublista nueva.            */
function huecoPara(p, frec, ref){
  let best = null;
  for(const s of p.sublistas){
    const libre = s.capacidad - statsSublista(s, ref).usados;
    if(libre >= frec && (!best || libre < best.libre)) best = {sub:s, libre};
  }
  return best;
}
function yaEsta(p, obj){
  const igual = (a,b) => String(a||"").trim().toUpperCase() === String(b||"").trim().toUpperCase();
  for(const s of p.sublistas) for(const c of s.campanas){
    if(igual(c.cliente, obj.cliente) && igual(c.campana, obj.campana) && c.inicio === obj.inicio && c.fin === obj.fin)
      return {sub:s, camp:c};
  }
  return null;
}
function planPara(p, obj, ref){
  const dup = yaEsta(p, obj);
  if(dup) return {tipo:"dup", sub:dup.sub};
  const h = huecoPara(p, obj.frec, ref);
  if(h) return {tipo:"ok", sub:h.sub, restante: h.libre - obj.frec};
  const cap = obj.frec <= 450 ? 450 : CAP_SUBLISTA;
  const capListas = p.sublistas.reduce((a,x) => a + x.capacidad, 0);
  const capPant = capPantalla(p);
  return {tipo:"nueva", cap,
          ampliar: (capListas + cap) > capPant,
          horasNec: Math.ceil((capListas + cap) / (DB.spotsPorHora/2)) / 2};
}
function textoPlan(plan, corto){
  if(plan.tipo === "dup")   return `ya está en ${plan.sub.nombre}`;
  if(plan.tipo === "ok")    return corto
      ? `→ ${plan.sub.nombre} · quedarían ${miles(plan.restante)} libres`
      : `entra en ${plan.sub.nombre} · quedarían ${miles(plan.restante)} libres`;
  return corto
    ? `→ sublista nueva de ${miles(plan.cap)}${plan.ampliar ? " · hay que ampliar el horario" : ""}`
    : `sin espacio · se creará una sublista de ${miles(plan.cap)}${plan.ampliar ? ` y habrá que ampliar el horario a ${textoHoras(Math.min(23, plan.horasNec))}` : ""}`;
}
function colocar(p, obj, ref, opId){
  const plan = planPara(p, obj, ref);
  if(plan.tipo === "dup") return {ok:false, plan};
  let sub = plan.sub;
  if(plan.tipo === "nueva"){
    const cod = p.codigo || p.nombre.replace(/[^A-Za-zÁÉÍÓÚÑ]/g,"").slice(0,6).toUpperCase();
    sub = {id: uid(), nombre: `${cod} EXTRA ${p.sublistas.length + 1}_${plan.cap}`, capacidad: plan.cap, campanas: []};
    p.sublistas.push(sub);
  }
  sub.campanas.push({...obj, id: uid()});
  marcarUltimo(p, obj.cliente, "agregada");
  anotar({tipo:"alta", cliente:obj.cliente, campana:obj.campana, pantalla:p.nombre, sublista:sub.nombre,
          frec:n(obj.frec), inicio:obj.inicio, fin:obj.fin, nueva: plan.tipo === "nueva", op: opId || null});
  return {ok:true, plan, sub};
}

/* ============ borrado: avisa si el cliente está en otras pantallas ============ */
function mismoTexto(a,b){ return String(a||"").trim().toUpperCase() === String(b||"").trim().toUpperCase(); }
function ocurrencias(objetivo, excluirId){
  const out = [];
  for(const p of DB.pantallas) for(const s of p.sublistas) for(const c of s.campanas){
    if(c.id === excluirId) continue;
    if(!mismoTexto(c.cliente, objetivo.cliente)) continue;
    out.push({p, s, c,
      misma: mismoTexto(c.campana, objetivo.campana) && c.inicio === objetivo.inicio && c.fin === objetivo.fin});
  }
  return out;
}
function quitarCampana(p, s, c){
  s.campanas = s.campanas.filter(x => x.id !== c.id);
  marcarUltimo(p, c.cliente, "eliminada");
  anotar({tipo:"baja", cliente:c.cliente, campana:c.campana, pantalla:p.nombre, sublista:s.nombre,
          frec:n(c.frec), inicio:c.inicio, fin:c.fin});
}

                sublista:d.s.nombre, frec:obj.frec, inicio:obj.inicio, fin:obj.fin, detalle:`desde ${s.nombre}`});

      if(ampliar.length) setTimeout(() => alert(
        "Se crearon sublistas nuevas y estas pantallas se quedaron sin horas suficientes:\n\n" +

    } else {

  };
  document.getElementById("f_cli").focus();
}

/* ================= Lectura de una OP (PDF o Excel) =================
   Todo pasa en el navegador, sin internet y sin librerías externas.
   Los dos formatos se convierten a "líneas de texto" y un solo parser
   saca los campos. */

const MESES_ES = {enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7,
  agosto:8, septiembre:9, setiembre:9, octubre:10, noviembre:11, diciembre:12};
const WINANSI = {128:"€",130:"‚",131:"ƒ",132:"„",133:"…",134:"†",135:"‡",136:"ˆ",137:"‰",138:"Š",
  139:"‹",140:"Œ",142:"Ž",145:"‘",146:"’",147:"“",148:"”",149:"•",150:"–",151:"—",152:"˜",
  153:"™",154:"š",155:"›",156:"œ",158:"ž",159:"Ÿ"};
const chrWin = b => (b >= 128 && b <= 159) ? (WINANSI[b] || "") : String.fromCharCode(b);
function sinTildes(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }

async function inflar(bytes, modo){
  try{
    const ds = new DecompressionStream(modo);
    const w = ds.writable.getWriter();
    w.write(bytes).catch(()=>{});
    w.close().catch(()=>{});
    const r = ds.readable.getReader();
    const trozos = [];
    let total = 0;
    try{
      for(;;){ const {done, value} = await r.read(); if(done) break; trozos.push(value); total += value.length; }
    }catch(e){ /* basura despues del stream: nos quedamos con lo ya descomprimido */ }
    if(!total) return null;
    const out = new Uint8Array(total);
    let o = 0;
    for(const t of trozos){ out.set(t, o); o += t.length; }
    return out;
  }catch(e){ return null; }
}
function aLatin1(u8){
  let s = "";
  for(let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return s;
}

/* ---------- PDF: texto por líneas, según la coordenada Y ---------- */
async function lineasPDF(u8){
  const crudo = aLatin1(u8);
  const salida = [];
  const re = /stream\r?\n/g;
  let m;
  while((m = re.exec(crudo))){
    const ini = m.index + m[0].length;
    const fin = crudo.indexOf("endstream", ini);
    if(fin < 0) continue;
    re.lastIndex = fin;
    const trozo = u8.subarray(ini, fin);
    let inf = await inflar(trozo, "deflate");
    if(!inf) inf = await inflar(trozo, "deflate-raw");
    if(!inf) continue;
    const cs = aLatin1(inf);
    if(!/\bTJ\b|\bTj\b/.test(cs)) continue;
    salida.push(...lineasDeContenido(cs));
  }
  return salida;
}
function desescapaPDF(s){
  let out = "";
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(c !== "\\"){ out += c; continue; }
    const n = s[++i];
    if(n === "n" || n === "r") out += " ";
    else if(n >= "0" && n <= "7"){
      let o = n;
      while(o.length < 3 && s[i+1] >= "0" && s[i+1] <= "7") o += s[++i];
      out += chrWin(parseInt(o, 8));
    } else out += n;
  }
  return [...out].map(ch => { const b = ch.charCodeAt(0); return b < 256 ? chrWin(b) : ch; }).join("");
}
function lineasDeContenido(cs){
  const items = [];
  let x = 0, y = 0;
  const re = /(-?[\d.]+)\s+(-?[\d.]+)\s+Td|1\s+0\s+0\s+1\s+(-?[\d.]+)\s+(-?[\d.]+)\s+Tm|\[((?:[^\[\]\\]|\\.)*)\]\s*TJ|\(((?:[^()\\]|\\.)*)\)\s*Tj/g;
  let m;
  while((m = re.exec(cs))){
    if(m[3] !== undefined){ x = +m[3]; y = +m[4]; continue; }
    if(m[1] !== undefined){ x += +m[1]; y += +m[2]; continue; }
    let txt = "";
    if(m[5] !== undefined){
      const rs = /\(((?:[^()\\]|\\.)*)\)/g;
      let t;
      while((t = rs.exec(m[5]))) txt += desescapaPDF(t[1]);
    } else if(m[6] !== undefined) txt = desescapaPDF(m[6]);
    if(txt) items.push({x, y, txt});
  }
  const filas = new Map();
  for(const it of items){
    const k = Math.round(it.y);
    if(!filas.has(k)) filas.set(k, []);
    filas.get(k).push(it);
  }
  return [...filas.entries()].sort((a,b) => b[0] - a[0])
    .map(([, arr]) => arr.sort((a,b) => a.x - b.x).map(i => i.txt).join(" ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}

/* ---------- XLSX: descomprimir el zip y leer la primera hoja ---------- */
function u16(u8,o){ return u8[o] | (u8[o+1]<<8); }
function u32(u8,o){ return (u8[o] | (u8[o+1]<<8) | (u8[o+2]<<16) | (u8[o+3]<<24)) >>> 0; }
async function leerZip(u8){
  // localizar el fin del directorio central
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(u32(u8, i) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("No parece un archivo de Excel (.xlsx).");
  const total = u16(u8, eocd + 10);
  let off = u32(u8, eocd + 16);
  const archivos = {};
  for(let k = 0; k < total; k++){
    if(u32(u8, off) !== 0x02014b50) break;
    const metodo = u16(u8, off + 10);
    const compSize = u32(u8, off + 20);
    const nLen = u16(u8, off + 28), eLen = u16(u8, off + 30), cLen = u16(u8, off + 32);
    const loc = u32(u8, off + 42);
    const nombre = aLatin1(u8.subarray(off + 46, off + 46 + nLen));
    // cabecera local: saltar nombre y extra
    const lnLen = u16(u8, loc + 26), leLen = u16(u8, loc + 28);
    const datos = u8.subarray(loc + 30 + lnLen + leLen, loc + 30 + lnLen + leLen + compSize);
    archivos[nombre] = {metodo, datos};
    off += 46 + nLen + eLen + cLen;
  }
  const salida = {};
  for(const [nombre, f] of Object.entries(archivos)){
    if(!/^xl\/(worksheets\/sheet1\.xml|sharedStrings\.xml|workbook\.xml|styles\.xml)$/.test(nombre)) continue;
    const bytes = f.metodo === 0 ? f.datos : await inflar(f.datos, "deflate-raw");
    if(bytes) salida[nombre] = new TextDecoder("utf-8").decode(bytes);
  }
  return salida;
}
function serialAFecha(n){
  const ms = Math.round((n - 25569) * 86400000);      // 1970-01-01 = serial 25569
  const d = new Date(ms);
  if(isNaN(d)) return null;
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
async function lineasXLSX(u8){
  const partes = await leerZip(u8);
  const hoja = partes["xl/worksheets/sheet1.xml"];
  if(!hoja) throw new Error("El Excel no tiene una primera hoja legible.");
  // cadenas compartidas
  const compartidas = [];
  const ss = partes["xl/sharedStrings.xml"];
  if(ss){
    for(const m of ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)){
      let t = "";
      for(const g of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += g[1];
      compartidas.push(desXML(t));
    }
  }
  // estilos con formato de fecha
  const fechaEstilo = new Set();
  const st = partes["xl/styles.xml"];
  if(st){
    const fmts = new Map();
    for(const m of st.matchAll(/<numFmt[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g)) fmts.set(m[1], m[2]);
    const xfs = (st.match(/<cellXfs[\s\S]*?<\/cellXfs>/) || [""])[0];
    let i = 0;
    for(const m of xfs.matchAll(/<xf\b[^>]*numFmtId="(\d+)"[^>]*\/?>/g)){
      const id = m[1], code = fmts.get(id) || "";
      const nativoFecha = ["14","15","16","17","22"].includes(id);
      if(nativoFecha || /[dmyDMY]/.test(code) && !/[#0]/.test(code)) fechaEstilo.add(i);
      i++;
    }
  }
  const filas = new Map();
  /* los atributos van con *?: si no, la barra de las celdas vacías (<c r="A3" s="3"/>)
     se cuela en el grupo y el lector se traga las celdas siguientes. */
  for(const m of hoja.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const attrs = m[1] || "", cuerpo = m[2] || "";
    const ref = (attrs.match(/r="([A-Z]+)(\d+)"/) || []);
    if(!ref[1]) continue;
    const col = ref[1], fila = +ref[2];
    const tipo = (attrs.match(/t="([^"]+)"/) || [])[1] || "n";
    const estilo = +((attrs.match(/s="(\d+)"/) || [])[1] || -1);
    let val = "";
    if(tipo === "s"){
      const idx = +(cuerpo.match(/<v>([\s\S]*?)<\/v>/) || [0,"-1"])[1];
      val = compartidas[idx] || "";
    } else if(tipo === "inlineStr"){
      for(const g of cuerpo.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) val += desXML(g[1]);
    } else if(tipo === "str"){
      val = desXML((cuerpo.match(/<v>([\s\S]*?)<\/v>/) || [0,""])[1]);
    } else {
      const raw = (cuerpo.match(/<v>([\s\S]*?)<\/v>/) || [0,""])[1];
      if(raw === "") val = "";
      else if(fechaEstilo.has(estilo) && +raw > 20000) val = serialAFecha(+raw) || raw;
      else val = raw;
    }
    if(!String(val).trim()) continue;
    if(!filas.has(fila)) filas.set(fila, []);
    filas.get(fila).push({col: numCol(col), val: String(val).trim()});
  }
  return [...filas.entries()].sort((a,b) => a[0] - b[0])
    .map(([, cs]) => cs.sort((a,b) => a.col - b.col).map(c => c.val).join(" ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}
function numCol(s){ let n = 0; for(const ch of s) n = n*26 + (ch.charCodeAt(0) - 64); return n; }
function desXML(s){
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&");
}

/* ---------- parser común de la OP ---------- */
const ALIAS_PANTALLA = [
  ["sdm",    ["salvador del mundo", "salvador", "sdm"]],
  ["heroe",  ["heroes", "monumento a los heroes"]],
  ["panam",  ["panamericana", "panam"]],
  ["proce",  ["proceres", "los proceres", "proce"]],
  ["paseo",  ["paseo general escalon", "paseo escalon", "paseo"]],
  ["jerusa", ["jerusalen", "jerusa"]],
  ["benito", ["san benito", "benito"]],
  ["juanpa", ["constitucion", "juan pablo", "juanpa"]],
];
function fechaDeTexto(t){
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/(\d{1,2})\s*(?:de\s*)?([A-Za-zÁÉÍÓÚÑáéíóúñ]{4,})\s*(?:de\s*)?(\d{4})/);
  if(m){
    const mes = MESES_ES[sinTildes(m[2])];
    if(mes) return `${m[3]}-${String(mes).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  m = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if(m) return `${m[3]}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  return null;
}
function trasEtiqueta(lineas, etiqueta){
  const et = sinTildes(etiqueta);
  for(let i = 0; i < lineas.length; i++){
    const l = sinTildes(lineas[i]);
    const p = l.indexOf(et);
    if(p < 0) continue;
    let resto = lineas[i].slice(p + etiqueta.length).replace(/^[:\s]+/, "");
    // cortar si empieza otra etiqueta en la misma línea
    resto = resto.split(/\s{2,}(?=[A-ZÁÉÍÓÚ])/)[0];
    for(const otra of ["Fecha de ingreso","Nombre de agencia","Valor por","Costo x spot","Valor Mensual","Valor Total"]){
      const q = sinTildes(resto).indexOf(sinTildes(otra));
      if(q > 0) resto = resto.slice(0, q);
    }
    resto = resto.trim();
    if(resto) return resto;
    if(lineas[i+1] && !/[:]/.test(lineas[i+1])) return lineas[i+1].trim();
  }
  return "";
}
/* Un número de la OP como lo escribe el Excel de comercial: 13,500 · 540.00 · 0.075.
   Con coma Y punto, el último es el decimal. Con solo coma: si le siguen tres
   cifras es de miles (13,500); con una o dos cifras es decimal (12,50). */
function numOP(t){
  let s = String(t == null ? "" : t).replace(/[^\d.,-]/g, "");
  if(!s || !/\d/.test(s)) return null;
  const c = s.lastIndexOf(","), p = s.lastIndexOf(".");
  if(c >= 0 && p >= 0) s = c > p ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if(c >= 0)      s = (/,\d{3}$/.test(s) && !/^-?0,/.test(s)) ? s.replace(/,/g, "") : s.replace(",", ".");
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
/* Lo que trae la fila de una pantalla después de su nombre, en el orden de la
   plantilla: spots por día, spots totales, valor por pantalla y costo por spot.
   En el PDF el dinero lleva "$"; en el Excel llegan los números solos. */
function valoresFilaOP(cola){
  const toks = [];
  for(const m of String(cola || "").matchAll(/(\$\s*)?(-?\d[\d.,]*)/g))
    toks.push({dinero: !!m[1], crudo: m[2], v: numOP(m[2])});
  const nums = toks.filter(t => t.v !== null);
  if(!nums.length) return null;
  /* los spots por día se leen igual que siempre: es un conteo, sin decimales */
  const frec = Math.round(parseFloat(nums[0].crudo.replace(/[.,](?=\d{3}\b)/g, "").replace(",", ".")));
  let spotsTot = null, mes = null, spot = null;
  const plata = nums.filter(t => t.dinero);
  if(plata.length){
    const conteos = nums.filter(t => !t.dinero);
    spotsTot = conteos[1] ? conteos[1].v : null;
    mes  = plata[0] ? plata[0].v : null;
    spot = plata[1] ? plata[1].v : null;
  } else {
    spotsTot = nums[1] ? nums[1].v : null;
    mes      = nums[2] ? nums[2].v : null;
    spot     = nums[3] ? nums[3].v : null;
  }
  return {frec, spotsTot, mes, spot};
}
function parsearOP(lineas){
  const r = {cliente:"", campana:"", inicio:null, fin:null, agencia:"", ejecutivo:"", formato:"",
             pantallas:[], avisos:[], valorMensual:null, valorTotal:null};
  r.cliente   = trasEtiqueta(lineas, "Marca");
  r.campana   = trasEtiqueta(lineas, "Campaña");
  r.agencia   = trasEtiqueta(lineas, "Nombre de agencia");
  r.ejecutivo = trasEtiqueta(lineas, "Ejecutivo/a") || trasEtiqueta(lineas, "Ejecutivo");
  r.formato   = trasEtiqueta(lineas, "Formato de Arte");
  r.inicio    = fechaDeTexto(trasEtiqueta(lineas, "Fecha de inicio"));
  r.fin       = fechaDeTexto(trasEtiqueta(lineas, "Fecha de fin") || trasEtiqueta(lineas, "Fecha final"));

  const vistas = new Set();
  for(const linea of lineas){
    const l = sinTildes(linea);
    if(l.includes("seleccione pantalla")) continue;
    for(const [pid, alias] of ALIAS_PANTALLA){
      if(vistas.has(pid)) continue;
      for(const a of alias){
        const p = l.indexOf(a);
        if(p < 0) continue;
        const cola = linea.slice(p + a.length);
        const vf = valoresFilaOP(cola);
        const frec = vf ? vf.frec : 0;
        if(frec >= 50 && frec <= 20000){
          r.pantallas.push({pid, frec, mes: vf.mes, spot: vf.spot, spotsTot: vf.spotsTot});
          vistas.add(pid);
        }
        break;
      }
    }
  }
  r.valorMensual = numOP(trasEtiqueta(lineas, "Valor Mensual"));
  r.valorTotal   = numOP(trasEtiqueta(lineas, "Valor Total"));
  if(!r.cliente) r.avisos.push("no encontré la marca o cliente");
  if(!r.inicio)  r.avisos.push("no encontré la fecha de inicio");
  if(!r.fin)     r.avisos.push("no encontré la fecha final");
  if(!r.pantallas.length) r.avisos.push("no encontré pantallas con spots");
  return r;
}

/* ---------- punto de entrada ---------- */
async function leerArchivoOP(file){
  const u8 = new Uint8Array(await file.arrayBuffer());
  const esPDF  = u8[0]===0x25 && u8[1]===0x50 && u8[2]===0x44 && u8[3]===0x46;
  const esZip  = u8[0]===0x50 && u8[1]===0x4B;
  let lineas;
  if(esPDF) lineas = await lineasPDF(u8);
  else if(esZip) lineas = await lineasXLSX(u8);
  else if(u8[0]===0xD0 && u8[1]===0xCF) throw new Error("Es un Excel del formato antiguo (.xls). Ábrelo y guárdalo como .xlsx.");
  else throw new Error("Formato no reconocido. Usa el PDF o el Excel (.xlsx) de la OP.");
  if(!lineas.length) throw new Error("No pude sacar texto del archivo. Si el PDF es un escaneo o una imagen, usa el Excel.");
  return {lineas, op: parsearOP(lineas)};
}

/* Ventana de ingreso de OP: un cliente nuevo repartido en varias pantallas,

      <div class="field">

        ${btnsArte("")}
        <div class="hint">Marca "Sin arte" o "Arte en aprobación" si la OP entra solo para reservar los spots.</div>
      </div>
      <div class="field">
        <label>Spots por día en cada pantalla</label>
        <div class="opgrid" id="op_grid">
          ${DB.pantallas.map(x => `
            <div class="oprow" data-pid="${x.id}" data-frec="0">
              <span class="opinfo">
                <span class="opnom">${esc(x.nombre)}</span>
                <span class="od">no va en esta pantalla</span>
              </span>
              <div class="opb">
                ${[300,450,600,900].map(v => `<button type="button" data-v="${v}">${v}</button>`).join("")}
              </div>
              <div class="opval">
                <label><span>$ mes</span>
                  <input type="number" min="0" step="0.01" placeholder="0.00" class="opvm"></label>
                <label><span>$ spot</span>
                  <input type="number" min="0" step="0.0001" placeholder="0.0000" class="opvs"></label>
                <label class="opneg"><span>modalidad</span>
                  <select class="opng">${NEG_OPC.map(o =>
                    `<option value="${o.v}">${o.v ? o.etq : "comercial"}</option>`).join("")}</select></label>
              </div>
            </div>`).join("")}
        </div>
        <div class="optodas">Aplicar a todas:
          ${[300,450,600,900,0].map(v => `<button type="button" data-todas="${v}">${v || "limpiar"}</button>`).join("")}
        </div>
      </div>
      <div class="optot"><span id="op_res">Sin pantallas seleccionadas</span><b id="op_tot">0</b></div>
      <div class="optot"><span>Valor total de la OP</span><b id="op_vtotal">$0.00</b></div>
      <div class="hint" id="op_vhint" style="margin:-4px 0 2px">Escribe el valor mensual de cada pantalla arriba. El valor por spot se calcula solo con la frecuencia de esa pantalla.</div>
      <div class="field">
        <label>Donación o canje · aplica a todas las pantallas</label>
        ${btnsNeg("")}
        <div class="hint" style="margin-top:6px">Elige aquí y se pone en todas. Si solo una pantalla va
          bonificada o donada, déjalo en <b>No aplica</b> y márcala arriba, en su propia fila.</div>
        <div class="hint" id="op_neghint" style="margin-top:6px"></div>
      </div>
