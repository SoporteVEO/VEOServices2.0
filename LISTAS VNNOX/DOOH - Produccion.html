      if(ok) modalGaleria();
    };
    return;
  }

  const d1 = parseISO(galDesde), d2 = parseISO(galHasta);
  const tope = d2 ? new Date(d2.getFullYear(), d2.getMonth(), d2.getDate(), 23, 59, 59, 999) : null;
  const q = slugCon(galBusca, 60);
  const filas = lista.filter(x =>
    (!d1 || x.fecha >= d1) && (!tope || x.fecha <= tope) &&
    (!q || x.cli.includes(q) || x.camp.includes(q)));

  m.innerHTML = `
    <div class="mh"><h3>Constancias de OP</h3>
      <span class="chip"><i class="i-accent"></i>${filas.length} de ${lista.length} · ${esc(dirNombre)}</span></div>
    <div class="mb">
      <div class="repfil">
        <span class="hlbl">Periodo</span>
        <input type="date" id="gal_d" value="${galDesde || ""}" autocomplete="off">
        <span class="hs">a</span>
        <input type="date" id="gal_h" value="${galHasta || ""}" autocomplete="off">
        <span class="repchips">
          ${[["semana","esta semana"],["mes","este mes"],["90","últimos 90 días"],["todo","todo"]]
            .map(([k,t]) => `<button type="button" data-gpre="${k}">${t}</button>`).join("")}
        </span>
      </div>
      <div class="repfil">
        <span class="hlbl">Cliente</span>
        <input id="gal_q" value="${esc(galBusca)}" placeholder="Escribe el nombre del cliente o de la campaña" autocomplete="off" style="flex:1;min-width:220px">
      </div>
      ${filas.length ? `<div class="galgrid" id="galgrid"></div>`
        : `<p class="empty" style="margin:6px 0">${lista.length ? "Ninguna constancia coincide con el filtro." : "Todavía no has generado ninguna constancia."}</p>`}
    </div>
    <div class="mf repmf">
      <span class="hint" id="gal_sel">Marca las que quieras eliminar</span>
      ${filas.length && !RO ? `<button class="btn" id="gal_todas">Seleccionar todas (${filas.length})</button>` : ""}
      <button class="btn alerta" id="gal_del" disabled>Eliminar seleccionadas</button>
      <button class="btn ghost" id="gal_cam">Cambiar carpeta</button>
      <button class="btn ghost" id="mcancel">Cerrar</button>
    </div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;

  const dD = document.getElementById("gal_d"), dH = document.getElementById("gal_h");
  dD.onchange = () => { galDesde = dD.value || null; modalGaleria(); };
  dH.onchange = () => { galHasta = dH.value || null; modalGaleria(); };
  m.querySelectorAll("[data-gpre]").forEach(b => b.onclick = () => {
    [galDesde, galHasta] = b.dataset.gpre === "todo" ? [null, null] : rangoPreset(b.dataset.gpre);
    modalGaleria();
  });
  const bq = document.getElementById("gal_q");
  let tq = null;
  bq.oninput = () => { clearTimeout(tq); tq = setTimeout(() => { galBusca = bq.value; modalGaleria(); }, 350); };
  document.getElementById("gal_cam").onclick = async () => { if(await pedirCarpeta()) modalGaleria(); };

  const marcadas = new Set();
  const bDel = document.getElementById("gal_del"), lbl = document.getElementById("gal_sel");
  const bTodas = document.getElementById("gal_todas");
  const refrescar = () => {
    bDel.disabled = !marcadas.size || RO;
    lbl.textContent = marcadas.size ? `${marcadas.size} seleccionada${marcadas.size === 1 ? "" : "s"}`
                                    : "Marca las que quieras eliminar";
    if(bTodas){
      const todas = marcadas.size === filas.length && filas.length > 0;
      bTodas.textContent = todas ? "Quitar la selección" : `Seleccionar todas (${filas.length})`;
      bTodas.classList.toggle("primary", todas);
    }
  };
  if(bTodas) bTodas.onclick = () => {
    const poner = marcadas.size !== filas.length;      // si ya están todas, se quitan
    marcadas.clear();
    if(poner) for(const it of filas) marcadas.add(it.nombre);
    m.querySelectorAll(".galcard").forEach(cc => {
      const cb = cc.querySelector("input");
      if(cb) cb.checked = poner;
      cc.classList.toggle("on", poner);
    });
    refrescar();
  };
  bDel.onclick = async () => {
    if(!marcadas.size) return;
    if(!confirm(`Se van a eliminar ${marcadas.size} constancia${marcadas.size === 1 ? "" : "s"} de la carpeta ${dirNombre}.\n\n` +
                `Los archivos .jpg se borran definitivamente.\n\n¿Eliminar?`)) return;
    const n2 = await borrarConstancias([...marcadas]);
    toast(`${n2} constancia${n2 === 1 ? "" : "s"} eliminada${n2 === 1 ? "" : "s"}`);
    modalGaleria();
  };

  const grid = document.getElementById("galgrid");
  if(!grid) return;
  const obs = new IntersectionObserver(async (ents) => {
    for(const e of ents){
      if(!e.isIntersecting) continue;
      obs.unobserve(e.target);
      const f = await blobConstancia(e.target.dataset.nom);
      const img = e.target.querySelector("img");
      if(f && img) img.src = urlDe(f);
      else e.target.querySelector(".gth").innerHTML = `<div class="mfalta">no está</div>`;
    }
  }, {root: m.querySelector(".mb"), rootMargin: "200px"});

  for(const it of filas){
    const cel = document.createElement("div");
    cel.className = "galcard";
    cel.dataset.nom = it.nombre;
    cel.innerHTML = `
      <div class="gth"><img alt=""></div>
      <div class="gtx">
        <b>${esc(it.cli.replace(/-/g, " "))}</b>
        ${it.camp ? `<span>${esc(it.camp.replace(/-/g, " ").toLowerCase())}</span>` : `<span class="cmp">sin campaña</span>`}
        <span class="cmp">${it.fecha.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"2-digit"})} · ${relojDe(it.fecha)} · ${esc(it.folio)}</span>
      </div>
      ${RO ? "" : `<label class="gsel"><input type="checkbox"></label>`}`;
    cel.querySelector(".gth").onclick = () => verConstancia(it, modalGaleria);
    const cb = cel.querySelector("input");
    if(cb) cb.onchange = () => { cb.checked ? marcadas.add(it.nombre) : marcadas.delete(it.nombre);
                                 cel.classList.toggle("on", cb.checked); refrescar(); };
    grid.appendChild(cel);
    obs.observe(cel);
  }
  refrescar();
}

/* ============================================================
   Control de "rentabilizado" (solo Soporte Comercial)
   Se guarda en un archivito dentro de la carpeta de constancias,
   nunca en el .json de las listas ni en el navegador.
   ============================================================ */
const CTRL_ARCHIVO = "_control soporte comercial.json";
const CTRL_VIEJO   = "_control del visor.json";   // nombre anterior: se lee si el nuevo no existe
let rentSet = new Set();          // OP ya rentabilizadas
let leidasSet = new Set();        // movimientos ya leídos
let okSet = new Set();            // valores revisados y dados por buenos
let ctrlCargado = false;

function claveRent(ev){
  if(ev.op) return "OP|" + ev.op;                       // una OP en varias pantallas = una sola fila
  return [String(ev.ts).slice(0, 16), slugCon(ev.cliente, 42), slugCon(ev.campana, 42), ev.tipo].join("|");
}
/* ============================================================
   El control de Soporte Comercial (qué OP ya se rentabilizó y en qué fila
   del Excel quedó) vive en la carpeta de constancias.

   Dos reglas que se aprendieron a la mala:

   1) NO SABER no es lo mismo que NO HAY. Chrome no conserva el permiso de
      la carpeta entre una sesión y otra: al reabrir el tablero la lectura
      falla hasta que la persona vuelve a autorizarla. Si eso se toma como
      "no hay nada rentabilizado", el tablero muestra otra vez OP que ya
      estaban hechas y se puede repetir una fila en el Excel.

   2) Nunca escribir encima de lo que no se pudo leer. Antes de guardar se
      relee el archivo y se unen las dos versiones, así lo que hizo otra
      pestaña (u otro día) no se borra. Lo único que sí desaparece es lo que
      se quitó a propósito en esta sesión.
   ============================================================ */
let ctrlLeido = false;      // el archivo se leyó de verdad (o se confirmó que no existe)
let ctrlFalta = false;      // hay carpeta, pero no se pudo leer: NO sabemos qué hay
/* lo que se quitó a propósito: no debe volver al unir con el disco */
const ctrlQuitadas = {rent:new Set(), leidas:new Set(), ok:new Set(), excel:new Set()};
function ctrlOlvidar(cual, clave){ if(ctrlQuitadas[cual]) ctrlQuitadas[cual].add(String(clave)); }
function ctrlSabemos(){ return !dirHandle ? false : ctrlLeido; }

/* Lee el archivo de control. Devuelve el objeto, {} si todavía no existe,
   o null si NO se pudo leer (que es muy distinto de que esté vacío). */
async function leerCtrlCrudo(){
  if(!dirHandle) return null;
  let fh = null;
  try{ fh = await dirHandle.getFileHandle(CTRL_ARCHIVO); }
  catch(e1){
    try{ fh = await dirHandle.getFileHandle(CTRL_VIEJO); }          // el nombre anterior
    catch(e2){
      const n1 = (e1 && e1.name) || "", n2 = (e2 && e2.name) || "";
      if(n1 === "NotFoundError" && n2 === "NotFoundError") return {};   // aún no existe
      return null;
    }
  }
  try{
    const t = (await (await fh.getFile()).text()).trim();
    if(!t) return {};
    const d = JSON.parse(t);
    return (d && typeof d === "object") ? d : null;
  }catch(e){ return null; }
}
/* Mete en memoria lo que venga del disco, sin pisar lo de esta sesión
   y sin resucitar lo que se quitó a propósito. */
function ctrlUnir(d){
  if(!d || typeof d !== "object") return;
  if(Array.isArray(d.rentabilizadas))
    for(const k of d.rentabilizadas) if(!ctrlQuitadas.rent.has(String(k))) rentSet.add(String(k));
  if(Array.isArray(d.leidas))
    for(const k of d.leidas) if(!ctrlQuitadas.leidas.has(String(k))) leidasSet.add(String(k));
  if(Array.isArray(d.validadas))
    for(const k of d.validadas) if(!ctrlQuitadas.ok.has(String(k))) okSet.add(String(k));
  if(d.excel && typeof d.excel === "object")
    for(const [k, v] of Object.entries(d.excel))
      if(!ctrlQuitadas.excel.has(String(k)) && !excelMap[k]) excelMap[k] = v;
}
async function cargarCtrl(){
  ctrlCargado = true;
  rentSet = new Set(); leidasSet = new Set(); okSet = new Set(); excelMap = {};
  if(!dirHandle){ ctrlLeido = false; ctrlFalta = false; return false; }
  if(!(await permisoCarpeta(false))){ ctrlLeido = false; ctrlFalta = true; return false; }
  const d = await leerCtrlCrudo();
  if(d === null){ ctrlLeido = false; ctrlFalta = true; return false; }   // no se pudo leer
  ctrlUnir(d);
  ctrlLeido = true; ctrlFalta = false;
  return true;
}
/* Reintenta la lectura cuando ya hay un clic de por medio (Chrome solo
   concede el permiso dentro de un gesto de la persona). */
async function recuperarCtrl(){
  if(!dirHandle) return false;
  if(!(await permisoCarpeta(true))){ ctrlFalta = true; return false; }
  const d = await leerCtrlCrudo();
  if(d === null){ ctrlFalta = true; return false; }
  ctrlUnir(d);
  ctrlLeido = true; ctrlFalta = false;
  return true;
}
async function guardarCtrl(){
  if(!dirHandle || !(await permisoCarpeta(true))) return false;
  try{
    /* siempre se relee antes de escribir: lo del disco se une a lo de aquí */
    const d = await leerCtrlCrudo();
    if(d === null && !ctrlLeido) return false;    // no se pudo leer: mejor no escribir que borrar
    if(d) ctrlUnir(d);
    ctrlLeido = true; ctrlFalta = false;
    const fh = await dirHandle.getFileHandle(CTRL_ARCHIVO, {create:true});
    await escribirEn(fh, JSON.stringify({rentabilizadas:[...rentSet], leidas:[...leidasSet],
                                         validadas:[...okSet], excel: excelMap}, null, 1));
    return true;
  }catch(e){ return false; }
}



/* ============================================================
   Registro en el Excel de rentabilidad   (solo Soporte Comercial)
   Al pulsar "Rentabilizar" la OP se escribe como una fila del
   archivo RENTABILIDAD_DE_PANTALLA_NV.xlsx que está en la carpeta
   "Calculo de rentabilidad". Se toca únicamente esa fila: el resto
   del libro (estilos, fórmulas, la otra hoja) se copia tal cual.
   ============================================================ */

const XKEY = "xlsx_rent";          // apuntador al Excel, en IndexedDB
let xlsxHandle = null;
let xlsxNombre = "";
let excelMap = {};                 // clave de OP -> {n, fila, ts}

/* ---------- utilidades de bytes ---------- */
const RX_CRC = (() => {
  const t = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function rxCrc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = RX_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function rxComprimir(u8){
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter();
  w.write(u8).catch(()=>{}); w.close().catch(()=>{});
  const r = cs.readable.getReader();
  const trozos = []; let total = 0;
  for(;;){ const {done, value} = await r.read(); if(done) break; trozos.push(value); total += value.length; }
  const out = new Uint8Array(total);
  let o = 0; for(const t of trozos){ out.set(t, o); o += t.length; }
  return out;
}
function rxU16(u8,o){ return u8[o] | (u8[o+1]<<8); }
function rxU32(u8,o){ return (u8[o] | (u8[o+1]<<8) | (u8[o+2]<<16) | (u8[o+3]<<24)) >>> 0; }

/* ---------- zip: leer todas las entradas y volverlas a armar ---------- */
function rxZipLeer(u8){
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(rxU32(u8, i) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Ese archivo no parece un Excel (.xlsx).");
  const total = rxU16(u8, eocd + 10);
  let off = rxU32(u8, eocd + 16);
  const entradas = [];
  for(let k = 0; k < total; k++){
    if(rxU32(u8, off) !== 0x02014b50) break;
    const metodo = rxU16(u8, off + 10);
    const hora   = rxU16(u8, off + 12), fecha = rxU16(u8, off + 14);
    const crc    = rxU32(u8, off + 16);
    const comp   = rxU32(u8, off + 20), orig = rxU32(u8, off + 24);
    const nLen = rxU16(u8, off + 28), eLen = rxU16(u8, off + 30), cLen = rxU16(u8, off + 32);
    const loc  = rxU32(u8, off + 42);
    const nombre = new TextDecoder("utf-8").decode(u8.subarray(off + 46, off + 46 + nLen));
    const lnLen = rxU16(u8, loc + 26), leLen = rxU16(u8, loc + 28);
    const ini = loc + 30 + lnLen + leLen;
    entradas.push({nombre, metodo, hora, fecha, crc, comp, orig, datos: u8.slice(ini, ini + comp)});
    off += 46 + nLen + eLen + cLen;
  }
  if(!entradas.length) throw new Error("El Excel viene vacío o dañado.");
  return entradas;
}
function rxZipEscribir(entradas){
  const enc = new TextEncoder();
  const partes = [], dir = [];
  let off = 0;
  for(const e of entradas){
    const nom = enc.encode(e.nombre);
    const lh = new Uint8Array(30 + nom.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);          // versión necesaria
    dv.setUint16(6, 0x0800, true);      // nombres en UTF-8, sin descriptor
    dv.setUint16(8, e.metodo, true);
    dv.setUint16(10, e.hora, true); dv.setUint16(12, e.fecha, true);
    dv.setUint32(14, e.crc, true);
    dv.setUint32(18, e.comp, true); dv.setUint32(22, e.orig, true);
    dv.setUint16(26, nom.length, true); dv.setUint16(28, 0, true);
    lh.set(nom, 30);
    partes.push(lh, e.datos);

    const ch = new Uint8Array(46 + nom.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, e.metodo, true);
    cv.setUint16(12, e.hora, true); cv.setUint16(14, e.fecha, true);
    cv.setUint32(16, e.crc, true);
    cv.setUint32(20, e.comp, true); cv.setUint32(24, e.orig, true);
    cv.setUint16(28, nom.length, true);
    cv.setUint32(42, off, true);
    ch.set(nom, 46);
    dir.push(ch);
    off += lh.length + e.datos.length;
  }
  const dirLen = dir.reduce((a, d) => a + d.length, 0);
  const fin = new Uint8Array(22);
  const fv = new DataView(fin.buffer);
  fv.setUint32(0, 0x06054b50, true);
  fv.setUint16(8, entradas.length, true); fv.setUint16(10, entradas.length, true);
  fv.setUint32(12, dirLen, true); fv.setUint32(16, off, true);
  const todo = [...partes, ...dir, fin];
  const largo = todo.reduce((a, t) => a + t.length, 0);
  const out = new Uint8Array(largo);
  let o = 0; for(const t of todo){ out.set(t, o); o += t.length; }
  return out;
}

/* ---------- la hoja: encabezados, pantallas y filas ---------- */
const RX_CAMPOS = [
  ["marca",  ["marca","cliente"]],
  ["camp",   ["campana","campaña"]],
  ["ini",    ["incio","inicio","fecha inicio"]],
  ["fin",    ["final","fin","fecha final"]],
  ["dias",   ["total dias","dias"]],
  ["frec",   ["frec total","frecuencia total","frec","frecuencia"]],
  ["precio", ["precio total","precio","total"]],
  ["prom",   ["valor prom","valor promedio","promedio"]],
  ["op",     ["n op","no op","n de op","num op","op"]],
  ["neg",    ["modalidad","donacion canje","tipo"]],
  ["coment", ["comentario","comentarios","observaciones","nota","notas"]],
];
const RX_EXTRA = [["neg", "MODALIDAD"], ["pant", "PANTALLAS"], ["coment", "COMENTARIO"]];
/* PROCE, SDM, JPABLO… ⇄ el código de la pantalla en las listas */
const RX_ALIAS = {
  proce:"PROCE", proceres:"PROCE", paseo:"PASEO", panam:"PANAM", panamericana:"PANAM",
  sdm:"SDM", salvadordelmundo:"SDM", heroe:"HEROE", heroes:"HEROE",
  benito:"BENITO", sanbenito:"BENITO", jerusa:"JERUSA", jerusalen:"JERUSA",
  jpablo:"JPABLO", juanpa:"JUANPA", juanpablo:"JPABLO", constitucion:"JPABLO",
};
function rxNorm(s){ return sinTildes(s).replace(/[\s\n\r]+/g, " ").replace(/[.:°º]/g, "").trim(); }
function rxClave(s){ return sinTildes(s).replace(/[^a-z0-9]/g, ""); }
function rxAbrev(s){ const k = rxClave(s); return RX_ALIAS[k] || k.toUpperCase(); }
function rxLetra(n){ let s = ""; while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; } return s; }
function rxNumCol(s){ let n = 0; for(const ch of s) n = n*26 + (ch.charCodeAt(0) - 64); return n; }
function rxDesXML(s){
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&");
}
function rxEscXML(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/\r/g,"").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
}
/* mapa fila -> {col: valor} solo con lo que hace falta para ubicarse */
function rxLeerCeldas(xml, compartidas){
  const filas = new Map();
  for(const m of xml.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const attrs = m[1] || "", cuerpo = m[2] || "";
    const ref = attrs.match(/r="([A-Z]+)(\d+)"/); if(!ref) continue;
    const tipo = (attrs.match(/t="([^"]+)"/) || [])[1] || "n";
    const vRaw = (cuerpo.match(/<v>([\s\S]*?)<\/v>/) || [0, null])[1];
    let val = null;
    if(tipo === "s"){ if(vRaw != null) val = compartidas[+vRaw] != null ? compartidas[+vRaw] : ""; }
    else if(tipo === "inlineStr"){ let t = ""; for(const g of cuerpo.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += g[1]; val = rxDesXML(t); }
    else if(tipo === "str"){ val = vRaw == null ? "" : rxDesXML(vRaw); }
    else if(tipo === "b"){ val = vRaw === "1"; }
    else if(tipo === "e"){ val = null; }
    else { val = (vRaw == null || vRaw === "") ? null : Number(vRaw); }
    if(val === null || val === "") continue;
    const f = +ref[2];
    if(!filas.has(f)) filas.set(f, {});
    filas.get(f)[rxNumCol(ref[1])] = typeof val === "string" ? val.trim() : val;
  }
  return filas;
}
function rxAnalizar(xml, compartidas){
  const celdas = rxLeerCeldas(xml, compartidas);
  const maxFila = Math.max(0, ...celdas.keys());
  let hRow = 0;
  for(let r = 1; r <= Math.min(maxFila, 30); r++){
    const f = celdas.get(r); if(!f) continue;
    if(Object.values(f).some(v => typeof v === "string" && rxNorm(v) === "marca")){ hRow = r; break; }
  }
  if(!hRow) throw new Error("No encontré la fila de encabezados (la que dice MARCA) en el Excel.");
  const enc = celdas.get(hRow), col = {};
  for(const [c, v] of Object.entries(enc)){
    if(typeof v !== "string") continue;
    const t = rxNorm(v);
    for(const [clave, alias] of RX_CAMPOS){ if(!col[clave] && alias.includes(t)){ col[clave] = +c; break; } }
  }
  const cp = Object.entries(enc).find(([, v]) => typeof v === "string" && rxNorm(v) === "pantallas");
  const desde = cp ? +cp[0] : Math.max(...Object.values(col)) + 1;
  const sub = celdas.get(hRow + 1) || {};
  const pantallas = [];
  for(const [c, v] of Object.entries(sub)){
    if(typeof v !== "string" || !v.trim() || +c < desde) continue;
    pantallas.push({abrev: rxAbrev(v), col: +c, colFlag: +c + 1});
  }
  /* "PANTALLAS" aparece dos veces: la que abre el bloque de casillas y, si ya se
     creó, la de texto que va al final. Solo cuenta la que está después del bloque. */
  const finBloque = Math.max(desde, ...pantallas.map(p => p.colFlag));
  for(const [c, v] of Object.entries(enc)){
    if(typeof v === "string" && rxNorm(v) === "pantallas" && +c > finBloque){ col.pant = +c; break; }
  }

  /* si el libro todavía no tiene MODALIDAD ni COMENTARIO, se apuntan para crearlas
     al final, después de la última pantalla: son columnas nuevas, no tocan nada */
  let siguiente = Math.max(...pantallas.map(p => p.colFlag), ...Object.values(col)) + 1;
  const conDatos = c => { for(const [r, f] of celdas) if(r > hRow + 1 && f[c] != null && String(f[c]).trim()) return true; return false; };
  const crear = [];
  for(const [clave, titulo] of RX_EXTRA){
    if(col[clave]) continue;
    /* MODALIDAD puede quedarse con la columna que ya venía usándose a mano para
       anotar donaciones y bonificaciones; COMENTARIO exige una columna limpia. */
    while(clave !== "neg" && conDatos(siguiente)) siguiente++;
    col[clave] = siguiente++;
    crear.push({clave, titulo, col: col[clave]});
  }

  /* filas con datos + la primera libre */
  const usadas = [], libres = [];
  const fecha = v => typeof v === "string" ? v : (typeof v === "number" ? serialRx(v) : "");
  for(let r = hRow + 2; r <= maxFila; r++){
    const f = celdas.get(r);
    const marca = f ? f[col.marca] : null;
    if(marca != null && String(marca).trim() && /[a-zA-ZÁÉÍÓÚÜÑáéíóúüñ]/.test(String(marca))){
      usadas.push({
        fila:r, n: f[col.op],
        marca: String(marca).trim(),
        camp:  String(f[col.camp] || "").trim(),
        ini: fecha(f[col.ini]), fin: fecha(f[col.fin]),
        dias: Number(f[col.dias]) || 0,
        frec: Number(f[col.frec]) || 0,
        precio: Number(f[col.precio]) || 0,
        vSpot: Number(f[col.prom]) || 0,
        neg: String(f[col.neg] || "").trim(),
        pantTxt: String(f[col.pant] || "").trim(),
        coment: String(f[col.coment] || "").trim(),
        pantallas: pantallas.filter(p => f[p.colFlag] === true).map(p => p.abrev),
      });
    } else if(celdas.has(r)) libres.push({fila:r, n: f ? f[col.op] : null});
  }
  /* el formato de la columna de valor cambia cuando la pantalla va marcada:
     se copia el que usa la última fila que la tenga en TRUE */
  for(const p of pantallas){
    for(let i = usadas.length - 1; i >= 0; i--){
      const f = celdas.get(usadas[i].fila);
      if(!f || f[p.colFlag] !== true) continue;
      const m = xml.match(new RegExp('<c r="' + rxLetra(p.col) + usadas[i].fila + '"([^>]*?)(?:/>|>)'));
      const e = m && m[1].match(/\ss="(\d+)"/);
      if(e){ p.estiloTrue = e[1]; break; }
    }
  }
  return {celdas, hRow, col, pantallas, usadas, libres, maxFila, crear};
}

/* ---------- escribir una fila ---------- */
function serialRx(n2){
  const ms = Math.round((n2 - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d)) return "";
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
function rxSerial(iso){
  const p = String(iso || "").split("-");
  if(p.length !== 3) return null;
  const t = Date.UTC(+p[0], +p[1]-1, +p[2]);
  if(isNaN(t)) return null;
  return Math.round(t / 86400000) + 25569;
}
function rxTrozoFila(xml, r){
  const re = new RegExp('<row r="' + r + '"(?:[^>]*?)(?:/>|>[\\s\\S]*?</row>)');
  const m = xml.match(re);
  return m ? {texto: m[0], i: m.index} : null;
}
function rxCelda(fila, ref){
  const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
  const m = fila.match(re);
  return m ? {todo: m[0], attrs: m[1] || "", cuerpo: m[2] || ""} : null;
}
function rxEstilo(attrs){ const m = attrs.match(/\ss="(\d+)"/); return m ? ` s="${m[1]}"` : ""; }
function rxFormula(cuerpo){ const m = cuerpo.match(/<f\b[\s\S]*?<\/f>|<f\b[^>]*\/>/); return m ? m[0] : ""; }
/* deja la celda con la fórmula que ya tenía y le pone el valor calculado */
function rxPoner(fila, ref, hacer){
  const c = rxCelda(fila, ref);
  if(!c) return fila;
  return fila.replace(c.todo, hacer(rxEstilo(c.attrs), rxFormula(c.cuerpo)));
}
function rxTexto(fila, ref, valor){
  return rxPoner(fila, ref, s => valor === "" ? `<c r="${ref}"${s}/>`
    : `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${rxEscXML(valor)}</t></is></c>`);
}
function rxNumero(fila, ref, valor){
  return rxPoner(fila, ref, s => (valor === null || valor === undefined || !isFinite(valor))
    ? `<c r="${ref}"${s}/>` : `<c r="${ref}"${s} t="n"><v>${valor}</v></c>`);
}
function rxFormulaNum(fila, ref, valor, estilo){
  return rxPoner(fila, ref, (s, f) => {
    const st = estilo ? ` s="${estilo}"` : s;
    return (valor === null || !isFinite(valor))
      ? `<c r="${ref}"${st} t="str">${f}<v></v></c>`
      : `<c r="${ref}"${st} t="n">${f}<v>${valor}</v></c>`;
  });
}
function rxBooleano(fila, ref, valor){
  return rxPoner(fila, ref, (s, f) =>
    `<c r="${ref}"${s} t="b"><f aca="false">${valor ? "TRUE" : "FALSE"}()</f><v>${valor ? 1 : 0}</v></c>`);
}
/* pone una celda que puede no existir todavía (columnas nuevas al final de la fila) */
function rxPonerNueva(fila, ref, celda){
  const c = rxCelda(fila, ref);
  if(c) return fila.replace(c.todo, celda);
  if(/<\/row>\s*$/.test(fila)) return fila.replace(/<\/row>\s*$/, celda + "</row>");
  return fila.replace(/\/>\s*$/, ">" + celda + "</row>");   // la fila venía vacía: <row .../>
}
function rxTextoLibre(fila, ref, valor){
  return rxPonerNueva(fila, ref, String(valor || "").trim() === ""
    ? `<c r="${ref}"/>`
    : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${rxEscXML(valor)}</t></is></c>`);
}
/* deja escritos los encabezados de las columnas nuevas */
function rxCrearColumnas(xml, an){
  if(!an.crear || !an.crear.length) return xml;
  const t = rxTrozoFila(xml, an.hRow);
  if(!t) return xml;
  let fila = t.texto;
  /* copia el estilo del encabezado de MARCA para que se vean igual */
  const ref0 = rxLetra(an.col.marca) + an.hRow;
  const c0 = rxCelda(fila, ref0);
  const est = c0 ? rxEstilo(c0.attrs) : "";
  for(const x of an.crear){
    const ref = rxLetra(x.col) + an.hRow;
    fila = rxPonerNueva(fila, ref,
      `<c r="${ref}"${est} t="inlineStr"><is><t>${rxEscXML(x.titulo)}</t></is></c>`);
  }
  an.crear = [];
  return xml.slice(0, t.i) + fila + xml.slice(t.i + t.texto.length);
}

/* ============================================================
   Agregar filas nuevas al final de la hoja
   La hoja traía filas ya formateadas de reserva; cuando se acaban no hay que
   pedirle a nadie que abra el Excel: se clona la última fila con datos (que
   trae los estilos y las fórmulas de la casa) y se deja lista y vacía.
   Ojo con las fórmulas compartidas de Excel (<f t="shared" si="..">): solo
   valen dentro del rango que declaró su fila maestra, así que en la fila nueva
   se escriben como fórmula normal, ya trasladada a ese número de fila.
   ============================================================ */
/* Sube o baja las filas de una fórmula: (E240-D240)+1 → (E241-D241)+1.
   Las referencias fijadas con $ no se tocan, ni lo que va entre comillas. */
function rxCorrerFormula(txt, delta){
  if(!txt || !delta) return txt || "";
  let out = "", i = 0;
  const partes = String(txt).split(/("(?:[^"]|"")*")/);        // fuera los textos entre comillas
  for(const p of partes){
    if(p.startsWith('"')){ out += p; continue; }
    out += p.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g, (m, d1, col, d2, fila) =>
      d2 ? m : `${d1}${col}${d2}${Math.max(1, +fila + delta)}`);
  }
  return out;
}
/* La fórmula que le toca a una celda de la fila nueva, sacada de la fila modelo:
   si era compartida se busca su maestra para copiar el texto de verdad. */
function rxFormulaPara(xml, cuerpo, filaModelo, filaNueva, col){
  const fm = cuerpo.match(/<f\b([^>]*)(?:\/>|>([\s\S]*?)<\/f>)/);
  /* si a la fila modelo le borraron la fórmula, se recupera la de la columna */
  if(!fm) return col ? rxFormulaDeColumna(xml, col, filaNueva) : "";
  const attrs = fm[1] || "", texto = fm[2] || "";
  const comp = attrs.match(/\st="shared"/);
  if(!comp) return texto ? `<f>${rxCorrerFormula(texto, filaNueva - filaModelo)}</f>` : "";
  const si = (attrs.match(/\ssi="(\d+)"/) || [])[1];
  if(si == null) return "";
  /* la maestra es la que declara el rango: de ahí sale el texto */
  const re = new RegExp('<c r="([A-Z]{1,3})(\\d+)"[^>]*>\\s*<f t="shared" ref="[^"]*" si="' + si + '"[^>]*>([\\s\\S]*?)</f>');
  const mm = xml.match(re);
  if(!mm) return "";
  return `<f>${rxCorrerFormula(mm[3], filaNueva - +mm[2])}</f>`;
}
/* La fórmula que usa una columna, tomada de la maestra de su rango compartido. */
function rxFormulaDeColumna(xml, col, filaNueva){
  const re = new RegExp('<c r="' + col + '(\\d+)"[^>]*>\\s*<f t="shared" ref="' + col + '[^"]*" si="\\d+"[^>]*>([\\s\\S]*?)</f>', "g");
  let ultima = null;
  for(const m of xml.matchAll(re)) ultima = m;        // la más abajo: la más reciente
  if(!ultima) return "";
  return `<f>${rxCorrerFormula(ultima[2], filaNueva - +ultima[1])}</f>`;
}
/* Clona la fila modelo en la fila r: mismos estilos y fórmulas, sin datos. */
function rxClonarFila(xml, filaModelo, r){
  const t = rxTrozoFila(xml, filaModelo);
  if(!t) throw new Error(`No encontré la fila ${filaModelo} para tomarla de modelo.`);
  const celdas = [];
  for(const m of t.texto.matchAll(/<c r="([A-Z]{1,3})(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const est = (m[3].match(/\ss="(\d+)"/) || [])[0] || "";
    const f = rxFormulaPara(xml, m[4] || "", filaModelo, r, m[1]);
    celdas.push(f ? `<c r="${m[1]}${r}"${est}>${f}</c>` : `<c r="${m[1]}${r}"${est}/>`);
  }
  const attrs = (t.texto.match(/^<row r="\d+"([^>]*?)\/?>/) || [0, ""])[1]
                  .replace(/\s(hidden|customHeight)="[^"]*"/g, "");
  const nueva = `<row r="${r}"${attrs}>${celdas.join("")}</row>`;
  /* si ya existía una fila con ese número (vacía, solo con formatos) se reemplaza */
  const vieja = rxTrozoFila(xml, r);
  if(vieja) return xml.slice(0, vieja.i) + nueva + xml.slice(vieja.i + vieja.texto.length);
  /* si no, se mete en su lugar: las filas van en orden dentro de sheetData */
  let corte = -1;
  for(const m of xml.matchAll(/<row r="(\d+)"/g)){ if(+m[1] > r){ corte = m.index; break; } }
  if(corte < 0) corte = xml.indexOf("</sheetData>");
  if(corte < 0) throw new Error("La hoja no tiene sheetData; no puedo agregar la fila.");
  return xml.slice(0, corte) + nueva + xml.slice(corte);
}
/* deja la hoja diciendo hasta dónde llega y pide a Excel recalcular al abrir */
function rxEstirarHoja(xml, r){
  return xml.replace(/<dimension ref="([A-Z]{1,3})(\d+):([A-Z]{1,3})(\d+)"\s*\/>/,
    (m, c1, r1, c2, r2) => +r2 >= r ? m : `<dimension ref="${c1}${r1}:${c2}${r}"/>`);
}
/* La fila donde se va a escribir la próxima OP: la primera de reserva que
   quede libre y, si ya no hay, una nueva clonada al final. */
function rxFilaParaNueva(xml, an){
  const ultima = an.usadas.length ? an.usadas[an.usadas.length - 1].fila : an.hRow + 1;
  const libre = an.libres.find(x => x.fila > ultima);
  const n = an.usadas.reduce((a, u) => Math.max(a, +u.n || 0), 0) + 1;
  if(libre) return {xml, fila: libre.fila, n: libre.n != null ? libre.n : n};
  if(!an.usadas.length)
    throw new Error("La hoja está vacía: escribe la primera OP a mano para que el archivo tenga un modelo de fila.");
  const fila = ultima + 1;
  let x2 = rxClonarFila(xml, ultima, fila);
  x2 = rxEstirarHoja(x2, fila);
  return {xml: x2, fila, n, agregada: true};
}

/* escribe un número solo si la celda todavía no trae valor (el N° de OP de las
   filas de reserva ya venía puesto; el de una fila nueva hay que ponerlo) */
function rxNumeroSiFalta(fila, ref, valor){
  if(valor === null || valor === undefined) return fila;
  const c = rxCelda(fila, ref);
  if(c && /<v>[\s\S]*?<\/v>/.test(c.cuerpo || "")) return fila;
  return rxNumero(fila, ref, valor);
}
/* arma la fila r del Excel con los datos de la OP */
function rxArmarFila(xml, r, an, d, nOP){
  xml = rxCrearColumnas(xml, an);
  const t = rxTrozoFila(xml, r);
  if(!t) throw new Error(`La fila ${r} no existe en la hoja.`);
  let fila = t.texto;
  const L = n => rxLetra(n);
  if(an.col.op) fila = rxNumeroSiFalta(fila, L(an.col.op) + r, nOP);
  fila = rxTexto  (fila, L(an.col.marca) + r, d.marca);
  fila = rxTexto  (fila, L(an.col.camp)  + r, d.camp);
  fila = rxNumero (fila, L(an.col.ini)   + r, rxSerial(d.ini));
  fila = rxNumero (fila, L(an.col.fin)   + r, rxSerial(d.fin));
  fila = rxNumero (fila, L(an.col.frec)  + r, d.frec || null);
  fila = rxNumero (fila, L(an.col.precio)+ r, d.precio || null);
  if(an.col.dias) fila = rxFormulaNum(fila, L(an.col.dias) + r, d.dias || null);
  if(an.col.prom) fila = rxFormulaNum(fila, L(an.col.prom) + r, d.vSpot);
  for(const p of an.pantallas){
    const on = d.pantallas.includes(p.abrev);
    fila = rxBooleano(fila, L(p.colFlag) + r, on);
    fila = rxFormulaNum(fila, L(p.col) + r, on ? d.vSpot : null, on ? p.estiloTrue : null);
  }
  if(an.col.neg)    fila = rxTextoLibre(fila, L(an.col.neg) + r, d.neg || "");
  if(an.col.pant)   fila = rxTextoLibre(fila, L(an.col.pant) + r, (d.pantallas || []).join(", "));
  if(an.col.coment) fila = rxTextoLibre(fila, L(an.col.coment) + r, d.coment || "");
  return xml.slice(0, t.i) + fila + xml.slice(t.i + t.texto.length);
}

/* ---------- lo que se va a escribir, sacado de la OP ---------- */
function rxDatosOP(ev){
  const ubs = ubicacionesConstancia({cliente: ev.cliente, campana: ev.campana});
  const vv  = valoresCliente(ev.cliente, ev.campana);
  const dias = diasVigencia(ev.inicio, ev.fin);
  const frec = ubs.reduce((a, u) => a + n(u.frec), 0);
  const precio = vv.total === null ? 0 : vv.total;
  const spots = (dias && frec) ? dias * frec : 0;
  const codigos = [];
  for(const u of ubs){
    const p = DB.pantallas.find(x => mismoTexto(x.nombre, u.pantalla));
    codigos.push(rxAbrev(p ? (p.codigo || p.nombre) : u.pantalla));
  }
  return {
    marca: String(ev.cliente || "").trim(),
    camp:  String(campanaActual(ev.cliente, ev.campana) || "").trim(),
    ini: ev.inicio || "", fin: ev.fin || "",
    dias: dias || null, frec, precio,
    vSpot: (precio && spots) ? precio / spots : null,
    pantallas: codigos, ubs, sinPrecio: vv.total === null,
    /* MODALIDAD: si toda la OP es de un tipo va el nombre solo; si es mezcla
       va cada tipo con las pantallas a las que aplica ("Bonificación: PASEO"). */
    negCod: vv.neg, negR: vv.negR, neg: negTexto(ev.cliente, ev.campana, true),
    coment: typeof comentariosTexto === "function" ? comentariosTexto(ev) : "",
  };
}
/* ¿esta OP ya está en el Excel? por lo apuntado en el control, o por marca+inicio */
/* La misma marca aunque cambien tildes, puntos o espacios: "NESTLÉ", "NESTLE"
   y "Nestle S.A" son el mismo cliente para efectos de buscar su fila. */
function rxMismaMarca(a, b){
  const limpia = s => sinTildes(String(s || ""))
    .replace(/&amp;/g, "&").replace(/[^a-z0-9]/g, "");
  const x = limpia(a), y = limpia(b);
  return !!x && x === y;
}
function rxBuscarFila(an, d, clave, opc){
  /* una decisión explícita manda sobre todo */
  if(opc && opc.modo === "nueva") return null;
  if(opc && opc.modo === "actualizar" && opc.fila){
    const u = an.usadas.find(x => x.fila === opc.fila);
    if(u) return u;
  }
  const g = excelMap[clave];
  if(g && g.fila){
    const u = an.usadas.find(x => x.fila === g.fila);
    if(u && rxMismaMarca(u.marca, d.marca)) return u;
  }
  return an.usadas.find(u => rxMismaMarca(u.marca, d.marca) && (u.ini || "") === (d.ini || "")) || null;
}
/* ============================================================
   Cuando la campaña YA tiene una fila en el Excel
   Un cambio posterior de Producción puede ser dos cosas distintas y solo
   quien revisa lo sabe: una corrección de la pauta que ya se registró, o
   pauta adicional que el cliente compró. Se pregunta, con una recomendación.
   ============================================================ */
/* La fila que esta campaña ya ocupa, venga del control o del propio Excel. */
function rxFilaDeLaCampana(an, ev, d, clave){
  /* 1) alguna otra novedad de la misma campaña que ya se rentabilizó */
  if(typeof claveDeCampana === "function" && typeof movimientosOP === "function"){
    const g = claveDeCampana(ev.cliente, ev.campana);
    for(const otro of bitacora()){
      if(!RES_TIPOS.includes(otro.tipo)) continue;
      if(claveDeCampana(otro.cliente, otro.campana) !== g) continue;
      const k = claveRent(otro);
      if(k === clave) continue;
      const g2 = excelMap[k];
      if(!g2 || !g2.fila) continue;
      const u = an.usadas.find(x => x.fila === g2.fila);
      if(u && rxMismaMarca(u.marca, d.marca)) return u;
    }
  }
  /* 2) o una fila del Excel que sea claramente ESTA misma pauta: la misma marca y,
        además, el mismo nombre de campaña o el mismo inicio. Con la marca sola no
        basta: un cliente grande tiene muchas filas viejas y no hay que ofrecer
        sobrescribir la equivocada. */
  const cand = an.usadas.filter(u => rxMismaMarca(u.marca, d.marca) && (
    (d.camp && rxMismaMarca(u.camp, d.camp)) || ((u.ini || "") === (d.ini || ""))));
  return cand.find(u => rxSeTocan(u, d)) || null;
}
/* ¿las dos vigencias se pisan? (entonces es la misma pauta, corregida) */
function rxSeTocan(u, d){
  const a1 = parseISO(u.ini), b1 = parseISO(u.fin);
  const a2 = parseISO(d.ini), b2 = parseISO(d.fin);
  if(!a1 || !b1 || !a2 || !b2) return (u.ini || "") === (d.ini || "");
  return a1 <= b2 && a2 <= b1;
}
/* Qué conviene hacer, y por qué. */
function rxQueConviene(u, d){
  if(rxSeTocan(u, d))
    return {modo:"actualizar",
            razon:"las dos vigencias se pisan, así que es la misma pauta con la fecha corregida"};
  return {modo:"nueva",
          razon:"la vigencia nueva empieza después de la que ya está registrada, así que parece pauta aparte"};
}

/* ---------- el archivo ---------- */
async function rxPermiso(escribir){
  if(!xlsxHandle) return false;
  const modo = {mode: escribir ? "readwrite" : "read"};
  try{
    if(await xlsxHandle.queryPermission(modo) === "granted") return true;
    return (await xlsxHandle.requestPermission(modo)) === "granted";
  }catch(e){ return false; }
}
async function rxConectar(){
  if(typeof window.showOpenFilePicker !== "function"){
    alert("Este navegador no permite elegir archivos de la carpeta. Usa Chrome o Edge de escritorio.");
    return false;
  }
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:"Excel de rentabilidad",
              accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}],
      multiple:false,
    });
    xlsxHandle = h; xlsxNombre = h.name;
    await idbSet(XKEY, h);
    toast("Excel de rentabilidad conectado");
    return true;
  }catch(e){ if(e && e.name !== "AbortError") toast("No se pudo abrir: " + e.message); return false; }
}
async function rxIniciar(){
  if(!RO || !HAS_FSA) return;
  const h = await idbGet(XKEY);
  if(h){ xlsxHandle = h; xlsxNombre = h.name || "RENTABILIDAD_DE_PANTALLA_NV.xlsx"; }
}
/* abre el libro y deja listo el análisis de la hoja de rentabilidad */
async function rxAbrir(){
  const file = await xlsxHandle.getFile();
  const u8 = new Uint8Array(await file.arrayBuffer());
  const entradas = rxZipLeer(u8);
  const dec = new TextDecoder("utf-8");
  const texto = async e => dec.decode(e.metodo === 0 ? e.datos : await inflar(e.datos, "deflate-raw"));

  const eWb = entradas.find(e => e.nombre === "xl/workbook.xml");
  const eRl = entradas.find(e => e.nombre === "xl/_rels/workbook.xml.rels");
  if(!eWb) throw new Error("El Excel no trae la lista de hojas.");
  const wb = await texto(eWb), rl = eRl ? await texto(eRl) : "";
  const rels = new Map();
  for(const m of rl.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)) rels.set(m[1], m[2]);
  let destino = null;
  const hojas = [];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/>/g)){
    const nombre = rxDesXML((m[1].match(/name="([^"]*)"/) || [0,""])[1]);
    const rid = (m[1].match(/r:id="([^"]*)"/) || [0,""])[1];
    const tgt = "xl/" + (rels.get(rid) || "").replace(/^\/?xl\//, "").replace(/^\//, "");
    if(entradas.some(e => e.nombre === tgt)) hojas.push({nombre, tgt});
  }
  destino = hojas.find(h => /rentabilidad/.test(sinTildes(h.nombre)) && !/copia/.test(sinTildes(h.nombre)))
         || hojas[0];
  if(!destino) throw new Error("No encontré una hoja de rentabilidad en el Excel.");

  const eSs = entradas.find(e => e.nombre === "xl/sharedStrings.xml");
  const compartidas = [];
  if(eSs){
    const ss = await texto(eSs);
    for(const m of ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)){
      let t = ""; for(const g of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += g[1];
      compartidas.push(rxDesXML(t));
    }
  }
  const eHoja = entradas.find(e => e.nombre === destino.tgt);
  const xml = await texto(eHoja);
  return {entradas, eHoja, xml, an: rxAnalizar(xml, compartidas), hoja: destino.nombre, file,
          eWb, wb};
}
/* deja el libro escrito en disco con la hoja cambiada */
/* mete un texto ya comprimido en una entrada del zip */
async function rxPonerEntrada(entrada, texto){
  const bytes = new TextEncoder().encode(texto);
  const comp = await rxComprimir(bytes);
  entrada.metodo = 8;
  entrada.datos  = comp;
  entrada.comp   = comp.length;
  entrada.orig   = bytes.length;
  entrada.crc    = rxCrc32(bytes);
}
async function rxGuardar(libro, xmlNuevo){
  await rxPonerEntrada(libro.eHoja, xmlNuevo);
  /* Cuando se agregó una fila nueva, sus fórmulas no están en el índice de
     cálculo que Excel guarda aparte: se le pide recalcular todo al abrir. */
  if(libro.recalcular && libro.eWb && libro.wb){
    let wb = libro.wb;
    if(/<calcPr\b/.test(wb)){
      if(!/fullCalcOnLoad="1"/.test(wb))
        wb = wb.replace(/<calcPr\b([^>]*?)\/>/, (m, at) => `<calcPr${at} fullCalcOnLoad="1"/>`);
    } else {
      wb = wb.replace("</workbook>", '<calcPr fullCalcOnLoad="1"/></workbook>');
    }
    if(wb !== libro.wb){ await rxPonerEntrada(libro.eWb, wb); libro.wb = wb; }
    libro.recalcular = false;
  }
  const zip = rxZipEscribir(libro.entradas);
  await escribirEn(xlsxHandle, zip);
  return zip.length;
}

/* ============================================================
   El histórico: todas las OP que ya están escritas en el Excel
   ============================================================ */
let rxHist = null;              // {filas, pantallas, hoja, cuando}
let rxCargando = false;
let rxHistEstado = "";          // sinexcel | permiso | leyendo | listo | error
let rxHistError = "";
/* Chrome solo concede el permiso del archivo si la petición sale de un clic.
   Al arrancar se intenta sin pedir nada; si hace falta permiso se avisa y el
   usuario lo autoriza con el botón (eso sí cuenta como clic). */
async function rxCargarHist(forzar, conGesto){
  if(!xlsxHandle){ rxHistEstado = "sinexcel"; return null; }
  if(rxCargando) return rxHist;
  if(rxHist && !forzar) return rxHist;
  let perm = "prompt";
  try{ perm = await xlsxHandle.queryPermission({mode:"read"}); }catch(e){}
  if(perm !== "granted"){
    if(!conGesto){ rxHistEstado = "permiso"; return null; }
    try{ perm = await xlsxHandle.requestPermission({mode:"read"}); }catch(e){ perm = "denied"; }
    if(perm !== "granted"){ rxHistEstado = "permiso"; return null; }
  }
  rxCargando = true; rxHistEstado = "leyendo";
  try{
    const libro = await rxAbrir();
    rxHist = {filas: libro.an.usadas, pantallas: libro.an.pantallas,
              an: libro.an, hoja: libro.hoja, cuando: new Date()};
    rxHistEstado = "listo";
  }catch(e){ rxHist = null; rxHistEstado = "error"; rxHistError = (e && e.message) || "error al leer"; }
  rxCargando = false;
  return rxHist;
}
/* la línea que explica en qué va el histórico, según el estado */
function rxHistAviso(){
  if(rxHist) return `Busca en las listas y en el histórico del Excel

    ${esc(rxHistError)}</span>

  if(xlsxHandle) return `El navegador necesita tu permiso para leer

    <button type="button" class="btn sm primary" id="bus_perm" style="margin-left:6px">Permitir y leer el histórico</button>`;

}
function rxBuscarHist(q){
  if(!rxHist) return [];
  const t = sinTildes(q).trim();
  if(!t) return [];
  return rxHist.filas.filter(f => sinTildes(f.marca).includes(t) || sinTildes(f.camp).includes(t))
    .sort((a, b) => String(b.ini).localeCompare(String(a.ini)));
}
function rxNombrePantalla(abrev){
  const p = DB.pantallas.find(x => rxAbrev(x.codigo || x.nombre) === abrev);

/* deja la fila en blanco, como estaba antes de registrarse */
async function rxBorrarFila(clave, ev){
  if(!xlsxHandle) throw new Error("Conecta primero el Excel de rentabilidad.");
  if(!(await rxPermiso(true))) throw new Error("El navegador no dio permiso para escribir en el Excel.");
  const libro = await rxAbrir();
  const an = libro.an;
  const d = ev ? rxDatosOP(ev) : {marca:"", ini:""};
  const ya = rxBuscarFila(an, d, clave);
  if(!ya) throw new Error("Esa OP ya no está en el Excel.");
  const vacio = {marca:"", camp:"", ini:"", fin:"", dias:null, frec:0, precio:0, vSpot:null, pantallas:[]};
  const xml = rxArmarFila(libro.xml, ya.fila, an, vacio);
  const chk = rxTrozoFila(xml, ya.fila);
  if(!chk || (d.marca && chk.texto.indexOf(rxEscXML(d.marca)) >= 0))
    throw new Error("No se pudo vaciar la fila; revisa el Excel.");
  await rxGuardar(libro, xml);
  return {fila: ya.fila, n: ya.n};
}
/* Si la OP ya tiene fila en el Excel, se rescribe completa con los datos de
   ahora: modalidad, pantallas, fechas, frecuencia, precio y comentarios.
   Devuelve la fila tocada, o null si no había fila o no se pudo escribir. */
async function rxRefrescarFila(clave, ev){
  try{
    if(!xlsxHandle) return null;
    const d = rxDatosOP(ev);
    if(!filaExcelDe(clave, ev)) return null;
    if(!(await rxPermiso(true))) return null;
    const libro = await rxAbrir();
    const ya = rxBuscarFila(libro.an, d, clave);
    if(!ya) return null;
    const xml = rxArmarFila(libro.xml, ya.fila, libro.an, d);
    await rxGuardar(libro, xml);
    excelMap[clave] = {n: ya.n, fila: ya.fila, ts: new Date().toISOString()};
    if(rxHist) await rxCargarHist(true, true);
    return {fila: ya.fila, n: ya.n};
  }catch(e){ return null; }
}
/* refresca solo la celda de comentario (y la de modalidad) de una OP ya registrada */
async function rxActualizarComentario(clave, ev){
  const g = excelMap[clave];
  if(!g || !xlsxHandle) return null;
  if(!(await rxPermiso(true))) return null;
  const libro = await rxAbrir();
  const an = libro.an;
  const d = rxDatosOP(ev);
  const ya = rxBuscarFila(an, d, clave);
  if(!ya) return null;
  let xml = rxCrearColumnas(libro.xml, an);
  const t = rxTrozoFila(xml, ya.fila);
  if(!t) return null;
  let fila = t.texto;
  if(an.col.coment) fila = rxTextoLibre(fila, rxLetra(an.col.coment) + ya.fila, d.coment || "");
  if(an.col.neg)    fila = rxTextoLibre(fila, rxLetra(an.col.neg) + ya.fila, d.neg || "");
  if(an.col.pant)   fila = rxTextoLibre(fila, rxLetra(an.col.pant) + ya.fila, (d.pantallas || []).join(", "));
  xml = xml.slice(0, t.i) + fila + xml.slice(t.i + t.texto.length);
  await rxGuardar(libro, xml);
  return {fila: ya.fila};
}
/* escribe de verdad */
async function rxRegistrar(ev, clave, d, opc){
  if(!xlsxHandle) throw new Error("Conecta primero el Excel de rentabilidad.");
  if(!(await rxPermiso(true))) throw new Error("El navegador no dio permiso para escribir en el Excel.");
  const libro = await rxAbrir();
  const an = libro.an;
  const ya = rxBuscarFila(an, d, clave, opc);
  let fila, n, nueva, base = libro.xml, agregada = false;
  if(ya){ fila = ya.fila; n = ya.n; nueva = false; }
  else{
    /* Última red: si ya hay una fila con la misma marca y exactamente la misma
       vigencia, escribir otra sería duplicarla. Solo se permite si alguien lo
       pidió a propósito ("Ingresar como OP nueva"). */
    if(!(opc && opc.modo === "nueva")){
      const gemela = an.usadas.find(u => rxMismaMarca(u.marca, d.marca) &&
        (u.ini || "") === (d.ini || "") && (u.fin || "") === (d.fin || ""));
      if(gemela) throw new Error(
        `El Excel ya tiene esta misma pauta en la fila ${gemela.fila} (OP ${gemela.n}): ` +
        `${gemela.marca}${gemela.camp ? " · " + gemela.camp : ""}, de ${fmt(gemela.ini)} a ${fmt(gemela.fin)}. ` +
        `Si de verdad es otra pauta, usa "Ingresar como OP nueva".`);
    }
    /* si se acabaron las filas de reserva, se agrega una nueva al final */
    const hueco = rxFilaParaNueva(base, an);
    base = hueco.xml; fila = hueco.fila; n = hueco.n; nueva = true;
    agregada = !!hueco.agregada;
    if(agregada) libro.recalcular = true;
  }
  const xml = rxArmarFila(base, fila, an, d, n);
  const chk = rxTrozoFila(xml, fila);          // la fila quedó con la marca dentro
  if(!chk || (d.marca && chk.texto.indexOf(rxEscXML(d.marca)) < 0))
    throw new Error("No se pudo componer la fila; revisa el formato del Excel.");
  await rxGuardar(libro, xml);
  excelMap[clave] = {n, fila, ts: new Date().toISOString()};
  /* el histórico en memoria queda al día: la próxima búsqueda ya ve esta fila */
  try{ await rxCargarHist(true, false); }catch(e){}
  return {fila, n, nueva, agregada, hoja: libro.hoja};
}

   notificaciones y rentabilidad), aunque la campaña siga al aire hasta que
   Producción la quite de la lista de reproducción. */
function opEliminada(clave){
  return avisos().some(a => a.tipo === "baja" && a.clave === clave);

    (Array.isArray(a.ids) && a.ids.includes(c.id)) ||
    (mismoTexto(a.cliente, c.cliente) && (!a.campana || mismoTexto(a.campana, c.campana || "")))));

  if(RO) return "";

function comentariosDe(c){
  return avisos().filter(a => a.tipo === "coment" && (
    (Array.isArray(a.ids) && a.ids.includes(c.id)) ||
    (mismoTexto(a.cliente, c.cliente) && (!a.campana || mismoTexto(a.campana, c.campana || "")))))
    .sort((a, b) => String(a.ts).localeCompare(String(b.ts)));

/* texto plano de los comentarios, para la columna del Excel */
function comentariosTexto(ev){
  const cm = comentarios(claveDeCampana(ev.cliente, ev.campana));

/* clave estable de una campaña para agrupar sus avisos */
function claveDeCampana(cliente, campana){

/* Soporte Comercial escribe el aviso dentro del archivo de datos */
async function emitirAviso(av){
  return escribirComoVisor(fresco => {
    if(!Array.isArray(fresco.avisos)) fresco.avisos = [];
    fresco.avisos.unshift(Object.assign({
      id: uid(), ts: new Date().toISOString(), visto: false, hecho: false,
    }, av));
    if(fresco.avisos.length > MAX_AVISOS) fresco.avisos.length = MAX_AVISOS;
    return 1;
  });
}

   ============================================================ */
let busOP = "", busVerBajas = false;
/* todas las OP de la bitácora, sin filtro de fecha, del cliente buscado */
function buscarOP(q){
  const t = sinTildes(q).trim();
  if(!t) return [];
  const vivos = clientesVivos(), vistos = new Set(), out = [];
  for(const ev of bitacora()){
    if(!RES_TIPOS.includes(ev.tipo)) continue;
    const cli = String(ev.cliente || "").trim();
    if(!cli || !vivos.has(cli.toUpperCase())) continue;
    if(!sinTildes(cli).includes(t) && !sinTildes(campanaActual(cli, ev.campana)).includes(t)) continue;
    const k = claveRent(ev);
    if(vistos.has(k)) continue;
    if(!busVerBajas && opEliminada(k)) continue;
    vistos.add(k);
    out.push(ev);
  }
  return out.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));   // lo más nuevo primero
}

      <td>${f.pantallas.length ? `<div class="plist">${f.pantallas.map(a2 =>
            `<span>${esc(rxNombrePantalla(a2))}</span>`).join("")}</div>` : `<span class="cmp">sin pantalla</span>`}</td>
      <td class="num">${esc(fmt(f.ini)) || "—"}</td>
      <td class="num">${esc(fmt(f.fin)) || "—"}</td>
      <td class="num money"><b>${f.precio ? money(f.precio) : "—"}</b></td>
      <td><span class="cmp">Excel · OP ${esc(f.n)} · fila ${f.fila}</span>${
        f.coment ? `<div class="cmp" title="${esc(f.coment)}">💬 ${esc(f.coment.slice(0, 40))}${f.coment.length > 40 ? "…" : ""}</div>` : ""}</td>
      <td><div class="acc2">
        <button class="btn sm" data-filax="${f.fila}"
          title="Cambiar los datos de esta OP en el Excel">${AV_ICO.cambio}Editar OP</button>

          title="Vaciar la fila de esta OP en el Excel">${AV_ICO.baja}Eliminar OP</button>
      </div></td></tr>`;
  }
  h += `</tbody></table></div>
    <p class="hint" style="margin-top:8px">Al eliminar una OP desaparece de Soporte Comercial, del Reporte OP y de
      rentabilidad, pero <b>la campaña sigue al aire</b>: <b>DOOH - Producción</b> recibe el aviso
      para quitarla de la lista de reproducción cuando corresponda.</p>`;
  return h;
}
/* La OP a la que pertenece una campaña: se busca su movimiento en la bitácora
   para que la clave sea la misma que usa el buscador; si no lo tiene, se usa
   una clave estable derivada del cliente y la campaña. */
function opYClave(c){
  let mejor = null;
  for(const e of bitacora()){
    if(!RES_TIPOS.includes(e.tipo)) continue;
    if(!mismoTexto(e.cliente, c.cliente)) continue;
    if(e.campana && c.campana && !mismoTexto(e.campana, c.campana)) continue;
    if(!mejor || String(e.ts) > String(mejor.ts)) mejor = e;
  }
  if(mejor) return {ev: mejor, clave: claveRent(mejor)};
  return {
    ev: {tipo:"alta", ts: new Date().toISOString(), cliente: c.cliente,
         campana: c.campana || "", inicio: c.inicio, fin: c.fin, op: null},
    clave: claveDeCampana(c.cliente, c.campana),
  };
}
/* ¿esta OP tiene una fila en el Excel? por lo apuntado o por el histórico leído */
function filaExcelDe(clave, ev){
  const g = excelMap[clave];
  if(g) return g;
  if(typeof rxHist !== "undefined" && rxHist){
    const f = rxHist.filas.find(x => mismoTexto(x.marca, ev.cliente) && (x.ini || "") === (ev.inicio || ""));
    if(f) return {n: f.n, fila: f.fila};
  }
  return null;
}

async function quitarBaja(clave){
  const r = await escribirComoVisor(fresco => {
    const a = (fresco.avisos || []).filter(x => x.tipo === "baja" && x.clave === clave);
    if(!a.length) return false;
    for(const x of a) fresco.avisos.splice(fresco.avisos.indexOf(x), 1);
    return a.length;
  });
  if(r.ok){ render(); toast("OP restaurada · la fila del Excel no se repone sola"); }
  else toast("No se pudo restaurar: " + (r.motivo || ""));
}

/* ---------- visor: cambiar los datos de la OP ---------- */
/* Puede corregir cliente, campaña, fechas, spots por día, arte y donación/canje.
   No puede crear OP nuevas ni moverlas de lista de reproducción: por eso los
   spots solo se aceptan si caben en la sublista donde la campaña ya está. */
function modalEditarOP(ev, clave){
  const filas = campanasDe(ev.cliente, ev.campana);
  const m = document.getElementById("modal");
  m.className = "modal ancho";
  if(!filas.length){
    m.innerHTML = `<div class="mh"><h3>Cambiar la OP</h3></div>
      <div class="mb"><p class="empty">Esta OP ya no está en ninguna lista.</p></div>
      <div class="mf"><button class="btn ghost" id="mcancel">Cerrar</button></div>`;
    document.getElementById("ov").hidden = false;
    document.getElementById("mcancel").onclick = closeModal;
    return;
  }
  const c0 = filas[0].c;
  /* Tope de cada pantalla: lo que quede libre en su sublista, pero nunca menos
     de lo que ya tiene (si la sublista viene apretada, al menos puede conservarlo
     o bajarlo). Subir más que eso exigiría moverla de lista, y eso no le toca a Soporte Comercial. */
  const topeDe = f => Math.max(f.s.capacidad - f.s.campanas.reduce(
    (a, x) => a + (x.id === f.c.id ? 0 : n(x.frec)), 0), n(f.c.frec));
  m.innerHTML = `
    <div class="mh"><div style="flex:1;min-width:0">
      <h3>Cambiar la OP · ${esc(ev.cliente)}</h3>
      <small>${filas.length} pantalla${filas.length === 1 ? "" : "s"} ·
        lo que cambies queda avisado en Producción</small></div></div>
    <div class="mb">
      <div class="tres">
        <div class="field"><label for="eo_cli">Cliente</label>
          <input type="text" id="eo_cli" maxlength="60" value="${esc(c0.cliente || "")}" autocomplete="off"></div>
        <div class="field"><label for="eo_camp">Campaña</label>
          <input type="text" id="eo_camp" maxlength="60" value="${esc(c0.campana || "")}" autocomplete="off"></div>
      </div>
      <div class="tres">
        <div class="field"><label for="eo_ini">Inicio</label>
          <input type="date" id="eo_ini" value="${esc(c0.inicio || "")}"></div>
        <div class="field"><label for="eo_fin">Fin</label>
          <input type="date" id="eo_fin" value="${esc(c0.fin || "")}"></div>
      </div>
      <div class="field"><label>Spots por día en cada pantalla</label>
        <div class="tblwrap" style="box-shadow:none">
          <table class="valtab"><thead><tr>
            <th>Pantalla</th><th>Sublista</th><th class="num">Spots por día</th>
            <th class="num">Máximo</th><th>Modalidad</th>
          </tr></thead><tbody>
            ${filas.map(f => `<tr data-cid="${f.c.id}" data-max="${topeDe(f)}">
              <td><b>${esc(f.p.nombre)}</b></td>
              <td class="cmp">${esc(f.s.nombre)}</td>
              <td class="num"><input type="number" min="0" step="1" class="ef" value="${n(f.c.frec) || 0}"></td>
              <td class="num"><span class="cmp">${miles(topeDe(f))}</span></td>
              <td><select class="eg">${NEG_OPC.map(o =>
                  `<option value="${o.v}"${negDe(f.c) === o.v ? " selected" : ""}>${o.v ? o.etq : "Comercial"}</option>`).join("")}</select></td>
            </tr>`).join("")}
          </tbody></table>
        </div>
        <div class="hint">El máximo es lo que cabe en la sublista donde ya está. Para pasar de ahí
          habría que moverla a otra lista de reproducción, y eso solo lo hace Producción.</div>
      </div>
      <div class="tres">
        <div class="field"><label>Arte</label>
          <div class="artebtns" id="eo_arte">
            ${["", "aprob", "sin"].map(k => `<button type="button" data-a="${k}"${
              (c0.arte || "") === k ? ' class="on"' : ""}><i></i>${ARTE_ETIQ[k]}</button>`).join("")}
          </div></div>
        <div class="field"><label>Modalidad · aplica a todas las pantallas</label>
          <div class="negbtns" id="eo_neg">
            ${["", "donacion", "canje", "dacion", "bonificacion"].map(k => `<button type="button" data-g="${k}"><i></i>${NEG_ETIQ[k]}</button>`).join("")}
          </div>
          <div class="hint" style="margin-top:6px">Pulsa aquí para poner la misma en todas.
            Si solo una pantalla va bonificada o donada, márcala arriba en su fila.</div></div>
      </div>
      <div class="field"><label for="eo_notas">Notas de la OP</label>
        <textarea id="eo_notas" rows="2" maxlength="400" placeholder="Opcional">${esc(c0.notas || "")}</textarea></div>
    </div>
    <div class="mf">
      <span class="hint" id="eo_msg">Se cambia en todas las pantallas de esta OP.</span>
      <button class="btn ghost" id="mcancel">Cancelar</button>
      <button class="btn primary" id="eo_save">Guardar cambios</button>
    </div>`;
  document.getElementById("ov").hidden = false;
  document.getElementById("mcancel").onclick = closeModal;
  let arte = c0.arte || "", neg = c0.neg || "";
  m.querySelectorAll("#eo_arte button").forEach(b => b.onclick = () => {
    arte = b.dataset.a;
    m.querySelectorAll("#eo_arte button").forEach(x => x.classList.toggle("on", x === b));
  });
  m.querySelectorAll("#eo_neg button").forEach(b => b.onclick = () => {
    neg = b.dataset.g;
    m.querySelectorAll("#eo_neg button").forEach(x => x.classList.toggle("on", x === b));
    m.querySelectorAll(".eg").forEach(s => { s.value = neg; });   // se copia a todas
  });

  document.getElementById("eo_save").onclick = async () => {
    const b = document.getElementById("eo_save"), msg = document.getElementById("eo_msg");
    const cli = document.getElementById("eo_cli").value.trim();
    const cam = document.getElementById("eo_camp").value.trim();
    const ini = document.getElementById("eo_ini").value;
    const fin = document.getElementById("eo_fin").value;
    const notas = document.getElementById("eo_notas").value.trim();
    if(!cli){ msg.textContent = "El cliente no puede quedar vacío."; msg.style.color = "var(--critical)"; return; }
    if(ini && fin && ini > fin){ msg.textContent = "La fecha de inicio va después del fin."; msg.style.color = "var(--critical)"; return; }
    const cambios = new Map();
    let malo = "";
    m.querySelectorAll("tbody tr").forEach(tr => {
      const f = n(tr.querySelector(".ef").value), max = +tr.dataset.max;
      if(f > max) malo = `${tr.querySelector("b").textContent}: como mucho ${miles(max)} spots por día; la sublista no da para ${miles(f)}.`;
      const sg = tr.querySelector(".eg");
      cambios.set(tr.dataset.cid, {cliente: cli, campana: cam, inicio: ini, fin, frec: f, arte,
                                   neg: sg ? (sg.value || "") : neg, notas});
    });
    if(malo){ msg.textContent = malo + " Para subirle más, Producción tiene que moverla de lista.";
              msg.style.color = "var(--critical)"; return; }

    const det = [];
    if(!mismoTexto(c0.cliente, cli)) det.push(`Cliente ${c0.cliente} → ${cli}`);
    if(!mismoTexto(c0.campana || "", cam)) det.push(`Campaña ${c0.campana || "—"} → ${cam || "—"}`);
    if((c0.inicio || "") !== ini) det.push(`Inicio ${fmt(c0.inicio) || "—"} → ${fmt(ini) || "—"}`);
    if((c0.fin || "") !== fin) det.push(`Fin ${fmt(c0.fin) || "—"} → ${fmt(fin) || "—"}`);
    for(const f of filas){
      const nf = cambios.get(f.c.id).frec;
      if(n(f.c.frec) !== nf) det.push(`${f.p.nombre}: ${miles(n(f.c.frec))} → ${miles(nf)} spots/día`);
    }
    if((c0.arte || "") !== arte) det.push(`Arte: ${ARTE_ETIQ[arte]}`);
    for(const f of filas){
      const ng = cambios.get(f.c.id).neg || "";
      if(negDe(f.c) !== ng) det.push(`${f.p.nombre}: modalidad ${NEG_ETIQ[negDe(f.c)]} → ${NEG_ETIQ[ng]}`);
    }
    if((c0.notas || "") !== notas) det.push(notas ? `Notas: ${notas.slice(0,60)}` : "Notas borradas");
    if(!det.length){ closeModal(); toast("No cambiaste nada"); return; }

    b.disabled = true; b.textContent = "Guardando…";
    const r = await escribirComoVisor(fresco => {
      let tocadas = 0;
      for(const p of fresco.pantallas) for(const s2 of p.sublistas) for(const c of s2.campanas){
        const cb = cambios.get(c.id); if(!cb) continue;
        c.cliente = cb.cliente; c.campana = cb.campana;
        c.inicio = cb.inicio; c.fin = cb.fin; c.frec = cb.frec;
        cb.arte ? (c.arte = cb.arte) : delete c.arte;
        cb.neg  ? (c.neg  = cb.neg)  : delete c.neg;
        cb.notas ? (c.notas = cb.notas) : delete c.notas;
        tocadas++;
      }
      return tocadas;
    });
    b.disabled = false; b.textContent = "Guardar cambios";
    if(!r.ok){
      bloqueReintento("eo_msg", r, () => document.getElementById("eo_save").click());
      return;
    }
    await emitirAviso({
      tipo:"cambio", clave, cliente: cli, campana: cam,
      ids: filas.map(f => f.c.id),
      detalle: det.slice(0, 4).join(" · ") + (det.length > 4 ? ` · y ${det.length - 4} más` : ""),
    });
    /* si ya estaba rentabilizada, su fila del Excel se pone al día sola */
    const ex = await rxRefrescarFila(clave, {...ev, cliente: cli, campana: cam, inicio: ini, fin});
    closeModal(); render();
    toast(`OP actualizada en ${r.n} pantalla${r.n === 1 ? "" : "s"}` +
          (ex ? ` · fila ${ex.fila} del Excel al día` : ""));
  };
}
