  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#184f95;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --pausa:#9085e9;
  --lima:#c8e600;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px 72px}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--plane);border-bottom:1px solid var(--grid)}
.topin{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;gap:9px;align-items:center;flex-wrap:nowrap}
.topin > *:not(.brand){flex:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;flex:1 1 auto}
.brand > div{min-width:0;flex:1 1 auto}
.brand h1,.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{height:22px;width:auto;object-fit:contain;flex:none;display:block}
.logo.osc{display:none}
:root[data-theme="dark"] .logo.osc{display:block}
:root[data-theme="dark"] .logo.clr{display:none}
.brand h1{font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:0}
.btn{
  background:var(--surface);border:1px solid var(--ring);border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:5px 7px}
.btn:disabled{opacity:.5;cursor:default}
.btn .ico{width:15px;height:15px;fill:currentColor;flex:none;margin-right:-1px}
.verchip{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--ring));
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border-radius:999px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
select.sel{background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:560;max-width:230px}
select.sel:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- barra de origen ---------- */
.fsbar{background:var(--surface-2);border-bottom:1px solid var(--grid)}
.fsin{max-width:1480px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.fsin .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.fsin .dot.ok{background:var(--good)}
.fsin .dot.no{background:var(--critical)}
.fsin .sep{flex:1}
.fsin b{font-weight:650;color:var(--ink)}

/* ---------- filtros ---------- */
.filtros{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:20px 0 4px;
  background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow);
}
.filtros .fl{font-size:10.5px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.filtros input[type=date]{background:var(--surface-2);border:1px solid var(--ring);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.filtros input[type=search]{background:var(--surface-2);border:1px solid var(--ring);border-radius:8px;padding:6px 11px;font-size:13px;min-width:190px;color:var(--ink)}
.filtros input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.qchips{display:flex;gap:5px;flex-wrap:wrap}
.qchips button{border:1px solid var(--ring);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:620;color:var(--ink)}
.qchips button:hover{border-color:var(--accent)}
.qchips button.sel{background:var(--accent);color:#fff;border-color:transparent}
.filtros .der{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.activos{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.fchip{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--ring));background:color-mix(in srgb,var(--accent) 10%,var(--surface));
  border-radius:999px;padding:3px 6px 3px 11px;color:var(--ink);
}
.fchip button{border:0;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink);border-radius:50%;width:17px;height:17px;line-height:1;display:grid;place-items:center;font-size:12px;padding:0}
.fchip button:hover{background:var(--critical);color:#fff}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin:16px 0 0}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:10.5px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:25px;font-weight:690;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .sub{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.acc .val{color:var(--accent)}
.kpi.good .val{color:var(--good)}
.kpi.warn .val{color:var(--warning)}
.kpi.bad .val{color:var(--critical)}
.spark{display:block;width:100%;height:26px;margin-top:7px;overflow:visible}

/* ---------- paneles ---------- */
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:13px;box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.ph h2{font-size:14.5px}
.ph small{font-size:11.5px;color:var(--muted)}
.ph .der{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pb{padding:15px 16px 17px}
.pb.tight{padding:10px 8px 12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:18px}
.dos > div > .panel:first-child{margin-top:0}
@media (max-width:1020px){ .dos{grid-template-columns:1fr} }
.hint{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 6px;border:1px dashed var(--axis);border-radius:11px}

/* ---------- ranking de pantallas ---------- */
.rank{display:flex;flex-direction:column;gap:3px}
.rrow{
  display:grid;grid-template-columns:26px 1fr 96px;gap:11px;align-items:center;
  padding:8px 10px;border-radius:10px;border:1px solid transparent;text-align:left;background:transparent;width:100%;
}
.rrow:hover{background:var(--surface-2);border-color:var(--ring)}
.rrow.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));border-color:color-mix(in srgb,var(--accent) 45%,var(--ring))}
.rpos{font-size:12px;font-weight:750;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rrow:nth-child(1) .rpos{color:var(--lima)}
.rmid{display:block;min-width:0}
.rtop{display:flex;align-items:baseline;gap:8px;min-width:0}
.rtop b{font-size:13px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtop span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
.rbar{display:block;height:9px;border-radius:5px;background:var(--grid);overflow:hidden;margin-top:5px}
.rbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--lima)));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.rval{display:block;text-align:right}
.rval b{display:block;font-size:14px;font-weight:680;font-variant-numeric:tabular-nums}
.rval small{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- gráficos ---------- */
.chart{width:100%;display:block;overflow:visible;user-select:none}
.chart text{font-family:inherit}
.gx{font-size:10.5px;fill:var(--muted)}
.gy{font-size:10px;fill:var(--muted)}
.gval{font-size:10.5px;font-weight:660;fill:var(--ink)}
.gline{stroke:var(--grid);stroke-width:1}
.gaxis{stroke:var(--axis);stroke-width:1}
.gcol{fill:var(--accent);transition:opacity .15s}
.gcol.dim{opacity:.28}
.gcol:hover{opacity:.82}
.gsel{fill:color-mix(in srgb,var(--accent) 55%,var(--lima))}
.gspot{fill:none;stroke:var(--warning);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gdot{fill:var(--warning);stroke:var(--surface);stroke-width:1.5}
.ghit{fill:transparent;cursor:pointer}
.ghit:hover + .ghl,.ghl.on{opacity:1}
.ghl{fill:color-mix(in srgb,var(--accent) 12%,transparent);opacity:0;pointer-events:none}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- mapa de calor ---------- */
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:3px;font-size:11.5px}
.heat th{font-size:10px;font-weight:680;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:2px 4px;text-align:center;white-space:nowrap}
.heat th.lft{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;padding-right:9px}
.heat td{padding:0}
.heat .hc{
  width:100%;min-width:52px;height:34px;border-radius:7px;border:1px solid transparent;
  display:grid;place-items:center;font-size:11px;font-weight:640;font-variant-numeric:tabular-nums;
  color:var(--ink);background:var(--surface-2);
}
.heat .hc.z{color:var(--muted);opacity:.5}
.heat .hc:hover{border-color:var(--accent)}
.heat .tot{background:transparent;font-weight:700}

/* ---------- distribución ---------- */
.dist{display:flex;align-items:flex-end;gap:5px;height:126px}
.dbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.dbar i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--accent);min-height:2px;transition:height .4s}
.dbar.baja i{background:var(--critical)}
.dbar.alta i{background:var(--good)}
.dbar span{font-size:9.5px;line-height:1.25;color:var(--muted);text-align:center;min-height:24px;padding-top:3px}
.dbar b{font-size:10.5px;font-weight:660;font-variant-numeric:tabular-nums}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta input{width:88px;background:var(--surface-2);border:1px solid var(--ring);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:640;font-variant-numeric:tabular-nums;color:var(--ink)}
.meta input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- tabla ---------- */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  font-weight:680;padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
table.t th.ord{cursor:pointer;user-select:none}
table.t th.ord:hover{color:var(--ink)}
table.t th.ord.on{color:var(--accent)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t tbody tr:hover{background:var(--surface-2)}
table.t td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t tr.baja td.pspot{color:var(--critical);font-weight:680}
table.t tr.sinp{opacity:.72}
.tblwrap{max-height:560px;overflow:auto;border:1px solid var(--ring);border-radius:11px}
.pchips{display:flex;gap:3px;flex-wrap:wrap}
.pchip{font-size:9.5px;font-weight:700;letter-spacing:.02em;border-radius:5px;padding:1px 5px;background:var(--surface-2);border:1px solid var(--ring);color:var(--ink-2);white-space:nowrap}
.pchip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--ring));color:var(--ink)}
.tag{font-size:10px;font-weight:680;letter-spacing:.02em;text-transform:uppercase;border-radius:999px;padding:1px 7px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.tag.mid{color:var(--warning);background:color-mix(in srgb,var(--warning) 16%,transparent)}
.tag.bad{color:var(--critical);background:color-mix(in srgb,var(--critical) 14%,transparent)}
.tag.mut{color:var(--muted);background:color-mix(in srgb,var(--muted) 16%,transparent)}
.tag.acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
/* modalidad y comentarios */
.negchip{display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:10px;font-weight:700;
  letter-spacing:.02em;text-transform:uppercase;padding:1px 7px;border-radius:999px}
.negchip.parcial{border-style:dashed}
.n-donacion{background:color-mix(in srgb,var(--pausa) 20%,transparent);color:var(--pausa)}
.n-canje{background:color-mix(in srgb,var(--serious) 22%,transparent);color:var(--serious)}
.n-dacion{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.n-bonificacion{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.comchip{font-size:10.5px;color:var(--muted);margin-top:3px;max-width:280px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.filas2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filas2 input[type=date]{background:var(--surface-2);border:1px solid var(--ring);border-radius:8px;
  padding:7px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.filas2 input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chk{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--ring);border-radius:10px;
  padding:10px 12px;background:var(--surface-2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.chk span{flex:1;min-width:0;line-height:1.3}
.chk b{display:block;font-size:13px;font-weight:640}
.chk small{font-size:11.5px;color:var(--ink-2)}
.aviso2{display:flex;align-items:center;gap:11px;border:1px solid var(--ring);border-left-width:3px;
  border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.aviso2 .ai{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.aviso2 .at{flex:1;min-width:0;line-height:1.3}
.aviso2 .at b{display:block;font-size:12.5px;font-weight:640}
.aviso2 .at small{font-size:11.5px;color:var(--ink-2)}
.aviso2.a{border-left-color:var(--good)}
.aviso2.a .ai{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.combox{background:var(--surface-2);border:1px solid var(--ring);border-radius:9px;padding:9px 11px;
  font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.field{display:grid;gap:5px}
.field > label{font-size:10.5px;font-weight:680;letter-spacing:.045em;text-transform:uppercase;color:var(--muted)}

/* ---------- avisos ---------- */
.avisos{display:flex;flex-direction:column;gap:7px}
.aviso{display:flex;align-items:center;gap:11px;border:1px solid var(--ring);border-left-width:3px;border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.aviso.w{border-left-color:var(--warning)}
.aviso.c{border-left-color:var(--critical)}
.aviso.a{border-left-color:var(--accent)}
.aviso.g{border-left-color:var(--good)}
.aviso .ai{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.aviso.w .ai{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.aviso.c .ai{background:color-mix(in srgb,var(--critical) 18%,transparent);color:var(--critical)}
.aviso.a .ai{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.aviso.g .ai{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.aviso .at{flex:1;min-width:0;line-height:1.3}
.aviso .at b{display:block;font-size:12.5px;font-weight:640}
.aviso .at small{font-size:11.5px;color:var(--ink-2)}

/* ---------- pantalla de bienvenida ---------- */
.hero{max-width:660px;margin:70px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.hero .hi{width:74px;height:74px;border-radius:20px;background:color-mix(in srgb,var(--accent) 13%,var(--surface));display:grid;place-items:center}
.hero .hi svg{width:36px;height:36px;fill:var(--accent)}
.hero h2{font-size:21px}
.hero p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:520px}
.hero .pasos{text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:15px 18px;width:100%;box-shadow:var(--shadow)}
.hero .pasos div{display:flex;gap:10px;font-size:12.5px;color:var(--ink-2)}
.hero .pasos b{color:var(--ink);flex:none;width:16px}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--ring);border-radius:15px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{padding:15px 19px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:16px;flex:1;min-width:0}
.modal .mh small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.modal .mb{padding:17px 19px;display:grid;gap:13px;max-height:74vh;overflow:auto}
.modal .mf{padding:13px 19px;border-top:1px solid var(--grid);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal .mf .hint{margin-right:auto}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px}
.dcell{background:var(--surface-2);border:1px solid var(--ring);border-radius:9px;padding:8px 10px;min-width:0}
.dcell span{display:block;font-size:9.5px;font-weight:680;letter-spacing:.045em;text-transform:uppercase;color:var(--muted)}
.dcell b{display:block;font-size:14px;font-weight:665;margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--plane);border-radius:10px;padding:10px 17px;font-size:13px;font-weight:560;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:min(560px,92vw);
}
.toast[hidden]{display:none}

@media print{
  header.top,.fsbar,.filtros,.activos,.ph .der,.toast{display:none!important}
  body{background:#fff}
  .panel{break-inside:avoid;box-shadow:none}
  .tblwrap{max-height:none}
}
</style>
</head>
<body>
<header class="top">

<script>
"use strict";
/* ===========================================================================
   Rentabilidad DOOH · Veo
   Lee RENTABILIDAD_DE_PANTALLA_NV.xlsx directamente del disco, sin internet,
   sin librerías y sin dejar nada guardado en el navegador: lo único que se
   recuerda es el "apuntador" al archivo (IndexedDB), para no volver a
   buscarlo cada vez.
   =========================================================================== */

const HAS_FSA = typeof window.showOpenFilePicker === "function";
let handle = null;          // FileSystemFileHandle del .xlsx
let libro = null;           // {hojas:[{nombre, filas}]}
let hojaSel = "";           // hoja activa
let DATOS = null;           // {pantallas:[{id,abrev,nombre,col,colFlag}], ops:[...], archivo, leido}
let ordCol = "ini", ordDir = -1;

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sinTildes = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const norm = s => sinTildes(s).replace(/[\s\n\r]+/g, " ").replace(/[.:°º]/g, "").trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function money(v, dec){
  const n = Number(v) || 0;
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits: dec == null ? 2 : dec,
                                          maximumFractionDigits: dec == null ? 2 : dec});
}
function moneyK(v){
  const n = Math.abs(Number(v) || 0);
  if(n >= 1000000) return "$" + (n/1000000).toFixed(n >= 10000000 ? 0 : 1) + "M";
  if(n >= 1000)    return "$" + (n/1000).toFixed(n >= 10000 ? 0 : 1) + "k";
  return "$" + n.toFixed(0);
}
function spot(v){
  const n = Number(v) || 0;
  if(!n) return "—";
  return "$" + n.toFixed(n < 0.01 ? 5 : 4);
}
const miles = v => (Number(v) || 0).toLocaleString("en-US");
function pct(a, b){ return b ? (a / b * 100) : 0; }

const MES_CORTO = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
                   "septiembre","octubre","noviembre","diciembre"];
function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dISO(iso){ const p = String(iso||"").split("-"); return p.length === 3 ? Date.UTC(+p[0], +p[1]-1, +p[2]) : NaN; }
function fmtFecha(iso){
  if(!iso) return "—";
  const p = iso.split("-");
  if(p.length !== 3) return iso;
  return `${+p[2]} ${MES_CORTO[+p[1]-1]} ${p[0]}`;
}
function etiqMes(k){ const [a, m] = k.split("-"); return `${MES_CORTO[+m-1]} ${a.slice(2)}`; }
function etiqMesLargo(k){ const [a, m] = k.split("-"); return `${MES_LARGO[+m-1]} de ${a}`; }
function sumaDias(iso, n){
  const t = dISO(iso); if(isNaN(t)) return iso;
  const d = new Date(t + n * 86400000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
let toastT = 0;

  el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600);
}

/* ---------------- IndexedDB: solo el apuntador al archivo ---------------- */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("vnnox_rent", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  try{
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const q = db.transaction("kv","readonly").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  }catch(e){ return undefined; }
}
async function idbSet(k, v){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const q = db.transaction("kv","readwrite").objectStore("kv").put(v, k);
      q.onsuccess = () => res(); q.onerror = () => rej(q.error);
    });
  }catch(e){}
}
/* ============================================================
   Escritura a prueba de Google Drive (igual que en los otros tableros)
   ============================================================ */
const REINTENTOS = [0, 300, 900, 2000];
let filaEscritura = Promise.resolve();
function enFila(tarea){
  const t = filaEscritura.then(tarea, tarea);
  filaEscritura = t.then(() => {}, () => {});
  return t;
}
function esErrorDeDisco(e){
  const n2 = (e && e.name) || "", m = ((e && e.message) || "").toLowerCase();
  return n2 === "NoModificationAllowedError" || n2 === "InvalidStateError" ||
         n2 === "AbortError" || m.includes("underlying filesystem") ||
         m.includes("state of the") || m.includes("lock") || m.includes("busy");
}
function esErrorDePermiso(e){
  const n2 = (e && e.name) || "";
  return n2 === "NotAllowedError" || n2 === "SecurityError" || (e && e.__permiso);
}
function esErrorDeArchivoPerdido(e){ return ((e && e.name) || "") === "NotFoundError"; }
function motivoEscritura(e){
  if(esErrorDePermiso(e))        return "falta tu permiso para escribir en el archivo";
  if(esErrorDeArchivoPerdido(e)) return "el archivo ya no está donde estaba: vuelve a conectarlo";
  if(esErrorDeDisco(e))          return "Google Drive tenía el archivo ocupado y no dejó escribir. " +
                                        "Ciérralo si lo tienes abierto en otro programa y vuelve a intentarlo";
  return (e && e.message) || "no se pudo escribir";
}
async function permisoEscritura(handle){
  if(!handle || !handle.queryPermission) return true;
  let p = "granted";
  try{ p = await handle.queryPermission({mode:"readwrite"}); }catch(e){}
  if(p === "granted") return true;
  try{ p = await handle.requestPermission({mode:"readwrite"}); }catch(e){}
  if(p === "granted") return true;
  const err = new Error("falta permiso de escritura"); err.__permiso = true; throw err;
}
/* Un intento. El modo normal es atómico: si algo falla, el archivo original
   queda intacto. El modo exclusive escribe encima y luego recorta al tamaño
   nuevo, para que el archivo nunca quede vacío en medio de la operación. */
async function unaEscritura(handle, cuerpo, tam, exclusivo){
  let w;
  if(exclusivo) w = await handle.createWritable({mode:"exclusive", keepExistingData:true});
  else          w = await handle.createWritable();
  try{
    if(exclusivo){
      await w.write({type:"write", position:0, data:cuerpo});
      await w.truncate(tam);          // recorta lo que sobraba del contenido anterior
    } else {
      await w.write(cuerpo);
    }
    await w.close();
    return true;
  }catch(e){
    try{ await w.abort(); }catch(e2){}
    throw e;
  }
}
/* Escribe `datos` (texto, Blob o Uint8Array) en `handle`. Lanza si no pudo. */
function escribirEn(handle, datos){
  return enFila(async () => {
    if(!handle) throw new Error("sin archivo");
    await permisoEscritura(handle);
    /* los datos van tal cual: texto, Blob o Uint8Array */
    const tam = (typeof datos === "string") ? new Blob([datos]).size
              : (datos instanceof Blob ? datos.size
              : (datos && (datos.byteLength != null ? datos.byteLength : datos.length)) || 0);
    let ultimo = null;
    for(let i = 0; i < REINTENTOS.length; i++){
      if(REINTENTOS[i]) await new Promise(r => setTimeout(r, REINTENTOS[i]));
      try{ return await unaEscritura(handle, datos, tam, false); }
      catch(e){
        ultimo = e;
        if(!esErrorDeDisco(e)) break;         // permiso o archivo perdido: no insistir
      }
    }
    /* último recurso: escribir directo, sin archivo temporal */
    if(esErrorDeDisco(ultimo)){
      try{ return await unaEscritura(handle, datos, tam, true); }
      catch(e){ ultimo = e; }
    }
    throw ultimo || new Error("no se pudo escribir");
  });
}

/* =========================================================================
   Lector de .xlsx (zip + XML), escrito a mano
   ========================================================================= */
function u16(u8,o){ return u8[o] | (u8[o+1]<<8); }
function u32(u8,o){ return (u8[o] | (u8[o+1]<<8) | (u8[o+2]<<16) | (u8[o+3]<<24)) >>> 0; }
function aLatin1(u8){
  let s = "";
  for(let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return s;
}
async function inflar(bytes){
  try{
    const ds = new DecompressionStream("deflate-raw");
    const w = ds.writable.getWriter();
    w.write(bytes).catch(()=>{}); w.close().catch(()=>{});
    const r = ds.readable.getReader();
    const trozos = []; let total = 0;
    try{ for(;;){ const {done, value} = await r.read(); if(done) break; trozos.push(value); total += value.length; } }
    catch(e){}
    if(!total) return null;
    const out = new Uint8Array(total);
    let o = 0; for(const t of trozos){ out.set(t, o); o += t.length; }
    return out;
  }catch(e){ return null; }
}
async function leerZip(u8, quiero){
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(u32(u8, i) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Ese archivo no parece un Excel (.xlsx).");
  const total = u16(u8, eocd + 10);
  let off = u32(u8, eocd + 16);
  const salida = {};
  for(let k = 0; k < total; k++){
    if(u32(u8, off) !== 0x02014b50) break;
    const metodo   = u16(u8, off + 10);
    const compSize = u32(u8, off + 20);
    const nLen = u16(u8, off + 28), eLen = u16(u8, off + 30), cLen = u16(u8, off + 32);
    const loc  = u32(u8, off + 42);
    const nombre = aLatin1(u8.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if(!quiero(nombre)) continue;
    const lnLen = u16(u8, loc + 26), leLen = u16(u8, loc + 28);
    const ini = loc + 30 + lnLen + leLen;
    const datos = u8.subarray(ini, ini + compSize);
    const bytes = metodo === 0 ? datos : await inflar(datos);
    if(bytes) salida[nombre] = new TextDecoder("utf-8").decode(bytes);
  }
  return salida;
}
function desXML(s){
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&");
}
function numCol(s){ let n = 0; for(const ch of s) n = n*26 + (ch.charCodeAt(0) - 64); return n; }
function serialAFecha(n){
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d)) return null;
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
/* devuelve un mapa fila -> {col:valor}  (col = número, A=1) */
function leerHoja(xml, compartidas, fechaEstilo){
  const filas = new Map();
  /* ojo: los atributos van con *? — si no, la barra de las celdas vacías (<c r="A3" s="3"/>)
     se cuela en el grupo y todo el lector se corre una columna. */
  for(const m of xml.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const attrs = m[1] || "", cuerpo = m[2] || "";
    const ref = attrs.match(/r="([A-Z]+)(\d+)"/);
    if(!ref) continue;
    const col = numCol(ref[1]), fila = +ref[2];
    const tipo   = (attrs.match(/t="([^"]+)"/) || [])[1] || "n";
    const estilo = +((attrs.match(/s="(\d+)"/) || [])[1] || -1);
    const vRaw = (cuerpo.match(/<v>([\s\S]*?)<\/v>/) || [0, null])[1];
    let val = null;
    if(tipo === "s"){
      if(vRaw != null) val = compartidas[+vRaw] != null ? compartidas[+vRaw] : "";
    } else if(tipo === "inlineStr"){
      let t = ""; for(const g of cuerpo.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += g[1];
      val = desXML(t);
    } else if(tipo === "str"){
      val = vRaw == null ? "" : desXML(vRaw);
    } else if(tipo === "b"){
      val = vRaw === "1";
    } else if(tipo === "e"){
      val = null;                                   // #DIV/0!, #N/A…
    } else {
      if(vRaw == null || vRaw === "") val = null;
      else if(fechaEstilo.has(estilo) && +vRaw > 20000) val = serialAFecha(+vRaw);
      else val = Number(vRaw);
    }
    if(val === null || val === "") continue;
    if(!filas.has(fila)) filas.set(fila, {});
    filas.get(fila)[col] = typeof val === "string" ? val.trim() : val;
  }
  return filas;
}
async function abrirLibro(u8){
  const partes = await leerZip(u8, n =>
    /^xl\/(workbook\.xml|sharedStrings\.xml|styles\.xml|_rels\/workbook\.xml\.rels|worksheets\/.+\.xml)$/.test(n));
  const wb = partes["xl/workbook.xml"];
  if(!wb) throw new Error("El Excel no trae la lista de hojas.");

  const compartidas = [];
  const ss = partes["xl/sharedStrings.xml"];
  if(ss) for(const m of ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)){
    let t = "";
    for(const g of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += g[1];
    compartidas.push(desXML(t));
  }
  const fechaEstilo = new Set();
  const st = partes["xl/styles.xml"];
  if(st){
    const fmts = new Map();
    for(const m of st.matchAll(/<numFmt[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g)) fmts.set(m[1], m[2]);
    const xfs = (st.match(/<cellXfs[\s\S]*?<\/cellXfs>/) || [""])[0];
    let i = 0;
    for(const m of xfs.matchAll(/<xf\b[^>]*\/?>/g)){
      const id = (m[0].match(/numFmtId="(\d+)"/) || [0,"0"])[1];
      const code = fmts.get(id) || "";
      if(["14","15","16","17","22"].includes(id) || (/[dmyDMY]/.test(code) && !/[#0]/.test(code))) fechaEstilo.add(i);
      i++;
    }
  }
  const rels = new Map();
  const rx = partes["xl/_rels/workbook.xml.rels"] || "";
  for(const m of rx.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)) rels.set(m[1], m[2]);

  const hojas = [];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/>/g)){
    const nombre = desXML((m[1].match(/name="([^"]*)"/) || [0,""])[1]);
    const rid    = (m[1].match(/r:id="([^"]*)"/) || [0,""])[1];
    let target = rels.get(rid) || "";
    target = target.replace(/^\/?xl\//, "").replace(/^\//, "");
    const xml = partes["xl/" + target];
    if(!xml) continue;
    hojas.push({nombre, filas: leerHoja(xml, compartidas, fechaEstilo)});
  }
  if(!hojas.length) throw new Error("No se pudo leer ninguna hoja del Excel.");
  return {hojas};
}

/* =========================================================================
   De la hoja al modelo: OP, pantallas y sus números
   ========================================================================= */
const PANT_NOMBRE = {
  PROCE:"Próceres", PROCERES:"Próceres",
  PASEO:"Paseo", PANAM:"Panamericana", PANAMERICANA:"Panamericana",
  SDM:"Salvador del Mundo", HEROE:"Héroes", HEROES:"Héroes",
  BENITO:"San Benito", JERUSA:"Jerusalén", JERUSALEN:"Jerusalén",
  JPABLO:"Constitución", JUANPABLO:"Constitución", CONSTITUCION:"Constitución",
};
const CAMPOS = [
  ["op",     ["n op","no op","n de op","num op","op"]],
  ["marca",  ["marca","cliente"]],
  ["camp",   ["campana","campaña"]],
  ["ini",    ["incio","inicio","fecha inicio"]],
  ["fin",    ["final","fin","fecha final"]],
  ["dias",   ["total dias","dias"]],
  ["frec",   ["frec total","frecuencia total","frec","frecuencia"]],
  ["precio", ["precio total","precio","total"]],
  ["prom",   ["valor prom","valor promedio","promedio"]],
  ["neg",    ["modalidad","tipo"]],
  ["coment", ["comentario","comentarios","observaciones","nota","notas"]],
];
/* modalidad: lo que escriben los otros tableros en la columna MODALIDAD */
const NEG_CLASE = {donacion:"Donación", canje:"Canje", dacion:"Dación", bonificacion:"Bonificación"};
/* la columna viene escrita a mano: "DONACION", "DACION EN PAGO",
   "BONIFICADA JERUSALEN", "SAN BENITO BONO"… se reconoce por la raíz */
function negCod(v){
  const t = sinTildes(v);
  if(!t.trim()) return "";
  if(t.includes("donac")) return "donacion";
  if(t.includes("canje")) return "canje";
  if(t.includes("dacion")) return "dacion";
  if(t.includes("bonific") || t.includes("bono")) return "bonificacion";
  return "";
}

/* Una modalidad escrita como "Bonificación: PASEO, HEROE" aplica solo a esas
   pantallas: la OP es comercial en las demás y su ingreso sí cuenta. */
function negEsParcial(v){ return /:/.test(String(v == null ? "" : v)); }
function negPantallasTxt(v){
  const s = String(v == null ? "" : v);
  if(!/:/.test(s)) return "";
  return s.split("·").map(x => x.split(":")[1]).filter(Boolean).join(", ").replace(/\s+/g, " ").trim();
}
function analizarHoja(filas){
  const maxFila = Math.max(0, ...filas.keys());
  /* 1) fila de encabezados: la que trae MARCA */
  let hRow = 0;
  for(let r = 1; r <= Math.min(maxFila, 30); r++){
    const f = filas.get(r); if(!f) continue;
    if(Object.values(f).some(v => typeof v === "string" && norm(v) === "marca")){ hRow = r; break; }
  }
  if(!hRow) throw new Error("No encontré la fila de encabezados (la que dice MARCA).");

  /* 2) columnas de cada campo */
  const enc = filas.get(hRow);
  const col = {};
  for(const [c, v] of Object.entries(enc)){
    if(typeof v !== "string") continue;
    const t = norm(v);
    for(const [clave, alias] of CAMPOS){
      if(col[clave]) continue;
      if(alias.includes(t)){ col[clave] = +c; break; }
    }
  }
  if(!col.marca) throw new Error("La hoja no tiene la columna MARCA.");
  const colPant = Object.entries(enc).find(([, v]) => typeof v === "string" && norm(v) === "pantallas");
  const desdePant = colPant ? +colPant[0] : (Math.max(...Object.values(col)) + 1);

  /* 3) pantallas: en la fila de abajo, cada rótulo abre un par (valor | marcado) */
  const sub = filas.get(hRow + 1) || {};
  const pantallas = [];
  for(const [c, v] of Object.entries(sub)){
    if(typeof v !== "string" || !v.trim()) continue;
    const cn = +c;
    if(cn < desdePant) continue;
    const abrev = v.trim().toUpperCase();
    pantallas.push({
      id: sinTildes(abrev).replace(/[^a-z0-9]/g, ""),
      abrev,
      nombre: PANT_NOMBRE[sinTildes(abrev).replace(/[^a-z0-9]/g,"").toUpperCase()] ||
              PANT_NOMBRE[abrev] || abrev,
      col: cn, colFlag: cn + 1,
    });
  }

  /* 4) filas de datos */
  const ops = [];
  for(let r = hRow + 2; r <= maxFila; r++){
    const f = filas.get(r); if(!f) continue;
    const marca = f[col.marca];
    if(marca == null || String(marca).trim() === "") continue;
    /* una marca de verdad trae letras: así se descartan las filas de relleno
       que el Excel deja abajo (contadores, sumas sueltas, casillas en blanco) */
    if(!/[a-zA-ZÁÉÍÓÚÜÑáéíóúüñ]/.test(String(marca))) continue;
    if(norm(marca) === "marca") continue;

    const ini = typeof f[col.ini] === "string" ? f[col.ini] : (typeof f[col.ini] === "number" ? serialAFecha(f[col.ini]) : "");
    const fin = typeof f[col.fin] === "string" ? f[col.fin] : (typeof f[col.fin] === "number" ? serialAFecha(f[col.fin]) : "");
    let dias = Number(f[col.dias]) || 0;
    if(!dias && ini && fin){
      const d = Math.round((dISO(fin) - dISO(ini)) / 86400000) + 1;
      if(d > 0) dias = d;
    }
    const frec   = Number(f[col.frec])   || 0;
    const precio = Number(f[col.precio]) || 0;
    const pant = pantallas.filter(p => f[p.colFlag] === true).map(p => p.id);
    const spots = dias * frec;
    let vSpot = Number(f[col.prom]) || 0;
    if(!vSpot && precio && spots) vSpot = precio / spots;

    ops.push({
      fila: r,
      op: f[col.op] == null ? "" : String(f[col.op]),
      marca: String(marca).trim().replace(/\s+/g," "),
      camp: String(f[col.camp] == null ? "" : f[col.camp]).trim(),
      ini: ini || "", fin: fin || "",
      dias, frec, precio, spots, vSpot,
      neg: negCod(f[col.neg]),
      negTxt: String(f[col.neg] == null ? "" : f[col.neg]).trim(),
      /* "Bonificación: PASEO" = solo esas pantallas; "Bonificación" = toda la OP */
      negParcial: negEsParcial(f[col.neg]),
      negPant: negPantallasTxt(f[col.neg]),
      coment: String(f[col.coment] == null ? "" : f[col.coment]).trim(),
      pant,
      mes: /^\d{4}-\d{2}-\d{2}$/.test(ini || "") ? ini.slice(0, 7) : "",
    });
  }
  return {pantallas, ops};
}

/* =========================================================================
   Filtros y cálculo
   ========================================================================= */
const F = {
  desde:"", hasta:"", pant:new Set(), texto:"", neg:"todo",
  modo:"inicio",         // inicio | prorrateo
  meta:null,             // $/spot objetivo; null = mediana del período
  metaAuto:true,
};
function rangoDatos(){
  const fs = DATOS.ops.map(o => o.ini).filter(Boolean).sort();
  const ff = DATOS.ops.map(o => o.fin || o.ini).filter(Boolean).sort();
  return {min: fs[0] || hoyISO(), max: ff[ff.length-1] || hoyISO()};
}
/* días de la OP que caen dentro del rango del filtro */
function diasEnRango(o){
  if(!o.ini) return 0;
  const a = Math.max(dISO(o.ini), dISO(F.desde));
  const fin = o.fin || o.ini;
  const b = Math.min(dISO(fin), dISO(F.hasta));
  if(isNaN(a) || isNaN(b) || b < a) return 0;
  return Math.round((b - a) / 86400000) + 1;
}
/* cada OP filtrada trae: peso (0..1), share de pantallas, ingreso y spots ya ajustados */
function calcular(){
  const q = sinTildes(F.texto).trim();
  const fuera = [];
  const filas = [];
  for(const o of DATOS.ops){
    if(q && !(sinTildes(o.marca).includes(q) || sinTildes(o.camp).includes(q) ||
              sinTildes(o.coment).includes(q) || String(o.op) === q)) continue;
    /* una OP con una sola pantalla bonificada sigue siendo comercial: cobra */
    if(F.neg === "com" && o.neg && !o.negParcial) continue;
    if(F.neg === "esp" && (!o.neg || o.negParcial)) continue;
    if(F.neg === "parc" && !o.negParcial) continue;
    if(NEG_CLASE[F.neg] && o.neg !== F.neg) continue;

    let peso = 0;
    if(F.modo === "inicio"){
      if(!o.ini) continue;
      const t = dISO(o.ini);
      if(t < dISO(F.desde) || t > dISO(F.hasta)) continue;
      peso = 1;
    } else {
      const d = diasEnRango(o);
      if(!d) continue;
      peso = o.dias ? d / o.dias : 1;
    }

    let share = 1, nSel = o.pant.length;
    if(F.pant.size){
      nSel = o.pant.filter(p => F.pant.has(p)).length;
      if(!nSel) continue;
      share = o.pant.length ? nSel / o.pant.length : 1;
    }
    const ingreso = o.precio * peso * share;
    const spots   = o.spots  * peso * share;
    filas.push({...o, peso, share, nSel, ingreso, spots});
  }
  return filas;
}
/* reparto mensual del ingreso de una OP */
function porMes(f, sumar){
  if(F.modo === "inicio"){ if(f.mes) sumar(f.mes, f.ingreso, f.spots); return; }
  const a = Math.max(dISO(f.ini), dISO(F.desde));
  const b = Math.min(dISO(f.fin || f.ini), dISO(F.hasta));
  if(isNaN(a) || isNaN(b) || b < a) return;
  const dTot = Math.round((b - a) / 86400000) + 1;
  let cur = a;
  while(cur <= b){
    const d = new Date(cur);
    const k = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`;
    const finMes = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0);
    const hasta = Math.min(finMes, b);
    const n = Math.round((hasta - cur) / 86400000) + 1;
    sumar(k, f.ingreso * n / dTot, f.spots * n / dTot);
    cur = hasta + 86400000;
  }
}
function mediana(arr){
  const a = arr.filter(x => x > 0).sort((x, y) => x - y);
  if(!a.length) return 0;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
function metaActual(filas){
  if(!F.metaAuto && F.meta > 0) return F.meta;
  return mediana(filas.map(f => f.vSpot));
}

function sparkHTML(serie){
  if(serie.length < 2) return "";
  const max = Math.max(...serie, 1), n = serie.length;
  const w = 100, h = 26;
  const pts = serie.map((v, i) => [i / (n-1) * w, h - (v / max) * (h - 3) - 1]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area = d + ` L${w} ${h} L0 ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="var(--accent)" opacity=".14"></path>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"
      stroke-linejoin="round" stroke-linecap="round"></path></svg>`;
}

/* ---------- ranking de pantallas ---------- */
function porPantalla(filas){
  const m = new Map();
  for(const p of DATOS.pantallas) m.set(p.id, {p, ingreso:0, spots:0, ops:0, dias:0});
  for(const f of filas){
    const usa = F.pant.size ? f.pant.filter(x => F.pant.has(x)) : f.pant;
    if(!usa.length) continue;
    const parte = 1 / usa.length;
    for(const id of usa){
      const r = m.get(id); if(!r) continue;
      r.ingreso += f.ingreso * parte;
      r.spots   += f.spots   * parte;
      r.dias    += (f.dias || 0) * f.peso;
      r.ops++;
    }
  }
  return [...m.values()].sort((a, b) => b.ingreso - a.ingreso);
}
function panelPantallas(filas){
  const r = porPantalla(filas);
  const max = Math.max(...r.map(x => x.ingreso), 1);

    return `<button class="rrow ${F.pant.has(x.p.id) ? "on" : ""}" data-pant="${esc(x.p.id)}"
      title="Ver solo ${esc(x.p.nombre)}">

        <span class="rtop"><b>${esc(x.p.nombre)}</b><span>${x.ops} OP · ${esc(miles(Math.round(x.spots)))} spots · ${esc(spot(vs))}/spot</span></span>
        <span class="rbar"><i style="width:${(x.ingreso / max * 100).toFixed(1)}%"></i></span>
      </span>
      <span class="rval"><b>${esc(money(x.ingreso, 0))}</b><small>${pct(x.ingreso, tot).toFixed(1)}% del total</small></span>
    </button>`;
  }).join("");
  return `<div class="panel">
    <div class="ph"><h2>Rentabilidad por pantalla</h2>
      <small>ingreso repartido en partes iguales entre las pantallas de cada OP</small>
      <div class="der"><span class="hint">Pulsa una pantalla para filtrar todo el tablero</span></div>

/* ---------- evolución mensual ---------- */
function serieMeses(filas){
  const m = new Map();
  for(const f of filas) porMes(f, (k, ing, sp) => {
    if(!m.has(k)) m.set(k, {k, ingreso:0, spots:0, ops:0});
    const r = m.get(k); r.ingreso += ing; r.spots += sp;
  });
  for(const f of filas) if(m.has(f.mes)) m.get(f.mes).ops++;
  return [...m.values()].sort((a, b) => a.k < b.k ? -1 : 1);
}
function panelMeses(filas){
  const s = serieMeses(filas);
  if(!s.length) return "";
  const W = 1000, H = 280, ML = 62, MR = 56, MT = 18, MB = 44;
  const iw = W - ML - MR, ih = H - MT - MB;
  const maxI = Math.max(...s.map(x => x.ingreso), 1);
  const paso = iw / s.length, bw = Math.min(54, paso * 0.62);
  const esc10 = v => MT + ih - (v / maxI) * ih;

  const vs = s.map(x => x.spots ? x.ingreso / x.spots : 0);
  const maxS = Math.max(...vs, 0.0001);
  const escS = v => MT + ih - (v / maxS) * ih * 0.86;

  let g = "";
  for(let i = 0; i <= 4; i++){
    const y = MT + ih - ih * i / 4;
    g += `<line class="gline" x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}"></line>
          <text class="gy" x="${ML-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${esc(moneyK(maxI * i / 4))}</text>`;
  }
  let cols = "", ejes = "", pts = [];
  s.forEach((x, i) => {
    const cx = ML + paso * i + paso / 2;
    const y = esc10(x.ingreso), h = MT + ih - y;
    cols += `<rect class="gcol" x="${(cx - bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(h,1).toFixed(1)}" rx="4" data-mes="${esc(x.k)}"
      ><title>${esc(etiqMesLargo(x.k))}\n${esc(money(x.ingreso))}\n${esc(miles(Math.round(x.spots)))} spots · ${esc(spot(vs[i]))}/spot</title></rect>`;
    if(h > 22) cols += `<text class="gval" x="${cx.toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle">${esc(moneyK(x.ingreso))}</text>`;
    ejes += `<text class="gx" x="${cx.toFixed(1)}" y="${(H-MB+17).toFixed(1)}" text-anchor="middle">${esc(etiqMes(x.k))}</text>`;
    pts.push([cx, escS(vs[i])]);
  });
  const linea = pts.length > 1
    ? `<path class="gspot" d="${pts.map((p,i) => `${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ")}"></path>`
    : "";
  const dots = pts.map((p, i) => `<circle class="gdot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4"
    ><title>${esc(etiqMesLargo(s[i].k))}: ${esc(spot(vs[i]))} por spot</title></circle>`).join("");
  const ejeD = `<text class="gy" x="${W-MR+10}" y="${(MT+10)}" text-anchor="start">${esc(spot(maxS))}</text>
                <text class="gy" x="${W-MR+10}" y="${(MT+ih)}" text-anchor="start">$0</text>`;

  const mejor = s.reduce((a, b) => b.ingreso > a.ingreso ? b : a, s[0]);
  return `<div class="panel">
    <div class="ph"><h2>Evolución mensual</h2>
      <small>mejor mes: <b>${esc(etiqMesLargo(mejor.k))}</b> con ${esc(money(mejor.ingreso, 0))}</small>
      <div class="der"><span class="leyenda"><span><i style="background:var(--accent)"></i>Ingresos</span>
        <span><i style="background:var(--warning)"></i>Valor por spot</span></span></div>
    </div>
    <div class="pb tight">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos por mes">
        ${g}
        <line class="gaxis" x1="${ML}" y1="${MT+ih}" x2="${W-MR}" y2="${MT+ih}"></line>
        ${cols}${linea}${dots}${ejes}${ejeD}
      </svg>
    </div>
  </div>`;
}

/* ---------- distribución del valor por spot ---------- */
const TRAMOS = [
  [0,    0.04,     "menos de 4¢"],
  [0.04, 0.05,     "4 a 5¢"],
  [0.05, 0.06,     "5 a 6¢"],
  [0.06, 0.07,     "6 a 7¢"],
  [0.07, 0.08,     "7 a 8¢"],
  [0.08, 0.10,     "8 a 10¢"],
  [0.10, Infinity, "10¢ o más"],
];
function panelSpot(filas, meta){
  const con = filas.filter(f => f.vSpot > 0);
  if(!con.length) return `<div class="panel" style="margin-top:0"><div class="ph"><h2>Valor por spot</h2></div>
    <div class="pb"><div class="empty">Todavía no hay OP con precio en este período.</div></div></div>`;
  const vals = con.map(f => f.vSpot).sort((a,b) => a-b);
  const min = vals[0], max = vals[vals.length-1];
  /* tramos fijos en centavos: se leen de un vistazo y no los descuadra un caso raro */
  const cubos = TRAMOS.map(t => ({a:t[0], b:t[1], et:t[2], n:0}));
  for(const v of vals){
    const i = cubos.findIndex(c => v >= c.a && v < c.b);
    cubos[i < 0 ? cubos.length - 1 : i].n++;
  }
  const maxN = Math.max(...cubos.map(c => c.n), 1);
  const bajo = con.filter(f => f.vSpot < meta);
  const perdida = bajo.reduce((a, f) => a + (meta - f.vSpot) * f.spots, 0);
  const barras = cubos.map(c => {
    const cls = c.b <= meta ? "baja" : (c.a >= meta ? "alta" : "");
    return `<div class="dbar ${cls}" title="${c.n} OP · ${esc(c.et)} por spot">
      <b>${c.n || ""}</b><i style="height:${(c.n/maxN*84).toFixed(0)}px"></i>
      <span>${esc(c.et)}</span></div>`;
  }).join("");
  return `<div class="panel" style="margin-top:0">
    <div class="ph"><h2>Valor por spot</h2>
      <small>${con.length} OP con precio · de ${esc(spot(min))} a ${esc(spot(max))}</small>
      <div class="der meta">
        <span class="fl">Meta</span>
        <input type="number" id="f_meta" step="0.001" min="0" value="${(meta||0).toFixed(4)}" title="Valor por spot que consideras aceptable">
        <button class="btn sm ghost" id="f_metaauto" ${F.metaAuto ? "disabled" : ""}>Mediana</button>
      </div>
    </div>
    <div class="pb">
      <div class="dist">${barras}</div>
      <div class="avisos" style="margin-top:16px">
        <div class="aviso ${bajo.length ? "w" : "g"}">
          <span class="ai">${bajo.length ? "!" : "✓"}</span>
          <span class="at"><b>${bajo.length} OP por debajo de ${esc(spot(meta))} el spot</b>
            <small>${bajo.length
              ? `Cobrando la meta habrían entrado ${esc(money(perdida, 0))} más en este período.`
              : "Todas las órdenes del período están en la meta o por encima."}</small></span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- mapa de calor pantalla × mes ---------- */
function panelCalor(filas){
  const meses = serieMeses(filas).map(x => x.k);
  if(!meses.length || meses.length > 26) return "";
  const celdas = new Map();      // pantalla|mes -> ingreso
  const totP = new Map(), totM = new Map();
  for(const f of filas){
    const usa = F.pant.size ? f.pant.filter(x => F.pant.has(x)) : f.pant;
    if(!usa.length) continue;
    const parte = 1 / usa.length;
    porMes(f, (k, ing) => {
      for(const id of usa){
        const key = id + "|" + k;
        celdas.set(key, (celdas.get(key) || 0) + ing * parte);
        totP.set(id, (totP.get(id) || 0) + ing * parte);
        totM.set(k, (totM.get(k) || 0) + ing * parte);
      }
    });
  }
  const max = Math.max(...celdas.values(), 1);
  const pants = DATOS.pantallas.filter(p => !F.pant.size || F.pant.has(p.id))
    .sort((a, b) => (totP.get(b.id) || 0) - (totP.get(a.id) || 0));
  const cuerpo = pants.map(p => `<tr>
    <th class="lft">${esc(p.nombre)}</th>
    ${meses.map(k => {
      const v = celdas.get(p.id + "|" + k) || 0;
      const t = v / max;
      const bg = v ? `background:color-mix(in srgb,var(--accent) ${(8 + t*72).toFixed(0)}%,var(--surface-2));${t > .55 ? "color:#fff" : ""}` : "";
      return `<td><div class="hc ${v ? "" : "z"}" style="${bg}"
        title="${esc(p.nombre)} · ${esc(etiqMesLargo(k))}: ${esc(money(v))}">${v ? esc(moneyK(v)) : "·"}</div></td>`;
    }).join("")}
    <td><div class="hc tot">${esc(moneyK(totP.get(p.id) || 0))}</div></td>
  </tr>`).join("");
  return `<div class="panel">
    <div class="ph"><h2>Mapa de calor · pantalla por mes</h2>
      <small>dónde y cuándo entra el dinero</small></div>
    <div class="pb heat">
      <table><thead><tr><th class="lft">Pantalla</th>
        ${meses.map(k => `<th>${esc(etiqMes(k))}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${cuerpo}</tbody>
      <tfoot><tr><th class="lft">Total</th>
        ${meses.map(k => `<td><div class="hc tot">${esc(moneyK(totM.get(k) || 0))}</div></td>`).join("")}
        <td><div class="hc tot">${esc(moneyK([...totM.values()].reduce((a,b)=>a+b,0)))}</div></td></tr></tfoot>
      </table>
    </div>
  </div>`;
}

/* ---------- avisos ---------- */
function panelAvisos(filas, meta){
  const a = [];
  const sinPrecio  = filas.filter(f => !f.precio && !f.neg);
  const noCom      = filas.filter(f => f.neg && !f.negParcial);
  const parcial    = filas.filter(f => f.neg && f.negParcial);
  const sinPant    = filas.filter(f => !f.pant.length);
  const sinFecha   = filas.filter(f => !f.ini || !f.fin);
  const bajo       = filas.filter(f => f.precio && f.vSpot < meta * 0.7);
  const hoy = hoyISO();
  const porVencer  = filas.filter(f => f.fin && f.fin >= hoy && f.fin <= sumaDias(hoy, 7));

  if(sinPrecio.length) a.push(["w","$",`${sinPrecio.length} OP comerciales sin precio`,
    `${sinPrecio.slice(0,6).map(f=>f.marca).join(", ")}${sinPrecio.length>6?"…":""} — les falta la tarifa, así que no suman a la rentabilidad.`]);
  if(noCom.length) a.push(["a","◇",`${noCom.length} OP no comerciales`,
    `${["donacion","canje","dacion","bonificacion"].map(k => ({k, n: noCom.filter(f=>f.neg===k).length}))
        .filter(x=>x.n).map(x=>`${x.n} ${NEG_CLASE[x.k].toLowerCase()}`).join(" · ")} — no llevan precio por definición; no cuentan como faltante.`]);
  if(parcial.length) a.push(["a","◈",`${parcial.length} OP con alguna pantalla bonificada`,
    `${parcial.slice(0,5).map(f => `${f.marca} (${f.negPant})`).join(", ")}${parcial.length>5?"…":""} — ` +
    `estas OP sí cobran: la modalidad aplica solo a esas pantallas, no a toda la orden.`]);
  if(sinPant.length) a.push(["w","▢",`${sinPant.length} OP sin pantalla marcada`,
    `${sinPant.map(f=>f.marca).slice(0,6).join(", ")} — marca la casilla de la pantalla en el Excel.`]);
  if(sinFecha.length) a.push(["w","📅",`${sinFecha.length} OP sin fechas completas`,
    "Sin inicio y final no se puede calcular ni los días ni el valor por spot."]);
  if(bajo.length) a.push(["w","↓",`${bajo.length} OP muy por debajo de la meta`,
    `Cobran menos de ${spot(meta*0.7)} el spot (30% bajo la meta de ${spot(meta)}).`]);
  if(porVencer.length) a.push(["a","⏱",`${porVencer.length} campaña${porVencer.length===1?"":"s"} termina${porVencer.length===1?"":"n"} esta semana`,
    porVencer.slice(0,6).map(f => `${f.marca} (${fmtFecha(f.fin)})`).join(" · ") + (porVencer.length > 6 ? " …" : "")]);
  /* estas ni siquiera llegan al filtro: sin fecha de inicio no hay dónde ponerlas */
  const huerfanas = DATOS.ops.filter(o => !/^\d{4}-\d{2}-\d{2}$/.test(o.ini));
  if(huerfanas.length) a.push(["c","?",`${huerfanas.length} OP ${huerfanas.length===1?"queda":"quedan"} fuera del tablero`,
    `${huerfanas.slice(0,6).map(f => f.marca || "(sin marca)").join(", ")}${huerfanas.length>6?"…":""} — ${huerfanas.length===1?"no tiene":"no tienen"} fecha de inicio, así que no se ${huerfanas.length===1?"puede":"pueden"} ubicar en ningún mes.`]);
  if(!a.length) a.push(["g","✓","Todo en orden","No hay OP sin tarifar, sin pantalla ni fuera de la meta en este período."]);

  return `<div class="panel">
    <div class="ph"><h2>Qué revisar</h2><small>lo que conviene corregir en el Excel</small></div>
    <div class="pb"><div class="avisos">${a.map(([c, i, t, s]) => `
      <div class="aviso ${c}"><span class="ai">${esc(i)}</span>
        <span class="at"><b>${esc(t)}</b><small>${esc(s)}</small></span></div>`).join("")}</div></div>
  </div>`;
}

const COLS = [
  ["op",     "OP",        "n"],
  ["marca",  "Marca",     ""],
  ["camp",   "Campaña",   ""],
  ["ini",    "Inicio",    "n"],
  ["fin",    "Final",     "n"],
  ["dias",   "Días",      "n"],
  ["frec",   "Spots/día", "n"],
  ["spots",  "Spots",     "n"],
  ["precio", "Precio",    "n"],
  ["vSpot",  "$/spot",    "n"],
  ["pant",   "Pantallas", ""],
];
function ordenar(filas){
  const c = ordCol;
  return filas.slice().sort((a, b) => {
    let x = a[c], y = b[c];
    if(c === "pant"){ x = a.pant.length; y = b.pant.length; }
    if(typeof x === "string" || typeof y === "string"){
      x = String(x || ""); y = String(y || "");
      return x < y ? -ordDir : x > y ? ordDir : 0;
    }
    return ((x || 0) - (y || 0)) * ordDir;
  });
}
function panelTabla(filas, meta){

      <td class="n">${esc(fmtFecha(f.ini))}</td>

      <td class="n">${f.precio ? esc(money(f.ingreso))
        : (f.neg && !f.negParcial ? `<span class="tag mut">${esc(NEG_CLASE[f.neg].toLowerCase())}</span>`
                 : `<span class="tag bad">sin tarifar</span>`)}</td>
      <td class="n pspot">${f.precio ? esc(spot(f.vSpot)) : "—"}</td>
      <td><div class="pchips">${DATOS.pantallas.map(p => f.pant.includes(p.id)

    <div class="pb tight"><div class="tblwrap"><table class="t"><thead><tr>
      ${COLS.map(([k, t, cls]) => `<th class="ord ${ordCol===k?"on":""} ${cls==="n"?"":""}" data-ord="${k}">${esc(t)}${ordCol===k?(ordDir>0?" ▲":" ▼"):""}</th>`).join("")}
    </tr></thead><tbody>${cuerpo || `<tr><td colspan="11"><div class="empty">Nada que mostrar con estos filtros.</div></td></tr>`}</tbody></table></div></div>

}

/* =========================================================================
   Interacción
   ========================================================================= */
function cablear(filas, meta){
  $("#f_desde").onchange = e => { F.desde = e.target.value || F.desde; render(); };
  $("#f_hasta").onchange = e => { F.hasta = e.target.value || F.hasta; render(); };
  $("#f_pre").onclick = e => {
    const b = e.target.closest("[data-pre]"); if(!b) return;
    aplicarPreset(b.dataset.pre); render();
  };
  $("#f_modo").onclick = e => {
    const b = e.target.closest("[data-modo]"); if(!b) return;
    F.modo = b.dataset.modo; render();
  };
  $("#f_neg").onclick = e => {
    const b = e.target.closest("[data-neg]"); if(!b) return;
    F.neg = b.dataset.neg; render();
  };
  const txt = $("#f_txt");
  let tT = 0;
  txt.oninput = e => {
    clearTimeout(tT);
    const v = e.target.value, pos = e.target.selectionStart;
    tT = setTimeout(() => {
      F.texto = v; render();
      const n = $("#f_txt"); n.focus(); try{ n.setSelectionRange(pos, pos); }catch(err){}
    }, 320);
  };

  const act = document.querySelector(".activos");
  if(act) act.onclick = e => {
    const q = e.target.closest("[data-quitap]");
    if(q){ F.pant.delete(q.dataset.quitap); render(); return; }
    if(e.target.closest("[data-quitatxt]")){ F.texto = ""; render(); return; }
    if(e.target.closest("[data-limpia]")){ F.pant.clear(); F.texto = ""; render(); }
  };
  document.querySelectorAll("[data-pant]").forEach(b => b.onclick = () => {
    if(F.pant.has(b.dataset.pant)) F.pant.delete(b.dataset.pant); else F.pant.add(b.dataset.pant);
    render();
  });
  document.querySelectorAll("[data-marca]").forEach(b => b.onclick = () => {
    F.texto = F.texto === b.dataset.marca ? "" : b.dataset.marca; render();
  });
  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => {
    const k = b.dataset.mes, [a, m] = k.split("-").map(Number);
    F.desde = `${k}-01`;
    F.hasta = `${k}-${String(new Date(Date.UTC(a, m, 0)).getUTCDate()).padStart(2,"0")}`;
    render(); toast("Filtrado a " + etiqMesLargo(k));
  });
  const mi = $("#f_meta");
  if(mi) mi.onchange = e => { const v = Number(e.target.value); F.meta = v > 0 ? v : null; F.metaAuto = !(v > 0); render(); };
  const ma = $("#f_metaauto");
  if(ma) ma.onclick = () => { F.metaAuto = true; F.meta = null; render(); };

  document.querySelectorAll("th[data-ord]").forEach(th => th.onclick = () => {
    const k = th.dataset.ord;
    if(ordCol === k) ordDir = -ordDir; else { ordCol = k; ordDir = (k === "marca" || k === "camp") ? 1 : -1; }
    render();
  });
  document.querySelectorAll("tr[data-fila]").forEach(tr => tr.onclick = () => modalOP(+tr.dataset.fila));
}
function aplicarPreset(p){
  const r = rangoDatos();
  const hoy = hoyISO(), [Y, M] = hoy.split("-").map(Number);
  if(p === "todo"){ F.desde = r.min; F.hasta = r.max; return; }
  if(p === "mes"){
    F.desde = `${hoy.slice(0,7)}-01`;
    F.hasta = `${hoy.slice(0,7)}-${String(new Date(Date.UTC(Y, M, 0)).getUTCDate()).padStart(2,"0")}`;
    return;
  }
  if(p === "t3"){
    const d = new Date(Date.UTC(Y, M - 3, 1));
    F.desde = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-01`;
    F.hasta = `${hoy.slice(0,7)}-${String(new Date(Date.UTC(Y, M, 0)).getUTCDate()).padStart(2,"0")}`;
    return;
  }
  if(p.startsWith("a")){ const a = p.slice(1); F.desde = `${a}-01-01`; F.hasta = `${a}-12-31`; }
}

/* ---------- CSV ---------- */
function exportCSV(){
  if(!DATOS) return;
  const filas = ordenar(calcular());
  const cab = ["OP","Marca","Campaña","Inicio","Final","Días","Spots por día","Spots totales",
               "Precio","Valor por spot","Modalidad","Comentario", ...DATOS.pantallas.map(p => p.nombre)];
  const q = v => {
    const s = String(v == null ? "" : v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lineas = [cab.map(q).join(",")];
  for(const f of filas){
    lineas.push([f.op, f.marca, f.camp, f.ini, f.fin, f.dias, f.frec, Math.round(f.spots),
      f.precio ? f.ingreso.toFixed(2) : "", f.vSpot ? f.vSpot.toFixed(6) : "", f.negTxt, f.coment,
      ...DATOS.pantallas.map(p => f.pant.includes(p.id) ? "X" : "")].map(q).join(","));
  }
  const blob = new Blob(["﻿" + lineas.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Rentabilidad ${F.desde} a ${F.hasta}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("CSV descargado");
}

/* =========================================================================
   Archivo
   ========================================================================= */
function estado(txt, clase, info){
  $("#fsbar").hidden = false;
  $("#fsdot").className = "dot " + (clase || "");
  $("#fstxt").innerHTML = txt;
  $("#fsinfo").textContent = info || "";
}
async function conectar(){
  if(!HAS_FSA){ toast("Este navegador no permite abrir archivos de la carpeta."); return; }
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:"Excel", accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}],
      multiple:false,
    });
    handle = h;
    await idbSet("handle_rent", h);
    await leerDeHandle(true);
  }catch(e){ if(e && e.name !== "AbortError") toast("No se pudo abrir: " + e.message); }
}
async function leerDeHandle(avisar){
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:"read"});
    if(perm !== "granted"){
      const p = await handle.requestPermission({mode:"read"});
      if(p !== "granted"){ estado("Falta permiso para leer el archivo", "no"); return; }
    }
  }catch(e){}
  const file = await handle.getFile();
  await cargarArchivo(file, handle.name);
  if(avisar) toast("Excel conectado");
}
async function cargarArchivo(file, nombre){
  try{
    estado("Leyendo <b>" + esc(nombre) + "</b>…");
    const u8 = new Uint8Array(await file.arrayBuffer());
    libro = await abrirLibro(u8);
    /* la hoja buena: la primera que diga RENTABILIDAD y no sea una copia */
    if(!hojaSel || !libro.hojas.some(h => h.nombre === hojaSel)){
      const buena = libro.hojas.find(h => /rentabilidad/.test(sinTildes(h.nombre)) && !/copia/.test(sinTildes(h.nombre)));
      hojaSel = (buena || libro.hojas[0]).nombre;
    }
    aplicarHoja(file, nombre);
  }catch(e){
    estado("No se pudo leer el archivo", "no");
    $("#view").innerHTML = `<div class="hero"><div class="hi" style="background:color-mix(in srgb,var(--critical) 14%,var(--surface))">
      <svg viewBox="0 0 24 24" style="fill:var(--critical)"><path d="M12 2 1.6 20.4h20.8L12 2zm0 5.6 6.4 11.2H5.6L12 7.6zM11 10v4.6h2V10h-2zm0 5.8v2h2v-2h-2z"/></svg></div>
      <h2>No pude leer ese Excel</h2><p>${esc(e.message)}</p>
      <button class="btn primary" id="hero_conn" style="padding:10px 20px">Elegir otro archivo</button></div>`;
    cablearHero();
  }
}
function aplicarHoja(file, nombre){
  const hoja = libro.hojas.find(h => h.nombre === hojaSel) || libro.hojas[0];
  const m = analizarHoja(hoja.filas);
  const primera = !DATOS;
  DATOS = {...m, archivo: nombre, leido: new Date(), mtime: file ? file.lastModified : 0};

  const r = rangoDatos();
  if(primera || !F.desde){ F.desde = r.min; F.hasta = r.max; }
  else { F.desde = F.desde < r.min ? r.min : F.desde; F.hasta = F.hasta > r.max ? r.max : F.hasta; }

  const sel = $("#selhoja");
  sel.hidden = libro.hojas.length < 2;

   Motor de PDF · tamaño carta con el membrete de Veo

/* --- métricas de Helvetica / Helvetica-Bold (las fuentes base del PDF) --- */
const PDF_ALF = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
const PDF_TAB_R = [0,191,222,260,278,333,334,350,355,365,370,389,400,469,500,537,556,584,611,667,722,737,778,833,834,889,944,1000,1015];
const PDF_MAP_R = "00000000000000000000000000000000448ggpj155bh4544gggggggggg44hhhgsjjkkjimk4ejgnkmjmkjikjqjji444dg5ggegg4gg22e2ngggg5e4gekeee636h0g02g5rgg5rj5r0i0022557gr5re5q0ej45gggg3g5lagh5l5ch555gf4559goooijjjjjjrkjjjj4444kkmmmmmhmkkkkjjiggggggpegggg4444ggggggghiggggege";
const PDF_TAB_B = [0,238,278,280,333,350,365,370,389,400,474,500,556,584,611,667,722,737,778,833,834,889,944,975,1000];
const PDF_MAP_B = "0000000000000000000000000000000024acclg1448d2422cccccccccc44dddenggggfeig2cgejgifigfegfmffe424dc4cecec4ee22c2leeee8c4eciccb838d0c02cbocc4of4o0e0022bb5co4oc4m0bf24cccc3c4h7cd4h49d444ec2446ckkkeggggggogffff2222ggiiiiidiggggffecccccclccccc2222eeeeeeedeeeeecec";
const PDF_W_R = [...PDF_MAP_R].map(ch => PDF_TAB_R[PDF_ALF.indexOf(ch)] || 0);
const PDF_W_B = [...PDF_MAP_B].map(ch => PDF_TAB_B[PDF_ALF.indexOf(ch)] || 0);

/* Caracteres fuera de latin-1 que sí existen en WinAnsiEncoding (más algunos reemplazos). */
const PDF_ESP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,
  "Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,
  "œ":156,"ž":158,"Ÿ":159,"→":150,"←":150,"↔":150,"″":34,"′":39,"　":32};
function pdfCod(ch){
  const c = ch.codePointAt(0);
  if(c < 256) return c;
  return PDF_ESP[ch] || 63;            // 63 = "?"
}
function pdfAncho(txt, tam, neg){
  const w = neg ? PDF_W_B : PDF_W_R;
  let t = 0;
  for(const ch of String(txt == null ? "" : txt)) t += w[pdfCod(ch)] || 0;
  return t * tam / 1000;
}
function pdfEsc(txt){
  let out = "";
  for(const ch of String(txt == null ? "" : txt)){
    const c = pdfCod(ch);
    if(c === 40 || c === 41 || c === 92) out += "\\";
    out += String.fromCharCode(c);
  }
  return out;
}
/* Corta un texto en líneas que quepan en "ancho". */
function pdfCortar(txt, ancho, tam, neg){
  const palabras = String(txt == null ? "" : txt).split(/\s+/).filter(Boolean);
  const lineas = [];
  let act = "";
  const partir = pal => {                       // palabra sola más ancha que la columna
    let trozo = "";
    for(const ch of pal){
      if(pdfAncho(trozo + ch, tam, neg) > ancho && trozo){ lineas.push(trozo); trozo = ch; }
      else trozo += ch;
    }
    return trozo;
  };
  for(const p of palabras){
    const t = act ? act + " " + p : p;
    if(pdfAncho(t, tam, neg) <= ancho){ act = t; continue; }
    if(act){ lineas.push(act); act = ""; }
    act = pdfAncho(p, tam, neg) > ancho ? partir(p) : p;
  }
  if(act) lineas.push(act);
  return lineas.length ? lineas : [""];
}
function pdfRecorta(txt, ancho, tam, neg){
  let s = String(txt == null ? "" : txt);
  if(pdfAncho(s, tam, neg) <= ancho) return s;
  while(s.length && pdfAncho(s + "…", tam, neg) > ancho) s = s.slice(0, -1);
  return s + "…";
}
function pdfRGB(hex){
  const h = hex.replace("#","");
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]
         .map(v => v.toFixed(3)).join(" ");
}
const nf = x => {
  const s = (Math.round(x * 100) / 100).toString();
  return s === "-0" ? "0" : s;
};

/* --- lienzo: acumula los operadores de una página --- */
function pdfLienzo(){
  const ops = [];
  const api = {
    ops,
    crudo(s){ ops.push(s); return api; },
    rect(x, y, w, h, color){ ops.push(`${pdfRGB(color)} rg ${nf(x)} ${nf(y)} ${nf(w)} ${nf(h)} re f`); return api; },
    borde(x, y, w, h, color, grosor){
      ops.push(`${pdfRGB(color)} RG ${nf(grosor||0.6)} w ${nf(x)} ${nf(y)} ${nf(w)} ${nf(h)} re S`); return api;
    },
    linea(x1, y1, x2, y2, color, grosor){
      ops.push(`${pdfRGB(color)} RG ${nf(grosor||0.6)} w ${nf(x1)} ${nf(y1)} m ${nf(x2)} ${nf(y2)} l S`); return api;
    },
    /* rectángulo con esquinas redondeadas */
    redondo(x, y, w, h, r, color){
      r = Math.min(r, w/2, h/2);
      const k = r * 0.5523;
      ops.push(`${pdfRGB(color)} rg ${nf(x+r)} ${nf(y)} m ${nf(x+w-r)} ${nf(y)} l ` +
        `${nf(x+w-r+k)} ${nf(y)} ${nf(x+w)} ${nf(y+r-k)} ${nf(x+w)} ${nf(y+r)} c ` +
        `${nf(x+w)} ${nf(y+h-r)} l ${nf(x+w)} ${nf(y+h-r+k)} ${nf(x+w-r+k)} ${nf(y+h)} ${nf(x+w-r)} ${nf(y+h)} c ` +
        `${nf(x+r)} ${nf(y+h)} l ${nf(x+r-k)} ${nf(y+h)} ${nf(x)} ${nf(y+h-r+k)} ${nf(x)} ${nf(y+h-r)} c ` +
        `${nf(x)} ${nf(y+r)} l ${nf(x)} ${nf(y+r-k)} ${nf(x+r-k)} ${nf(y)} ${nf(x+r)} ${nf(y)} c h f`);
      return api;
    },
    texto(x, y, txt, o){
      o = o || {};
      const tam = o.tam || 9, neg = !!o.neg, col = o.col || "#1B2229";
      let s = String(txt == null ? "" : txt);
      if(o.max) s = pdfRecorta(s, o.max, tam, neg);
      let px = x;
      if(o.al === "der")  px = x - pdfAncho(s, tam, neg);
      if(o.al === "cen")  px = x - pdfAncho(s, tam, neg) / 2;
      ops.push(`BT ${pdfRGB(col)} rg /${neg ? "FB" : "FR"} ${nf(tam)} Tf ${nf(px)} ${nf(y)} Td (${pdfEsc(s)}) Tj ET`);
      return api;
    }
  };
  return api;
}

/* --- ensamblado del archivo PDF --- */
async function pdfDesinflar(bytes){
  if(typeof CompressionStream === "undefined") return null;
  try{
    const cs = new CompressionStream("deflate");
    const w = cs.writable.getWriter();
    w.write(bytes); w.close();
    const r = cs.readable.getReader();
    const tr = []; let tot = 0;
    for(;;){ const {done, value} = await r.read(); if(done) break; tr.push(value); tot += value.length; }
    const out = new Uint8Array(tot);
    let o = 0; for(const t of tr){ out.set(t, o); o += t.length; }
    return out;
  }catch(e){ return null; }
}
function pdfBytesDe(s){
  const b = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255;
  return b;
}
async function pdfArmar(contenidos){
  const partes = [], obj = [];
  let pos = 0;
  const put = bytes => { partes.push(bytes); pos += bytes.length; };
  const putStr = s => put(pdfBytesDe(s));
  const nHojas = contenidos.length;
  const idPagina = i => 5 + i * 2;             // 5,7,9…   contenido: 6,8,10…

  putStr("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const escribir = async (num, cuerpo, flujo) => {
    obj[num] = pos;
    if(!flujo){ putStr(`${num} 0 obj\n${cuerpo}\nendobj\n`); return; }
    const crudo = pdfBytesDe(flujo);
    const comp = await pdfDesinflar(crudo);
    const datos = comp || crudo;
    putStr(`${num} 0 obj\n<< /Length ${datos.length}${comp ? " /Filter /FlateDecode" : ""} >>\nstream\n`);
    put(datos);
    putStr("\nendstream\nendobj\n");
  };

  const hijos = contenidos.map((_, i) => `${idPagina(i)} 0 R`).join(" ");
  await escribir(1, "<< /Type /Catalog /Pages 2 0 R >>");
  await escribir(2, `<< /Type /Pages /Count ${nHojas} /Kids [${hijos}] >>`);
  await escribir(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  await escribir(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  for(let i = 0; i < nHojas; i++){
    await escribir(idPagina(i),
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${HOJA_W} ${HOJA_H}] ` +
      `/Resources << /Font << /FR 3 0 R /FB 4 0 R >> >> /Contents ${idPagina(i)+1} 0 R >>`);
    await escribir(idPagina(i) + 1, null, contenidos[i]);
  }
  const total = idPagina(nHojas - 1) + 2;      // último id + 1, más el objeto 0
  const xref = pos;
  let tabla = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i = 1; i < total; i++) tabla += String(obj[i] || 0).padStart(10, "0") + " 00000 n \n";
  putStr(tabla);
  putStr(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  let len = 0; for(const p of partes) len += p.length;
  const out = new Uint8Array(len);
  let o = 0; for(const p of partes){ out.set(p, o); o += p.length; }
  return out;
}

function infKPI(L, x, y, w, h, rot, val, sub, color){

/* barra horizontal con su rótulo y su valor */
function infBarra(L, x, y, w, etq, valor, txt, max, color){
  const hb = 7, wl = 108, wv = 74, wb = w - wl - wv - 14;
  L.texto(x, y + 1, etq, {tam:8.5, neg:true, max:wl - 6});
  L.rect(x + wl, y, wb, hb, "#EDEFEA");
  const largo = max > 0 ? Math.max(1.5, wb * (valor / max)) : 1.5;
  L.rect(x + wl, y, largo, hb, color || AZUL);
  L.texto(x + w, y + 1, txt, {tam:8.5, neg:true, al:"der"});
}
/* columnas mensuales */
function infColumnas(L, x, y, w, h, serie, etiqueta, valorTxt){
  const max = Math.max(...serie.map(s => s.v), 1);
  const paso = w / serie.length, bw = Math.min(30, paso * 0.6);
  L.linea(x, y, x + w, y, LINEA, 0.7);
  for(let i = 1; i <= 3; i++){
    const yy = y + h * i / 3;
    L.linea(x, yy, x + w, yy, "#F1F3EF", 0.5);
  }
  serie.forEach((s, i) => {
    const cx = x + paso * i + paso / 2;
    const alto = Math.max(1.5, h * (s.v / max));
    L.rect(cx - bw / 2, y, bw, alto, AZUL);
    L.texto(cx, y + alto + 4, valorTxt(s.v), {tam:6.6, neg:true, al:"cen", col:TINTA});
    L.texto(cx, y - 10, etiqueta(s.k), {tam:6.8, al:"cen", col:GRIS});
  });
}
/* pastilla de color */
function infPastilla(L, x, y, txt, fondo, tinta, tam){
  const t = tam || 7;

  L.redondo(x, y - 2.5, w, t + 6, (t + 6) / 2, fondo);
  L.texto(x + 5, y, txt, {tam:t, neg:true, col:tinta});

}
