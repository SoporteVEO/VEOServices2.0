  const ingreso = filas.reduce((a, f) => a + f.ingreso, 0);
  const spots = filas.reduce((a, f) => a + f.spots, 0);
  const conP = filas.filter(f => f.precio > 0);
  const noCom = filas.filter(f => f.neg && !f.negParcial);   // toda la OP bajo modalidad
  const parcial = filas.filter(f => f.neg && f.negParcial);   // solo alguna pantalla
  const sinTarifar = filas.filter(f => !f.precio && !f.neg);
  const pant = porPantalla(filas);
  const mm = new Map();
  for(const f of filas) porMes(f, (k, ing, sp) => {
    if(!mm.has(k)) mm.set(k, {k, v:0, spots:0});
    const r = mm.get(k); r.v += ing; r.spots += sp;
  });
  const meses = [...mm.values()].sort((a, b) => a.k < b.k ? -1 : 1);
  const marcas = new Map();
  for(const f of filas){
    if(!marcas.has(f.marca)) marcas.set(f.marca, {marca:f.marca, ingreso:0, spots:0, ops:0});
    const r = marcas.get(f.marca); r.ingreso += f.ingreso; r.spots += f.spots; r.ops++;
  }
  return {
    filas, meta, ingreso, spots, conP, noCom, parcial, sinTarifar, pant, meses,
    marcas: [...marcas.values()].sort((a, b) => b.ingreso - a.ingreso),
    bajas: conP.filter(f => f.vSpot < meta),
    sinPant: filas.filter(f => !f.pant.length),
  };
}

/* ---------- el informe ---------- */
async function pdfInforme(opc){
  const d = infDatos();
  const ahora = new Date();
  const sello = `${ahora.toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"numeric"})} · ` +
                `${ahora.toLocaleTimeString("es-SV",{hour:"2-digit",minute:"2-digit"})}`;
  const paginas = [];
  let L = infHoja(paginas, sello);
  let y = 700;

  /* ---- portada del informe ---- */
  L.texto(MG, y, "Informe de rentabilidad DOOH", {tam:19, neg:true});
  y -= 17;
  L.texto(MG, y, `Del ${fmtFecha(F.desde)} al ${fmtFecha(F.hasta)}` +
    (F.pant.size ? ` · ${[...F.pant].map(p => (DATOS.pantallas.find(x => x.id === p) || {}).nombre).join(", ")}` : "") +
    (F.neg !== "todo" ? ` · ${{"com":"solo comerciales","esp":"solo no comerciales"}[F.neg] || NEG_CLASE[F.neg]}` : ""),
    {tam:9.5, col:GRIS});
  y -= 8;
  L.rect(MG, y, ANCHO_CUERPO, 1.6, LIMA);
  y -= 22;

  /* ---- indicadores ---- */
  const anchoK = (ANCHO_CUERPO - 12) / 3, altoK = 50;
  const kpis = [
    ["Ingresos del período", money(d.ingreso, 0), `${d.filas.length} OP · ${d.marcas.length} marcas`, AZUL],
    ["Valor por spot", spot(d.spots ? d.ingreso / d.spots : 0), `mediana ${spot(d.meta)}`, TINTA],
    ["Spots vendidos", miles(Math.round(d.spots)), `${miles(Math.round(d.spots / (DATOS.pantallas.length || 1)))} por pantalla`, TINTA],
    ["Ticket promedio", money(d.conP.length ? d.ingreso / d.conP.length : 0, 0), "por orden de pauta", TINTA],
    ["OP bajo la meta", String(d.bajas.length), `de ${d.conP.length} con precio`, d.bajas.length ? AMBAR : VERDE],
    ["No comerciales", String(d.noCom.length), "donación, canje, dación, bonificación", MORADO],
  ];
  for(let i = 0; i < kpis.length; i++){
    const cx = MG + (i % 3) * (anchoK + 6);
    const cy = y - Math.floor(i / 3) * (altoK + 6) - altoK;
    infKPI(L, cx, cy, anchoK, altoK, kpis[i][0], kpis[i][1], kpis[i][2], kpis[i][3]);
  }
  y -= (altoK + 6) * 2 + 12;

  /* ---- rentabilidad por pantalla ---- */
  L.texto(MG, y, "Rentabilidad por pantalla", {tam:11.5, neg:true});
  L.texto(MG + ANCHO_CUERPO, y, "ingreso repartido entre las pantallas de cada OP",
    {tam:7.5, al:"der", col:GRIS});
  y -= 14;
  const maxP = Math.max(...d.pant.map(p => p.ingreso), 1);
  const totP = d.pant.reduce((a, p) => a + p.ingreso, 0);
  for(const p of d.pant){
    infBarra(L, MG, y, ANCHO_CUERPO, p.p.nombre, p.ingreso,
      `${money(p.ingreso, 0)}   ${pct(p.ingreso, totP).toFixed(1)}%`, maxP);
    L.texto(MG + 108 - 6, y + 1, `${p.ops}`, {tam:7, al:"der", col:GRIS2});
    y -= 15;
  }
  y -= 8;

  /* ---- evolución mensual ---- */
  if(d.meses.length){
    L.texto(MG, y, "Evolución mensual", {tam:11.5, neg:true});
    const mejor = d.meses.reduce((a, b) => b.v > a.v ? b : a, d.meses[0]);
    L.texto(MG + ANCHO_CUERPO, y, `mejor mes: ${etiqMesLargo(mejor.k)} con ${money(mejor.v, 0)}`,
      {tam:7.5, al:"der", col:GRIS});
    y -= 96;
    infColumnas(L, MG, y, ANCHO_CUERPO, 72, d.meses, etiqMes, v => moneyK(v));
    y -= 16;
  }

  /* ---- segunda hoja: marcas, modalidades y avisos ---- */
  L = infHoja(paginas, sello);
  y = 700;
  L.texto(MG, y, "Marcas que más aportan", {tam:11.5, neg:true});
  const t5 = d.marcas.slice(0, 5).reduce((a, x) => a + x.ingreso, 0);
  L.texto(MG + ANCHO_CUERPO, y, `las 5 primeras: ${pct(t5, d.ingreso).toFixed(0)}% del total`,
    {tam:7.5, al:"der", col:GRIS});
  y -= 16;
  const top = d.marcas.slice(0, 12);
  const maxM = Math.max(...top.map(x => x.ingreso), 1);
  top.forEach((x, i) => {
    infBarra(L, MG, y, ANCHO_CUERPO, `${i + 1}. ${x.marca}`, x.ingreso,
      `${money(x.ingreso, 0)}   ${pct(x.ingreso, d.ingreso).toFixed(1)}%`, maxM);
    y -= 15;
  });
  y -= 10;

  /* ---- modalidades ---- */
  L.texto(MG, y, "Donaciones, canjes, daciones y bonificaciones", {tam:11.5, neg:true});
  y -= 16;
  const porNeg = Object.keys(NEG_INF).map(k => ({
    k, n: d.noCom.filter(f => f.neg === k).length,
    v: d.noCom.filter(f => f.neg === k).reduce((a, f) => a + f.ingreso, 0),
    s: d.noCom.filter(f => f.neg === k).reduce((a, f) => a + f.spots, 0),
  })).filter(x => x.n);
  if(porNeg.length){
    let x = MG;
    for(const n of porNeg){
      const c = negInf(n.k), w = (ANCHO_CUERPO - 18) / porNeg.length;
      L.redondo(x, y - 40, w, 40, 5, c.f);
      L.texto(x + 9, y - 15, c.etq.toUpperCase(), {tam:6.8, neg:true, col:c.t});
      L.texto(x + 9, y - 30, `${n.n} OP`, {tam:12, neg:true, col:c.t});
      L.texto(x + w - 9, y - 30, n.v ? money(n.v, 0) : "sin cobro", {tam:8.5, neg:true, al:"der", col:c.t});
      x += w + 6;
    }
    y -= 52;
    L.texto(MG, y, `${miles(Math.round(porNeg.reduce((a, n) => a + n.s, 0)))} spots emitidos sin cobro comercial.`,
      {tam:8, col:GRIS});
    y -= 18;
  } else {
    L.texto(MG, y, "No hay OP no comerciales en el período.", {tam:9, col:GRIS});
    y -= 20;
  }

  /* ---- qué revisar ---- */
  L.texto(MG, y, "Qué revisar", {tam:11.5, neg:true});
  y -= 16;
  const avisos = [];
  if(d.sinTarifar.length) avisos.push([ROJO, `${d.sinTarifar.length} OP sin precio y sin modalidad`,
    "Son ventas comerciales a las que les falta la tarifa: no suman a la rentabilidad."]);
  if(d.sinPant.length) avisos.push([AMBAR, `${d.sinPant.length} OP sin pantalla marcada`,
    "Hay que marcar la casilla de la pantalla en el Excel."]);
  if(d.bajas.length) avisos.push([AMBAR, `${d.bajas.length} OP por debajo de ${spot(d.meta)} el spot`,
    `Cobrando la meta habrían entrado ${money(d.bajas.reduce((a, f) => a + (d.meta - f.vSpot) * f.spots, 0), 0)} más.`]);
  if(d.parcial.length) avisos.push([MORADO, `${d.parcial.length} OP con alguna pantalla bonificada`,
    `${d.parcial.slice(0,4).map(f => `${f.marca} (${f.negPant})`).join(", ")}${d.parcial.length>4?"…":""} — ` +
    `sí cobran: la modalidad aplica solo a esas pantallas.`]);
  if(d.noCom.length) avisos.push([MORADO, `${d.noCom.length} OP no comerciales`,
    "Donaciones, canjes, daciones y bonificaciones: no llevan precio por definición."]);
  if(!avisos.length) avisos.push([VERDE, "Todo en orden", "No hay OP sin tarifar ni fuera de la meta."]);
  for(const [c, t, s] of avisos){
    L.rect(MG, y - 20, 2.5, 24, c);
    L.texto(MG + 10, y - 4, t, {tam:9, neg:true});
    L.texto(MG + 10, y - 15, s, {tam:8, col:GRIS, max:ANCHO_CUERPO - 20});
    y -= 32;
  }

  /* ---- detalle de las órdenes ---- */
  if(opc && opc.detalle !== false && d.filas.length){
    const COLI = [
      {k:"op",     t:"OP",      w:26, al:"der"},
      {k:"marca",  t:"Marca",   w:112},
      {k:"camp",   t:"Campaña", w:84},
      {k:"vig",    t:"Vigencia",w:74},
      {k:"spots",  t:"Spots",   w:44, al:"der"},
      {k:"precio", t:"Precio",  w:54, al:"der"},
      {k:"vspot",  t:"$/spot",  w:44, al:"der"},
      {k:"pant",   t:"Pant.",   w:26, al:"der"},
    ];
    const PAD = 5;
    const posX = (x, c) => c.al === "der" ? x + c.w - PAD : x;
    const orden = ordenar(d.filas);
    const cabecera = () => {
      L = infHoja(paginas, sello);
      y = 700;
      L.texto(MG, y, "Detalle de órdenes", {tam:11.5, neg:true});
      L.texto(MG + ANCHO_CUERPO, y, `${orden.length} OP · rojo = bajo la meta de ${spot(d.meta)}`,
        {tam:7.5, al:"der", col:GRIS});
      y -= 16;
      let x = MG;
      for(const c of COLI){
        L.texto(posX(x, c), y, c.t.toUpperCase(),
          {tam:6.6, neg:true, col:GRIS, al:c.al === "der" ? "der" : undefined});
        x += c.w;
      }
      y -= 5;
      L.linea(MG, y, MG + ANCHO_CUERPO, y, GRIS2, 0.7);
      y -= 12;
    };
    cabecera();
    let cebra = false;
    for(const f of orden){
      if(y < 110){ cabecera(); cebra = false; }
      if(cebra) L.rect(MG - 3, y - 3.5, ANCHO_CUERPO + 6, 13, CEBRA);
      cebra = !cebra;
      const baja = f.precio && f.vSpot < d.meta;
      const val = {
        op: String(f.op || ""),
        marca: f.marca,
        camp: f.camp || "—",
        vig: `${infFecha(f.ini)} – ${infFecha(f.fin)}`,
        spots: miles(Math.round(f.spots)),
        precio: f.precio ? money(f.ingreso, 0) : (f.neg ? negInf(f.neg).etq.toLowerCase() : "sin tarifa"),
        vspot: f.precio ? spot(f.vSpot) : "—",
        pant: String(f.pant.length || "—"),
      };
      let x = MG;
      for(const c of COLI){
        const col = (c.k === "vspot" && baja) ? ROJO
                  : (c.k === "precio" && !f.precio) ? (f.neg ? negInf(f.neg).t : ROJO) : TINTA;
        L.texto(posX(x, c), y, val[c.k],
          {tam:7.4, neg: c.k === "marca", col, max: c.w - PAD - 2, al: c.al === "der" ? "der" : undefined});
        x += c.w;
      }
      y -= 13;
    }
  }

  infPie(paginas);
  return await pdfArmar(paginas.map(p => p.ops.join("\n")));
}

/* ---------- la ventana que arma el informe ---------- */
function modalInforme(){
  const r = rangoDatos();
  const anios = [...new Set(DATOS.ops.map(o => o.mes.slice(0,4)).filter(Boolean))].sort();
  $("#modal").innerHTML = `
    <div class="mh"><div style="flex:1;min-width:0">
      <h3>Informe de rentabilidad DOOH</h3>
      <small>un PDF tamaño carta con el membrete de Veo</small></div></div>
    <div class="mb">
      <div class="field"><label>Período del informe</label>
        <div class="filas2">
          <input type="date" id="in_desde" value="${esc(F.desde)}" min="${esc(r.min)}" max="${esc(r.max)}">
          <span class="fl">al</span>
          <input type="date" id="in_hasta" value="${esc(F.hasta)}" min="${esc(r.min)}" max="${esc(r.max)}">
        </div>
        <div class="qchips" id="in_pre" style="margin-top:7px">
          <button data-pre="mes">Este mes</button>
          <button data-pre="t3">Últimos 3 meses</button>
          ${anios.map(a => `<button data-pre="a${a}">${a}</button>`).join("")}
          <button data-pre="todo">Todo</button>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="in_det" checked>
        <span><b>Incluir el detalle de todas las órdenes</b>
        <small>una tabla con cada OP del período; si son muchas, el PDF crece.</small></span></label>
      <div class="aviso2 a" id="in_res"><span class="ai">✓</span><span class="at">
        <b>—</b><small>—</small></span></div>
      <p class="hint">El informe respeta los filtros que tengas puestos arriba (pantalla, modalidad y búsqueda).</p>
    </div>
    <div class="mf">
      <span class="hint" id="in_msg"></span>
      <button class="btn" id="in_cerrar">Cerrar</button>
      <button class="btn primary" id="in_ok">Generar el PDF</button>
    </div>`;
  $("#ov").hidden = false;

  const pintar = () => {
    const f = calcular();
    const ing = f.reduce((a, x) => a + x.ingreso, 0);
    const b = $("#in_res");
    b.querySelector("b").textContent = `${f.length} OP · ${money(ing, 0)}`;
    b.querySelector("small").textContent =
      `Del ${fmtFecha(F.desde)} al ${fmtFecha(F.hasta)}` +
      (F.pant.size ? ` · ${F.pant.size} pantalla${F.pant.size === 1 ? "" : "s"}` : "") +
      (F.texto ? ` · “${F.texto}”` : "");
  };
  pintar();
  $("#in_desde").onchange = e => { F.desde = e.target.value || F.desde; pintar(); };
  $("#in_hasta").onchange = e => { F.hasta = e.target.value || F.hasta; pintar(); };
  $("#in_pre").onclick = e => {
    const b = e.target.closest("[data-pre]"); if(!b) return;
    aplicarPreset(b.dataset.pre);
    $("#in_desde").value = F.desde; $("#in_hasta").value = F.hasta;
    pintar();
  };
  $("#in_cerrar").onclick = () => { cerrarModal(); render(); };
  $("#in_ok").onclick = async () => {
    const b = $("#in_ok"), msg = $("#in_msg");
    b.disabled = true; b.textContent = "Armando el PDF…"; msg.textContent = "";
    try{
      await guardarInformePDF({detalle: $("#in_det").checked});
      cerrarModal(); render();
    }catch(e){
      b.disabled = false; b.textContent = "Generar el PDF";
      msg.textContent = "No se pudo generar: " + e.message;
      msg.style.color = "var(--critical)";
    }
  };
}
function nombreInforme(){
  const f = iso => { const p = String(iso).split("-"); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : iso; };
  return `Informe de rentabilidad DOOH ${f(F.desde)} a ${f(F.hasta)}.pdf`;
}
async function guardarInformePDF(opc){
  const nombre = nombreInforme();
  let destino = null;
  if(window.showSaveFilePicker){
    try{
      destino = await window.showSaveFilePicker({
        suggestedName: nombre,
        types: [{description:"PDF", accept:{"application/pdf":[".pdf"]}}],
      });
    }catch(e){ if(e && e.name === "AbortError") return; destino = null; }
  }
  const bytes = await pdfInforme(opc);
  if(destino){
    await escribirEn(destino, bytes);
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    a.download = nombre; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast("Informe en PDF guardado");
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
else iniciar();
